include /etc/nginx/modules-enabled/*.conf;

error_log /dev/stdout debug;

worker_processes 1;

# user nobody nogroup;
pid /tmp/nginx.pid;

events {
    worker_connections 20000;
    accept_mutex off;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format custom_json escape=json '{'
        '"level": "info",'
        '"ts": "$time_iso8601",'
        '"message": "handled request $request_method $request_uri",'
        '"request": {'
            '"id": "$http_x_request_id",'
            '"remote_ip": "$remote_addr",'
            '"remote_port": "$remote_port",'
            '"protocol": "$server_protocol",'
            '"method": "$request_method",'
            '"host": "$host",'
            '"uri": "$request_uri",'
            '"headers": {'
                '"user-agent": "$http_user_agent",'
                '"accept": "$http_accept",'
                '"accept-encoding": "$http_accept_encoding",'
                '"traceparent": "$http_traceparent",'
                '"tracestate": "$http_tracestate",'
                '"x_forwarded_for": "$http_x_forwarded_for",'
                '"x_amzn_trace_id": "$http_x_amzn_trace_id",'
                '"origin": "$http_origin"'
            '}'
        '},'
        '"bytes_read": $request_length,'
        '"duration_msecs": $request_time,'
        '"size": $bytes_sent,'
        '"status": $status,'
        '"resp_headers": {'
            '"content_length": "$sent_http_content_length",'
            '"content_type": "$sent_http_content_type"'
        '},'
        '"request_duration": "$request_time",'
        '"response_duration": "$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log custom_json;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # don't send the nginx version number in error pages and Server header
    server_tokens off;

    # Expires map
    map $sent_http_content_type $expires {
        default                    off;
        text/html                  epoch;
        text/css                   epoch;
        application/javascript     epoch;
    }

    upstream app_server {
        # For a TCP configuration:
        server app:8000 fail_timeout=0;
    }

    server {
        listen 80 default;

        keepalive_timeout 5;

        location / {
            proxy_pass  http://app_server;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass_request_headers on;
            proxy_redirect off;

            proxy_connect_timeout 600s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            send_timeout 600s;
        }
    }
}
