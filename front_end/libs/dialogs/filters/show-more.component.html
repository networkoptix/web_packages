<div>
    <div class="nx-modal__header">
        <span class="nx-modal__header-title">
            {{ dialogData.header }}
        </span>
        <button
            type="button"
            class="nx-modal__header-close-btn"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        ></button>
    </div>
    <div class="nx-modal__content">
        <ng-container [ngTemplateOutlet]="dialogData.template"></ng-container>
    </div>
</div>
