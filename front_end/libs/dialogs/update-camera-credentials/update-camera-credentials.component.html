<form
    #updateForm="ngForm"
    name="updateForm"
    novalidate
    autocomplete="off"
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Authentication Credentials
        </h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <div class="close-content"></div>
        </button>
    </div>

    <div class="modal-body">
        <div class="form-group">
            <label
                for="cameraLoginCredentials"
                translate
                >Login</label
            >
            <input
                class="fs-mask form-control"
                [(ngModel)]="cameraLoginCredentials"
                id="cameraLoginCredentials"
                name="cameraLoginCredentials"
                type="text"
                (blur)="clearPassword()"
                autocomplete="off"
            />
        </div>
        <div class="form-group">
            <label
                for="cameraPasswordCredentials"
                translate
                >Password</label
            >
            <input
                class="fs-exclude form-control"
                [(ngModel)]="cameraPasswordCredentials"
                (focus)="clearPassword()"
                id="cameraPasswordCredentials"
                name="cameraPasswordCredentials"
                autocomplete="new-password"
                type="password"
            />
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="update"
            [form]="updateForm"
            [actionType]="'primary'"
            buttonText="{{ 'Save' | translate }}"
        ></nx-process-button>
        <nx-cancel-button
            [process]="update"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
