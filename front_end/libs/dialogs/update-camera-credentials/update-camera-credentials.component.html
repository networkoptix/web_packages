<form
    #updateForm="ngForm"
    name="updateForm"
    novalidate
    autocomplete="off"
>
    <div class="modal-header">
        <h1 class="modal-title">
            <ng-template #updatePasswordSpan>
                <span translate>Set Camera Password</span>
            </ng-template>
            <ng-container *ngIf="!defaultPassword; else updatePasswordSpan">
                <span translate>Authentication Credentials</span>
            </ng-container>
        </h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <div class="close-content"></div>
        </button>
    </div>

    <div class="modal-body">
        <div
            *ngIf="!defaultPassword"
            class="form-group"
        >
            <label
                for="cameraLoginCredentials"
                translate
                >Login</label
            >
            <input
                class="fs-mask form-control"
                [(ngModel)]="cameraLoginCredentials"
                id="cameraLoginCredentials"
                name="cameraLoginCredentials"
                type="text"
                (blur)="clearPassword()"
                autocomplete="off"
            />
        </div>
        <div class="form-group">
            <label for="cameraPasswordCredentials">
                <ng-template #newPasswordSpan><span translate>New Password</span></ng-template>
                <span
                    *ngIf="!defaultPassword; else newPasswordSpan"
                    translate
                    >Password</span
                >
            </label>
            <input
                class="fs-exclude form-control"
                [(ngModel)]="cameraPasswordCredentials"
                (focus)="clearPassword(); clearError()"
                id="cameraPasswordCredentials"
                name="cameraPasswordCredentials"
                autocomplete="new-password"
                type="password"
            />
        </div>
        <div
            *ngIf="defaultPassword"
            class="form-group"
        >
            <label
                for="confirmPassword"
                translate
                >Repeat Password</label
            >
            <input
                class="fs-exclude form-control"
                [(ngModel)]="confirmPassword"
                (focus)="clearError()"
                id="confirmPassword"
                name="confirmPassword"
                type="password"
            />
        </div>
        <div
            *ngIf="error"
            class="input-error"
        >
            {{ error | translate }}
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="update"
            [form]="updateForm"
            [actionType]="'primary'"
            buttonText="{{ 'Save' | translate }}"
        ></nx-process-button>
        <nx-cancel-button
            [process]="update"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
