<div data-testid="removeUserModal">
    <div class="modal-header">
        <h1 class="modal-title">{{ dialogTitle | translate }}</h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <div class="close-content"></div>
        </button>
    </div>

    <div class="modal-footer">
        <nx-process-button
            [process]="removeUserProcess"
            [actionType]="'danger'"
            [buttonText]="dialogButtonText | translate"
            data-testid="removeUserBtn"
        ></nx-process-button>
        <nx-cancel-button
            [process]="removeUserProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
            data-testid="closeRemoveUserModalBtn"
        ></nx-cancel-button>
    </div>
</div>
