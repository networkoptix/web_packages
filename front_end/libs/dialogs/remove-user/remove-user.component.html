<div id="removeUserModal">
    <div class="modal-header">
        <h1 class="modal-title">{{ dialogTitle | translate }}</h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="!dialogRef.disableClose"
        >
            <div class="close-content"></div>
        </button>
    </div>
    <div [ngStyle]="{ display: needsUpdate ? 'none' : 'unset' }">
        <div class="modal-footer">
            <nx-process-button
                [process]="removeUserProcess"
                [actionType]="'danger'"
                [buttonText]="dialogButtonText | translate"
                [id]="'removeUserBtn'"
            ></nx-process-button>
            <nx-cancel-button
                [process]="removeUserProcess"
                [cancelFn]="unlock"
                [discardFn]="close"
                [id]="'cancelRemoveUserBtn'"
            ></nx-cancel-button>
        </div>
    </div>
</div>
<nx-update-webadmin-session
    *ngIf="system.useRest && needsUpdate"
    (loginSuccess)="needsUpdate = false; removeUserProcess.run()"
    [dialogRef]="dialogRef"
    [system]="system"
    processAction="danger"
></nx-update-webadmin-session>
