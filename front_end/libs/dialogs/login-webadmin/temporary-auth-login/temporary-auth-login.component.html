<div class="temp-auth-container">
    <div>
        <img
            [alt]="environment.isLocal ? CONFIG.vmsName : CONFIG.cloudName + ' logo'"
            srcset="static/images/welcome_page_logo.png, static/images/welcome_page_logo@2x.png 2x"
            src="static/images/welcome_page_logo@2x.png"
        />
    </div>
    <div
        class="text-header"
        translate
    >
        Opened in %VMS_NAME%
    </div>
    <div>
        <a
            class="text-link"
            (click)="handleLoginToWeb()"
            translate
            >Login to web client instead</a
        >
    </div>
</div>
