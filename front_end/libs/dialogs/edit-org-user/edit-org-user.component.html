<form>
    <div class="modal-header">
        <h1 class="modal-title">
            <!-- TODO: replace with data -->
            {{ LANG.dialogs.editOrgUser.title | translate: { user: 'user@example.com' } }}
        </h1>
        <button
            *ngIf="closable"
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <span class="close-content"></span>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label
                for="targetGroup"
                translate
                >Groups</label
            >
            <nx-select
                id="targetGroup"
                name="targetGroup"
                [items]="groups"
                [selected]="selectedGroup"
                [(ngModel)]="selectedGroup"
                canSearch
            ></nx-select>
        </div>
        <div class="form-group">
            <label
                for="permissions"
                translate
                >Access Level</label
            >
            <nx-multi-select
                id="permissions"
                name="permissions"
                [items]="permissions"
                [ngModel]="selectedPermissions"
                (ngModelChange)="updatePermissions($event)"
            ></nx-multi-select>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="editProcess"
            [buttonText]="'Edit' | translate"
        ></nx-process-button>
        <nx-cancel-button
            [process]="editProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
