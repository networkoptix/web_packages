<form
    #resetServerForm="ngForm"
    name="resetServerForm"
    novalidate
    [ngClass]="{ 'hide-errors': hideErrors }"
    (submit)="hideErrors = false"
>
    <div class="modal-header">
        <h1
            class="modal-title"
            [innerHTML]="
                LANG.dialogs.titles.serversReset
                    | translate: { title: serverName | escapeHTML }
                    | safe: 'html'
            "
        ></h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <div class="close-content"></div>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <div [ngClass]="{ 'mb-3': system.mediaserver.requiresPassword }">
                <p
                    class="mb-0"
                    translate
                >
                    All settings for this server will be reset to factory default settings, and it
                    will be detached from this system and added to a new one.
                </p>

                <p
                    [ngClass]="{ 'mb-3': system.mediaserver.requiresPassword }"
                    translate
                >
                    Video archive will remain intact.
                </p>
                <span
                    *ngIf="system.mediaserver.requiresPassword"
                    translate
                    >Enter password for your account to continue.</span
                >
            </div>
            <ng-container *ngIf="system.mediaserver.requiresPassword">
                <input
                    #passwordInput
                    class="form-control"
                    [(ngModel)]="password"
                    id="password"
                    name="password"
                    type="password"
                    required
                />
                <p
                    class="help-block"
                    *ngIf="
                        !resetServerForm.controls['password']?.valid &&
                        resetServerForm.controls['password']?.touched
                    "
                >
                    <span
                        class="input-error"
                        translate
                        >Password is required</span
                    >
                </p>
            </ng-container>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="resetServer"
            [form]="resetServerForm"
            [actionType]="'danger'"
            buttonText="{{ 'Reset' | translate }}"
        ></nx-process-button>
        <nx-cancel-button
            [process]="resetServer"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
