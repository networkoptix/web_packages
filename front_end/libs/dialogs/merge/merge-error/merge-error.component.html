<!-- eslint-disable nx/template/no-global-style-class -->
<!-- TODO: Fix no-global-style-class lint error for all Merge Components -->
<div class="modal-body">
    @if (primarySystemOffline) {
        <p
            class="paragraph"
            [innerHTML]="
                LANG.dialogs.merge.primarySystemOffline
                    | translate: { primarySystem: primaryName, secondarySystem: secondaryName }
            "
        ></p>
    } @else if (secondarySystemOffline) {
        <p
            class="paragraph"
            [innerHTML]="
                LANG.dialogs.merge.secondarySystemOffline
                    | translate: { primarySystem: primaryName, secondarySystem: secondaryName }
            "
        ></p>
    } @else {
        <p
            class="paragraph"
            [innerHTML]="
                LANG.dialogs.merge.mergeConfirmation
                    | translate
                        : {
                              primarySystem: primaryName,
                              secondarySystem: secondaryName
                          }
            "
        ></p>
    }
</div>
<div class="modal-footer">
    <button
        type="button"
        class="nx-button--primary"
        data-dismiss="modal"
        aria-label="Close"
        (click)="this.finishDialog.emit(true)"
    >
        {{ LANG.dialogs.buttons.ok }}
    </button>
</div>
