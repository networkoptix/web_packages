<!-- <nx-pre-loader *ngIf=""></nx-pre-loader> -->
<main class="merge-main">
    <form
        #adminPasswordForm="ngForm"
        name="adminPasswordForm"
    >
        <div class="modal-body">
            <p
                [innerHTML]="
                    LANG.dialogs.merge.adminPasswordTitle
                        | translate
                            : {
                                  secondarySystem: targetSystem.name
                              }
                "
            ></p>
            <div class="form-group">
                <label
                    class="mt-2"
                    for="adminLogin"
                    translate
                    >Login</label
                >
                <input
                    class="form-control"
                    name="adminLogin"
                    disabled
                    value="admin"
                />
            </div>
            <!-- need to investigate why these two within the ngIf (also for required in the input) -->
            <div
                *ngIf="!isSessionOauth || !targetSystem.cloudSystemId"
                class="form-group"
                [ngClass]="{
                    'mb-merge': !(
                        adminPassword.invalid &&
                        (adminPassword.dirty || adminPassword.touched)
                    )
                }"
            >
                <label
                    for="adminPassword"
                    translate
                    >Password</label
                >
                <input
                    class="fs-exclude form-control"
                    #adminPassword="ngModel"
                    #adminPasswordInput
                    [ngClass]="{
                        'invalid-state':
                            adminPassword.invalid && (adminPassword.touched || adminPassword.dirty)
                    }"
                    id="adminPassword"
                    autocomplete="current-password"
                    name="adminPassword"
                    type="password"
                    required
                    [ngModel]="password"
                    (ngModelChange)="passwordChange.emit($event)"
                />
                <!-- not sure why this was inside the input above (blur)="passwordUpdate(adminPassword)" -->
                <!-- verify password error texts -->
                <ng-container
                    *ngIf="adminPassword.invalid && (adminPassword.dirty || adminPassword.touched)"
                >
                    <label
                        *ngIf="adminPassword.errors.required"
                        class="error-label password-label-margin mb-0 mt-2"
                        for="adminPassword"
                        translate
                    >
                        Required
                    </label>
                    <label
                        *ngIf="adminPassword.errors.wrongPassword"
                        class="error-label password-label-margin mb-0 mt-2"
                        for="adminPassword"
                        translate
                    >
                        Wrong password
                    </label>
                </ng-container>
            </div>
        </div>
        <div class="modal-footer next-button">
            <button
                class="btn btn-default svg-icon"
                (click)="setCurrentState.emit()"
                type="button"
            >
                <svg-icon
                    nx-add-svg-src
                    [src]="icons.dir + 'arrow_left.svg'"
                    class="mr-1"
                    [applyClass]="true"
                ></svg-icon>
                <span translate>Back</span>
            </button>
            <nx-process-button
                [process]="adminPasswordProcess"
                [form]="adminPasswordForm"
                actionType="primary"
                [svg]="{ src: 'arrow_right' }"
                buttonText="{{ 'Next' | translate }}"
            ></nx-process-button>
        </div>
    </form>
</main>
