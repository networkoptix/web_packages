<!-- @if() { <nx-pre-loader></nx-pre-loader> } -->
<main class="merge-main">
    <form
        #adminPasswordForm="ngForm"
        name="adminPasswordForm"
    >
        <div class="modal-body">
            <p
                class="paragraph"
                [innerHTML]="
                    LANG.dialogs.merge.adminPasswordTitle
                        | translate
                            : {
                                  secondarySystem: targetSystem.name
                              }
                "
            ></p>
            <div class="form-group">
                <label
                    class="label mt-2"
                    for="adminLogin"
                    translate
                    >Login</label
                >
                <input
                    class="form-control"
                    name="adminLogin"
                    disabled
                    value="admin"
                />
            </div>
            <!-- need to investigate why these two within the ngIf (also for required in the input) -->
            @if (!isSessionOauth || !targetSystem.cloudSystemId) {
                <div
                    class="form-group"
                    [ngClass]="{
                        'mb-merge': !(
                            adminPassword.invalid &&
                            (adminPassword.dirty || adminPassword.touched)
                        )
                    }"
                >
                    <label
                        class="label"
                        for="adminPassword"
                        translate
                        >Password</label
                    >
                    <input
                        class="fs-exclude form-control"
                        #adminPassword="ngModel"
                        #adminPasswordInput
                        [ngClass]="{
                            'invalid-state':
                                adminPassword.invalid &&
                                (adminPassword.touched || adminPassword.dirty)
                        }"
                        id="adminPassword"
                        autocomplete="current-password"
                        name="adminPassword"
                        type="password"
                        required
                        [ngModel]="password"
                        (ngModelChange)="passwordChange.emit($event)"
                    />
                    @if (adminPassword.invalid && (adminPassword.dirty || adminPassword.touched)) {
                        @if (adminPassword.errors?.required) {
                            <p
                                class="paragraph error-label password-label-margin mb-0 mt-2"
                                for="adminPassword"
                                translate
                            >
                                Required
                            </p>
                        }
                        @if (adminPassword.errors?.wrongPassword) {
                            <p
                                class="paragraph error-label password-label-margin mb-0 mt-2"
                                for="adminPassword"
                                translate
                            >
                                Wrong password
                            </p>
                        }
                    }
                </div>
            }
        </div>
        <div class="modal-footer next-button">
            <button
                class="btn btn-default svg-icon"
                (click)="setCurrentState.emit()"
                type="button"
            >
                <svg-icon
                    nx-add-svg-src
                    [src]="icons.dir + 'arrow_left.svg'"
                    class="mr-1"
                    [applyClass]="true"
                ></svg-icon>
                <span translate>Back</span>
            </button>
            <nx-process-button
                [process]="adminPasswordProcess"
                [form]="adminPasswordForm"
                actionType="primary"
                [svg]="{ src: 'arrow_right' }"
                buttonText="{{ 'Next' | translate }}"
            ></nx-process-button>
        </div>
    </form>
</main>
