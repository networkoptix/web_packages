<form
    #codeForm="ngForm"
    name="loginForm"
    novalidate
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Change Password
        </h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <span class="close-content"></span>
        </button>
    </div>

    <div class="modal-body">
        <div class="form-group">
            <label
                class="label"
                for="tfaCodeInput"
                translate
                >Enter a verification code from your authentication app or a backup code to
                continue</label
            >

            <nx-2fa-code-input
                #tfaCodeInput
                name="tfaCodeInput"
                [(ngModel)]="tfaCode"
                [codeForm]="codeForm"
                required
            ></nx-2fa-code-input>
        </div>
    </div>

    <div class="modal-footer">
        <nx-process-button
            [clickFn]="markAsDirty"
            [process]="changePasswordProcess"
            [form]="codeForm"
            actionType="primary"
            [buttonText]="'OK' | translate"
        ></nx-process-button>
        <nx-cancel-button
            [process]="changePasswordProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
