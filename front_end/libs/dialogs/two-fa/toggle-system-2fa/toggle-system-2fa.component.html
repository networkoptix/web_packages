<form
    #codeForm="ngForm"
    name="codeForm"
    novalidate
>
    <div class="modal-header">
        <h1 class="modal-title">
            <ng-container *ngIf="!system2faEnabled; else disable2fa">
                <span translate>Enable mandatory two-factor authentication</span>
            </ng-container>
            <ng-template #disable2fa>
                <span translate> Disable mandatory two-factor authentication </span>
            </ng-template>
        </h1>

        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <span class="close-content"></span>
        </button>
    </div>

    <div class="modal-body">
        <div class="form-group">
            <!-- <div>
                <p
                    *ngIf="usersWithout2fa > 0"
                    class="input-error"
                    translate="{numUsers} users from this system have accounts with disabled two-factor authentication. They will not be able to log in to the system."
                    [translateParams]="{ numUsers: usersWithout2fa }"
                ></p>

            </div> -->
            <label
                class="label"
                for="tfaCodeInput"
                translate
                >Enter a verification code from your authentication app or a backup code to
                continue</label
            >
            <nx-2fa-code-input
                #tfaCodeInput
                name="tfaCodeInput"
                [(ngModel)]="tfaCode"
                [codeForm]="codeForm"
                required
            ></nx-2fa-code-input>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [clickFn]="markAsDirty"
            [process]="toggleSystem2faProcess"
            [form]="codeForm"
            [actionType]="!system2faEnabled ? 'primary' : 'danger'"
            [buttonText]="
                !system2faEnabled ? LANG.dialogs.buttons.enable : LANG.dialogs.buttons.disable
            "
        ></nx-process-button>
        <nx-cancel-button
            [process]="toggleSystem2faProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
