<form
    name="addCustomizationForm"
    novalidate
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Add Brand
        </h1>
        <button
            type="button"
            class="close"
            id="closeAddUCustomization"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <div class="close-content"></div>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label translate>Brand Name</label>
            <input
                class="form-control"
                id="brandName"
                name="brandName"
                [(ngModel)]="newBrand.name"
                autofocus
                required
            />
        </div>
        <div class="form-group">
            <label translate>Brand</label>
            <nx-select
                [id]="brands.id"
                [name]="brands.label"
                [items]="brands.items"
                [(ngModel)]="brands.selected"
            ></nx-select>
        </div>
    </div>
    <div class="modal-footer">
        <button
            class="btn btn-default"
            (click)="saveBrand()"
            translate
        >
            Save
        </button>
    </div>
</form>
