<div class="nx-modal__header">
    <span
        class="nx-modal__header-title"
        translate
        >Modal Title</span
    >
    @if (closable) {
        <button
            type="button"
            class="nx-modal__header-close-btn"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        ></button>
    }
</div>
<form class="nx-modal__content">
    <div class="nx-modal__body">
        <!-- Content -->
    </div>
    <div class="nx-modal__footer">
        <button
            type="button"
            class="btn btn-default"
            translate
        >
            Cancel
        </button>
        <nx-async-action-button
            [action]="asyncAction"
            [(busy)]="busy"
            translate
        >
            Action
        </nx-async-action-button>
    </div>
</form>
