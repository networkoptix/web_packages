<form
    #createSystemGroupForm="ngForm"
    name="createSystemGroupForm"
    novalidate
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            New Folder
        </h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <div class="close-content"></div>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label for="groupName">
                {{ 'Name' | translate }}
            </label>
            <input
                #groupName="ngModel"
                class="form-control"
                id="groupName"
                name="groupName"
                [(ngModel)]="name"
                autofocus
                required
            />
            <span
                *ngIf="groupName.touched && groupName.errors?.required"
                class="error-label"
                translate
                >Name is required</span
            >
            <span
                *ngIf="groupName.value?.length > 150"
                class="error-label"
                translate
                >Folder name shouldn't be more than 150 symbols</span
            >
        </div>
        <!-- <div class="form-group">
            <label for="groupParent" translate>Group Parent</label>
            <nx-select
                [componentId]="'groupParent'"
                name="groupParent"
                [items]="parentOptions"
                [selected]="selectedParent"
                [(ngModel)]="selectedParent"
            ></nx-select>
        </div> -->
    </div>
    <div class="modal-footer">
        <nx-process-button
            [form]="createSystemGroupForm"
            [process]="createSystemGroupProcess"
            [buttonText]="'Create' | translate"
            [buttonDisabled]="groupName.value?.length > 150"
        ></nx-process-button>
        <nx-cancel-button
            [process]="createSystemGroupProcess"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
