<form
    #createSystemGroupForm="ngForm"
    name="createSystemGroupForm"
    novalidate
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Create Group
        </h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <div class="close-content"></div>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label for="groupName">{{
                !hasGroups ? ('Name' | translate) : ('New Group Name' | translate)
            }}</label>
            <input
                #groupName="ngModel"
                class="form-control"
                [ngClass]="{ 'no-groups': !hasGroups }"
                id="groupName"
                name="groupName"
                [(ngModel)]="newGroupName"
                autofocus
                required
            />
            <p
                class="modal-paragraph-light"
                *ngIf="!hasGroups; else subsequentGroups"
            >
                {{ LANG.dialogs.systemGroups.createFirstGroup | translate }}
            </p>

            <ng-template #subsequentGroups>
                <p class="modal-paragraph-light">
                    {{
                        (parentGroup
                            ? LANG.dialogs.systemGroups.createdInsideSelectedGroup
                            : LANG.dialogs.systemGroups.createdInCurrentGroup
                        ) | translate: { parentGroup }
                    }}
                </p>
            </ng-template>
        </div>
        <!-- <div class="form-group">
            <label for="groupParent" translate>Group Parent</label>
            <nx-select
                id="groupParent"
                name="groupParent"
                [items]="parentOptions"
                [selected]="selectedParent"
                [(ngModel)]="selectedParent"
            ></nx-select>
        </div> -->
    </div>
    <div class="modal-footer">
        <nx-process-button
            [form]="createSystemGroupForm"
            [process]="createSystemGroupProcess"
            [buttonText]="'Create' | translate"
        ></nx-process-button>
        <nx-cancel-button
            [process]="createSystemGroupProcess"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
