<div class="bookmark-modal">
    <div class="modal-header">
        <h1 class="title">{{ bookmark.name }}</h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <span class="close-content"></span>
        </button>
    </div>

    <div class="modal-body">
        <div class="video">
            <div class="clip">
                <!-- When uncommenting the CSS transitions, remove *ngIf="!videoError$$()", add [ngClass]="{ 'clip--loading': !videoLoaded$$() }" -->
                <nx-clip
                    *ngIf="!videoError$$()"
                    [ngClass]="{ 'clip--loading': !videoLoaded$$() }"
                    [sourceUrl]="bookmark.src"
                    [posterUrl]="bookmark.thumbnail | async"
                    disableDownload
                    disablePictureInPicture
                    autoplay
                    (error)="videoError$$.set(true); videoLoaded$$.set(true)"
                    (loadeddata)="videoLoaded$$.set(true)"
                >
                </nx-clip>
                <div
                    *ngIf="!videoLoaded$$()"
                    class="placeholder"
                >
                    <nx-pre-loader></nx-pre-loader>
                </div>
            </div>
            <div
                class="placeholder"
                [ngClass]="{ 'is-hidden': !videoError$$() }"
            >
                <nx-player-placeholder
                    class="placeholder--hidden"
                    [ngClass]="{ 'placeholder--visible': videoError$$() }"
                    svgFileName="placeholder_camera_alert"
                    [description]="
                        !bookmark.canViewBookmark
                            ? ('View Bookmarks and View Archive permissions are required to access this Bookmark.'
                              | translate)
                            : ('The video format for this bookmark is not supported by your browser. Please download it to view locally'
                              | translate)
                    "
                ></nx-player-placeholder>
            </div>
        </div>
        <div class="date">{{ date }} • {{ time }}</div>
        <div class="deviceName">{{ bookmark.deviceName }}</div>
        <h2 class="name">{{ bookmark.name }}</h2>
        <p
            class="description"
            *ngIf="bookmark.description; else noDescription"
        >
            {{ bookmark.description }}
        </p>
        <ng-template #noDescription>
            <p
                class="description"
                translate
            >
                No description has been added. You may add one through %VMS_NAME%.
            </p>
        </ng-template>
        <div class="tags">
            <span *ngFor="let tag of bookmark.tags">#{{ tag }}</span>
        </div>
    </div>

    <div class="modal-footer">
        <a
            class="view-recording-button btn btn-primary"
            [href]="fullRecordingUrl"
            target="_blank"
            translate
        >
            <svg-icon
                nx-add-svg-src
                [src]="icons.dirTextButtons + 'play-2.svg'"
                [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                [applyClass]="true"
            ></svg-icon>
            View Full Recording
        </a>
        <button
            *ngIf="bookmark.canDownloadBookmark"
            (click)="openDownloadDialog()"
            class="download-button btn-default btn"
            type="button"
            translate
        >
            <svg-icon
                nx-add-svg-src
                [src]="icons.dirTextButtons + 'download-2.svg'"
                [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                [applyClass]="true"
            ></svg-icon>
            Download
        </button>
    </div>
</div>
