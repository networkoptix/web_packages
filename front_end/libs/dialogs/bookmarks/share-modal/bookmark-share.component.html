<div
    class="outer-container"
    [ngStyle]="{ visibility: loading() ? 'hidden' : 'visible' }"
>
    @if (loading()) {
        <nx-pre-loader class="pre-loader-visible" />
    }
    <div class="modal-header">
        <div class="header-title">
            @if (pageState() === 'details') {
                <span translate>Share</span>
            } @else if (pageState() === 'edit') {
                <span translate>Edit Link Parameters</span>
            }
        </div>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <span class="close-content"></span>
        </button>
    </div>
    @if (pageState() === 'details') {
        <nx-bookmark-share-details
            [shareUrl]="shareUrl"
            [onEditClick]="onEditClick"
            [onDeleteClick]="onDeleteClick"
            [expirationText]="(expirationText | async) || '' | nxTranslate"
            [passwordDetailsText]="passwordDetailsText"
        />
    } @else if (pageState() === 'edit') {
        <nx-bookmark-share-edit
            (onConfirmClick)="onSaveClick($event)"
            (onCancelClick)="onCancelEditClick()"
            [initialExpirationTime]="bookmark.share!.expirationTimeMs"
            [hasExistingPassword]="bookmark.share!.password === '******'"
        />
    }
</div>
