<div>
    <form [formGroup]="shareForm">
        <div class="input-section">
            <div
                class="input-header"
                translate
            >
                Lifetime
            </div>
            <nx-select-v2 formControlName="expiresTime">
                @if (initialExpirationTime() !== 0) {
                    <nx-select-item [value]="initialExpirationTime()">
                        {{ (initialExpirationTimeString() | async) || '' | nxTranslate }}
                    </nx-select-item>
                }
                <nx-select-item
                    [value]="nowTime + TIMES.hour"
                    translate
                >
                    Expires in an hour
                </nx-select-item>
                <nx-select-item
                    [value]="nowTime + TIMES.day"
                    translate
                >
                    Expires in a day
                </nx-select-item>
                <nx-select-item
                    [value]="oneMonthFromNow"
                    translate
                >
                    Expires in a month
                </nx-select-item>
                <nx-select-item
                    [value]="0"
                    translate
                >
                    Never expires
                </nx-select-item>
            </nx-select-v2>
        </div>
        <div class="input-section input-section-password">
            <div
                class="input-header"
                translate
            >
                Protect with Password
            </div>
            <input
                #passwordInput
                autocomplete="off"
                class="form-control input-sm"
                [placeholder]="LANG.bookmarkSharing.notPasswordProtected"
                (click)="passwordInput.select()"
                (keydown)="onPasswordInputKeydown()"
                formControlName="password"
            />
        </div>
        <div class="buttons-section">
            <button
                class="btn btn-primary"
                (click)="onConfirm()"
                [disabled]="!shareForm.valid || shareForm.pristine"
                translate
            >
                Confirm
            </button>
            <button
                class="btn btn-default"
                (click)="onCancelClick.emit()"
                translate
            >
                Cancel
            </button>
        </div>
    </form>
</div>
