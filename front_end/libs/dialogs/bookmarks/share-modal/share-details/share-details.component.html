<div class="url-section">
    <div class="url-text">
        {{ shareUrl() }}
    </div>
    <button
        class="copy-button"
        type="button"
        (click)="copyToClipboard()"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirTextButtons + 'copy.svg'"
            [svgStyle]="{ 'width.px': '24', 'height.px': '24' }"
            [applyClass]="true"
            nxTooltip="Copied!"
            toggleOnClick
            closeAfterDelay
        >
        </svg-icon>
    </button>
</div>
<div class="share-details-section">
    <ul class="nx-ul">
        <li>{{ expirationText() }}</li>
        <li>{{ passwordDetailsText() }}</li>
    </ul>
</div>
<div class="buttons-sections">
    <button
        class="btn btn-default"
        (click)="onEditClick.emit()"
        translate
    >
        Edit
    </button>
    <button
        class="btn btn-text"
        (click)="onDeleteClick.emit()"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirTextButtons + 'block.svg'"
            [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
            [applyClass]="true"
        >
        </svg-icon>
        <span
            class="delete-button-text"
            translate
        >
            Stop Sharing
        </span>
    </button>
</div>
