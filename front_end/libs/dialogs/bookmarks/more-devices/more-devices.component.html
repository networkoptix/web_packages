<nx-more-filters-base>
    <ng-container header>{{ 'More Devices' | translate }}</ng-container>
    <ng-container body>
        <nx-simple-search
            [(ngModel)]="search"
            [placeholder]="LANG.search.quickSearch"
        ></nx-simple-search>
        <div class="devices">
            <label *ngFor="let device of searchMatches">
                <nx-checkbox
                    [ngModel]="dialogData.selection.isSelected(device)"
                    (ngModelChange)="selectionChange(device, $event)"
                ></nx-checkbox>
                {{ device }}
            </label>
        </div>
    </ng-container>
</nx-more-filters-base>
