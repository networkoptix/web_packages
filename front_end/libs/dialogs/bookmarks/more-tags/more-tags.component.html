<nx-more-filters-base>
    <ng-container header>{{ 'More Tags' | translate }}</ng-container>
    <ng-container body>
        <nx-simple-search [(ngModel)]="search"></nx-simple-search>
        <div class="tags">
            <button
                class="tag"
                [ngClass]="{ selected: dialogData.selection.isSelected(tag) }"
                *ngFor="let tag of searchMatches"
                (click)="dialogData.selection.toggle(tag)"
            >
                {{ tag }}
            </button>
        </div>
    </ng-container>
</nx-more-filters-base>
