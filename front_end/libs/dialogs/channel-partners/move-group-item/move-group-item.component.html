<div class="nx-modal__header">
    <span
        class="nx-modal__header-title"
        translate
        >Move to</span
    >
    @if (closable) {
        <button
            type="button"
            class="nx-modal__header-close-btn"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        ></button>
    }
</div>
<form
    class="nx-modal__content"
    [formGroup]="formGroup"
>
    <div class="nx-modal__body">
        <nx-org-tree-selector
            formControlName="folder"
            [organization]="organization"
            [groups]="groups"
            [statuses]="orgTreeStatuses"
        ></nx-org-tree-selector>
    </div>
    <div class="nx-modal__footer">
        <button
            type="button"
            class="btn btn-default"
            [disabled]="busy"
            (click)="close()"
            translate
        >
            Cancel
        </button>
        <nx-async-action-button
            [action]="moveItemAction"
            [(busy)]="busy"
            noInvalidFirstSubmit
        >
            {{ 'Move' | translate }}
        </nx-async-action-button>
    </div>
</form>
