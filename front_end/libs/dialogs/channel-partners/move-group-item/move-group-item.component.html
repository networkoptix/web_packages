<div class="nx-modal__header">
    <span
        class="nx-modal__header-title"
        translate
        >Move to</span
    >
    @if (closable) {
        <button
            type="button"
            class="nx-modal__header-close-btn"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        ></button>
    }
</div>
<form
    class="nx-modal__content"
    [formGroup]="formGroup"
    nxFormObserver
>
    <div class="nx-modal__body">
        <nx-form-field>
            <nx-org-tree-selector
                formControlName="folder"
                [organization]="organization"
                [groups]="groups"
                [statuses]="orgTreeStatuses"
            ></nx-org-tree-selector>
            <nx-control-messages>
                <nx-control-message
                    key="required"
                    [text]="'Destination folder is required' | translate"
                ></nx-control-message>
            </nx-control-messages>
        </nx-form-field>
    </div>
    <div class="nx-modal__footer">
        <button
            type="button"
            class="btn btn-default"
            [disabled]="busy"
            (click)="close()"
            translate
        >
            Cancel
        </button>
        <button
            nx-async-submit-button
            [action]="moveItemAction"
            (busyChange)="busy$$.set($event)"
        >
            <span translate>Move</span>
        </button>
    </div>
</form>
