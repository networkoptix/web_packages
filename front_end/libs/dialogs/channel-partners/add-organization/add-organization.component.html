<div class="nx-modal__header">
    <span
        class="nx-modal__header-title"
        translate
        >New Organization</span
    >
    @if (closable) {
        <button
            type="button"
            class="nx-modal__header-close-btn"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        ></button>
    }
</div>
<form
    class="nx-modal__content"
    [formGroup]="formGroup"
>
    <div class="nx-modal__body">
        <nx-form-field>
            <label
                for="add-organization-name"
                nx-label
                translate
                >Name</label
            >
            <input
                nx-input
                id="add-organization-name"
                formControlName="orgName"
            />
            <nx-control-messages>
                <nx-control-message
                    key="required"
                    [text]="'Name is required' | translate"
                ></nx-control-message>
            </nx-control-messages>
        </nx-form-field>
    </div>
    <div class="nx-modal__footer">
        <button
            type="button"
            class="btn btn-default"
            [disabled]="busy"
            (click)="close()"
            translate
        >
            Cancel
        </button>
        <nx-async-action-button
            [action]="addOrganizationProcess"
            [(busy)]="busy"
            translate
        >
            Create
        </nx-async-action-button>
    </div>
</form>
