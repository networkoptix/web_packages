<button
    #selectButton
    type="button"
    (click)="onClick()"
    [disabled]="disabled$$() || readOnly()"
    class="org-step-select btn btn-dropdown-toggle"
    [ngClass]="{ 'org-step-select--readonly': readOnly() }"
>
    <div
        class="path-container"
        #pathContainer
    >
        @if (selectedPath) {
            <ng-template [cdkPortalOutlet]="selectedPath"></ng-template>
        } @else {
            <span translate>Select</span>
        }
        <div class="hidden-paths">
            <!-- Using control flow adds whitespace between path parts -->
            <!-- eslint-disable @angular-eslint/template/prefer-control-flow -->
            <span
                *ngIf="value.length"
                #path
                data-full-path
                ><ng-container *ngFor="let part of value; last as last"
                    >{{ part }}{{ !last ? '/' : '' }}</ng-container
                ></span
            >
            <!-- eslint-enable @angular-eslint/template/prefer-control-flow -->
            @if (value.length > 1) {
                <span #path>.../{{ value[1] }}</span>
            }
            @if (value.length > 2) {
                <span #path>{{ value[0] }}/.../{{ value[value.length - 1] }}</span>
            }
        </div>
    </div>
    <svg-icon
        class="org-step-select__arrow"
        [src]="icons.dirTextButtons + 'arrow_expand.svg'"
    ></svg-icon>
</button>
