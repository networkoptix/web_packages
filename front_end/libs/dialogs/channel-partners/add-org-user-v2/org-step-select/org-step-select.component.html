<button
    [id]="controlId()"
    #selectButton
    type="button"
    (click)="onClick()"
    [disabled]="disabled$$() || readOnly()"
    class="org-step-select"
    [ngClass]="{ 'org-step-select--readonly': readOnly() }"
>
    <div
        class="path-container"
        #pathContainer
    >
        @if (selectedPath) {
            <ng-template [cdkPortalOutlet]="selectedPath"></ng-template>
        } @else {
            <span
                class="org-step-select__placeholder"
                translate
                >Select</span
            >
        }
        <div class="hidden-paths">
            <span #ellipsesSpan>...</span>
            @if (fullPath()) {
                <span
                    #fullPathSpan
                    class="full-path"
                    >{{ fullPath() }}</span
                >
            }
            @if (shortPath(); as shortPath) {
                <span
                    #shortPathSpan
                    class="short-path"
                >
                    <span class="short-path__head">{{ shortPath.head }}</span
                    ><span
                        class="short-path__center"
                        #shortPathCenterSpan
                        >{{ shortPath.center }}</span
                    ><span
                        class="short-path__tail"
                        #shortPathTailSpan
                        >{{ shortPath.tail }}</span
                    >
                </span>

                <span
                    #extraShortPathSpan
                    class="extra-short-path"
                    >.../{{ shortPath.tail }}</span
                >
            }
        </div>
    </div>
    <svg-icon
        class="org-step-select__arrow"
        [src]="icons.dirTextButtons + 'arrow_expand.svg'"
    ></svg-icon>
</button>
