<form #addOrgUserForm="ngForm">
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Add User
        </h1>
        <button
            *ngIf="closable"
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <span class="close-content"></span>
        </button>
    </div>
    <div class="modal-body">
        <label
            for="userEmail"
            translate
            >Login</label
        >
        <nx-email-input
            class="fs-mask form-component"
            id="userEmail"
            name="userEmail"
            componentId="userEmail"
            [ngModel]="userEmail$$()"
            (ngModelChange)="userEmail$$.set($event)"
            [form]="addOrgUserForm"
            #userEmail="ngModel"
            [setFocus]="true"
        >
        </nx-email-input>
        <p
            *ngIf="userEmail.touched && userEmail.errors?.pattern"
            class="error-label"
            translate
        >
            Invalid email
        </p>
        <div
            class="mb-3"
            [ngStyle]="{ display: 'hidden' }"
        ></div>

        <label
            translate
            for="permission-group"
            >Permission Group</label
        >
        <nx-dropdown
            [selected]="selectedRole$$()"
            (selectedChange)="selectedRole$$.set($event)"
            name="permission-group"
            class="d-block mb-3"
        >
            <ng-container *ngFor="let role of roles">
                <nx-simple-dropdown-item
                    [value]="role.id"
                    [selected]="selectedRole$$() === role.id"
                    >{{ role.name }}</nx-simple-dropdown-item
                >
            </ng-container>
        </nx-dropdown>

        <label
            for="orgTreeSearch"
            translate
            >Folder</label
        >
        <!-- Only close dropdown if Esc while dropdown is open -->
        <div
            class="dropdown-wrapper"
            (keydown.arrowup)="up()"
            (keydown.arrowdown)="down()"
            (keydown.arrowleft)="setHighlightedFolderState(false)"
            (keydown.arrowright)="setHighlightedFolderState(true)"
            (keydown.Esc)="dropdownOpen && $event.stopPropagation(); closeDropdown()"
        >
            <!-- Focus stays with the input, but pseudo-focus highlighting indicates
            target in dropdown list -->
            <input
                [(ngModel)]="folderSearch"
                (ngModelChange)="openDropdown(); searchGroups($event)"
                type="text"
                spellcheck="false"
                class="form-control mb-1"
                [ngClass]="{
                    warning: this.errorState$$().warning,
                    error: this.errorState$$().error
                }"
                name="orgTreeSearch"
                id="org-tree-search"
                #orgTreeSearch
                autocomplete="off"
                (keydown.arrowup)="$event.preventDefault()"
                (keydown.arrowdown)="$event.preventDefault()"
                (keydown.arrowleft)="(highlightIndex === null)"
                (keydown.arrowright)="(highlightIndex === null)"
                (keydown.Enter)="onFolderSearchEnter($event)"
                required
            />
            <!-- Prevent default up/down input behavior always  -->
            <!-- Prevent default left/right cursor navigation if in dropdown -->
            <!-- Block default submit on enter if dropdown open to prevent
            immediately submitting on select -->
            <button
                #openBtn
                class="dropdown-open-btn"
                type="button"
                (click)="dropdownOpen ? closeDropdown() : openDropdown()"
            >
                <svg-icon
                    [src]="icons.dirTextButtons + 'arrow_down.svg'"
                    [svgStyle]="{
                        'width.px': '25',
                        'height.px': '25',
                        transform: dropdownOpen ? 'scaleY(-1)' : 'none'
                    }"
                ></svg-icon>
            </button>
            <div
                class="focus-trap"
                tabindex="0"
                (focus)="$event.relatedTarget === openBtn ? orgTreeRef.nativeElement.focus() : true"
            ></div>
        </div>
        <ng-template
            cdk-portal
            #overlayTemplate="cdkPortal"
        >
            <div
                class="focus-trap"
                tabindex="0"
                (focus)="openBtn.focus()"
            ></div>
            <!-- Because the "buttons" in the dropdown aren't focusable, we
            have to do some magic to prevent the focus from escaping to the page. -->
            <!-- Prevent 2 default behaviors: -->
            <!-- 1. Scrolling the dropdown (this should be handled by setting the highlighted folder) -->
            <!-- 2. The cursor being put at the beginning of the input when focusing from up press -->
            <ul
                #orgTree
                class="org-tree"
                (keydown.arrowup)="$event.preventDefault(); up()"
                (keydown.arrowdown)="$event.preventDefault(); down()"
                (keydown.arrowleft)="setHighlightedFolderState(false)"
                (keydown.arrowright)="setHighlightedFolderState(true)"
                (keydown.Esc)="$event.stopPropagation(); closeDropdown()"
                tabindex="-1"
            >
                <!-- Org itself has index of -1 since it's separate from the folders, but
                still highlightable -->
                <li
                    #orgItem
                    id="org-item"
                    class="org-tree__item"
                    [ngClass]="{
                        'org-tree__item--highlight': highlightIndex === -1,
                        'org-tree__item--selected': selectedFolder$$() === organization.id
                    }"
                    (click)="selectFolder(organization.id)"
                >
                    <svg-icon
                        [src]="icons.dirTextButtons + 'organization.svg'"
                        [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
                    ></svg-icon>
                    <span>{{ organization.name }}</span>
                </li>
                <ng-container *ngFor="let group of folderSearchResults; index as i">
                    <li
                        *ngIf="visibleFolders.has(group.id)"
                        [ngStyle]="{
                            paddingLeft: group.level * 25 + 'px'
                        }"
                        [class]="'org-tree__item' + ' ' + 'org-tree__item--' + i"
                        [ngClass]="{
                            'org-tree__item--highlight': highlightIndex === i,
                            'org-tree__item--selected': selectedFolder$$() === group.id
                        }"
                        (click)="selectFolder(group.id)"
                    >
                        <div
                            class="org-tree__arrow-btn"
                            (click)="
                                $event.stopPropagation();
                                toggleFolderOpen(group.id);
                                highlightIndex = i
                            "
                        >
                            <svg-icon
                                [src]="
                                    icons.dirTextButtons +
                                    (openFolders.has(group.id)
                                        ? 'arrow_down.svg'
                                        : 'arrow_right.svg')
                                "
                                [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
                            ></svg-icon>
                        </div>
                        <svg-icon
                            [src]="
                                icons.dir +
                                (openFolders.has(group.id)
                                    ? 'ws_folder_open.svg'
                                    : 'ws_folder_close.svg')
                            "
                            [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
                            svgClass="folder"
                        ></svg-icon>
                        <span>{{ group.name }}</span>
                    </li>
                </ng-container>
            </ul>
            <div
                class="focus-trap"
                tabindex="0"
                (focus)="orgTreeSearch.focus()"
            ></div>
        </ng-template>
        <ng-container *ngrxLet="errorState$$() as state">
            <div
                *ngIf="!state.error && state.warning"
                class="warning"
            >
                {{ state.warning }}
            </div>
            <div
                *ngIf="state.error"
                class="error-label"
            >
                {{ state.error }}
            </div>
        </ng-container>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="addOrgUserProcess"
            [buttonText]="'Confirm' | translate"
            [buttonDisabled]="!!errorState$$().error || !userEmail$$()"
            [form]="addOrgUserForm"
        ></nx-process-button>
        <!-- Role and folder are defined on construct -->
        <nx-cancel-button
            [process]="addOrgUserProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
