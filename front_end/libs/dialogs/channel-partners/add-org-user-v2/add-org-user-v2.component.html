<form #addOrgUserForm="ngForm">
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Add User
        </h1>
        <button
            *ngIf="closable"
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <span class="close-content"></span>
        </button>
    </div>
    <div class="modal-body">
        <label
            for="userEmail"
            translate
            >Login</label
        >
        <nx-email-input
            class="fs-mask form-component"
            id="userEmail"
            name="userEmail"
            componentId="userEmail"
            [ngModel]="userEmail$$()"
            (ngModelChange)="userEmail$$.set($event)"
            [form]="addOrgUserForm"
            #userEmail="ngModel"
            [setFocus]="true"
        >
        </nx-email-input>
        <p
            *ngIf="userEmail.touched && userEmail.errors?.pattern"
            class="error-label"
            translate
        >
            Invalid email
        </p>
        <div
            class="mb-3"
            [ngStyle]="{ display: 'hidden' }"
        ></div>

        <label
            translate
            for="permission-group"
            >Permission Group</label
        >
        <nx-dropdown
            [ngModel]="selectedRole$$()"
            (ngModelChange)="selectedRole$$.set($event!)"
            name="permission-group"
            class="d-block mb-3"
        >
            <ng-container *ngFor="let role of roles">
                <nx-simple-dropdown-item
                    [value]="role.id"
                    [selected]="selectedRole$$() === role.id"
                    >{{ role.name }}</nx-simple-dropdown-item
                >
            </ng-container>
        </nx-dropdown>

        <label
            for="orgTreeSearch"
            translate
            >Folder</label
        >
        <nx-org-tree-selector
            name="targetFolder"
            #targetFolder="ngModel"
            [model]="targetFolder"
            [organization]="organization"
            [groups]="groupsStore.sortedGroups$$()"
            [statuses]="orgTreeStatuses$$()"
            [messagesNumLines]="2"
            [ngModel]="selectedFolder$$()"
            (ngModelChange)="selectedFolder$$.set($event)"
        ></nx-org-tree-selector>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="addOrgUserProcess"
            [buttonText]="'Confirm' | translate"
            [buttonDisabled]="
                targetFolder.errors?.invalid || !userEmail$$() || userEmail.errors?.pattern
            "
            [form]="addOrgUserForm"
        ></nx-process-button>
        <!-- Role and folder are defined on construct -->
        <nx-cancel-button
            [process]="addOrgUserProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
