<div class="nx-modal__header">
    <span
        class="nx-modal__header-title"
        translate
    >
        Rename Folder
    </span>
    @if (closable) {
        <button
            type="button"
            class="nx-modal__header-close-btn"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        ></button>
    }
</div>

<form
    class="nx-modal__content"
    [formGroup]="formGroup"
>
    <div class="nx-modal__body">
        <nx-form-field>
            <label
                for="update-group-folder-name"
                nx-label
                translate
                >Folder Name</label
            >
            <input
                nx-input
                id="update-group-folder-name"
                formControlName="renameFolder"
            />
            <nx-control-messages>
                <nx-control-message
                    key="required"
                    [text]="'Folder Name is required' | translate"
                ></nx-control-message>
            </nx-control-messages>
        </nx-form-field>
    </div>
    <div class="nx-modal__footer">
        <button
            type="button"
            class="btn btn-default"
            [disabled]="busy"
            (click)="close()"
            translate
        >
            Cancel
        </button>
        <nx-async-action-button
            [action]="updateSystemGroupProcess"
            [(busy)]="busy"
        >
            <span translate>Save</span>
        </nx-async-action-button>
    </div>
</form>
