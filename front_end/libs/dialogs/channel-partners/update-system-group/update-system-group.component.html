<form #updateSystemGroupFrom="ngForm">
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Rename Folder
        </h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <span class="close-content"></span>
        </button>
    </div>
    <div class="modal-body">
        <label
            for="groupName"
            translate
        >
            Folder Name
        </label>
        <input
            class="form-control"
            id="groupName"
            name="groupName"
            [(ngModel)]="name"
            #groupName="ngModel"
            autofocus
            [required]="updateSystemGroupFrom.submitted"
        />
        @if (groupName.touched && groupName.errors?.required) {
            <span
                class="error-label"
                translate
            >
                Name is required
            </span>
        } @else if (groupName.value?.length > 150) {
            <span
                class="error-label"
                translate
            >
                Folder name shouldn't be more than 150 symbols
            </span>
        }
    </div>
    <div class="modal-footer">
        <nx-process-button
            [form]="updateSystemGroupFrom"
            [process]="updateSystemGroupProcess"
            [buttonText]="'Save' | translate"
            [buttonDisabled]="groupName.value?.length > 150"
        ></nx-process-button>
        <nx-cancel-button
            [process]="updateSystemGroupProcess"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
