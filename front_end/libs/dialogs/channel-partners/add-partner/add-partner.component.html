<form
    #addPartnerForm="ngForm"
    name="addPartnerForm"
    novalidate
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            New Channel Partner
        </h1>
        <button
            type="button"
            class="close"
            id="closeAddPartner"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <div class="close-content"></div>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label
                for="partnerName"
                translate
                >Name</label
            >
            <input
                class="form-control"
                id="partnerName"
                name="partnerName"
                [(ngModel)]="name"
                #partnerName="ngModel"
                required
            />
            <div class="warning-container">
                <span
                    *ngIf="partnerName.touched && partnerName.errors?.required"
                    class="input-error"
                    translate
                    >Required</span
                >
            </div>

            <label
                for="ownerEmail"
                translate
                >Owner email</label
            >
            <nx-email-input
                class="fs-mask form-component"
                id="ownerEmail"
                name="ownerEmail"
                componentId="ownerEmail"
                [(ngModel)]="firstAdminEmail"
                [form]="addPartnerForm"
                #ownerEmail="ngModel"
            >
            </nx-email-input>
            <div class="warning-container">
                <ng-container *ngIf="ownerEmail.touched">
                    <span
                        *ngIf="ownerEmail.errors?.required"
                        class="input-error"
                        translate
                        >Required</span
                    >
                    <span
                        *ngIf="ownerEmail.errors?.pattern"
                        class="input-error"
                        translate
                        >Invalid email</span
                    >
                </ng-container>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="addPartnerProcess"
            [buttonText]="'Create' | translate"
            [buttonDisabled]="!!(partnerName.errors || ownerEmail.errors)"
        ></nx-process-button>
        <nx-cancel-button
            [process]="addPartnerProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
