<form
    name="addPartnerForm"
    novalidate
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            New Channel Partner
        </h1>
        <button
            type="button"
            class="close"
            id="closeAddPartner"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <div class="close-content"></div>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label translate>Name</label>
            <input
                class="form-control"
                id="partnerName"
                name="partnerName"
                [(ngModel)]="name"
                required
            />
        </div>
        <div>
            <label>
                <nx-checkbox
                    name="canCreateSubChannels"
                    componentId="canCreateSubChannels"
                    [(ngModel)]="canCreateSubChannels"
                ></nx-checkbox>
                <span translate>Can create subchannels</span>
            </label>
        </div>
        <div class="monthly-limit-container">
            <label translate>Monthly additional service limit</label>
            <div>
                <nx-checkbox
                    name="hasMonthlyLimit"
                    componentId="hasMonthlyLimit"
                    [(ngModel)]="hasMonthlyLimit"
                    [ngModelOptions]="{ standalone: true }"
                ></nx-checkbox>
                <nx-numeric
                    [min]="0"
                    [max]="POSITIVE_INFINITY"
                    [disabled]="!hasMonthlyLimit"
                    [(ngModel)]="monthlyAdditionalServiceLimit"
                    [ngModelOptions]="{ standalone: true }"
                ></nx-numeric>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="addPartnerProcess"
            [buttonText]="'Create' | translate"
        ></nx-process-button>
        <nx-cancel-button
            [process]="addPartnerProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
