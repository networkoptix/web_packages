<div class="nx-modal__header">
    <span
        class="nx-modal__header-title"
        translate
    >
        New Partner
    </span>
    @if (closable) {
        <button
            type="button"
            class="nx-modal__header-close-btn"
            id="closeAddPartner"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        ></button>
    }
</div>
<form
    class="nx-modal__content"
    [formGroup]="formGroup"
    nxFormObserver
>
    <div class="nx-modal__body">
        <nx-form-field>
            <label
                nx-label
                for="new-partner-name"
                translate
                >Partner Name</label
            >
            <input
                nx-input
                id="new-partner-name"
                formControlName="name"
            />
            <nx-control-messages>
                <nx-control-message
                    key="required"
                    [text]="'Partner Name is required' | translate"
                ></nx-control-message>
            </nx-control-messages>
        </nx-form-field>

        <nx-form-field>
            <label
                nx-label
                for="new-partner-admin-email"
                translate
                >Administrator email</label
            >
            <input
                nx-input
                type="email"
                id="new-partner-admin-email"
                formControlName="email"
            />
            <nx-control-messages pattern="email">
                <nx-control-message
                    key="required"
                    [text]="'Administrator email is required' | translate"
                ></nx-control-message>
            </nx-control-messages>
        </nx-form-field>
    </div>
    <div class="nx-modal__footer">
        <button
            nx-async-submit-button
            [action]="addPartnerAction"
            (busyChange)="busy$$.set($event)"
        >
            <span translate>Create</span>
        </button>
        <button
            type="button"
            class="btn btn-default"
            [disabled]="busy$$()"
            (click)="close()"
            translate
        >
            Cancel
        </button>
    </div>
</form>
