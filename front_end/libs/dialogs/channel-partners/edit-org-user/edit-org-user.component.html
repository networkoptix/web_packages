<form #editOrgUserForm="ngForm">
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Update Organization User
        </h1>
        <button
            *ngIf="closable"
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <span class="close-content"></span>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <div class="form-group">
                <label
                    class="label"
                    for="orgEditChannelPartner"
                    translate
                    >Role</label
                >
                <nx-select
                    [componentId]="'orgEditChannelPartner'"
                    name="channelPartner"
                    [stillLoading]="!roles.length"
                    [items]="roles"
                    [selected]="role"
                    [(ngModel)]="role"
                ></nx-select>
            </div>
        </div>
        <div class="form-group">
            <label
                class="label"
                for="title"
                translate
                >Title</label
            >
            <input
                class="form-control"
                id="title"
                name="title"
                [(ngModel)]="title"
            />
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="editOrgUserProcess"
            [buttonText]="'Update' | translate"
            [form]="editOrgUserForm"
        ></nx-process-button>
        <nx-cancel-button
            [process]="editOrgUserProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
