<button
    #selectButton
    type="button"
    (click)="onClick()"
    [disabled]="disabled$$() || readOnly()"
    class="org-step-select btn btn-default"
    [ngClass]="{ 'org-step-select--readonly': readOnly() }"
>
    <!-- TODO: Check how this text truncates with really long names -->
    <div [class]="'path-length-' + value.length">
        @switch (value.length) {
            @case (0) {
                <span translate>Select a folder</span>
            }
            @case (1) {
                <span class="org-name">{{ value[0] }}</span>
            }
            @case (2) {
                <span class="org-name">{{ value[0] }}</span
                >/<span class="group-name">{{ value[1] }}</span>
            }
            @case (3) {
                <span class="org-name">{{ value[0] }}</span
                >/.../<span class="group-name">{{ value[2] }}</span>
            }
        }
    </div>
    <svg-icon
        class="org-step-select__arrow"
        [src]="icons.dirTextButtons + 'arrow_expand.svg'"
    ></svg-icon>
</button>
