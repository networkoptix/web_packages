<form #moveSystemItemForm="ngForm">
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Move to
        </h1>
        @if (closable) {
            <button
                type="button"
                class="close"
                data-dismiss="modal"
                aria-label="Close"
                (click)="close()"
            >
                <span class="close-content"></span>
            </button>
        }
    </div>
    <div class="modal-body">
        <nx-org-tree-selector
            [organization]="organization"
            [groups]="groups"
            [statuses]="orgTreeStatuses"
            [ngModel]="selectedFolder()"
            (ngModelChange)="selectedFolder.set($event)"
        ></nx-org-tree-selector>
    </div>
    <div class="modal-footer">
        <nx-async-action-button
            [action]="moveSystemItemAction"
            [(busy)]="busy"
            noInvalidFirstSubmit
        >
            {{ 'Confirm' | translate }}
        </nx-async-action-button>
        <button
            type="button"
            class="btn btn-default"
            [disabled]="busy"
            (click)="close()"
            translate
        >
            Cancel
        </button>
    </div>
</form>
