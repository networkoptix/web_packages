<form
    name="addCustomizationUserForm"
    novalidate
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Add User
        </h1>
        <button
            type="button"
            class="close"
            id="closeAddCustomizationUser"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <div class="close-content"></div>
        </button>
    </div>
    <div class="modal-body">
        <form class="form">
            <div
                class="form-group"
                [formGroup]="form"
            >
                <label
                    for="email"
                    translate
                    >Email</label
                >
                <input
                    id="email"
                    class="form-control"
                    formControlName="email"
                    [ngClass]="{ 'input-error': emailInput?.invalid }"
                />
                <div *ngIf="emailInput?.invalid && (emailInput?.touched || emailInput?.dirty)">
                    <div
                        *ngIf="
                            emailInput?.errors['emailInvalid'] ||
                            emailInput?.errors['existingEmail']
                        "
                        class="subtext error"
                    >
                        {{ emailInput?.errors?.msg }}
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label
                    for="userRole"
                    translate
                    >Permission Group</label
                >
                <nx-select
                    [componentId]="'partnerAddUserRole'"
                    name="userRole"
                    [items]="roles"
                    [selected]="selectedRole"
                    [(ngModel)]="selectedRole"
                ></nx-select>
                <div class="subtext description">
                    {{ roleDescriptionMap[selectedRole.name] | translate }}
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [buttonDisabled]="!emailInput?.value || emailInput?.invalid || !selectedRole.value"
            [process]="createUserProcess"
            [buttonText]="'Add' | translate"
        ></nx-process-button>
        <nx-cancel-button
            [process]="createUserProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
