<div class="nx-modal__header">
    <span
        class="nx-modal__header-title"
        translate
        >Add User</span
    >
    @if (closable) {
        <button
            type="button"
            class="nx-modal__header-close-btn"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        ></button>
    }
</div>
<form
    class="nx-modal__content"
    [formGroup]="formGroup"
    nxFormObserver
>
    <div class="nx-modal__body">
        <nx-form-field [errorMatcher]="emailErrorMatcher">
            <label
                nx-label
                for="add-partner-user-email"
                translate
                >Email</label
            >
            <input
                type="email"
                id="add-partner-user-email"
                nx-input
                formControlName="email"
            />
            <nx-control-messages
                pattern="email"
                required="email"
            >
                <nx-control-message
                    key="selfAdd"
                    [text]="'You cannot add yourself' | translate"
                ></nx-control-message>
                <nx-control-message
                    key="existingUser"
                    [text]="'User has already been added to this channel partner' | translate"
                ></nx-control-message>
                <nx-control-message
                    key="backendReject"
                    [text]="'User has already been added to a child organization' | translate"
                ></nx-control-message>
            </nx-control-messages>
        </nx-form-field>
        <nx-form-field>
            <label
                nx-label
                for="add-partner-user-permission-group"
                translate
                >Permission Group</label
            >
            <nx-select-v2
                id="add-partner-user-permission-group"
                formControlName="permissionGroup"
                [placeholder]="'Select' | translate"
            >
                @for (role of partnerRoles$$(); track role.id) {
                    <nx-select-item
                        [value]="role.id"
                        [selected]="permissionGroupControl.value === role.id"
                        >{{ role.name | translate }}</nx-select-item
                    >
                }
            </nx-select-v2>
            <nx-control-messages
                useValueState
                [spacingLines]="2"
            >
                <nx-control-message
                    key="required"
                    [text]="'Permission Group is required' | translate"
                ></nx-control-message>
                @for (message of partnerRolesMessages(); track message.key) {
                    <nx-control-message
                        [key]="message.key"
                        [text]="message.text | translate"
                        type="info"
                    ></nx-control-message>
                }
            </nx-control-messages>
        </nx-form-field>
    </div>
    <div class="nx-modal__footer">
        <button
            type="button"
            class="btn btn-default"
            [disabled]="busy"
            (click)="close()"
            translate
        >
            Cancel
        </button>
        <button
            nx-async-submit-button
            [action]="addUserAction"
            (busyChange)="busy$$.set($event)"
        >
            <span translate>Add</span>
        </button>
    </div>
</form>
