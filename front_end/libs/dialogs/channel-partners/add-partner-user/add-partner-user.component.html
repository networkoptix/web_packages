<form
    name="addCustomizationUserForm"
    novalidate
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Add User
        </h1>
        <button
            type="button"
            class="close"
            id="closeAddCustomizationUser"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <div class="close-content"></div>
        </button>
    </div>
    <div class="modal-body">
        <form class="form">
            <div
                class="form-group"
                [formGroup]="form"
            >
                <label
                    for="email"
                    translate
                    >Email</label
                >
                <input
                    id="email"
                    class="form-control"
                    formControlName="email"
                    [ngClass]="{ 'input-error': emailInput?.invalid && emailInput?.touched }"
                />
                <ng-container
                    *ngIf="emailInput?.invalid && (emailInput?.touched || emailInput?.dirty)"
                >
                    <span
                        *ngIf="
                            emailInput?.errors['requiredEmail'] ||
                            emailInput?.errors['emailInvalid'] ||
                            emailInput?.errors['existingEmail'] ||
                            emailInput?.errors['backendError']
                        "
                        class="input-error"
                        >{{ emailInput?.errors?.msg }}</span
                    >
                </ng-container>
            </div>
            <div class="form-group permissions">
                <label
                    for="userRole"
                    translate
                    >Permission Group</label
                >
                <nx-select
                    [componentId]="'partnerAddUserRole'"
                    name="userRole"
                    [items]="roles"
                    [selected]="selectedRole"
                    [(ngModel)]="selectedRole"
                    (focusout)="partnerAddUserRoleFocused$$.set(true)"
                ></nx-select>
                <div
                    *ngIf="selectedRole.value"
                    class="subtext description"
                >
                    {{ roleDescriptionMap[selectedRole.name] | translate }}
                </div>
                <span
                    *ngIf="!selectedRole.value && partnerAddUserRoleFocused$$()"
                    class="input-error"
                    translate
                    >The "Permission group" is empty</span
                >
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [buttonDisabled]="!emailInput?.value || emailInput?.invalid || !selectedRole.value"
            [process]="createUserProcess"
            [buttonText]="'Add' | translate"
        ></nx-process-button>
        <nx-cancel-button
            [process]="createUserProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
