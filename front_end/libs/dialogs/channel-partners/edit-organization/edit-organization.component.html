<form #editOrgForm="ngForm">
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Update Organization
        </h1>
        <button
            *ngIf="closable"
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <span class="close-content"></span>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label
                class="label"
                for="name"
                translate
                >Name</label
            >
            <input
                class="form-control"
                id="name"
                name="name"
                [(ngModel)]="name"
                required
            />
        </div>
        <div class="form-group">
            <label
                class="label"
                for="orgChannelPartner"
                translate
                >Channel Partner</label
            >
            <nx-select
                [componentId]="'orgChannelPartner'"
                name="channelPartner"
                [stillLoading]="!channelPartners.length"
                [items]="channelPartners"
                [selected]="selectedPartner"
                [(ngModel)]="selectedPartner"
            ></nx-select>
        </div>
        <div class="form-group">
            <label
                class="label"
                for="orgEditState"
                translate
                >State</label
            >
            <nx-select
                [componentId]="'orgEditState'"
                name="state"
                [items]="states"
                [selected]="state"
                [(ngModel)]="state"
            ></nx-select>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="editOrgProcess"
            [buttonText]="'Update' | translate"
            [form]="editOrgForm"
        ></nx-process-button>
        <nx-cancel-button
            [process]="editOrgProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
