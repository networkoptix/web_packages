<div class="nx-modal__header">
    <span
        class="nx-modal__header-title"
        translate
        >New Folder</span
    >
    @if (closable) {
        <button
            type="button"
            class="nx-modal__header-close-btn"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        ></button>
    }
</div>
<form
    class="nx-modal__content"
    [formGroup]="formGroup"
    nxFormObserver
>
    <div class="nx-modal__body">
        <nx-form-field>
            <label
                for="add-group-folder-name"
                nx-label
                translate
                >Folder Name</label
            >
            <input
                nx-input
                id="add-group-folder-name"
                formControlName="folderName"
            />
            <nx-control-messages>
                <nx-control-message
                    key="required"
                    [text]="'Folder Name is required' | translate"
                ></nx-control-message>
            </nx-control-messages>
        </nx-form-field>
    </div>
    <div class="nx-modal__footer">
        <button
            type="button"
            class="btn btn-default"
            [disabled]="busy"
            (click)="close()"
            translate
        >
            Cancel
        </button>
        <button
            nx-async-submit-button
            [action]="createGroupAction"
            (busyChange)="busy$$.set($event)"
        >
            <span translate>Create</span>
        </button>
    </div>
</form>
