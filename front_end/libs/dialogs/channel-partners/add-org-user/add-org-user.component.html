<form
    #addUserForm="ngForm"
    name="addUserForm"
    novalidate
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Add User
        </h1>
        <button
            *ngIf="closable"
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <span class="close-content"></span>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label
                for="email"
                translate
                >Email</label
            >
            <nx-email-input
                class="fs-mask form-component"
                id="email"
                name="email"
                componentId="email"
                [(ngModel)]="email"
                [setFocus]="true"
                [form]="addUserForm"
                #userEmail="ngModel"
            >
            </nx-email-input>
        </div>
        <div class="form-group">
            <label
                for="userRole"
                translate
                >Role</label
            >
            <nx-select
                id="userRole"
                name="userRole"
                [stillLoading]="!roles.length"
                [items]="roles"
                [selected]="selectedRole"
                [(ngModel)]="selectedRole"
            ></nx-select>
        </div>
        <!-- <div class="form-group">
            <label
                for="targetGroup"
                translate
                >Groups</label
            >
            <nx-select
                id="targetGroup"
                name="targetGroup"
                [items]="groups"
                [selected]="selectedGroup"
                [(ngModel)]="selectedGroup"
                canSearch
            ></nx-select>
        </div>
        <div class="form-group">
            <label
                for="permissions"
                translate
                >Access Level</label
            >
            <nx-multi-select
                id="permissions"
                name="permissions"
                [items]="permissions"
                [ngModel]="selectedPermissions"
                (ngModelChange)="updatePermissions($event)"
            ></nx-multi-select>
        </div> -->
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="addUserProcess"
            [buttonText]="'Add' | translate"
        ></nx-process-button>
        <nx-cancel-button
            [process]="addUserProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
