<form #editPartnerUserForm="ngForm">
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Update Channel Partner User
        </h1>
        <button
            *ngIf="closable"
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <span class="close-content"></span>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label
                class="label"
                for="partnerChannelPartner"
                translate
                >Role</label
            >
            <nx-select
                [componentId]="'partnerChannelPartner'"
                name="channelPartner"
                [stillLoading]="!roles.length"
                [items]="roles"
                [selected]="role"
                [(ngModel)]="role"
            ></nx-select>
        </div>
        <div class="form-group">
            <label
                class="label"
                for="title"
                translate
                >Title</label
            >
            <input
                class="form-control"
                id="title"
                name="title"
                [(ngModel)]="title"
            />
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="editPartnerUserProcess"
            [buttonText]="'Update' | translate"
            [form]="editPartnerUserForm"
        ></nx-process-button>
        <nx-cancel-button
            [process]="editPartnerUserProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
