<div class="modal-content-wrapper">
    <div class="modal-header">
        <h1 class="modal-title">
            {{ entityName }}
        </h1>
        <button
            type="button"
            class="close"
            id="closeRegularServiceDetailsDialog"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <div class="close-content"></div>
        </button>
    </div>
    <div>
        @if (isLoading$$()) {
            <nx-pre-loader></nx-pre-loader>
        } @else {
            <nx-regular-service-dialog-table
                [records]="formattedRecords$$()"
                [totals]="totals$$()"
            ></nx-regular-service-dialog-table>
        }
    </div>
</div>
