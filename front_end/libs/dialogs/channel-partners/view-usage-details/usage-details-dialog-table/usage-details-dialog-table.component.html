<nx-table
    ngClass="usage-details-dialog-table"
    [style.height]="'calc(100% - 12px)'"
    set-sorting
    [set-row-expand]="false"
    [set-selected-item-id]="selectedRecordId"
    [data]="records()"
>
    <ng-template #header>
        @for (head of headers; track head.name) {
            <div
                [attr.id]="head.name"
                [style.justify-content]="head.align || 'flex-start'"
            >
                <span
                    class="head-title"
                    title="{{ head.value }}"
                    >{{ head.value }}</span
                >
                @if (head.tooltip) {
                    <nx-hint [tooltipText]="head.tooltip | translate"></nx-hint>
                }
            </div>
        }
    </ng-template>
    <ng-template
        #rows
        let-row
    >
        <div>
            {{ row.changed }}
        </div>
        <div class="numeric-column">
            @if (row.isChangeRecord) {
                <nx-quantity-change [number]="row.channels"></nx-quantity-change>
            } @else {
                {{ row.channels }}
            }
        </div>
        <div class="numeric-column">
            @if (row.isChangeRecord) {
                <nx-quantity-change [number]="row.monthlyRate"></nx-quantity-change>
            } @else {
                {{ row.monthlyRate }}
            }
        </div>
        <div class="numeric-column">
            @if (row.isChangeRecord) {
                <nx-quantity-change [number]="row.fractionalUsage"></nx-quantity-change>
            } @else {
                {{ row.fractionalUsage }}
            }
        </div>
    </ng-template>
</nx-table>
