<div
    class="modal-header"
    *ngIf="title"
>
    <button
        type="button"
        class="close"
        data-dismiss="modal"
        aria-label="Close"
        (click)="close()"
        *ngIf="closable"
    >
        <div class="close-content"></div>
    </button>
    <h1
        class="modal-title"
        [ngClass]="{ closable: closable }"
    >
        <span class="ellipsis">{{ title | translate }}</span>
    </h1>
</div>
<div
    class="modal-body"
    *ngIf="message"
>
    <p [innerHTML]="message | translate"></p>
</div>

<div
    class="modal-footer"
    *ngIf="hasFooter"
    [ngClass]="footerClass"
>
    <button
        type="button"
        class="btn"
        [ngClass]="buttonClass"
        *ngIf="cancellable"
        (click)="close('CANCEL')"
        translate
    >
        Close
    </button>
    <button
        type="button"
        class="btn"
        [ngClass]="buttonClass"
        *ngIf="!cancellable"
        (click)="close(true)"
    >
        <ng-container>{{ actionLabel | translate }}</ng-container>
    </button>
    <button
        type="button"
        class="btn btn-default"
        *ngIf="!cancellable && cancelLabel"
        (click)="close(cancelLabel)"
    >
        <span class="ellipsis">{{ cancelLabel | translate }}</span>
    </button>
</div>
