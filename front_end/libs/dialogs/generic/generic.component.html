<div class="modal-header">
    <button
        type="button"
        class="close"
        data-dismiss="modal"
        aria-label="Close"
        (click)="close()"
        *ngIf="closable"
    >
        <div class="close-content"></div>
    </button>
    <h1
        class="modal-title"
        [ngClass]="{ closable: !dialogRef.disableClose }"
    >
        <span class="ellipsis">{{ dialogData.title | nxTranslate }}</span>
    </h1>
</div>
<div
    class="modal-body"
    *ngIf="dialogData.message as message"
>
    <p
        *ngIf="!dialogData.safeHTML; else safe"
        [innerHTML]="message | nxTranslate"
    ></p>
    <ng-template #safe>
        <p [innerHTML]="message | nxTranslate | safe : 'html'"></p>
    </ng-template>
</div>

<div
    class="modal-footer"
    *ngIf="dialogData.footer as f"
    [ngClass]="f.footerClass"
>
    <ng-container *ngIf="f.actionable">
        <button
            type="button"
            class="btn"
            [ngClass]="f.buttonClass || 'btn-primary'"
            (click)="close(true)"
        >
            {{ f.actionLabel | nxTranslate }}
        </button>
        <button
            type="button"
            class="btn btn-default"
            *ngIf="f.cancelLabel"
            (click)="close(false)"
        >
            <span class="ellipsis">{{ f.cancelLabel | nxTranslate }}</span>
        </button>
    </ng-container>
    <button
        *ngIf="!f.actionable"
        type="button"
        class="btn"
        [ngClass]="f.buttonClass || 'btn-primary'"
        (click)="close()"
        translate
    >
        Close
    </button>
</div>
