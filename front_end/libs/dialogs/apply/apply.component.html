<div class="modal-header">
    <button
        type="button"
        class="close"
        id="closeApply"
        data-dismiss="modal"
        aria-label="Close"
        (click)="close()"
    >
        <div class="close-content"></div>
    </button>
    <h1
        class="modal-title"
        translate
    >
        Apply changes before leaving this page?
    </h1>
</div>
<div class="modal-footer">
    <nx-process-button
        [actionType]="'primary'"
        [buttonText]="'Apply' | translate"
        [clickFn]="apply"
        [process]="applyFunc"
        [id]="'applyChanges'"
    ></nx-process-button>
    <nx-cancel-button
        [process]="applyFunc"
        [discardFn]="discard"
        [showDiscard]="true"
        [id]="'discardChanges'"
    ></nx-cancel-button>
    <button
        *ngIf="!applyFunc?.processing"
        type="button"
        class="btn btn-default"
        (click)="close()"
        translate
        [id]="'cancelChanges'"
    >
        Cancel
    </button>
</div>
