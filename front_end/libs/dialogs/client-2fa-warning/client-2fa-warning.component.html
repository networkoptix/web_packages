<div class="modal-header">
    <h1
        class="modal-title"
        translate
    >
        You cannot log in to this system from %VMS_NAME% Client
    </h1>
    <button
        type="button"
        class="close"
        data-dismiss="modal"
        aria-label="Close"
        (click)="close()"
    >
        <span class="close-content"></span>
    </button>
</div>

<div class="modal-body">
    <p translate>Earlier versions of %VMS_NAME% Client do not support two-factor authentication.</p>
    <p [innerHTML]="LANG.dialogs.twoFactor.unsupportedSystem | translate"></p>
</div>
<div class="modal-footer">
    <button
        class="btn btn-primary"
        (click)="close()"
        translate
    >
        OK
    </button>
</div>
