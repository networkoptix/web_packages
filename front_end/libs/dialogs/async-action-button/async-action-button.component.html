<button
    type="submit"
    (click)="execute()"
    class="btn async-action-button"
    [class]="buttonClass()"
    [ngClass]="{
        invalid: buttonInvalid$$(),
        busy: busy$$()
    }"
    [disabled]="disabled()"
>
    <div
        [ngStyle]="{
            visibility: busy$$() ? 'hidden' : undefined
        }"
    >
        <ng-content></ng-content>
    </div>
    @if (busy$$()) {
        <div
            class="loading-dots"
            [ngClass]="{
                'loading-dots--light-default': !CONFIG.isDarkTheme && buttonColor() === 'default'
            }"
        >
            @for (_ of [].constructor(3); track $index) {
                <div
                    class="loading-dots__dot"
                    [ngClass]="'loading-dots__dot--' + $index"
                ></div>
            }
        </div>
    }
</button>
