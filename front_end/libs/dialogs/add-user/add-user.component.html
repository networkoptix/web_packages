<form
    #addUserForm="ngForm"
    name="addUserForm"
    novalidate
    [ngClass]="{ 'hide-errors': hideErrors }"
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Add User
        </h1>
        <button
            type="button"
            class="close"
            data-testid="closeAddUser"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <div class="close-content"></div>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label
                for="addUserEmail"
                translate
                >Email</label
            >
            <nx-email-input
                class="fs-mask form-component"
                id="addUserEmail"
                name="addUserEmail"
                componentId="addUserEmail"
                [(ngModel)]="user.email"
                [form]="addUserForm"
                [setFocus]="true"
                #addUserEmail="ngModel"
            >
            </nx-email-input>
            <div class="col-12 ml-n2 d-flex">
                <ng-container *ngIf="addUserEmail.errors">
                    <span
                        *ngIf="addUserEmail.errors.alreadyExists"
                        class="input-error"
                        >{{ LANG.dialogs.addUser.alreadyExists | translate: { systemName } }}</span
                    >
                    <span
                        *ngIf="addUserEmail.errors.cantEditAdmin"
                        class="input-error"
                        >{{ LANG.dialogs.addUser.cantEditAdmin }}
                    </span>
                    <ng-container *ngIf="addUserEmail.touched">
                        <span
                            *ngIf="addUserEmail.errors.required"
                            class="input-error"
                            translate
                            >Email is required</span
                        >
                        <span
                            *ngIf="addUserEmail.errors.pattern"
                            class="input-error"
                            translate
                            >Please enter a valid Email</span
                        >
                    </ng-container>
                </ng-container>
            </div>
        </div>
        <div class="form-group">
            <label
                for="permissionsSelect"
                translate
                >Access Level</label
            >
            <nx-permissions-select
                id="permissionsSelect"
                name="permissionsSelect"
                [system]="system"
                [roles]="system.userManager.accessRoles"
                [ngModel]="user.role"
                (ngModelChange)="setPermission($event)"
            >
            </nx-permissions-select>
            <span
                class="help-block"
                data-testid="addUserHelpBlock"
                [innerText]="accessDescription | translate"
            ></span>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [clickFn]="preSubmit"
            [process]="addUser"
            [form]="addUserForm"
            [buttonText]="'Add' | translate"
            data-testid="addUserBtn"
        ></nx-process-button>
        <nx-cancel-button
            [process]="addUser"
            [cancelFn]="unlock"
            [discardFn]="close"
            data-testid="cancelAddUserBtn"
        ></nx-cancel-button>
    </div>
</form>
