<form
    #addUserForm="ngForm"
    name="addUserForm"
    novalidate
    [ngClass]="{ 'hide-errors': hideErrors }"
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Add User
        </h1>
        <button
            type="button"
            class="close"
            data-testid="closeAddUser"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <div class="close-content"></div>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label
                class="label"
                for="addUserDialogEmail"
                translate
                >Email</label
            >
            <nx-email-input
                class="fs-mask form-component"
                id="addUserDialogEmail"
                name="addUserDialogEmail"
                componentId="addUserDialogEmail"
                [(ngModel)]="user.email"
                [form]="addUserForm"
                [setFocus]="true"
                #addUserDialogEmail="ngModel"
                [disabled]="busy$$()"
            >
            </nx-email-input>
            <div class="col-12 ml-n2 d-flex">
                <ng-container *ngIf="addUserDialogEmail.errors">
                    <span
                        *ngIf="addUserDialogEmail.errors.alreadyExists"
                        [@transitionEnter]
                        class="input-error"
                        >{{ LANG.dialogs.addUser.alreadyExists | translate: { systemName } }}</span
                    >
                    <span
                        *ngIf="addUserDialogEmail.errors.cantEditAdmin"
                        [@transitionEnter]
                        class="input-error"
                        >{{ LANG.dialogs.addUser.cantEditAdmin }}
                    </span>
                    <ng-container *ngIf="addUserDialogEmail.touched">
                        <span
                            *ngIf="addUserDialogEmail.errors.required"
                            [@transitionEnter]
                            class="input-error"
                            translate
                            >Email is required</span
                        >
                        <span
                            *ngIf="addUserDialogEmail.errors.pattern"
                            [@transitionEnter]
                            class="input-error"
                            translate
                            >Please enter a valid Email</span
                        >
                    </ng-container>
                </ng-container>
            </div>
        </div>
        <div class="form-group">
            <ng-container *ngIf="!useGroups; else groupsDropdown">
                <label
                    class="label"
                    for="permissionsSelect"
                    translate
                    >Access Level</label
                >
                <nx-permissions-select
                    id="permissionsSelect"
                    name="permissionsSelect"
                    [system]="system"
                    [roles]="accessRoles"
                    [ngModel]="user.role"
                    (ngModelChange)="setPermission($event)"
                >
                </nx-permissions-select>
                <span
                    *ngIf="accessDescription"
                    class="help-block"
                    data-testid="addUserHelpBlock"
                    [innerText]="accessDescription | translate"
                ></span>
            </ng-container>
            <ng-template #groupsDropdown>
                <label
                    for="addUserDialogGroupsSelect"
                    class="label"
                    translate
                    >Permission Groups</label
                >
                <nx-multi-select
                    [componentId]="'addUserDialogGroupsSelect'"
                    name="addUserDialogGroupsSelect"
                    [dataType]="DATA_TYPE.GROUPS"
                    [canSelectAll]="false"
                    [canSearch]="false"
                    description="User Groups"
                    [tooltipAlternateSecondary]="true"
                    [tooltipHorizontal]="true"
                    [items]="groups"
                    [ngModel]="user.groupIds"
                    (ngModelChange)="setGroupDescription($event)"
                    [moreLeftPadding]="true"
                    [moreBottomMargin]="true"
                >
                </nx-multi-select>
                <nx-ml-ellipsis-clamp
                    *ngIf="user.groupIds.length === 1 && accessDescription"
                    [viewLines]="5"
                >
                    <span
                        class="help-block"
                        data-testid="addUserHelpBlock"
                        [innerText]="accessDescription | translate"
                    ></span>
                </nx-ml-ellipsis-clamp>
            </ng-template>
        </div>
    </div>
    <div class="modal-footer">
        <nx-async-action-button
            [action]="addUserAction"
            [(busy)]="busy$$"
            data-testid="addUserBtn"
        >
            {{ 'Add' | translate }}
        </nx-async-action-button>
        <button
            type="button"
            class="btn btn-default"
            [disabled]="busy$$()"
            (click)="close()"
            data-testid="cancelAddUserBtn"
            translate
        >
            Cancel
        </button>
    </div>
</form>
