<form
    #disconnectAccountForm="ngForm"
    name="disconnectAccountForm"
    novalidate
    [ngClass]="{ 'hide-errors': hideErrors }"
    (submit)="hideErrors = false"
>
    <div class="modal-header">
        <h1 class="modal-title">{{ this.LANG.dialogs.removeSystem.title }}</h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <div class="close-content"></div>
        </button>
    </div>

    <div class="modal-body">
        <p>{{ this.LANG.dialogs.removeSystem.message }}</p>
        <p
            translate
            class="mb-3"
        >
            Enter password to continue.
        </p>

        <div class="form-group">
            <label
                class="label"
                for="password"
                translate
                >Password</label
            >
            <input
                class="form-control"
                [(ngModel)]="auth.password"
                #password="ngModel"
                id="password"
                autocomplete="new-password"
                name="password"
                type="password"
                required
            />
            <ng-container *ngIf="password.invalid">
                <div *ngIf="password.touched && password.dirty && !wrongPassword">
                    <div
                        class="input-error"
                        translate
                    >
                        Password is required
                    </div>
                </div>
            </ng-container>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="disconnectFromAccount"
            [form]="disconnectAccountForm"
            [actionType]="'danger'"
            buttonText="{{ 'Disconnect' | translate }}"
        ></nx-process-button>
        <nx-cancel-button
            [process]="disconnectFromAccount"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
