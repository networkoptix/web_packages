<div class="modal-header">
    <h1
        class="modal-title"
        translate
    >
        Reset Backup Settings to Defaults?
    </h1>
    <button
        type="button"
        class="close"
        data-dismiss="modal"
        aria-label="Close"
        (click)="close()"
        *ngIf="closable"
    >
        <div class="close-content"></div>
    </button>
</div>

<div
    class="modal-body"
    *ngIf="system?.serverManager.servers.length > 1"
>
    <p
        class="paragraph mb-0"
        translate
    >
        Backup settings will be reset for all servers in this system.
    </p>
</div>

<div class="modal-footer">
    <nx-process-button
        [process]="resetBackupProcess"
        [actionType]="'danger'"
        [buttonText]="'Reset' | translate"
    ></nx-process-button>
    <nx-cancel-button
        [process]="resetBackupProcess"
        [discardFn]="close"
        [cancelFn]="unlock"
    ></nx-cancel-button>
</div>
