<form
    #disconnectForm="ngForm"
    name="disconnectForm"
    novalidate
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Disconnect System from %CLOUD_NAME%
        </h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <div class="close-content"></div>
        </button>
    </div>
    <div class="modal-body">
        <p
            *ngIf="system.userManager.currentUser.isCloud && environment.isLocal"
            translate
        >
            You will be logged out
        </p>
        <p translate>System will be accessible only via local network.</p>
        <p
            class="warning-label"
            translate
        >
            All cloud users will be deleted.
        </p>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="disconnect"
            [form]="disconnectForm"
            [actionType]="'danger'"
            data-testid="disconnectSystemBtn"
            buttonText="{{ 'Disconnect' | translate }}"
        ></nx-process-button>
        <nx-cancel-button
            [process]="disconnect"
            [cancelFn]="unlock"
            [discardFn]="close"
            data-testid="cancelDisconnectSystemBtn"
        ></nx-cancel-button>
    </div>
</form>
