<form #moveOrgItemForm="ngForm">
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Move to
        </h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <span class="close-content"></span>
        </button>
    </div>
    <div class="modal-body">
        <nx-org-tree-selector
            [organization]="organization"
            [groups]="groups"
            [selected]="selectedFolder$$()"
            (selectedChange)="selectedFolder$$.set($event)"
        ></nx-org-tree-selector>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="moveOrgItemProcess"
            [buttonText]="'Confirm' | translate"
            [form]="moveOrgItemForm"
        ></nx-process-button>
        <nx-cancel-button
            [process]="moveOrgItemProcess"
            [cancelFn]="unlock"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
