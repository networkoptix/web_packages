<div class="modal-header">
    <h1
        class="modal-title"
        translate
    >
        Delete existing VMS archives
    </h1>
    <button
        type="button"
        class="close"
        data-dismiss="modal"
        aria-label="Close"
        (click)="close()"
    >
        <span class="close-content"></span>
    </button>
</div>

<div class="modal-body">
    <nx-alert-block
        type="error"
        [iconSrc]="icons.dirNonStandard + 'error.svg'"
        [line1]="
            'You are attempting to reserve more space than there is free space available. This will delete existing VMS archives!'
                | translate
        "
        [line2]="'Are you sure you want to continue?' | translate"
    ></nx-alert-block>
    <label>
        <nx-checkbox
            [required]="true"
            [(ngModel)]="accepted"
        ></nx-checkbox>
        <span translate>Yes, delete existing VMS archives</span>
    </label>
</div>
<div class="modal-footer">
    <nx-process-button
        [process]="acceptOverwrite"
        actionType="danger"
        [buttonText]="'Confirm' | translate"
        [buttonDisabled]="!accepted"
    ></nx-process-button>
    <nx-cancel-button [discardFn]="close"></nx-cancel-button>
</div>
