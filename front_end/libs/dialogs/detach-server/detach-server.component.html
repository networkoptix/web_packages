<form
    #detachServerForm="ngForm"
    name="detachServerForm"
    novalidate
>
    <div class="modal-header">
        <h1
            class="modal-title"
            [innerHTML]="
                LANG.dialogs.titles.serversDetach
                    | translate: { title: serverName | escapeHTML }
                    | safe: 'html'
            "
        ></h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
            *ngIf="closable"
        >
            <div class="close-content"></div>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <div [ngClass]="{ 'mb-3': system.mediaserver.requiresPassword }">
                <p
                    class="mb-0"
                    translate
                >
                    The server will be detached from this system and added to a new one. Database,
                    local users, configuration, and video archive will remain intact.
                </p>

                <p
                    [ngClass]="{ 'mb-3': system.mediaserver.requiresPassword }"
                    translate
                >
                    Cloud users will not be transferred to the new system.
                </p>
                <span
                    *ngIf="system.mediaserver.requiresPassword"
                    translate
                    >Enter password for your account to continue.</span
                >
            </div>
            <ng-container *ngIf="system.mediaserver.requiresPassword">
                <input
                    class="fs-exclude form-control"
                    [(ngModel)]="password"
                    id="password"
                    name="password"
                    type="password"
                    required
                    nxFocusMe
                />
                <p
                    class="help-block"
                    *ngIf="
                        !detachServerForm.controls['password']?.valid &&
                        detachServerForm.controls['password']?.touched
                    "
                >
                    <span
                        class="input-error"
                        translate
                        >Password is required</span
                    >
                </p>
            </ng-container>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="detachServer"
            [form]="detachServerForm"
            [actionType]="'danger'"
            buttonText="{{ 'Detach' | translate }}"
        ></nx-process-button>
        <nx-cancel-button
            [process]="detachServer"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
