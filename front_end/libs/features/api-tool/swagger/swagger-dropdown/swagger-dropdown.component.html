<div [class.is-disabled]="isDisabled">
    <nx-select
        [componentId]="'swaggerSingleSelect'"
        *ngIf="!isMultiSelect"
        [items]="singleDropdownOptions"
        (onSelected)="onSelect($event)"
        [selected]="singleDropdownOptions[0]"
    ></nx-select>

    <nx-multi-select
        [componentId]="'swaggerMultiSelect'"
        *ngIf="isMultiSelect"
        [items]="multiDropdownOptions"
        [ngModel]="selectedOptions"
        (ngModelChange)="onMultiSelect($event)"
        canSelectAll
    >
    </nx-multi-select>
</div>
