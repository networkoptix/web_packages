<ng-container *ngIf="!(APIToolSystemService.outDatedSystem$ | async)">
    <ng-container
        #swagger
        *ngIf="openAPIJSONService.menuNodes; else preloader"
    >
        <div
            *ngIf="openAPIJSONService.activeNode"
            [class.single-api-route-showing]="singleAPIRouteShowing"
            [ngClass]="{ 'api-info': openAPIJSONService.isInfoNode }"
        >
            <div
                style="padding: 0 1rem 1rem"
                class="swagger-description"
                *ngIf="!openAPIJSONService.isMarkdownNode"
            >
                <h2 [innerHTML]="this.swaggerMenuDescription.title | safe: 'html'"></h2>
                <ng-container *ngIf="this.singleAPIRouteShowing">
                    <p
                        class="description-path"
                        [innerHTML]="this.singleRoutePath | safe: 'html'"
                    ></p>
                    <div
                        class="opblock-method"
                        [ngClass]="this.singleRouteMethod"
                    >
                        {{ this.singleRouteMethod }}
                    </div>
                </ng-container>
                <p
                    class="mt-3"
                    *ngIf="this.swaggerMenuDescription.description"
                >
                    <markdown [data]="this.swaggerMenuDescription.description"></markdown>
                </p>
            </div>
            <nx-swagger-markdown
                *ngIf="openAPIJSONService.isMarkdownNode"
                [data]="openAPIJSONService?.currentMarkdown[openAPIJSONService.activeNode.name]"
            ></nx-swagger-markdown>
            <div
                id="swagger-ui"
                #viewContainerRef
                [class.RTSP-request]="RTSPRequestShowing"
                [class.single-api-route-showing]="singleAPIRouteShowing"
            ></div>
        </div>
    </ng-container>
</ng-container>

<ng-template #preloader>
    <nx-pre-loader></nx-pre-loader>
</ng-template>
