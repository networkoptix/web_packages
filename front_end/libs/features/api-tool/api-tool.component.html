<ng-container *ngIf="APIToolService.loadingFailure$ | async; then loadingError"></ng-container>

<ng-container *ngIf="!(APIToolService.loadingFailure$ | async)">
    <ng-container
        *ngTemplateOutlet="mainPage; context: { menuNodes: APIJSONService.menuNodes }"
    ></ng-container>
</ng-container>

<ng-template
    #mainPage
    let-menuNodes="menuNodes"
>
    <div
        class="page-wrapper"
        [ngClass]="{ 'new-cloud': useNewCloud }"
    >
        <div class="block-container">
            <div class="row">
                <div
                    *nxMenuProjection="useNewCloud"
                    class="fixed-sidebar col-12 d-flex flex-column fill-screen-height"
                    [ngClass]="{ newCloud: useNewCloud }"
                    [ngStyle]="{ height: 'calc(100% - (' + headerHeight + 'px + 16px))' }"
                >
                    <nx-api-tool-dropdowns></nx-api-tool-dropdowns>
                    <span #developersMenu></span>
                    <nx-developers-menu
                        *ngIf="!(APIToolService.outDatedSystem$ | async)"
                        [service]="APIJSONService"
                        [offsetHeight]="menuOffset"
                        [additionalSearchNodes]="APIJSONService.searchMoreNodes$ | async"
                        (searchQueryEmitter)="APIJSONService.searchQuery = $event"
                        [queryParamsOnInternalRoute]="'merge'"
                        (onClick)="clickNode($event.node)"
                        #developersMenu
                    >
                    </nx-developers-menu>
                    <div
                        *ngIf="
                            APIJSONService.searchQuery &&
                            (APIJSONService.searchMoreShowing$ | async)
                        "
                        class="more-results"
                    >
                        <span (click)="APIJSONService.clickSearchMore()">
                            <svg-icon
                                nx-add-svg-src
                                [src]="icons.dirTextButtons + 'more_results.svg'"
                                [svgStyle]="{ 'width.px': '24', 'height.px': '24' }"
                            ></svg-icon>
                            <span
                                class="more-results-text"
                                translate
                                >More Results</span
                            >
                        </span>
                    </div>
                </div>
                <div
                    class="swagger-container pt-3 pt-md-0 px-3"
                    [ngClass]="
                        useNewCloud ? '' : 'col-12 col-md-8 col-xl-7 offset-md-4 offset-xl-3'
                    "
                >
                    <nx-swagger [activeNode]="APIJSONService.activeNode"></nx-swagger>
                </div>
            </div>
        </div>
    </div>
</ng-template>

<ng-template #loadingError>
    <nx-page-generic-placeholder-v2 class="api-placeholder">
        <svg-icon
            [src]="icons.dirPagePlaceholder + '404.svg'"
            [svgStyle]="{ 'height.px': 200 }"
        />
        @if (APIToolService.loadingErrorType === 'NO_SYSTEM_FOUND_API_TOOL') {
            <h2
                class="title"
                translate
            >
                No Valid System Found
            </h2>
        } @else {
            <h2
                class="title"
                translate
            >
                System failed to load
            </h2>
        }
        <button class="btn btn-primary main-button mx-auto">
            <a
                class="anchor"
                routerLink="/"
                translate
                >Go to Main Page</a
            >
        </button>
    </nx-page-generic-placeholder-v2>
</ng-template>
