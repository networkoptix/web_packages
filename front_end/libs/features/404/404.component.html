<ng-template #preloader>
    <nx-pre-loader type="page"></nx-pre-loader>
</ng-template>

<nx-page-placeholder
    *ngIf="!redirecting; else preloader"
    type="404"
    withFooter
    [placeholderTitle]="message"
>
    <button
        data-escape-global-style
        class="nx-button--primary main-button mx-auto"
    >
        <a
            routerLink="/"
            translate
            >Go to Main Page</a
        >
    </button>
</nx-page-placeholder>
