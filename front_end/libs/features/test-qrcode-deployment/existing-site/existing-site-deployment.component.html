<!-- eslint-disable nx/template/no-untranslated -->
@if (loading()) {
    <nx-pre-loader></nx-pre-loader>
} @else {
    <div class="servers">
        @for (site of sites(); track site.id) {
            <a
                [routerLink]="['../add-servers']"
                [queryParams]="{ siteId: site.id }"
                class="server"
            >
                <nx-card>
                    {{ site.name }}
                </nx-card>
            </a>
        }
    </div>
}
