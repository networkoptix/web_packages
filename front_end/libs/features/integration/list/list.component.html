<ng-template
    #compactTags
    let-tag="tag"
>
    <!-- If this behavior is needed for other components in the future it's probably best to create a better abstraction, maybe make this a directive -->
    <nx-tag
        *ngIf="!tag.hidden && tag.id !== 'mine' && tag.label"
        (resize)="updateTagSize(tag.label, $event)"
        [style.grid-column]="gridColumnLookup[tag.label]"
        [ngClass]="{ ready: gridColumnLookup[tag.label] }"
        [type]="tag.type + ' badge-integration' + (gridColumnLookup[tag.label] ? ' ready' : '')"
        >{{ tag.label | translate }}</nx-tag
    >
</ng-template>

<nx-pre-loader *ngIf="!list"></nx-pre-loader>

<div
    class="col text-placeholder d-flex align-items-center"
    *ngIf="list && !list.length"
    translate
>
    Nothing Found
</div>

<div
    class="row p-0 m-0"
    *ngIf="list && list.length"
>
    <div
        *ngFor="let plugin of list"
        name="plugin"
        class="list col-12 col-md-6 col-lg-4 col-xxl-3 p-2"
    >
        <a
            class="anchor plugin m-0"
            [routerLink]="plugin.link"
            [queryParams]="plugin.queryParams"
        >
            <nx-block
                fixed-height
                hoverable
                header-style="extended"
            >
                <header>
                    <div
                        class="card--header-logo"
                        [style.backgroundImage]="'url(' + plugin.information.logo + ')'"
                    ></div>
                </header>

                <nx-section>
                    <div class="card--body-name">
                        <h3
                            class="h3"
                            [innerText]="plugin.information.name"
                        ></h3>
                    </div>
                    <div class="card--body-descr">{{ plugin.information.shortDescription }}</div>
                </nx-section>

                <footer
                    class="tags-compact"
                    [ngStyle]="{ opacity: (ready | async) ? 1 : 0 }"
                >
                    <ng-container
                        *ngFor="
                            let type of [
                                {
                                    label: 'In Review' | translate,
                                    type: 'danger',
                                    hidden: !plugin.pending
                                },
                                {
                                    label: 'Draft' | translate,
                                    type: 'danger',
                                    hidden: !plugin.draft
                                },
                                { label: 'Mine' | translate, type: 'brand', hidden: !plugin.mine }
                            ].concat(plugin.information.type)
                        "
                    >
                        <ng-container
                            *ngTemplateOutlet="compactTags; context: { tag: type }"
                        ></ng-container>
                    </ng-container>
                </footer>
            </nx-block>
        </a>
    </div>
</div>

<div class="row px-4">
    <nx-footer></nx-footer>
</div>
