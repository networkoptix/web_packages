<nx-block
    first-element
    *ngIf="plugin?.information || plugin?.overview"
    name="howItWorks"
>
    <header translate>How it works</header>
    <ng-container *ngIf="plugin.overview">
        <nx-section *ngIf="plugin.overview.overviewVideo">
            <nx-external-video [src]="plugin.overview.overviewVideo"></nx-external-video>
        </nx-section>

        <nx-section *ngIf="plugin.overview.description">
            <div [innerHtml]="plugin.overview.description"></div>
        </nx-section>

        <nx-section *ngIf="plugin.overview.screenshots?.length">
            <nx-carousel
                type="Overview"
                [screenshots]="plugin.overview.screenshots"
            ></nx-carousel>
        </nx-section>
    </ng-container>
</nx-block>

<nx-block
    *ngIf="plugin?.versionDetails && plugin?.versionDetails.whatsNew"
    name="whatsNew"
    class="d-block mt-3"
>
    <header translate>What's New?</header>
    <nx-section>
        <div [innerHtml]="plugin.versionDetails.whatsNew | safe : 'html'"></div>
    </nx-section>
</nx-block>
