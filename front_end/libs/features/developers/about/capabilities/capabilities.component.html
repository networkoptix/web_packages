<ng-template #showError>
    <nx-error-state [errors]="errorManager.errors"></nx-error-state>
</ng-template>

<ng-template
    #capabilityBlock
    let-capability="capability"
>
    <div
        class="card capability-card"
        [routerLink]="capability.url"
    >
        <header
            class="card-header"
            [ngStyle]="{
                backgroundColor: capability.icon.split(' ')[2] || '#35464f',
                backgroundImage:
                    'linear-gradient(to right, ' +
                    (capability.icon.split(' ')[3] || '#35464f') +
                    ' 25%, rgba(53, 70, 79, 0)), url(' +
                    icons.backgrounds +
                    capability.icon.split(' ')[1]
            }"
        >
            <svg-icon
                nx-add-svg-src
                [src]="images.dirDevelopers + capability.icon.split(' ')[0]"
            ></svg-icon>
            <div class="intro-line">{{ capability.subtitle }}</div>
            <h3>{{ capability.title }}</h3>
        </header>
        <div
            class="capability-detail"
            [innerHTML]="capability.asset.shortDescription | safe: 'html'"
        ></div>
    </div>
</ng-template>

<section
    *ngIf="capabilitiesNode.nodes && !errorManager.hasErrors; else showError"
    class="capabilities"
>
    <h2
        class="heading-link"
        *ngIf="capabilitiesNode.url; else noLinkHeader"
        [routerLink]="capabilitiesNode.url"
    >
        {{ capabilitiesNode.title }}
    </h2>
    <ng-template #noLinkHeader>
        <h2 class="heading-non-link">{{ capabilitiesNode.title }}</h2>
    </ng-template>
    <div
        class="detail-blocks"
        nxMatchHeight
        [classToMatch]="'card-header'"
    >
        <ng-container *ngFor="let capability of capabilitiesNode.nodes">
            <ng-container
                *ngTemplateOutlet="capabilityBlock; context: { capability: capability }"
            ></ng-container>
        </ng-container>
    </div>
</section>
