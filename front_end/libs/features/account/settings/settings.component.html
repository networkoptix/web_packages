<ng-container *ngIf="account?.id || account?.email; else preloader">
    <div class="col-12 p-0">
        <nx-block>
            <header>
                <h4 translate>Account Information</h4>
            </header>

            <nx-section>
                <form
                    #accountForm="ngForm"
                    name="accountForm"
                    class="form"
                    novalidate
                    [ngClass]="{ 'hide-errors': hideErrors }"
                >
                    <div class="inputs d-block d-md-table w-100 mw-100">
                        <div class="form-group d-block d-md-table-row mb-2">
                            <div
                                class="label d-block d-md-table-cell text-nowrap text-right pr-md-2 pb-2 pb-md-0"
                            >
                                <label
                                    for="firstName"
                                    class="control-label m-0 pb-md-2"
                                    translate
                                    >First Name</label
                                >
                            </div>
                            <div class="d-block d-md-table-cell">
                                <div class="row pb-md-2">
                                    <div class="col-12 col-md-7 pb-2 pb-md-0">
                                        <input
                                            type="text"
                                            class="fs-mask form-control"
                                            [(ngModel)]="account.first_name"
                                            name="firstName"
                                            id="firstName"
                                            #firstName="ngModel"
                                            pattern="\S+.*"
                                            maxlength="255"
                                            required
                                            nxFocusMe
                                        />
                                    </div>
                                    <div
                                        class="col-12 col-md-5 d-block d-md-flex ml-md-n2 align-items-center"
                                    >
                                        <span
                                            class="input-error"
                                            *ngIf="firstName.invalid && firstName.touched"
                                            translate
                                            >First name is required</span
                                        >
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group d-block d-md-table-row mb-0">
                            <div
                                class="label d-block d-md-table-cell text-nowrap text-right pr-md-2 pb-2 pb-md-0"
                            >
                                <label
                                    for="firstName"
                                    class="control-label m-0 pb-md-2"
                                    translate
                                    >Last Name</label
                                >
                            </div>
                            <div class="d-block d-md-table-cell">
                                <div class="row pb-md-2">
                                    <div class="col-12 col-md-7 pb-2 pb-md-0">
                                        <input
                                            type="text"
                                            class="fs-mask form-control"
                                            [(ngModel)]="account.last_name"
                                            name="lastName"
                                            id="lastName"
                                            #lastName="ngModel"
                                            pattern="\S+.*"
                                            maxlength="255"
                                            required
                                        />
                                    </div>
                                    <div
                                        class="col-12 col-md-5 d-block d-md-flex ml-md-n2 align-items-center"
                                    >
                                        <span
                                            class="input-error"
                                            *ngIf="lastName.invalid && lastName.touched"
                                            translate
                                            >Last name is required</span
                                        >
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </nx-section>
            <nx-section>
                <div class="float-right">
                    <div
                        class="d-inline-block"
                        [nxTooltip]="
                            isSystemOwner || account.account2faEnabled
                                ? LANG.dialogs.tooltips.deleteAccount()
                                : ''
                        "
                    >
                        <button
                            class="btn btn-default has-icon"
                            id="accountSettingsDeleteButton"
                            [disabled]="isSystemOwner || account.account2faEnabled"
                            (click)="deleteUser()"
                        >
                            <svg-icon
                                nx-add-svg-src
                                [src]="icons.dir + 'delete.svg'"
                                [svgStyle]="{ 'width.px': '24', 'height.px': '24' }"
                            ></svg-icon>
                            <ng-container>{{ LANG.dialogs.buttons.deleteAccount() }}</ng-container>
                        </button>
                    </div>
                </div>
            </nx-section>
        </nx-block>
    </div>

    <div
        class="col-12 mt-3 p-0"
        *ngIf="CONFIG.featureFlags.themesEnabled"
    >
        <nx-theme-switcher-component [account]="account"></nx-theme-switcher-component>
    </div>

    <div class="col-12 mt-3 p-0">
        <nx-block>
            <header>
                <h4 translate>Language</h4>
            </header>

            <nx-section>
                <form
                    #langForm="ngForm"
                    name="langForm"
                    class="form"
                    novalidate
                    [ngClass]="{ 'hide-errors': hideErrors }"
                >
                    <nx-language-select
                        name="langSelect"
                        [(ngModel)]="langCode"
                        (langChange)="changeLanguage($event)"
                    ></nx-language-select>
                </form>
            </nx-section>
        </nx-block>
    </div>
</ng-container>

<ng-template #preloader><nx-pre-loader></nx-pre-loader></ng-template>

<ng-container #pageApply></ng-container>
