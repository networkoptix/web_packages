<div class="mt-3 adjusted-height">
    @if (!systemOnline()) {
        <nx-page-placeholder
            class="placeholder-section page-placeholder"
            type="NO_SETTINGS"
        />
    } @else {
        <div class="row">
            <div class="col-12 col-md-4 col-xl-3">
                @if (!servers()) {
                    <nx-pre-loader />
                } @else {
                    <nx-select-v2 [(ngModel)]="serverId">
                        @for (server of servers()!; track server.id) {
                            <nx-select-item
                                [selected]="serverId() === server.id"
                                [value]="server.id"
                            >
                                @if (server.status === 'Online') {
                                    {{ server.name }}
                                } @else {
                                    <span>{{
                                        LANG.healthMonitor.serverName
                                            | translate: { name: server.name }
                                    }}</span>
                                }
                            </nx-select-item>
                        }
                    </nx-select-v2>
                    <nx-menu [content]="content()" />
                }
            </div>

            <div class="col-12 col-md-8 col-xl-9 pt-3 pt-md-0">
                @if (selectedServer()?.status !== 'Online') {
                    <nx-alert-block
                        type="error"
                        id="server-offline"
                        [iconSrc]="icons.dirNonStandard + 'error.svg'"
                        [line1]="'Server offline' | translate"
                    />
                }
                <router-outlet />
            </div>
        </div>
    }
</div>
