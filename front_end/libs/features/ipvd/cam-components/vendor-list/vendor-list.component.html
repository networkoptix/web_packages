<nx-pre-loader
    *ngIf="!vendors"
    type="page"
></nx-pre-loader>

<nx-block
    *ngIf="vendors"
    id="vendors-block"
>
    <header>
        <h4 class="h4">{{ allVendors.length }} <span translate>manufacturers</span></h4>
    </header>

    <nx-section>
        <div
            class="mb-2"
            *ngIf="vendors.length !== allVendors.length"
        >
            {{ LANG.ipvd.topXByVolume | translate: topXByVolume }}
        </div>
        <div
            class="float-left mr-1 mb-1"
            *ngFor="let vendor of vendors; trackBy: trackItem"
        >
            <nx-tag
                element="btn"
                size="large"
                locked
                [routerLink]="'./'"
                [queryParams]="{ vendors: vendor.name }"
                queryParamsHandling="merge"
            >
                {{ vendor.name }} <span *ngIf="debug">({{ vendor.count }})</span>
            </nx-tag>
        </div>

        <div class="manufacture-info">
            <button
                class="btn btn-default"
                #buttonElement
                (click)="toggleVendorsShown(buttonElement)"
                translate
            >
                Show All
            </button>
        </div>
    </nx-section>
</nx-block>

<nx-block
    *ngIf="numCameras"
    id="cameras-block"
>
    <header>
        <h4 class="h4">{{ numCameras }} <span translate>devices</span></h4>
    </header>

    <nx-section>
        <div
            class="float-left mr-1 mb-1"
            *ngFor="let filter of tagFilters"
        >
            <!-- Tag is being used as a button here, no internal tag state -->
            <nx-tag
                element="btn"
                size="large"
                (click)="setFilter(filter)"
                [value]="null"
            >
                <ng-container>{{ filter.label | translate }}</ng-container>
            </nx-tag>
        </div>
    </nx-section>
</nx-block>
