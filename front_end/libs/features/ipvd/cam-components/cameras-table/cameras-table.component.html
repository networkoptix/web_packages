<div class="nx-new-table-container">
    <div class="csv">
        <nx-csv-button
            [data]="csvCameraData"
            filename="camera_list_{{ csvFilename | date: 'yyyy-MM-dd' }}"
            [options]="csvOptions"
        ></nx-csv-button>
    </div>
    <!-- set height until we find better place for CSV button -->
    <nx-table
        [style.height]="'calc(100% - 20px)'"
        class="cameras"
        set-pagination
        set-sorting
        set-rows-auto
        [set-additional-classes]="tableClasses"
        [set-sorting-default]="{ name: 'vendor', type: 'string' }"
        [set-arrange]="headerFlow"
        [data]="showRecords"
        (onRowClick)="onRowAction($event)"
    >
        <ng-template #header>
            <div
                class="position-relative"
                *ngFor="let head of showHeaders"
                #sortItem
                [attr.id]="head.name"
                [attr.data-sort]="head.sort"
                [style.justify-content]="head.align || 'flex-start'"
            >
                <span
                    class="head-title ellipsis caption"
                    title="{{ head.value }}"
                    >{{ head.value }}</span
                >
            </div>
        </ng-template>
        <ng-template
            #rows
            let-row
        >
            <div
                *ngFor="let prop of row | keyvalue; trackBy: trackItem"
                class="div-container-wrapper"
                data-id="{{ prop.key + '-' + row.model }}"
                style="grid-area: {{
                    prop.key === 'isAptzSupported'
                        ? 'isPtzSupported'
                        : prop.key === 'isTwAudioSupported'
                        ? 'isAudioSupported'
                        : prop.key
                }}"
            >
                <div *ngIf="!isBoolIcon(prop.value); else icon">
                    {{ prop.value }}
                </div>
                <ng-template #icon>
                    <!-- center to label minus sort icon -->
                    <div
                        [style.width]="'calc(100% - 24px)'"
                        [style.justify-content]="isBoolIcon(prop.value) ? 'center' : 'flex-start'"
                    >
                        <nx-bool-icon
                            [param]="prop.key"
                            [value]="prop.value"
                        ></nx-bool-icon>
                    </div>
                </ng-template>
            </div>
        </ng-template>
    </nx-table>
</div>
