<div>
    <span>Primary/Brand button</span>
    <nx-button
        [type]="ButtonType.brand"
        [disabled]="false"
        (click)="onClick()"
    >
        <span [innerText]="'Primary' | translate"></span>
    </nx-button>
</div>
<div class="mt-3">
    <span>Secondary button</span>
    <nx-button
        [type]="ButtonType.secondary"
        [disabled]="false"
        (click)="onClick()"
    >
        <span [innerText]="'Secondary' | translate"></span>
    </nx-button>
</div>
<div class="mt-3">
    <span>Primary/Brand button disabled</span>
    <nx-button
        [type]="ButtonType.brand"
        text="Primary"
        [disabled]="true"
        (click)="onClick()"
    >
        <span [innerText]="'Primary' | translate"></span>
    </nx-button>
</div>
<div class="mt-3">
    <span>Secondary button disabled</span>
    <nx-button
        [type]="ButtonType.secondary"
        [disabled]="true"
        (click)="onClick()"
    >
        <span [innerText]="'Secondary' | translate"></span>
    </nx-button>
</div>
<div class="mt-3">
    <span>Async action button (success)</span>
    <nx-async-action-button [action]="successAction">Success</nx-async-action-button>
</div>
<div class="mt-3">
    <span>Async action button (error)</span>
    <nx-async-action-button [action]="errorAction">Error</nx-async-action-button>
</div>
<div class="mt-3">
    <span>Action button (timeline)</span>
    <nx-button
        [type]="ButtonType.action"
        (click)="onClick()"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirActions + 'selection.svg'"
            [svgStyle]="{
                'width.px': '20',
                'height.px': '20'
            }"
            [applyClass]="true"
        ></svg-icon>
    </nx-button>
</div>
