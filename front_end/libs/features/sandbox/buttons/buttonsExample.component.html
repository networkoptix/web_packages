<div>
    <span>Primary/Brand button</span>
    <nx-button
        [type]="ButtonType.brand"
        text="Primary"
        [disabled]="false"
        (click)="onClick()"
    />
</div>
<div>
    <span>Secondary button</span>
    <nx-button
        [type]="ButtonType.secondary"
        text="Secondary"
        [disabled]="false"
        (click)="onClick()"
    />
</div>
<div>
    <span>Primary/Brand button disabled</span>
    <nx-button
        [type]="ButtonType.brand"
        text="Primary"
        [disabled]="true"
        (click)="onClick()"
    />
</div>
<div>
    <span>Secondary button disabled</span>
    <nx-button
        [type]="ButtonType.secondary"
        text="Secondary"
        [disabled]="true"
        (click)="onClick()"
    />
</div>
<div class="mt-3">
    <span>Async action button (success)</span>
    <nx-async-action-button [action]="successAction">Success</nx-async-action-button>
</div>
<div class="mt-3">
    <span>Async action button (error)</span>
    <nx-async-action-button [action]="errorAction">Error</nx-async-action-button>
</div>
