<div>
    <span>Primary/Brand button</span>
    <nx-button
        [type]="ButtonType.brand"
        text="Primary"
        [disabled]="false"
        (click)="onClick()"
    />
</div>
<div class="mt-3">
    <span>Secondary button</span>
    <nx-button
        [type]="ButtonType.secondary"
        text="Secondary"
        [disabled]="false"
        (click)="onClick()"
    />
</div>
<div class="mt-3">
    <span>Primary/Brand button disabled</span>
    <nx-button
        [type]="ButtonType.brand"
        text="Primary"
        [disabled]="true"
        (click)="onClick()"
    />
</div>
<div class="mt-3">
    <span>Secondary button disabled</span>
    <nx-button
        [type]="ButtonType.secondary"
        text="Secondary"
        [disabled]="true"
        (click)="onClick()"
    />
</div>
<div class="mt-3">
    <span>Action button (timeline)</span>
    <nx-button
        [type]="ButtonType.action"
        [btnIconSrc]="icons.dirActions + 'selection.svg'"
        (click)="onClick()"
    />
</div>
