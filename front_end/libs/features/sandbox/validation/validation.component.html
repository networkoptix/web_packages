<div
    class="p-3"
    style="border: 1px solid lightgray"
>
    <div class="row col-12">
        <form
            name="resetPassword"
            #resetPassword="ngForm"
            class="form-horizontal w-100"
            novalidate
        >
            <div class="form-group row">
                <label
                    for="email"
                    class="col-sm-4 control-label"
                    >Email</label
                >
                <nx-email-input
                    class="form-component col-sm-4"
                    name="email"
                    componentId="email"
                    [(ngModel)]="data.email"
                    [form]="resetPassword"
                    #email="ngModel"
                >
                </nx-email-input>

                <div class="col-sm-4">
                    <ng-container *ngIf="email.touched && email.errors">
                        <span
                            class="help-block input-error"
                            *ngIf="email.errors.required"
                            >Email is required</span
                        >
                        <span
                            class="help-block input-error"
                            *ngIf="email.errors.pattern"
                            >Please enter a valid Email</span
                        >
                    </ng-container>
                </div>
            </div>
            <div class="form-group row">
                <div class="offset-sm-4 col-sm-8">
                    <nx-process-button
                        [process]="restore"
                        [form]="resetPassword"
                        buttonText="Reset"
                    >
                    </nx-process-button>
                </div>
            </div>
        </form>
    </div>

    <hr />

    <div class="row col-12">
        <form
            class="form-horizontal w-100"
            name="restorePassword"
            #restorePassword="ngForm"
            novalidate
        >
            <div class="form-group row">
                <label
                    for="newPassword"
                    class="col-sm-4 control-label"
                    >New Password</label
                >
                <nx-password-input
                    class="form-component col-sm-4"
                    name="newPassword"
                    componentId="newPassword"
                    [(ngModel)]="data.newPassword"
                    [form]="restorePassword"
                    [component]="newPassword"
                    #newPassword="ngModel"
                >
                </nx-password-input>

                <div class="col-md-4">
                    <nx-password-input-validation
                        [forElement]="newPassword"
                        [value]="data.newPassword"
                    >
                    </nx-password-input-validation>
                </div>
            </div>

            <div class="form-group row">
                <div class="offset-sm-4 col-sm-8">
                    <nx-process-button
                        [process]="change"
                        [form]="restorePassword"
                        buttonText="Save"
                    >
                    </nx-process-button>
                </div>
            </div>
        </form>
    </div>
</div>

<h3 [ngStyle]="{ paddingBottom: '1rem' }">NxFormField</h3>
<div class="ff-container">
    <form [formGroup]="emailFormGroup">
        <nx-form-field [errorMatcher]="emailErrorMatcher">
            <label
                nx-label
                for="test-email"
                >Email</label
            >
            <input
                type="email"
                id="test-email"
                nx-input
                formControlName="email"
            />
            <nx-control-messages pattern="email">
                <nx-control-message
                    key="letterA"
                    text="The letter A is not allowed"
                ></nx-control-message>
            </nx-control-messages>
        </nx-form-field>
        <div class="footer">
            <nx-async-action-button [action]="doNothingAction">Submit</nx-async-action-button>
        </div>
    </form>
    <form [formGroup]="quoteFormGroup">
        <nx-form-field>
            <label
                nx-label
                for="test-select"
                >Source</label
            >
            <nx-select-v2
                formControlName="quote"
                placeholder="Select"
            >
                <nx-select-item
                    [value]="undefined"
                    [selected]="false"
                    >Unselect</nx-select-item
                >
                @for (quote of quotes; track quote.source) {
                    <nx-select-item
                        [value]="quote.source"
                        [selected]="quoteControl.value === quote.source"
                        >{{ quote.source }}</nx-select-item
                    >
                }
            </nx-select-v2>
            <nx-control-messages
                [spacingLines]="3"
                [state]="quoteControl.value ?? null"
            >
                @for (quote of quotes; track quote.source) {
                    <nx-control-message
                        [key]="quote.source"
                        [text]="quote.text"
                        type="info"
                    ></nx-control-message>
                }
            </nx-control-messages>
        </nx-form-field>
        <div class="footer">
            <nx-async-action-button [action]="doNothingAction">Submit</nx-async-action-button>
        </div>
    </form>
</div>
