<div
    class="mb-3 row m-0 p-3"
    style="border: 1px solid lightgray"
>
    <div class="col-12 col-lg-4">
        <form
            class="form"
            role="form"
            id="form1"
            name="form1"
            #form1="ngForm"
            novalidate
        >
            <h2 translate>Form 1</h2>
            <div class="form-group">
                <input
                    class="form-control"
                    type="text"
                    name="form1_Field1"
                    [(ngModel)]="account.form1Field1Input"
                />
            </div>
            <div class="form-group">
                <input
                    class="form-control"
                    type="text"
                    name="form1_Field2"
                    [(ngModel)]="account.form1Field2Input"
                />
            </div>
            <div class="form-group">
                <div class="col-6 p-0 pb-3">
                    <nx-multi-select
                        name="ddMultiSelect"
                        [items]="items"
                        [ngModel]="itemsSelected"
                        (ngModelChange)="ddModelChanged($event)"
                        canSelectAll
                    >
                    </nx-multi-select>
                </div>
                <div class="col-6 p-0 pb-3">
                    <nx-select
                        name="ddSSingle"
                        [items]="itemsDDSingle"
                        [ngModel]="selectedDDItem"
                        (ngModelChange)="ddSingleModelChanged($event)"
                        [selected]="selectedDDItem ? selectedDDItem : null"
                    >
                    </nx-select>
                </div>
                <div class="col-6 p-0 pb-3">
                    <nx-language-select
                        name="langSelect"
                        [ngModel]="langCode"
                        (ngModelChange)="changeLanguage($event)"
                    ></nx-language-select>
                </div>
            </div>
        </form>
    </div>

    <div class="col-12 col-lg-4">
        <form
            class="form"
            role="form"
            id="form2"
            name="form2"
            #form2="ngForm"
            novalidate
        >
            <h2 translate>Form 2</h2>
            <div class="form-group">
                <input
                    class="form-control"
                    type="text"
                    name="form2_Field1"
                    [(ngModel)]="form2Field1Input"
                />
            </div>

            <br />

            <div class="row">
                <div class="col-12 col-lg-6">
                    <div class="form-group">
                        <nx-checkbox
                            name="show"
                            componentId="show1"
                            #spyShow1
                            [(ngModel)]="show1"
                            translate
                            >Remember me
                        </nx-checkbox>

                        <label
                            for="show1"
                            translate
                            >Remember me</label
                        >
                        <!--component: {{spyShow1 | json}}-->
                    </div>
                    <div class="form-group">
                        <nx-checkbox
                            name="show2"
                            componentId="show2"
                            #spyShow2
                            [(ngModel)]="show2"
                            required
                        >
                        </nx-checkbox>

                        <label
                            for="show2"
                            translate
                            >I agree to T&C (required)</label
                        >
                        <!--component: {{spyShow2 | json}}-->
                        <div
                            class="help-block input-error input-error--required"
                            translate
                        >
                            Required
                        </div>
                    </div>

                    <div class="form-group">
                        <nx-radio
                            name="blah"
                            componentId="blah1"
                            value="blah1"
                            [(ngModel)]="blah"
                        >
                        </nx-radio>
                        <label
                            for="blah1"
                            translate
                            >blah1</label
                        >
                        <br />
                        <nx-radio
                            name="blah"
                            componentId="blah2"
                            value="blah2"
                            [(ngModel)]="blah"
                            translate
                            >blah2
                        </nx-radio>
                        <label
                            for="blah2"
                            translate
                            >blah2</label
                        >
                        <br />
                        <nx-radio
                            name="blah"
                            componentId="blah3"
                            value="blah3"
                            [(ngModel)]="blah"
                            translate
                            >blah3
                        </nx-radio>
                        <label
                            for="blah3"
                            translate
                            >blah3</label
                        >
                    </div>
                </div>
            </div>

            <!-- <div class="form-group">
                <nx-tag
                    class="mr-1 mb-1 d-inline-flex"
                    name="tag.name"
                    size="large"
                    *ngFor="let tag of tags"
                    [type]="tag.type"
                    [value]="tag.selected"
                    [(ngModel)]="tag.selected"
                    >{{ tag.name }} | {{ tag.selected }}</nx-tag
                >
            </div> -->
        </form>
    </div>

    <div class="col-12 col-lg-4">
        <dynamic-form-apply-example></dynamic-form-apply-example>
    </div>
</div>
<ng-container #pageApply></ng-container>
