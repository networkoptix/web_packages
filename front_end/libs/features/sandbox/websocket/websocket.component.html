<div class="col-12 p-0">
    <nx-block>
        <header translate>Group Inputs</header>
        <nx-section>
            <form
                class="form"
                #groupForm="ngForm"
                novalidate
            >
                <div class="inputs d-block d-md-table w-100 mw-100">
                    <div class="form-group d-block d-md-table-row mb-2">
                        <div
                            class="label d-block d-md-table-cell text-nowrap text-right pr-md-2 pb-2 pb-md-0"
                        >
                            <label
                                for="group-name"
                                class="control-label m-0 pb-md-2"
                                translate
                                >Group Name</label
                            >
                        </div>
                        <div class="d-block d-md-table-cell">
                            <div class="row pb-md-2">
                                <div class="col-12 col-md-7 pb-2 pb-md-0">
                                    <input
                                        id="group-name"
                                        name="groupName"
                                        class="form-control"
                                        [(ngModel)]="group.name"
                                        #groupName="ngModel"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group d-block d-md-table-row mb-2">
                        <div
                            class="label d-block d-md-table-cell text-nowrap text-right pr-md-2 pb-2 pb-md-0"
                        >
                            <label
                                for="group-id"
                                class="control-label m-0 pb-md-2"
                                translate
                                >Group Id</label
                            >
                        </div>
                        <div class="d-block d-md-table-cell">
                            <div class="row pb-md-2">
                                <div class="col-12 col-md-7 pb-2 pb-md-0">
                                    <input
                                        id="group-id"
                                        name="groupId"
                                        class="form-control"
                                        [(ngModel)]="group.groupId"
                                        #groupId="ngModel"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group d-block d-md-table-row mb-2">
                        <div
                            class="label d-block d-md-table-cell text-nowrap text-right pr-md-2 pb-2 pb-md-0"
                        >
                            <label
                                for="target-group-id"
                                class="control-label m-0 pb-md-2"
                                translate
                                >Target Group ID (Moving Groups to Group)</label
                            >
                        </div>
                        <div class="d-block d-md-table-cell">
                            <div class="row pb-md-2">
                                <div class="col-12 col-md-7 pb-2 pb-md-0">
                                    <input
                                        id="target-group-id"
                                        class="form-control"
                                        name="targetId"
                                        [(ngModel)]="group.targetId"
                                        #targetId="ngModel"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group d-block d-md-table-row mb-2">
                        <div
                            class="label d-block d-md-table-cell text-nowrap text-right pr-md-2 pb-2 pb-md-0"
                        >
                            <label
                                for="target-system-id"
                                class="control-label m-0 pb-md-2"
                                translate
                                >System ID (Moving System to Group)</label
                            >
                        </div>
                        <div class="d-block d-md-table-cell">
                            <div class="row pb-md-2">
                                <div class="col-12 col-md-7 pb-2 pb-md-0">
                                    <input
                                        id="target-system-id"
                                        class="form-control"
                                        name="systemId"
                                        [(ngModel)]="group.systemId"
                                        #systemId="ngModel"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </nx-section>

        <nx-section>
            <div class="d-flex justify-content-between">
                <button
                    (click)="sendGroupAction('create')"
                    translate
                >
                    Create group
                </button>
                <button
                    (click)="sendGroupAction('delete')"
                    translate
                >
                    Delete group
                </button>
                <button
                    (click)="sendGroupAction('moveSystem')"
                    translate
                >
                    Move system to group
                </button>
                <button
                    (click)="sendGroupAction('moveGroup')"
                    translate
                >
                    Move group to group
                </button>
                <button
                    (click)="sendGroupAction('list')"
                    translate
                >
                    Update list
                </button>
            </div>
        </nx-section>
    </nx-block>
</div>
<div class="col-12 p-0 mt-2">
    <nx-block>
        <header translate>Aggregate Url</header>
        <nx-section>
            <form
                class="form"
                #aggregatorForm="ngForm"
                novalidate
            >
                <div class="inputs d-block d-md-table w-100 mw-100">
                    <div class="form-group d-block d-md-table-row mb-2">
                        <div
                            class="label d-block d-md-table-cell text-nowrap text-right pr-md-2 pb-2 pb-md-0"
                        >
                            <label
                                for="aggregate-url"
                                class="control-label m-0 pb-md-2"
                                translate
                                >Url</label
                            >
                        </div>
                        <div class="d-block d-md-table-cell">
                            <div class="row pb-md-2">
                                <div class="col-12 col-md-7 pb-2 pb-md-0">
                                    <input
                                        id="aggregate-url"
                                        class="form-control"
                                        name="aggregateUrl"
                                        [(ngModel)]="aggregate.url"
                                        #aggregateUrl="ngModel"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group d-block d-md-table-row mb-2">
                        <div
                            class="label d-block d-md-table-cell text-nowrap text-right pr-md-2 pb-2 pb-md-0"
                        >
                            <label
                                for="aggregate-group-id"
                                class="control-label m-0 pb-md-2"
                                translate
                                >Aggregate Group Id</label
                            >
                        </div>
                        <div class="d-block d-md-table-cell">
                            <div class="row pb-md-2">
                                <div class="col-12 col-md-7 pb-2 pb-md-0">
                                    <input
                                        id="aggregate-group-id"
                                        class="form-control"
                                        name="aggregateGroupId"
                                        [(ngModel)]="aggregate.groupId"
                                        #aggregateGroupId="ngModel"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group d-block d-md-table-row mb-2">
                        <div
                            class="label d-block d-md-table-cell text-nowrap text-right pr-md-2 pb-2 pb-md-0"
                        >
                            <label
                                for="aggregate-method"
                                class="control-label m-0 pb-md-2"
                                translate
                                >Request Method</label
                            >
                        </div>
                        <div class="d-block d-md-table-cell">
                            <div class="row pb-md-2">
                                <div class="col-12 col-md-7 pb-2 pb-md-0">
                                    <input
                                        id="aggregate-method"
                                        class="form-control"
                                        name="aggregateMethod"
                                        [(ngModel)]="aggregate.method"
                                        #aggregateMethod="ngModel"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </nx-section>
        <nx-section>
            <div class="d-flex justify-content-between">
                <button
                    (click)="sendAggregateAction('aggregateSystemsRequest')"
                    translate
                >
                    All systems
                </button>
                <button
                    (click)="sendAggregateAction('aggregateRequestByGroup')"
                    translate
                >
                    All systems in a group
                </button>
            </div>
        </nx-section>
    </nx-block>
</div>

<div class="col-12 p-0 mt-2">
    <nx-block>
        <header translate>Socket Data</header>
        <nx-section>
            <pre [innerText]="socketData | json"></pre>
        </nx-section>
    </nx-block>
</div>

<div class="col-12 p-0 mt-2">
    <nx-block>
        <header translate>System Groups</header>
        <nx-section>
            <pre [innerText]="systemGroups | json"></pre>
        </nx-section>
    </nx-block>
</div>
