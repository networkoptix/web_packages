<h2
    class="nx-h2"
    [ngStyle]="{ paddingBottom: '1rem' }"
>
    NxFormField
</h2>
<div class="ff-container">
    <form
        [formGroup]="emailFormGroup"
        nxFormObserver
    >
        <nx-form-field [errorMatcher]="emailErrorMatcher">
            <label
                nx-label
                for="test-email"
                >Email</label
            >
            <input
                type="email"
                id="test-email"
                nx-input
                formControlName="email"
            />
            <nx-control-messages
                pattern="email"
                required="email"
            >
                <nx-control-message
                    key="letterA"
                    text="The letter A is not allowed"
                ></nx-control-message>
            </nx-control-messages>
        </nx-form-field>

        <div class="footer">
            <button
                nx-submit-button
                (click)="success()"
            >
                Submit
            </button>
        </div>
    </form>
    <form
        [formGroup]="quoteFormGroup"
        nxFormObserver
    >
        <nx-form-field>
            <label
                nx-label
                for="test-select"
                >Source</label
            >
            <nx-select-v2
                formControlName="quote"
                placeholder="Select"
            >
                <nx-select-item
                    [value]="undefined"
                    [selected]="false"
                    >Unselect</nx-select-item
                >
                @for (quote of quotes; track quote.source) {
                    <nx-select-item
                        [value]="quote.source"
                        [selected]="quoteControl.value === quote.source"
                        >{{ quote.source }}</nx-select-item
                    >
                }
            </nx-select-v2>
            <nx-control-messages
                useValueState
                [spacingLines]="3"
            >
                <nx-control-message
                    key="required"
                    [text]="'Source is required'"
                ></nx-control-message>
                @for (quote of quotes; track quote.source) {
                    <nx-control-message
                        [key]="quote.source"
                        [text]="quote.text"
                        type="info"
                    ></nx-control-message>
                }
            </nx-control-messages>
        </nx-form-field>
        <div class="footer">
            <button
                nx-async-submit-button
                [action]="delayedToastAction"
            >
                Submit
            </button>
        </div>
    </form>
    <form
        [formGroup]="nameFormGroup"
        nxFormObserver
        #nameFormObserver="nxFormObserver"
    >
        <nx-form-field>
            <label
                nx-label
                for="test-name"
                >Name</label
            >
            <input
                id="test-name"
                nx-input
                formControlName="name"
            />
            <nx-control-messages>
                <nx-control-message
                    key="required"
                    [text]="'Name is required'"
                ></nx-control-message>
            </nx-control-messages>
        </nx-form-field>
        <div class="footer">
            @if (nameFormObserver.formChanged()) {
                <button nx-reset-button>Cancel</button>
                <button
                    nx-apply-button
                    [action]="delayedToastAction"
                >
                    Save
                </button>
            } @else {
                <span style="display: inline-block; height: 2rem">No unsaved changes</span>
            }
        </div>
    </form>
</div>
