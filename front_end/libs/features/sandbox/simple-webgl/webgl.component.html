<div>System : SOFIA</div>
<div>Camera : DWC-MPTZ5X</div>
<div>
    <nx-checkbox
        componentId="checkTL"
        [(ngModel)]="showTL"
        (ngModelChange)="prepShowData()"
        [labelText]="'Show records'"
    >
    </nx-checkbox>
</div>
<div>
    <nx-checkbox
        componentId="checkBM"
        [(ngModel)]="showBM"
        (ngModelChange)="prepShowData()"
        [labelText]="'Show bookmarks'"
    >
    </nx-checkbox>
</div>
<div>
    <nx-checkbox
        componentId="checkAN"
        [(ngModel)]="showAN"
        (ngModelChange)="prepShowData()"
        [labelText]="'Show analytics'"
    >
    </nx-checkbox>
</div>

<div
    class="mb-3 m-0 p-3"
    style="border: 1px solid lightgray; height: 400px; background-color: white"
>
    <nx-simple-webgl-canvas
        [initialData]="recordsData"
        [pushData]="newRecordsData"
        [bookmarksData]="bookmarksData"
        [analyticsData]="analyticsData"
        [showData]="showData"
        style="height: 105px; margin-top: 115px; width: 100%; display: block; position: relative"
    ></nx-simple-webgl-canvas>
</div>
