<h1>NxDateTimeFormatService</h1>

<h3>Date</h3>
<table>
    <tbody>
        <tr>
            <td>Short</td>
            <td>{{ shortDate$ | async }}</td>
        </tr>
        <tr>
            <td>Medium</td>
            <td>{{ mediumDate$ | async }}</td>
        </tr>
        <tr>
            <td>Long</td>
            <td>{{ longDate$ | async }}</td>
        </tr>
        <tr>
            <td>Full</td>
            <td>{{ fullDate$ | async }}</td>
        </tr>
    </tbody>
</table>

<h3>Time</h3>
<table>
    <tbody>
        <tr>
            <td>Short</td>
            <td>{{ shortTime$ | async }}</td>
        </tr>
        <tr>
            <td>Medium</td>
            <td>{{ mediumTime$ | async }}</td>
        </tr>
        <tr>
            <td>Long</td>
            <td>{{ longTime$ | async }}</td>
        </tr>
        <tr>
            <td>Full</td>
            <td>{{ fullTime$ | async }}</td>
        </tr>
    </tbody>
</table>
