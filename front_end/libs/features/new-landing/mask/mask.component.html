<div class="parent-container">
    <div class="mask-wrapper">
        <div
            [ngStyle]="{
                transform: 'scale(' + scale + ')',
                transition: isSafari ? 'transform 120ms' : null
            }"
            class="svg-layer"
            [ngClass]="{
                'intro-animation':
                    (landingService.introAnimationFinished$ | async) === false &&
                    (landingService.backgroundGraphicFinishedLoading$ | async) === true
            }"
        >
            <svg-icon
                [src]="images.dirLandingGraphic + 'mask.svg'"
                class="mask"
                [applyClass]="true"
            >
            </svg-icon>
        </div>
    </div>
</div>
