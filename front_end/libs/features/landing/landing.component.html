@if (useNewCloud) {
    <iframe
        [ngClass]="{ 'auth-loaded': loaded }"
        [src]="authorizationUrl | safe: 'url'"
        (load)="handleLoad($event)"
    ></iframe>
} @else if (!loaded) {
    <nx-pre-loader
        type="page"
        [ngClass]="{ centered: useNewCloud }"
    ></nx-pre-loader>
} @else {
    <div class="container">
        <div class="jumbotron">
            <nx-landing-display-component></nx-landing-display-component>

            <p class="button d-flex justify-content-center auth-hidden">
                @if (userEmail) {
                    <a
                        data-escape-global-style
                        class="nx-button--primary"
                        routerLink="/login"
                        role="button"
                        translate
                        >Log In</a
                    >
                } @else {
                    <a
                        data-escape-global-style
                        class="nx-button--primary"
                        [href]="createUrl"
                        role="button"
                        data-testid="landingComponentLink"
                        translate
                        >Create Account</a
                    >
                }
            </p>
        </div>
        <nx-footer [center]="true"></nx-footer>
    </div>
}
