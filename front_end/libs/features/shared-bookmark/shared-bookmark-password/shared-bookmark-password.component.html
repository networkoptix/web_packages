<div class="password-container">
    <div class="hero-logo">
        <img
            [alt]="CONFIG.cloudName + ' logo'"
            [src]="'/static/images/' + (CONFIG.isDarkTheme ? 'dark_' : '') + 'logo.png'"
        />
    </div>
    <div class="password-input-container">
        <p
            class="input-header"
            translate
        >
            The requested video is protected with a password
        </p>
        <!-- TODO: This section will be replaced with Cloud2.0 Input. Don't worry much about styling or how it works currently -->
        <div class="input-box">
            <input
                #passwordInput
                type="password"
                [(ngModel)]="password"
                class="form-control"
                (keydown.Enter)="handleConfirmPressed()"
                [disabled]="disabled()"
                [ngClass]="{ 'input-error': passwordError() }"
            />
            @if (passwordError()) {
                <div class="mt-2">
                    <p
                        class="error-label mb-0"
                        translate
                    >
                        Wrong password
                    </p>
                </div>
            }
        </div>
        <button
            data-escape-global-style
            class="continue-button nx-button--primary"
            (click)="handleConfirmPressed()"
            [disabled]="disabled()"
            translate
        >
            Continue
        </button>
    </div>
</div>
