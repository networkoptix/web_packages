<div class="password-container">
    <div class="hero-logo">
        <img
            [alt]="CONFIG.cloudName + ' logo'"
            [src]="'/static/images/' + (CONFIG.isDarkTheme ? 'dark_' : '') + 'logo.png'"
        />
    </div>
    <div class="password-input-container">
        <p
            class="input-header"
            translate
        >
            The requested video is protected with a password
        </p>
        <input
            type="password"
            [ngModel]="password"
            (ngModelChange)="passwordChange.emit($event)"
            class="input-box form-control"
            (keydown.Enter)="handleConfirmPressed()"
        />
        <nx-button
            type="Brand"
            translate
            class="continue-button"
            (onClick)="handleConfirmPressed()"
        >
            Continue
        </nx-button>
    </div>
</div>
