<div
    class="background-container"
    [ngClass]="{
        'background-container-centered': pageState() === 'password' || pageState() === '404'
    }"
>
    @if (pageState() === 'loading') {
        <nx-pre-loader class="pre-loader" />
    } @else if (pageState() === 'viewer') {
        <nx-shared-bookmark-viewer
            class="view-container"
            [videoSource]="videoSource()"
            [title]="bookmarkInfo().title"
            [startTime]="bookmarkInfo().startTime"
            [description]="bookmarkInfo().description"
        />
    } @else if (pageState() === 'password') {
        <nx-shared-bookmark-password
            (onConfirmPressed)="checkPassword()"
            [(password)]="password"
            [(passwordError)]="incorrectPasswordError"
            [(disabled)]="inputFieldsDisabled"
        />
    } @else if (pageState() === '404') {
        <nx-shared-bookmark-404 />
    }
</div>
