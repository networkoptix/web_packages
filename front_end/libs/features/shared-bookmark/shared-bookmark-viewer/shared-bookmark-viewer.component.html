<div class="viewer-container">
    <div class="hero-logo">
        <img
            [alt]="CONFIG.cloudName + ' logo'"
            [src]="'/static/images/' + (CONFIG.isDarkTheme ? 'dark_' : '') + 'logo.png'"
        />
    </div>
    <nx-clip
        [sourceUrl]="videoSource()"
        (error)="onError()"
        (loadeddata)="onLoadedData()"
    />
    <div class="title-text">{{ title() }}</div>
    <div class="date-text">
        <span>{{ dateText() }} • {{ timeText() }}</span>
    </div>
    <div class="description-text">{{ description() }}</div>
</div>
