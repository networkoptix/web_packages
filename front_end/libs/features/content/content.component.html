<div class="container">
    <nx-pre-loader *ngIf="!loaded"></nx-pre-loader>

    <ng-container *ngIf="title || body">
        <h1 class="nx-h1--vertical-margin">{{ title }}</h1>
        <div class="card">
            <div
                class="card-body"
                [innerHTML]="body | safe: 'html'"
            ></div>
        </div>
    </ng-container>

    <nx-process-button
        *ngIf="showAgree"
        customClass="mt-3"
        actionType="primary"
        [process]="agreeProcess"
        [buttonText]="'Agree' | translate"
    ></nx-process-button>

    <nx-footer></nx-footer>
</div>
