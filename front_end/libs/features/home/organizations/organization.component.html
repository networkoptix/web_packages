<ng-template #body>
    <div class="pb-3">
        <h2>{{ (currentOrganization$ | async)?.name }}</h2>
    </div>
    <nx-tabs
        [onLoadTab]="currentTab"
        (tabClick)="onTabClick($event)"
    >
        <ng-container *ngFor="let tab of tabs">
            <div *tab="tab"></div>
        </ng-container>
    </nx-tabs>
</ng-template>

<div
    id="groups"
    cdkDropListGroup
>
    <div
        class="sidebar-toggling-ear-wrapper"
        *ngIf="!isLoading"
        [ngClass]="{ shown: (sidebarSettings.value$ | async)?.showSidebarState }"
        (click)="handleSidebarTogglingEarClick()"
    >
        <div class="sidebar-toggling-ear">
            <svg-icon
                nx-add-svg-src
                [src]="icons.dirTextButtons + 'arrow_expand.svg'"
            >
            </svg-icon>
        </div>
    </div>

    <div *ngIf="(sidebarSettings.value$ | async)?.showSidebarState">
        <nx-pre-loader *ngIf="isLoading; else sidebar"></nx-pre-loader>
        <ng-template #sidebar>
            <nx-groups-sidebar
                [currentGroupId]="currentGroupId$ | async"
                [userEmail]="userEmail"
                [hasGroups]="hasGroups$ | async"
                [currentPath]="currentPath$ | async"
                [openGroups]="openGroups$ | async"
                (dismiss)="dismiss()"
            ></nx-groups-sidebar>
        </ng-template>
    </div>
    <div
        class="cards"
        [ngClass]="{ 'back-button': inChannelPartner }"
    >
        <nx-pre-loader *ngIf="isLoading; else cards"></nx-pre-loader>
        <ng-template #cards>
            <ng-container *ngIf="!inChannelPartner; else channelPartnerView">
                <ng-template [ngTemplateOutlet]="body"></ng-template>
                <nx-groups-cards [inRoot]="true"></nx-groups-cards>
            </ng-container>
            <ng-template #channelPartnerView>
                <a
                    (click)="toRoot()"
                    translate
                >
                    All Organizations</a
                >
                <ng-template [ngTemplateOutlet]="body"></ng-template>
                <router-outlet></router-outlet>
            </ng-template>
        </ng-template>
        <!-- TODO: Replace with actual placeholder -->
        <!-- eslint-disable-next-line nx/template/no-untranslated -->
    </div>
</div>
