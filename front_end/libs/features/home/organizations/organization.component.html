<ng-template #loading><nx-pre-loader></nx-pre-loader></ng-template>
<ng-template #body>
    <div
        class="name pb-3"
        *ngIf="currentOrganization$$() as currentOrg"
    >
        <h2>{{ currentOrg.name }}</h2>
        <nx-tag
            *ngIf="currentOrg.effectiveState !== 'active'"
            [type]="currentOrg.effectiveState === 'suspended' ? 'warning' : 'danger'"
            [size]="'large'"
            [locked]="true"
            [customClass]="
                'status' + (currentOrg.effectiveState === 'suspended' ? ' dark-text' : '')
            "
        >
            {{ currentOrg.effectiveState | translate | uppercase }}
        </nx-tag>
    </div>
    <nx-tabs
        animated
        [currentTabIndex]="currentTabIndex$$()"
    >
        <nx-base-tab
            *ngFor="let tab of tabs$$()"
            [displayName]="tab.displayName"
            (tabClick)="onTabClick($event)"
        >
            {{ tab.displayName }}
        </nx-base-tab>
    </nx-tabs>
</ng-template>

<ng-container *ngIf="!isLoading; else loading">
    <div
        id="groups"
        cdkDropListGroup
        *ngIf="!showAccessTable; else accessTable"
    >
        <button
            *ngIf="rootGroups$$()?.length"
            class="sidebar-toggling-ear-wrapper"
            type="button"
            [ngClass]="{ shown: (sidebarSettings.value$ | async)?.showSidebarState }"
            (click)="handleSidebarTogglingEarClick()"
        >
            <div class="sidebar-toggling-ear">
                <svg-icon
                    nx-add-svg-src
                    [src]="icons.dirTextButtons + 'arrow_expand.svg'"
                >
                </svg-icon>
            </div>
        </button>

        <div
            *ngIf="
                (rootGroups$$()?.length || currentOrganization$$()?.systemCount) &&
                (sidebarSettings.value$ | async)?.showSidebarState
            "
        >
            <nx-pre-loader *ngIf="isLoading; else sidebar"></nx-pre-loader>
            <ng-template #sidebar>
                <nx-groups-sidebar></nx-groups-sidebar>
            </ng-template>
        </div>
        <div
            class="cards"
            [ngClass]="{ 'back-button': inChannelPartner }"
        >
            <nx-pre-loader
                *ngIf="isLoading && !currentOrganization$$(); else cards"
            ></nx-pre-loader>
            <ng-template #cards>
                <ng-container *ngIf="!inChannelPartner; else channelPartnerView">
                    <ng-template [ngTemplateOutlet]="body"></ng-template>
                    <router-outlet></router-outlet>
                </ng-container>
                <ng-template #channelPartnerView>
                    <a
                        (click)="toRoot()"
                        translate
                    >
                        All Organizations</a
                    >
                    <ng-template [ngTemplateOutlet]="body"></ng-template>
                    <router-outlet></router-outlet>
                </ng-template>
            </ng-template>
            <!-- TODO: Replace with actual placeholder -->
            <!-- eslint-disable-next-line nx/template/no-untranslated -->
        </div>
    </div>
</ng-container>

<ng-template #accessTable>
    <nx-access-table [email]="accessTableUser"></nx-access-table>
</ng-template>
