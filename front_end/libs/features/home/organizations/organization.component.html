<div
    id="groups"
    cdkDropListGroup
    *ngIf="loadingState$ | async as loadingState"
>
    <div
        class="sidebar-toggling-ear-wrapper"
        *ngIf="loadingState === LoadingState.LOADED"
        [ngClass]="{ shown: (sidebarSettings.value$ | async)?.showSidebarState }"
        (click)="handleSidebarTogglingEarClick()"
    >
        <div class="sidebar-toggling-ear">
            <svg-icon
                nx-add-svg-src
                [src]="icons.dirTextButtons + 'arrow_expand.svg'"
            >
            </svg-icon>
        </div>
    </div>

    <div
        class="sidebar-container"
        *ngIf="(sidebarSettings.value$ | async)?.showSidebarState"
    >
        <nx-pre-loader *ngIf="loadingState === LoadingState.LOADING; else sidebar"></nx-pre-loader>
        <ng-template #sidebar>
            <nx-groups-sidebar
                [currentGroupId]="currentGroupId$ | async"
                [currentGroupOwner]="currentGroupOwner$ | async"
                [userEmail]="userEmail"
                [hasGroups]="hasGroups$ | async"
                [currentPath]="currentPath$ | async"
                [openGroups]="openGroups$ | async"
                (dismiss)="dismiss()"
            ></nx-groups-sidebar>
        </ng-template>
    </div>
    <div class="cards">
        <ng-container [ngSwitch]="loadingState">
            <nx-pre-loader *ngSwitchCase="LoadingState.LOADING"></nx-pre-loader>
            <ng-container *ngSwitchCase="LoadingState.LOADED">
                <!-- Putting this here for now until actual page is completed -->
                <!-- eslint-disable nx/template/no-untranslated -->
                <!-- <button
                    class="btn btn-default"
                    (click)="addOrgUser()"
                >
                    Add org user
                </button>
                <button
                    class="btn btn-default"
                    (click)="editOrgUser()"
                >
                    Edit org user
                </button> -->
                <!-- eslint-enable nx/template/no-untranslated -->
                <ng-container *ngIf="inRoot$ | async; else organization">
                    <nx-groups-cards [inRoot]="true"></nx-groups-cards>
                </ng-container>
                <ng-template #organization>
                    <div>
                        <div class="header">
                            <p
                                class="mb-0"
                                translate
                            >
                                Organization
                            </p>
                            <h2 class="pb-3 pt-2">{{ (rootGroup$ | async).name }}</h2>
                        </div>
                        <nx-tabs
                            [onLoadTab]="currentTab"
                            (tabClick)="onTabClick($event)"
                        >
                            <div *tab="'systems'; title as title">{{ title }}</div>
                            <div *tab="'users'; title as title">{{ title }}</div>
                            <div *tab="'reports'; title as title">{{ title }}</div>
                            <div *tab="'settings'; title as title">{{ title }}</div>
                        </nx-tabs>
                    </div>
                    <router-outlet></router-outlet>
                </ng-template>
            </ng-container>
            <!-- TODO: Replace with actual placeholder -->
            <!-- eslint-disable-next-line nx/template/no-untranslated -->
            <div *ngSwitchDefault>No group found</div>
        </ng-container>
    </div>
</div>
