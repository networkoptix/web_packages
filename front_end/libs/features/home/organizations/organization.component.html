<ng-template #body>
    <div class="name pb-3">
        <h2>{{ currentOrganization$$().name }}</h2>
        <nx-tag
            *ngIf="currentOrganization$$().effectiveState !== 'active'"
            [type]="currentOrganization$$().effectiveState === 'suspended' ? 'warning' : 'danger'"
            [size]="'large'"
            [locked]="true"
            [isStatusBadge]="true"
        >
            {{ currentOrganization$$().effectiveState | translate | uppercase }}
        </nx-tag>
        <ng-container
            class="status"
            [ngSwitch]="currentOrganization$$().effectiveState"
        >
        </ng-container>
    </div>
    <nx-tabs
        [style.visibility]="isLoading ? 'hidden' : ''"
        animated
        [currentTabIndex]="currentTabIndex$$()"
    >
        <nx-base-tab
            *ngFor="let tab of tabs$$()"
            [displayName]="tab.displayName"
            (tabClick)="onTabClick($event)"
        >
            {{ tab.displayName }}
        </nx-base-tab>
    </nx-tabs>
</ng-template>

<div
    id="groups"
    cdkDropListGroup
    *ngIf="!showAccessTable; else accessTable"
>
    <button
        *ngIf="rootGroups$$()?.length && !isLoading"
        class="sidebar-toggling-ear-wrapper"
        type="button"
        [ngClass]="{ shown: (sidebarSettings.value$ | async)?.showSidebarState }"
        (click)="handleSidebarTogglingEarClick()"
    >
        <div class="sidebar-toggling-ear">
            <svg-icon
                nx-add-svg-src
                [src]="icons.dirTextButtons + 'arrow_expand.svg'"
            >
            </svg-icon>
        </div>
    </button>

    <div
        *ngIf="
            (rootGroups$$()?.length || currentOrganization$$()?.systemCount) &&
            (sidebarSettings.value$ | async)?.showSidebarState
        "
    >
        <nx-pre-loader *ngIf="isLoading; else sidebar"></nx-pre-loader>
        <ng-template #sidebar>
            <nx-groups-sidebar></nx-groups-sidebar>
        </ng-template>
    </div>
    <div
        class="cards"
        [ngClass]="{ 'back-button': inChannelPartner }"
    >
        <nx-pre-loader *ngIf="isLoading && !currentOrganization$$(); else cards"></nx-pre-loader>
        <ng-template #cards>
            <ng-container *ngIf="!inChannelPartner; else channelPartnerView">
                <ng-template [ngTemplateOutlet]="body"></ng-template>
                <router-outlet></router-outlet>
            </ng-container>
            <ng-template #channelPartnerView>
                <a
                    (click)="toRoot()"
                    translate
                >
                    All Organizations</a
                >
                <ng-template [ngTemplateOutlet]="body"></ng-template>
                <router-outlet></router-outlet>
            </ng-template>
        </ng-template>
        <!-- TODO: Replace with actual placeholder -->
        <!-- eslint-disable-next-line nx/template/no-untranslated -->
    </div>
</div>

<ng-template #accessTable>
    <nx-access-table [email]="accessTableUser"></nx-access-table>
</ng-template>
