<!-- Issue with "Unable to preventDefault inside passive event listener invocation." caused by monitoring? -->
<!-- https://github.com/angular/components/issues/24979#issuecomment-1203583528 -->

<ng-container *ngIf="isLoading; else showContent">
    <nx-pre-loader></nx-pre-loader>
</ng-container>

<ng-template #showContent>
    <div class="actions p-3">
        <button
            [disabled]="!isAdmin"
            class="btn btn-default"
            translate
            (click)="newGroupDialog()"
        >
            New Group
        </button>
        <div class="input px-2">
            <span class="glyphicon web-icon-search icon-search"></span>
            <input
                class="pl-2"
                [placeholder]="'Search' | translate"
            />
        </div>
    </div>
    <div
        *ngIf="!currentGroups$$()?.length && !(currentSystems$ | async).length; else showGroups"
        class="no-systems"
    >
        <nx-no-systems-cards></nx-no-systems-cards>
    </div>
</ng-template>

<ng-template
    #showGroups
    let-groups="groups"
    let-systems="systems"
>
    <div class="px-3 cards-container">
        <div
            *ngFor="let group of currentGroups$$(); trackBy: trackGroup"
            class="group-card"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="group"
            (cdkDropListDropped)="onDrop($event)"
        >
            <div
                cdkDrag
                [cdkDragData]="group"
            >
                <div *cdkDragPlaceholder></div>
                <nx-card
                    class="card-content"
                    [icon]="icons.dir + 'folder2.svg'"
                    [svgStyle]="{ 'height.px': '64', 'width.px': '54' }"
                    (click)="handleGroupClick(group)"
                >
                    <h3>{{ group.name }}</h3>
                    <div>12</div>
                </nx-card>
                <div class="placeholder-shadow"></div>
            </div>
        </div>
        <div
            *ngFor="let system of currentSystems$ | async; trackBy: trackSystem"
            class="system-card"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="system"
        >
            <!-- Update to check if system requests ownership transfer -->
            <div
                cdkDrag
                [cdkDragData]="system"
            >
                <div *cdkDragPlaceholder></div>
                <nx-card
                    class="card-content"
                    (click)="handleSystemClick(system)"
                >
                    <h3>{{ system.name }}</h3>
                    <div>12</div>
                </nx-card>
                <div class="placeholder-shadow"></div>
            </div>
        </div>
    </div>
</ng-template>
