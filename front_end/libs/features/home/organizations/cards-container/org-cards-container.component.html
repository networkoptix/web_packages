<!-- Issue with "Unable to preventDefault inside passive event listener invocation." caused by monitoring? -->
<!-- https://github.com/angular/components/issues/24979#issuecomment-1203583528 -->

<ng-container *ngIf="!currentGroups$$(); else showContent">
    <nx-pre-loader></nx-pre-loader>
</ng-container>

<ng-template #showContent>
    <div class="actions p-3">
        <button
            [disabled]="!canCreateGroups$$()"
            class="btn btn-default"
            translate
            (click)="newGroupDialog()"
        >
            New Group
        </button>
        <nx-search
            *ngIf="hasEnoughGroupsOrSystems$$()"
            class="input-overlay"
            [style.width.px]="searchConfig.channelPartners.searchWidth"
            [ngModel]="search"
            (ngModelChange)="setSearch($event)"
            layout="compact"
            [placeholder]="'Search' | translate"
            instant
        ></nx-search>
    </div>
    <div
        *ngIf="!currentGroups$$().length && !currentSystems$$()?.length; else showGroups"
        class="no-systems"
    >
        <nx-no-systems-cards></nx-no-systems-cards>
    </div>
</ng-template>

<ng-template
    #showGroups
    let-groups="groups"
    let-systems="systems"
>
    <div class="px-3 cards-container">
        <div
            *ngFor="let group of filteredGroups; trackBy: trackGroup"
            class="group-card"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="group"
            (cdkDropListDropped)="onDrop($event)"
        >
            <div
                cdkDrag
                [cdkDragData]="group"
            >
                <div *cdkDragPlaceholder></div>
                <nx-card
                    class="card-content"
                    [icon]="icons.dir + 'folder2.svg'"
                    [svgStyle]="{ 'height.px': '64', 'width.px': '54' }"
                    (click)="handleGroupClick(group)"
                >
                    <h3>{{ group.name }}</h3>
                    <div>{{ group.systemCount }}</div>
                </nx-card>
                <div class="placeholder-shadow"></div>
            </div>
        </div>
        <div
            *ngFor="let system of filteredSystems$; trackBy: trackSystem"
            class="system-card"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="system"
        >
            <!-- Update to check if system requests ownership transfer -->
            <div
                cdkDrag
                [cdkDragData]="system"
            >
                <div *cdkDragPlaceholder></div>
                <nx-card
                    class="card-content"
                    (click)="handleSystemClick(system)"
                >
                    <h3>{{ system.name }}</h3>
                </nx-card>
                <div class="placeholder-shadow"></div>
            </div>
        </div>
    </div>
</ng-template>
