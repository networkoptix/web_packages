<!-- Issue with "Unable to preventDefault inside passive event listener invocation." caused by monitoring? -->
<!-- https://github.com/angular/components/issues/24979#issuecomment-1203583528 -->

<ng-container *ngIf="!groupsStore.currentGroups$$(); else showContent">
    <nx-pre-loader></nx-pre-loader>
</ng-container>

<ng-template #showContent>
    <div class="actions p-3">
        <button
            *ngIf="canManageSystems$$()"
            class="btn btn-default"
            translate
            (click)="newGroupDialog()"
        >
            New Folder
        </button>
        <nx-search
            *ngIf="hasEnoughGroupsOrSystems$$()"
            class="input-overlay"
            [style.width.px]="searchConfig.channelPartners.searchWidth"
            [ngModel]="search"
            layout="compact"
            [placeholder]="'Search' | translate"
            instant
        ></nx-search>
    </div>
    <div
        *ngIf="
            !groupsStore.currentGroups$$().length && !groupsStore.currentSystems$$()?.length;
            else showGroups
        "
        class="no-systems"
    >
        <nx-no-systems-cards></nx-no-systems-cards>
    </div>
</ng-template>

<ng-template #showGroups>
    <div class="px-3 cards-container">
        <div
            *ngFor="let group of filteredGroups$$(); trackBy: trackGroup"
            class="group-card"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="group"
            (cdkDropListDropped)="onDrop($event)"
        >
            <div
                cdkDrag
                [cdkDragDisabled]="!canManageSystems$$()"
                [cdkDragData]="group"
            >
                <div *cdkDragPlaceholder></div>
                <nx-card
                    class="card-content"
                    [icon]="icons.dir + 'folder2.svg'"
                    [svgStyle]="{ 'height.px': '64', 'width.px': '54' }"
                    [routerLink]="['group', group.id]"
                    [relativeTo]="route.parent"
                    [dropdownItems]="groupActions$$()[group.id]"
                    (toggleShow)="$event && getGroupUsers(group.id)"
                >
                    <h3>{{ group.name }}</h3>
                    <div>{{ group.systemCount }}</div>
                </nx-card>
                <div class="placeholder-shadow"></div>
            </div>
        </div>
        <div
            *ngFor="let system of filteredSystems$$(); trackBy: trackSystem"
            class="system-card"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="system"
        >
            <!-- Update to check if system requests ownership transfer -->
            <div
                cdkDrag
                [cdkDragDisabled]="!canManageSystems$$()"
                [cdkDragData]="system"
            >
                <div *cdkDragPlaceholder></div>
                <nx-card
                    class="card-content"
                    [routerLink]="
                        openServices$$()
                            ? ['/systems', system.systemId, 'services']
                            : ['/systems', system.systemId]
                    "
                    [dropdownItems]="systemActions$$()[system.systemId]"
                >
                    <h3>{{ system.name }}</h3>
                    <svg-icon
                        *ngIf="system.system2faEnabled"
                        [src]="icons.dir + 'key.svg'"
                        [svgStyle]="{ 'height.px': '24' }"
                    ></svg-icon>
                </nx-card>
                <div class="placeholder-shadow"></div>
            </div>
        </div>
        <div
            *ngIf="!filteredSystems$$().length && !filteredGroups$$().length && search.value"
            class="no-search-results"
        >
            <svg-icon
                nx-add-svg-src
                [svgStyle]="{
                    'width.px': '64',
                    'height.px': '64'
                }"
                [src]="icons.dirPageV2Placeholder + 'not_found.svg'"
            ></svg-icon>
            <h3 translate>No Results</h3>
            <p translate>Try changing the search string</p>
        </div>
    </div>
</ng-template>
