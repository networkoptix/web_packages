<div class="sub-container">
    <a
        (click)="toRoot()"
        translate
    >
        <svg-icon [src]="icons.dirTextButtons + 'arrow_right.svg'"></svg-icon>
        All Partners</a
    >
    <div class="header">
        <h2>{{ currentSubChannel().name }}</h2>
        @if (effectiveState() !== 'active') {
            <nx-tag
                [type]="effectiveState() === 'suspended' ? 'warning' : 'danger'"
                [size]="'large'"
                [locked]="true"
                [customClass]="'status' + (effectiveState() === 'suspended' ? ' dark-text' : '')"
            >
                {{ effectiveState() | translate | uppercase }}
            </nx-tag>
        }
    </div>
    <nx-tabs [tabs]="tabs()" />
    <router-outlet></router-outlet>
</div>
