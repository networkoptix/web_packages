<div class="sub-container">
    <a
        (click)="toRoot()"
        translate
    >
        <svg-icon [src]="icons.dirTextButtons + 'arrow_right.svg'"></svg-icon>
        All Partners</a
    >
    <div class="header">
        <h2>{{ currentSubChannel$$()?.name }}</h2>
        @if (
            currentSubChannel$$()?.effectiveState !== 'active' &&
                currentSubChannel$$()?.effectiveState;
            as state
        ) {
            <nx-tag
                [type]="state === 'suspended' ? 'warning' : 'danger'"
                [size]="'large'"
                [locked]="true"
                [customClass]="'status' + (state === 'suspended' ? ' dark-text' : '')"
            >
                {{ state | translate | uppercase }}
            </nx-tag>
        }
    </div>
    <nx-tabs animated>
        @for (tab of tabs(); track $index) {
            <nx-base-tab
                [displayName]="tab.displayName"
                [route]="tab.route"
            >
                {{ tab.displayName }}
            </nx-base-tab>
        }
    </nx-tabs>
    <router-outlet></router-outlet>
</div>
