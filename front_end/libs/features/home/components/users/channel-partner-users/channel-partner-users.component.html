<div class="actions p-3">
    <button
        *ngIf="currentPartnerId$ | async as id"
        class="btn btn-default"
        translate
        (click)="newUserDialog(id)"
    >
        Add User
    </button>
    <div class="input px-2">
        <span class="glyphicon web-icon-search icon-search"></span>
        <input
            class="pl-2"
            [placeholder]="'Search' | translate"
        />
    </div>
</div>
<div
    #tableContainer
    class="m-0 table-grid"
>
    <div [style.display]="'block'">
        <nx-users-table
            [userType]="UserType.CHANNEL_PARTNER"
            [headers]="headers"
            [records]="records$ | async"
            [selectedRecordId]="selectedUserEmail"
            (onDeleteClick)="deleteChannelPartnerUser($event)"
            (onRowClick)="selectUser($event)"
        ></nx-users-table>
    </div>
</div>
