<div class="actions p-3">
    <div
        class="selected-users"
        *ngIf="hasSelectedUsers; else addUser"
    >
        <div class="text">
            <svg-icon
                nx-add-svg-src
                [src]="icons.dirTextButtons + 'close.svg'"
                [svgStyle]="{ 'width.px': '12' }"
            ></svg-icon>
            {{ selectedUsersLength }}
            <span translate> selected: </span>
        </div>
        <button
            class="btn"
            translate
            (click)="deleteChannelPartnerUser()"
        >
            <svg-icon
                class="delete"
                nx-add-svg-src
                [src]="icons.dirTextButtons + 'delete.svg'"
                [svgStyle]="{ 'width.px': '24', 'height.px': '24' }"
            ></svg-icon>

            Delete
        </button>
    </div>
    <ng-template #addUser>
        <button
            *ngIf="currentPartnerId$ | async as id"
            class="btn btn-default"
            translate
            (click)="newUserDialog(id)"
        >
            Add User
        </button>
    </ng-template>

    <div class="filter">
        <nx-search
            [(ngModel)]="searchModel"
            (ngModelChange)="setQuery($event)"
            layout="search"
            instant
        ></nx-search>
        <button (click)="sortRecords()">
            <svg-icon [src]="icons.dir + 'filter.svg'"></svg-icon>
        </button>
    </div>
</div>
<div
    #tableContainer
    class="m-0 px-3 table-grid"
>
    <div [style.display]="'block'">
        <nx-users-table
            [userType]="UserType.CHANNEL_PARTNER"
            [headers]="headers"
            [records]="recordStore.filteredRecords$$()"
            (onDeleteClick)="deleteChannelPartnerUser($event)"
            (selectedUsersEmitter)="updateSelectedUsers($event)"
            [roles]="roles$$()"
        ></nx-users-table>
    </div>
</div>
