@defer (when channelPartnerUsersStore.filteredRecords$$()) {
    <div class="actions p-3">
        @if (selectedCount) {
            <div class="selected-users">
                <div class="text">
                    <svg-icon
                        nx-add-svg-src
                        [src]="icons.dirTextButtons + 'close.svg'"
                        [svgStyle]="{ 'width.px': '12' }"
                    ></svg-icon>
                    {{ selectedCount }}
                    <span translate> selected: </span>
                </div>
                <button
                    class="btn"
                    translate
                    (click)="channelPartnersUsersTable.bulkDeleteUsers()"
                >
                    <svg-icon
                        class="delete"
                        nx-add-svg-src
                        [src]="icons.dirTextButtons + 'delete.svg'"
                        [svgStyle]="{ 'width.px': '24', 'height.px': '24' }"
                    ></svg-icon>

                    Delete
                </button>
            </div>
        } @else {
            <button
                *ngIf="currentPartnerId$ | async as id"
                class="btn btn-default"
                translate
                (click)="newUserDialog(id)"
            >
                Add User
            </button>
        }
        <div class="filter">
            <nx-search
                [(ngModel)]="searchModel"
                layout="search"
                instant
            ></nx-search>
            <button (click)="sortRecords()">
                <svg-icon [src]="icons.dir + 'filter.svg'"></svg-icon>
            </button>
        </div>
    </div>
    <div
        #tableContainer
        class="table-grid"
    >
        <div [style.display]="'block'">
            @if (CONFIG.featureFlags.channelPartnersUpdatedUserTable) {
                <nx-channel-partner-users-table
                    (selectedCountEmitter)="updateSelectedCount($event)"
                    [searching]="searchModel.query !== ''"
                ></nx-channel-partner-users-table>
            } @else {
                <nx-users-table
                    [userType]="UserType.CHANNEL_PARTNER"
                    [headers]="headers"
                    [records]="channelPartnerUsersStore.filteredRecords$$()"
                    (onDeleteClick)="deleteChannelPartnerUser($event)"
                    (selectedUsersEmitter)="updateSelectedUsers($event)"
                    (onAdduser)="newUserDialog()"
                    [roles]="roles$$()"
                    [searching]="searchModel.query !== ''"
                ></nx-users-table>
            }
        </div>
    </div>
} @loading {
    <nx-pre-loader></nx-pre-loader>
}
