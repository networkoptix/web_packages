@defer (when channelPartnerUsersStore.filteredRecords$$()) {
    <div class="actions">
        @if (selectedCount) {
            <div class="selected-users">
                <button
                    class="btn uncheckBtn"
                    (click)="channelPartnersUsersTable.uncheckAll()"
                    type="button"
                >
                    <svg-icon
                        nx-add-svg-src
                        [src]="icons.dirTextButtons + 'close.svg'"
                        [svgStyle]="{ 'width.px': '15' }"
                    ></svg-icon>
                </button>
                <div>
                    {{ selectedCount }}
                    <span translate> selected: </span>
                </div>
                <button
                    class="btn"
                    translate
                    (click)="channelPartnersUsersTable.bulkDeleteUsers()"
                >
                    <svg-icon
                        class="delete"
                        nx-add-svg-src
                        [src]="icons.dirTextButtons + 'delete.svg'"
                        [svgStyle]="{ 'width.px': '24', 'height.px': '24' }"
                    ></svg-icon>

                    Delete
                </button>
            </div>
        } @else {
            <button
                *ngIf="currentPartnerId$ | async as id"
                class="btn btn-default"
                translate
                (click)="newUserDialog(id)"
            >
                Add User
            </button>
        }
        <nx-search
            [(ngModel)]="searchModel"
            (ngModelChange)="setQuery($event)"
            layout="search"
            instant
        ></nx-search>

        <!--            <nx-filter-tags-->
        <!--                [filters]="filters$$()"-->
        <!--                (filterChange)="updateFilters($event)"-->
        <!--            ></nx-filter-tags>-->

        <!--            <button-->
        <!--                class="btn btn-default-clear"-->
        <!--                (click)="filterRecords()"-->
        <!--            >-->
        <!--                <svg-icon [src]="icons.dir + 'filter.svg'"></svg-icon>-->
        <!--            </button>-->
    </div>
    <div
        #tableContainer
        class="table-grid"
    >
        <div [style.display]="'block'">
            <nx-channel-partner-users-table
                (selectedCountEmitter)="updateSelectedCount($event)"
                [searching]="searchModel.query !== ''"
            ></nx-channel-partner-users-table>
        </div>
    </div>
} @loading {
    <nx-pre-loader></nx-pre-loader>
}
