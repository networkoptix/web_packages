<div class="header">
    <div class="back">
        <a
            class="anchor"
            [routerLink]="currentGroupId$$() | mapWith: routerState.getBreadcrumbLink$$()"
        >
            <div class="back-icon">
                <svg-icon
                    nx-add-svg-src
                    [src]="icons.dirTextButtons + 'arrow_left.svg'"
                ></svg-icon>
            </div>
            <span
                class="back-text"
                translate
            >
                Back
            </span></a
        >
    </div>
    <h2 class="h2">{{ fullName$$() }}</h2>
</div>
<div class="body">
    <div class="actions py-3">
        @if (selectedCount) {
            <div class="selected-users">
                <button
                    class="btn uncheckBtn"
                    (click)="accessTable.uncheckAll()"
                    type="button"
                >
                    <svg-icon
                        nx-add-svg-src
                        [src]="icons.dirTextButtons + 'close.svg'"
                        [svgStyle]="{ 'width.px': '15' }"
                    ></svg-icon>
                </button>
                <div>
                    {{ selectedCount }}
                    <span translate> selected: </span>
                </div>
                <button
                    class="btn"
                    translate
                    (click)="accessTable.bulkDeleteUsers()"
                >
                    <svg-icon
                        class="delete"
                        nx-add-svg-src
                        [src]="icons.dirTextButtons + 'delete.svg'"
                        [svgStyle]="{ 'width.px': '24', 'height.px': '24' }"
                    ></svg-icon>

                    Delete
                </button>
            </div>
        } @else {
            @if (isOrgUser$$()) {
                <div translate>This user already has access to all objects in the organization</div>
            } @else if (email !== accountEmail$$()) {
                <button
                    class="btn btn-default"
                    translate
                    (click)="addAccess()"
                >
                    Add Access
                </button>
            }
        }
        <div class="filter">
            <nx-search
                [(ngModel)]="searchModel"
                (ngModelChange)="setQuery($event)"
                layout="search"
                instant
            ></nx-search>
            <!--            <button (click)="sortRecords()">-->
            <!--                <svg-icon [src]="icons.dir + 'filter.svg'"></svg-icon>-->
            <!--            </button>-->
        </div>
    </div>
    <nx-users-access-table
        (selectedCountEmitter)="updateSelectedCount($event)"
    ></nx-users-access-table>
</div>
