<div class="actions p-3">
    <button
        *ngIf="currentItemId$$()"
        class="btn btn-default"
        translate
        (click)="newUserDialog()"
    >
        Add User
    </button>
    <div class="input px-2">
        <span class="glyphicon web-icon-search icon-search"></span>
        <input
            class="pl-2"
            [placeholder]="'Search' | translate"
        />
    </div>
</div>
<nx-users-table
    [userType]="inGroup ? UserType.GROUP : UserType.ORGANIZATION"
    [inGroup]="inGroup"
    [headers]="headers"
    [records]="orgUserStore.tableUsers$$()"
    [roles]="orgRoles$$() || []"
    (selectedUsersEmitter)="updateSelectedUsers($event)"
    (onDeleteClick)="deleteUsers($event)"
    (onExpandClick)="expandClick($event)"
    (onAdduser)="newUserDialog()"
></nx-users-table>
