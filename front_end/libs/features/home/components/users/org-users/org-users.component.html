<div class="actions p-3">
    <button
        class="btn btn-default"
        translate
        (click)="newUserDialog()"
    >
        Add User
    </button>
    <div class="filter">
        <nx-search
            [(ngModel)]="searchModel"
            (ngModelChange)="setQuery($event)"
            layout="search"
            instant
        ></nx-search>
        <!--            <button (click)="sortRecords()">-->
        <!--                <svg-icon [src]="icons.dir + 'filter.svg'"></svg-icon>-->
        <!--            </button>-->
    </div>
</div>
@if (CONFIG.featureFlags.channelPartnersUpdatedUserTable) {
    <nx-org-users-table
        [userType]="inGroup$$() ? UserType.GROUP : UserType.ORGANIZATION"
        [inGroup]="inGroup$$()"
        [headers]="headers"
        [records]="orgUserStore.filteredRecords$$()"
        [roles]="orgRoles$$() || []"
        (selectedUsersEmitter)="updateSelectedUsers($event)"
        (onDeleteClick)="deleteUsers($event)"
        (onAdduser)="newUserDialog()"
    ></nx-org-users-table>
} @else {
    <nx-users-table
        [userType]="inGroup$$() ? UserType.GROUP : UserType.ORGANIZATION"
        [inGroup]="inGroup$$()"
        [headers]="headers"
        [records]="orgUserStore.filteredRecords$$()"
        [roles]="orgRoles$$() || []"
        (selectedUsersEmitter)="updateSelectedUsers($event)"
        (onDeleteClick)="deleteUsers($event)"
        (onAdduser)="newUserDialog()"
    ></nx-users-table>
}
