@if (orgUsersStore.currentGroupUsersEntities().length) {
    <div class="actions">
        @if (selectedCount) {
            <div class="selected-users">
                <button
                    class="btn uncheckBtn"
                    (click)="orgUsersTable.uncheckAll()"
                    type="button"
                >
                    <svg-icon
                        nx-add-svg-src
                        [src]="icons.dirTextButtons + 'close.svg'"
                        [svgStyle]="{ 'width.px': '15' }"
                    ></svg-icon>
                </button>
                <div>
                    {{ selectedCount }}
                    <span translate> selected: </span>
                </div>
                <button
                    class="btn"
                    translate
                    (click)="orgUsersTable.bulkDeleteUsers()"
                >
                    <svg-icon
                        class="delete"
                        nx-add-svg-src
                        [src]="icons.dirTextButtons + 'delete.svg'"
                        [svgStyle]="{ 'width.px': '24', 'height.px': '24' }"
                    ></svg-icon>

                    Delete
                </button>
            </div>
        } @else {
            <button
                class="btn btn-default"
                translate
                (click)="newUserDialog()"
            >
                Add User
            </button>
        }
        <nx-search
            [(ngModel)]="searchModel"
            (ngModelChange)="setQuery($event)"
            layout="search"
            instant
        ></nx-search>

        <!--            <nx-filter-tags-->
        <!--                [filters]="filters$$()"-->
        <!--                (filterChange)="updateFilters($event)"-->
        <!--            ></nx-filter-tags>-->

        <!--            <button-->
        <!--                class="btn btn-default-clear"-->
        <!--                (click)="filterRecords()"-->
        <!--            >-->
        <!--                <svg-icon [src]="icons.dir + 'filter.svg'"></svg-icon>-->
        <!--            </button>-->
    </div>
}
<nx-org-users-table (selectedCountEmitter)="updateSelectedCount($event)"></nx-org-users-table>
