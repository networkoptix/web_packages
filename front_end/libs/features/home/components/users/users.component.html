<div class="actions p-3">
    <button
        class="btn btn-default"
        translate
        (click)="newUserDialog()"
    >
        Add User
    </button>
    <div class="input px-2">
        <span class="glyphicon web-icon-search icon-search"></span>
        <input
            class="pl-2"
            [placeholder]="'Search' | translate"
        />
    </div>
</div>
<nx-users-table
    [headers]="headers"
    [records]="records"
></nx-users-table>
