<div class="header">
    <div class="back">
        <a [routerLink]="currentGroupId$$() | mapWith: routerState.getBreadcrumbLink$$()">
            <div class="back-icon">
                <svg-icon
                    nx-add-svg-src
                    [src]="icons.dirTextButtons + 'arrow_left.svg'"
                ></svg-icon>
            </div>
            <span
                class="back-text"
                translate
            >
                Back
            </span></a
        >
    </div>
    <h2>{{ fullName$$() }}</h2>
</div>
<div class="body">
    <div class="actions py-3">
        @if (selectedCount) {
            <div class="selected-users">
                <div class="text">
                    <svg-icon
                        nx-add-svg-src
                        [src]="icons.dirTextButtons + 'close.svg'"
                        [svgStyle]="{ 'width.px': '12' }"
                    ></svg-icon>
                    {{ selectedCount }}
                    <span translate> selected: </span>
                </div>
                <button
                    class="btn"
                    translate
                    (click)="accessTable.bulkDeleteUsers()"
                >
                    <svg-icon
                        class="delete"
                        nx-add-svg-src
                        [src]="icons.dirTextButtons + 'delete.svg'"
                        [svgStyle]="{ 'width.px': '24', 'height.px': '24' }"
                    ></svg-icon>

                    Delete
                </button>
            </div>
        } @else {
            <button
                class="btn btn-default"
                translate
                (click)="addAccess()"
            >
                Add Access
            </button>
        }
        <div class="input px-2">
            <span class="glyphicon web-icon-search icon-search"></span>
            <input
                class="pl-2"
                [placeholder]="'Search' | translate"
            />
        </div>
    </div>
    @if (CONFIG.featureFlags.channelPartnersUpdatedUserTable) {
        <nx-users-access-table
            [records]="userRecords$$()"
            (selectedCountEmitter)="updateSelectedCount($event)"
        ></nx-users-access-table>
    } @else {
        <nx-users-table
            [userType]="UserType.ORGANIZATION"
            [accessTable]="true"
            [headers]="headers"
            [records]="userRecords$$()"
            [roles]="orgRoles$$()"
            (onDeleteClick)="deleteUser($event)"
            (selectedUsersEmitter)="updateSelectedUsers($event)"
        ></nx-users-table>
    }
</div>
