<div
    class="system-button card card-condensed"
    [class.toggle-active]="toggleShow | async"
>
    <div class="card-body">
        <svg-icon
            *ngIf="icon"
            [src]="icon"
            [svgStyle]="svgStyle"
        ></svg-icon>
        <div class="info">
            <ng-content></ng-content>
        </div>
    </div>
    <div
        *ngIf="dropdownItems?.length"
        class="dropdown"
    >
        <nx-three-dot
            [items]="dropdownItems"
            (toggleShow)="toggleShow.emit($event)"
        ></nx-three-dot>
    </div>
</div>
