<div class="cards-container">
    <ng-container *ngFor="let service of services">
        <nx-card
            [icon]="icons.dir + service.icon"
            [dropdownItems]="dropddownItems"
            [svgStyle]="{ 'height.px': '64', 'width.px': '54' }"
        >
            <h3 name>{{ service.name }}</h3>
        </nx-card>
    </ng-container>
</div>
