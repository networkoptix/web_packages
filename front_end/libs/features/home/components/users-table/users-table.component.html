<div
    style="display: none !important"
    class="d-flex pl-2 pb-3"
>
    <nx-checkbox
        componentId="showSubLevels"
        [labelText]="'Include sub-levels'"
        (onClick)="showSubLevels($event)"
    >
    </nx-checkbox>
</div>
<div class="nx-new-table-container">
    <nx-table
        class="CP-users"
        [style.height]="'calc(100% - 12px)'"
        set-pagination
        set-sorting
        set-rows-auto
        [set-arrange]="setHeaders"
        [set-row-expand]="subLevels"
        [set-selected-item-id]="selectedRecordId"
        [data]="records"
        (onRowClick)="onRowClickAction($event)"
    >
        <ng-template #header>
            <div style="grid-area: userId">
                <nx-checkbox
                    componentId="checkAll"
                    (onClick)="selectAll()"
                >
                </nx-checkbox>
            </div>
            <div
                *ngFor="let head of headers"
                #sortItem
                [attr.id]="head.name"
                [attr.data-sort]="head.sort"
                [style.justify-content]="head.align || 'flex-start'"
            >
                <span
                    class="head-title ellipsis caption"
                    title="{{ head.value }}"
                    >{{ head.value }}</span
                >
            </div>
            <!--            <div-->
            <!--                #sortItem-->
            <!--                data-sort-string-->
            <!--                style="grid-area: email"-->
            <!--            >-->
            <!--                {{ headers['email'].name }}-->
            <!--            </div>-->
            <!--            <div-->
            <!--                #sortItem-->
            <!--                data-sort-string-->
            <!--                style="grid-area: fullName"-->
            <!--            >-->
            <!--                {{ headers['fullName'].name }}-->
            <!--            </div>-->
            <!--            <div style="grid-area: accessLevel">-->
            <!--                {{ headers['accessLevel'].name }}-->
            <!--            </div>-->
            <!--            <div style="grid-area: roles">-->
            <!--                {{ headers['roles'].name }}-->
            <!--            </div>-->
            <!--            <div>&nbsp;</div>-->
        </ng-template>
        <ng-template
            #rows
            let-row
        >
            <div
                data-id="{{ row.userId }}"
                style="grid-area: userId"
            >
                <nx-checkbox
                    componentId="checkBox{{ row.email }}"
                    (onClick)="selectRecord(row)"
                >
                </nx-checkbox>
                <svg-icon
                    *ngIf="subLevels && (row.roles.length > 1 || row.accessLevel.length > 1)"
                    nx-add-svg-src
                    class="icon-expand"
                    [src]="icons.dirTextButtons + 'arrow_expand.svg'"
                    [applyClass]="true"
                    [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                ></svg-icon>
            </div>

            <div
                class="div-container-wrapper"
                data-id="{{ row.userId }}"
                style="grid-area: email"
                [ngClass]="row.userId === expandRowId ? 'expanded' : ''"
            >
                {{ row.email }}
            </div>

            <div
                data-id="{{ row.userId }}"
                style="grid-area: fullName"
            >
                {{ row.fullName }}
            </div>

            <div
                class="div-container-wrapper"
                data-id="{{ row.userId }}"
                style="grid-area: accessLevel"
                *ngIf="row.accessLevel.length === 1"
            >
                {{ row.accessLevel[0] }}
            </div>
            <div
                class="div-container-wrapper"
                data-id="{{ row.userId }}"
                style="grid-area: accessLevel"
                *ngIf="row.accessLevel.length > 1"
            >
                <div
                    class="div-container"
                    *ngIf="!subLevels"
                >
                    {{ row.accessLevel[0] }}
                </div>
                <div
                    class="div-container"
                    *ngIf="subLevels"
                >
                    <i>{{ LANG.systemsCount | translate : { count: row.accessLevel.length } }}</i>
                </div>

                <div
                    class="div-container-wrapper"
                    *ngIf="subLevels && row.userId === expandRowId"
                >
                    <div *ngFor="let level of row.accessLevel">
                        {{ level }}
                    </div>
                </div>
            </div>

            <div
                class="div-container-wrapper"
                data-id="{{ row.userId }}"
                style="grid-area: roles"
                *ngIf="row.roles.length === 1"
            >
                <div class="div-container">
                    {{ row.roles[0].name }}
                </div>
            </div>
            <div
                class="div-container-wrapper"
                data-id="{{ row.userId }}"
                style="grid-area: roles"
                *ngIf="row.roles.length > 1"
            >
                <div
                    class="div-container"
                    *ngIf="!subLevels"
                >
                    {{ row.roles[0] }}
                </div>
                <div
                    class="div-container"
                    *ngIf="subLevels"
                >
                    <i translate>multiple groups</i>
                </div>

                <div
                    class="div-container-wrapper"
                    *ngIf="subLevels && row.userId === expandRowId"
                >
                    <div
                        class="div-container"
                        *ngFor="let group of row.roles"
                    >
                        {{ group }}
                    </div>
                </div>
            </div>

            <div class="div-container-wrapper">
                <svg-icon
                    nx-add-svg-src
                    (click)="onDeleteClick.emit(row.email)"
                    [src]="icons.dir + 'delete.svg'"
                    [svgStyle]="{ 'width.px': '24', 'height.px': '24' }"
                ></svg-icon>
            </div>
        </ng-template>
    </nx-table>
</div>
