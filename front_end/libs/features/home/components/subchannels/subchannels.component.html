<div
    class="subchannels-container"
    [ngClass]="{ 'subchannels-placeholder': subchannels$$().length === 0 }"
    *ngIf="subchannels$$().length > 0; else subchannelsEmpty"
>
    <div
        class="subchannels-body"
        *ngIf="!(inSubchannels$ | async); else outlet"
    >
        <div
            class="actions"
            [ngClass]="{ search: !canCreatePartners$$() }"
        >
            <button
                *ngIf="canCreatePartners$$()"
                class="btn btn-default"
                translate
                (click)="newPartnerDialog()"
            >
                New Partner
            </button>

            <nx-search
                *ngIf="subchannels$$().length > searchConfig.channelPartners.searchMinimumCards"
                class="input-overlay"
                [style.width.px]="searchConfig.channelPartners.searchWidth"
                [ngModel]="{ value: search$$() }"
                layout="search"
                [placeholder]="'Search' | translate"
                instant
            ></nx-search>
        </div>
        <ng-container *ngIf="filteredSubchannels$$().length > 0; else noPartners">
            <div class="cards-container">
                <ng-container *ngFor="let channel of filteredSubchannels$$()">
                    <nx-card
                        class="card-content"
                        (click)="handleChannelClick(channel.id)"
                        [icon]="icons.dir + 'partner.svg'"
                        [svgStyle]="{ 'height.px': '64', 'width.px': '64' }"
                    >
                        <h3>{{ channel.name }}</h3>

                        @if (channel.effectiveState === 'active') {
                            <div>
                                <svg-icon [src]="icons.dir + 'organization_2.svg'"></svg-icon>
                                {{ channel.organizationCount }}
                                <svg-icon [src]="icons.dir + 'partner_small.svg'"></svg-icon>
                                {{ channel.partnerCount }}
                            </div>
                        } @else {
                            <nx-tag
                                [type]="
                                    channel.effectiveState === 'suspended' ? 'warning' : 'danger'
                                "
                                size="medium"
                                [locked]="true"
                                [customClass]="
                                    'status' +
                                    (channel.effectiveState === 'suspended' ? ' dark-text' : '')
                                "
                            >
                                {{ channel.effectiveState | translate | uppercase }}
                            </nx-tag>
                        }
                    </nx-card>
                </ng-container>
            </div>
        </ng-container>
        <ng-template #noPartners>
            <div class="nothing-found-placeholder">
                <nx-page-placeholder-v2
                    [type]="PAGE_PLACEHOLDER.NOTHING_FOUND"
                ></nx-page-placeholder-v2>
            </div>
        </ng-template>
    </div>
    <ng-template #outlet>
        <router-outlet></router-outlet>
    </ng-template>
</div>
<ng-template #subchannelsEmpty>
    <div
        *ngIf="subchannelsStoresLoaded"
        class="placeholder-container"
    >
        <div>
            <!-- TEMPORARY SVG - replace Aria label -->
            <svg-icon
                nx-add-svg-src
                [svgStyle]="{
                    'height.px': 64,
                    'width.px': 64,
                    'pointer-events': 'none'
                }"
                [src]="icons.dirPageV2Placeholder + 'no_partners.svg'"
                svgAriaLabel="change me please"
            ></svg-icon>
        </div>
        <div class="placeholder-heading">{{ 'No Partners' | translate }}</div>
        <!-- eslint-disable-next-line nx/template/no-untranslated -->
        <div
            translate
            class="placeholder-body"
        >
            You have not yet created any partners.
        </div>
        <div *ngIf="canCreatePartners$$()">
            <nx-button
                text="{{ 'New Partner' | translate }}"
                [type]="buttonType"
                (onClick)="newPartnerDialog()"
            ></nx-button>
        </div>
    </div>
</ng-template>
