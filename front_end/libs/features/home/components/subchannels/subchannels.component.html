<div
    class="body"
    [ngClass]="{ 'subchannels-placeholder': subchannels$$().length === 0 }"
>
    <div
        class="body"
        *ngIf="subchannels$$().length > 0; else subchannelsEmpty"
    >
        <div *ngIf="!(inSubchannels$ | async); else outlet">
            <div class="actions p-3">
                <button
                    [disabled]="!canCreatePartners$$()"
                    class="btn btn-default"
                    translate
                    (click)="newPartnerDialog()"
                >
                    New Partner
                </button>

                <nx-search
                    *ngIf="subchannels$$().length > searchConfig.channelPartners.searchMinimumCards"
                    class="input-overlay"
                    [style.width.px]="searchConfig.channelPartners.searchWidth"
                    [ngModel]="search"
                    (ngModelChange)="setSearch($event)"
                    layout="compact"
                    [placeholder]="'Search' | translate"
                    instant
                ></nx-search>
            </div>
            <div class="px-3 cards-container">
                <ng-container *ngFor="let channel of filteredSubchannels$$()">
                    <nx-card
                        class="card-content"
                        (click)="handleChannelClick(channel.id)"
                        [icon]="icons.dir + 'partner.svg'"
                    >
                        <h3>{{ channel.name }}</h3>
                        <div>
                            <svg-icon [src]="icons.dir + 'organization_2.svg'"></svg-icon>
                            {{ channel.organizationCount }}
                            <svg-icon [src]="icons.dir + 'partner_small.svg'"></svg-icon>
                            {{ channel.partnerCount }}
                        </div>
                    </nx-card>
                </ng-container>
            </div>
        </div>
        <ng-template #outlet>
            <router-outlet></router-outlet>
        </ng-template>
    </div>
    <ng-template #subchannelsEmpty>
        <div
            *ngIf="subchannelsStoresLoaded"
            class="placeholder-container"
        >
            <div>
                <!-- TEMPORARY SVG - replace Aria label -->
                <svg-icon
                    nx-add-svg-src
                    [svgStyle]="{
                        'height.px': 64,
                        'width.px': 64,
                        'pointer-events': 'none'
                    }"
                    [src]="icons.dirSectionPlaceholder + 'cantconnect.svg'"
                    svgAriaLabel="change me please"
                ></svg-icon>
            </div>
            <div class="placeholder-heading">{{ 'No Partners' | translate }}</div>
            <!-- eslint-disable-next-line nx/template/no-untranslated -->
            <div class="placeholder-body">
                <!-- TEMPORARY COPY -->
                Drag video files or images to the client window, or add local media folder through
                the Local Settings dialog.'
            </div>
            <div>
                <nx-button
                    text="{{ 'New Partner' | translate }}"
                    [type]="buttonType"
                    (onClick)="newPartnerDialog()"
                ></nx-button>
            </div>
        </div>
    </ng-template>
</div>
