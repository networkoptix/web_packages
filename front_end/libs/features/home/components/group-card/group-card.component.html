<div class="system-button group-card card-condensed">
    <div
        class="card-body"
        (click)="openGroup()"
    >
        <div class="top">
            <svg-icon
                nx-add-svg-src
                [src]="icons.dir + 'folder2.svg'"
                [svgStyle]="{ 'width.px': '54', 'height.px': '64' }"
            ></svg-icon>
        </div>
        <h3>
            <div class="bottom">
                <nx-search-highlight
                    [text]="group.name"
                    [search]="search"
                    class="card-name"
                ></nx-search-highlight>
                <span class="count">
                    {{ group.systemsCount + group.groups.length }}
                </span>
            </div>
        </h3>
    </div>
    <div
        class="three-dots"
        [cdkMenuTriggerFor]="menu"
    >
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
    <ng-template #menu>
        <div
            class="card-menu"
            cdkMenu
        >
            <div
                class="card-menu-option"
                cdkMenuItem
                (cdkMenuItemTriggered)="addGroup()"
                translate
            >
                Add group
            </div>
            <div
                class="card-menu-option"
                cdkMenuItem
                (cdkMenuItemTriggered)="deleteGroup()"
                translate
            >
                Delete group
            </div>
            <!-- eslint-disable-next-line nx/template/no-untranslated -->
            <div
                class="card-menu-option"
                cdkMenuItem
            >
                Another group menu option
            </div>
        </div>
    </ng-template>
</div>
