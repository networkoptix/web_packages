<div class="sub-container">
    <a
        (click)="toRoot()"
        translate
    >
        <svg-icon [src]="icons.dirTextButtons + 'arrow_right.svg'"></svg-icon>
        All Partners</a
    >
    <div class="name">
        <div class="pb-3">
            <h2>{{ (currentSubchannel$ | async).name }}</h2>
        </div>
        <div
            *ngIf="
                (currentSubchannel$ | async)?.effectiveState !== 'active' &&
                (currentSubchannel$ | async)?.effectiveState as state
            "
        >
            <nx-tag
                [type]="state === 'suspended' ? 'warning' : 'danger'"
                [size]="'large'"
                [locked]="true"
                [customClass]="'status'"
            >
                {{ state | translate | uppercase }}
            </nx-tag>
        </div>
    </div>
    <nx-tabs
        animated
        [currentTabIndex]="currentTabIndex$$()"
    >
        <nx-base-tab
            *ngFor="let tab of tabs"
            [displayName]="tab.displayName"
            (tabClick)="onTabClick($event)"
        >
            {{ tab.displayName }}
        </nx-base-tab>
    </nx-tabs>
    <router-outlet></router-outlet>
</div>
