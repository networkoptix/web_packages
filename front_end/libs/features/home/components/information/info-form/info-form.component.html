<div>
    <div *ngIf="!editMode; else itemForm">
        <div
            *ngFor="let item of data$$()"
            class="mb-1 d-flex flex-row"
        >
            <a
                *ngIf="linkPredicate; else nonLink"
                target="_blank"
                class="section-link"
                href="{{ linkPredicate + item.data.value }}"
                >{{ item.data.value }}</a
            >

            <span *ngIf="item.description?.value !== 'null'">
                <span class="mx-1">&dash;</span>
                <span class="section-descr">{{ item.description.value }}</span>
            </span>

            <ng-template #nonLink>
                <span class="section-link">{{ item.data.value }}</span>
            </ng-template>
        </div>
    </div>

    <ng-template #itemForm>
        <form
            [formGroup]="formGroup"
            [id]="formId"
            [name]="formId"
        >
            <div formArrayName="records">
                <div
                    class="form-group d-flex justify-between"
                    *ngFor="let row of records.controls; let i = index"
                    [formGroupName]="i"
                >
                    <div class="pr-3 w-100">
                        <label style="text-transform: capitalize">{{ linkCaption }}</label>
                        <input
                            class="form-control mr-1"
                            type="text"
                            formControlName="data"
                        />
                        <ng-container
                            *ngIf="
                                row.get('data').invalid &&
                                ((row.get('data').dirty && !row.get('data').errors?.pattern) ||
                                    row.get('data').touched)
                            "
                        >
                            <p
                                *ngIf="row.get('data').errors.required; else customError"
                                class="error-label mt-1 mb-0"
                                data-testid="linkRequiredError"
                                translate
                            >
                                Required
                            </p>
                            <ng-template #customError>
                                <p
                                    class="error-label mt-1 mb-0"
                                    data-testid="linkCustomError"
                                >
                                    {{ row.get('data').errors.msg }}
                                </p>
                            </ng-template>
                        </ng-container>
                    </div>
                    <div
                        class="pr-3 w-100"
                        *ngIf="row.get('description')?.value != 'null'"
                    >
                        <label style="text-transform: capitalize">{{ descrCaption }}</label>
                        <input
                            class="form-control mr-1"
                            type="text"
                            formControlName="description"
                        />
                    </div>
                    <div
                        class="clickable"
                        style="padding-top: 24px"
                        (click)="removeRecord(i)"
                    >
                        <svg-icon
                            nx-add-svg-src
                            [src]="icons.dir + 'delete.svg'"
                            [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                            [applyClass]="true"
                        ></svg-icon>
                    </div>
                </div>
            </div>
        </form>
    </ng-template>
</div>
