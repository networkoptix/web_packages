<div>
    <div *ngIf="!editMode; else itemForm">
        <div
            *ngFor="let item of data"
            class="mb-1 d-flex flex-column"
        >
            <a
                target="_blank"
                class="section-link"
                href="{{ linkPredicate + item.link.value }}"
                >{{ item.link.value }}</a
            >
            <span class="section-descr">{{ item.descr.value }}</span>
        </div>
    </div>

    <ng-template #itemForm>
        <form
            [formGroup]="form"
            [id]="formId"
            [name]="formId"
        >
            <div formArrayName="records">
                <div
                    class="form-group d-flex justify-between"
                    *ngFor="let row of records.controls; let i = index"
                    [formGroupName]="i"
                >
                    <div class="pr-3 w-100">
                        <label style="text-transform: capitalize">{{ linkCaption }}</label>
                        <input
                            class="form-control mr-1"
                            type="text"
                            name="link"
                            formControlName="link"
                        />
                        <ng-container
                            *ngIf="
                                row.get('link').invalid &&
                                ((row.get('link').dirty && !row.get('link').errors?.pattern) ||
                                    row.get('link').touched)
                            "
                        >
                            <p
                                *ngIf="row.get('link').errors.required; else customError"
                                class="error-label mt-2 mb-0"
                                data-testid="linkRequiredError"
                                translate
                            >
                                Required
                            </p>
                            <ng-template #customError>
                                <p
                                    class="error-label mt-2 mb-0"
                                    data-testid="linkCustomError"
                                >
                                    {{ row.get('link').errors.msg }}
                                </p>
                            </ng-template>
                        </ng-container>
                    </div>
                    <div class="pr-3 w-100">
                        <label translate>Description</label>
                        <input
                            class="form-control mr-1"
                            type="text"
                            formControlName="descr"
                        />
                    </div>
                    <div
                        class="clickable"
                        style="padding-top: 24px"
                        (click)="removeRecord(i)"
                    >
                        <svg-icon
                            nx-add-svg-src
                            [src]="icons.dir + 'delete.svg'"
                            [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                            [applyClass]="true"
                        ></svg-icon>
                    </div>
                </div>
            </div>
        </form>
    </ng-template>
</div>
