<div class="information">
    <nx-page-placeholder-v2
        *ngIf="!systems; else info"
        [type]="PAGE_PLACEHOLDER.NO_INFO"
    >
    </nx-page-placeholder-v2>
</div>

<ng-template #info>
    <div
        class="systems pane"
        *ngIf="systems"
    >
        <div class="base">
            <h4
                class="header"
                translate
            >
                Base parameters
            </h4>
            <div class="body">
                <div class="data-row">
                    <span translate>Count of systems</span>
                    <span>{{ systems.length }}</span>
                </div>
            </div>
        </div>
        <div class="additional">
            <h4
                class="header"
                translate
            >
                Additional Parameters
            </h4>
            <div class="body">
                <div class="data-row">
                    <span translate>Count of systems</span>
                    <span>{{ systems.length }}</span>
                </div>
            </div>
        </div>
    </div>
</ng-template>
