@if (currentState$$(); as state) {
    <div class="settings">
        <div class="settings-container">
            @if (state.item) {
                <nx-settings-general-v2
                    [inSubChannel]="subchannelSettings()"
                    [lockState]="!currentState$$().canUpdateStatus"
                    [currentName]="name$$()"
                    [permissions]="permissions$$()"
                    [currentState]="effectiveState$$()"
                >
                    @if (name$$() !== generalForm?.get('name').value) {
                        <ng-container processButtons>
                            <div class="row m-0">
                                <div class="footer pt-4 pl-2 pb-2">
                                    <nx-process-button
                                        [buttonDisabled]="!generalForm?.valid"
                                        [removeMinWidth]="true"
                                        [process]="updateCPProcess"
                                        [buttonText]="'Save' | translate"
                                    >
                                    </nx-process-button>
                                    <nx-cancel-button
                                        [process]="updateCPProcess"
                                        [discardFn]="resetGeneralUpdates"
                                    >
                                    </nx-cancel-button>
                                </div>
                            </div>
                        </ng-container>
                    }
                    @if (effectiveState$$() !== stateForm?.get('stateToggle').value) {
                        <ng-container stateProcessButtons>
                            <div class="row m-0">
                                <div class="footer pb-2 pl-2">
                                    <nx-process-button
                                        [process]="updateStateProcess"
                                        [buttonText]="'Save' | translate"
                                        [removeMinWidth]="true"
                                    >
                                    </nx-process-button>
                                    <nx-cancel-button
                                        [process]="updateStateProcess"
                                        [discardFn]="resetStateUpdates"
                                    >
                                    </nx-cancel-button>
                                </div>
                            </div>
                        </ng-container>
                    }
                </nx-settings-general-v2>
            }
        </div>
    </div>
}
