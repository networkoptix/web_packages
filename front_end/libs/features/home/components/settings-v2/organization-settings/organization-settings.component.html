@if (currentState$$(); as state) {
    <div class="settings">
        <div class="settings-container">
            @if (state.item) {
                <ng-container>
                    <nx-settings-general-v2
                        [currentName]="name$$()"
                        [permissions]="permissions$$()"
                        [canUpdateAccess]="canUpdateAccess$$()"
                        [channelPartnerAccessLevel]="accessLevel$$()"
                        [canChangeState]="permissionsStore.canChangeOrganizationState$$()"
                        [currState]="effectiveState$$()"
                        [settingsState]="currentState$$()"
                        (updateAccess)="handleAccessUpdate()"
                    >
                        @if (
                            name$$() !== generalForm?.get('name').value ||
                            accessLevel$$() !== generalForm?.get('accessLevel')?.value.value
                        ) {
                            <ng-container processButtons>
                                <div class="row m-0">
                                    <div class="footer pt-4 pl-2 pb-2">
                                        <nx-process-button
                                            [buttonDisabled]="!generalForm?.valid"
                                            [removeMinWidth]="true"
                                            [process]="updateOrgProcess"
                                            [buttonText]="'Save' | translate"
                                        >
                                        </nx-process-button>
                                        <nx-cancel-button
                                            [process]="updateOrgProcess"
                                            [discardFn]="resetGeneralUpdates"
                                        >
                                        </nx-cancel-button>
                                    </div>
                                </div>
                            </ng-container>
                        }
                        @if (effectiveState$$() !== stateForm?.get('stateToggle').value) {
                            <ng-container stateProcessButtons>
                                <div class="footer pb-2 pl-2">
                                    <nx-process-button
                                        [process]="updateStateProcess"
                                        [buttonText]="'Save' | translate"
                                        [removeMinWidth]="true"
                                    >
                                    </nx-process-button>
                                    <nx-cancel-button
                                        [process]="updateStateProcess"
                                        [discardFn]="resetStateUpdates"
                                    >
                                    </nx-cancel-button>
                                </div>
                            </ng-container>
                        }
                    </nx-settings-general-v2>
                </ng-container>
            }
        </div>
    </div>
}
