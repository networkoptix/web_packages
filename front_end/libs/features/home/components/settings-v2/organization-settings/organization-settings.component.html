@if (currentState$$(); as state) {
    <div class="settings">
        <div class="settings-container">
            @if (state.item) {
                <ng-container>
                    <nx-settings-general-v2
                        [currentName]="currentName$ | async"
                        [permissions]="permissions$$()"
                        (updateName)="onNameChange($event)"
                        [canUpdateAccess]="canUpdateAccess"
                        [channelPartnerAccessLevel]="currentPartnerAccess$ | async"
                        [canChangeState]="canChangeStateUI"
                        [currState]="effectState$$()"
                        [settingsState]="currentState$$()"
                        (updateState)="handleStateUpdate($event)"
                        (updateAccess)="handleAccessUpdate($event)"
                    >
                        @if (generalHasChange) {
                            <ng-container processButtons>
                                <div class="row m-0">
                                    <div class="footer pt-4 pl-2 pb-2">
                                        <nx-process-button
                                            [buttonDisabled]="
                                                !currentName$.getValue()?.length ||
                                                currentName$.getValue()?.length >
                                                    MAX_ORG_NAME_LENGTH
                                            "
                                            [removeMinWidth]="true"
                                            [process]="updateOrgProcess"
                                            [buttonText]="'Save' | translate"
                                        >
                                        </nx-process-button>
                                        <nx-cancel-button
                                            [process]="updateOrgProcess"
                                            [discardFn]="resetUpdates"
                                        >
                                        </nx-cancel-button>
                                    </div>
                                </div>
                            </ng-container>
                        }
                        @if (stateHasChange) {
                            <ng-container stateProcessButtons>
                                <div class="footer pb-2 pl-2">
                                    <nx-process-button
                                        [process]="updateStateProcess"
                                        [buttonText]="'Save' | translate"
                                        [removeMinWidth]="true"
                                    >
                                    </nx-process-button>
                                    <nx-cancel-button
                                        [process]="updateStateProcess"
                                        [discardFn]="resetUpdates"
                                    >
                                    </nx-cancel-button>
                                </div>
                            </ng-container>
                        }
                    </nx-settings-general-v2>
                </ng-container>
            }
        </div>
    </div>
}
