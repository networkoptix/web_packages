@if (canConfigureChannelPartner()) {
    <nx-block>
        <header>
            <h4
                class="h4"
                translate
            >
                General
            </h4>
        </header>
        <form
            class="block-content--form"
            [formGroup]="generalFormGroup"
            nxFormObserver
        >
            <nx-form-field>
                <label
                    id="partner-name-input"
                    nx-label
                    translate
                    >Name</label
                >
                <input
                    nx-input
                    formControlName="name"
                    id="partner-name-input"
                />
                <nx-control-messages [spacingLines]="0">
                    <nx-control-message
                        key="required"
                        [text]="'Name is required' | translate"
                    ></nx-control-message>
                </nx-control-messages>
            </nx-form-field>
            <nx-apply-v3 [action]="saveGeneralAction"></nx-apply-v3>
        </form>
    </nx-block>
}

@if (canChangePartnerState()) {
    <nx-state-setting-block
        [saveStateAction]="saveStateAction"
        [inheritedState]="inactiveParentPartner()"
        [state]="selectedState()"
        (onStateChange)="selectedState.set($event)"
    ></nx-state-setting-block>
}

@if (canDisconnectFromPartner()) {
    <nx-block>
        <header translate>Disconnect</header>
        <nx-section>
            <div class="disconnect-section">
                <div translate>
                    You can disconnect Partner from your account if access to Partner was granted
                    accidentally.
                </div>
                <button
                    class="nx-button--default"
                    translate
                    (click)="openDisconnectDialog()"
                >
                    Disconnect from my Account
                </button>
            </div>
        </nx-section>
    </nx-block>
}
