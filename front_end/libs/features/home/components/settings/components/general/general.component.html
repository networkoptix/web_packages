<nx-block>
    <header>
        <h4 translate>General</h4>
    </header>

    <nx-section>
        <div class="body">
            <form
                name="settingsGeneralForm"
                #settingsGeneralForm="ngForm"
            >
                <div class="input">
                    <label
                        for="name"
                        translate
                        >Name</label
                    >
                    <input
                        id="name"
                        class="form-control ml-2"
                        [disabled]="disableNameInput"
                        [(ngModel)]="name"
                        [name]="name"
                        (input)="updateName.emit(name)"
                    />
                </div>
                <div
                    class="input"
                    *ngIf="view === settingsViews.ORGANIZATIONS"
                >
                    <label
                        for="role"
                        translate
                        >Channel Partner Access</label
                    >
                    <nx-select
                        [componentId]="'channelPartnerAccessSelect'"
                        [items]="partnerAccess"
                        [selected]="currAccess"
                        (onSelected)="updateAccess.emit($event.value)"
                    ></nx-select>
                </div>
            </form>
        </div>
    </nx-section>
</nx-block>
