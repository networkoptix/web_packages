<div class="pane">
    <h4 translate>General</h4>
    <div class="body">
        <div class="input">
            <label
                for="name"
                translate
                >Name</label
            >
            <input
                id="name"
                [(ngModel)]="name"
                (input)="updateName.emit(name)"
            />
        </div>
        <div
            class="input"
            *ngIf="view === settingsViews.ORGANIZATIONS"
        >
            <label
                for="role"
                translate
                >Channel Partner Access</label
            >
            <nx-select
                [componentId]="'channelPartnerAccessSelect'"
                [items]="partnerAccess"
                [selected]="currAccess"
                (onSelected)="updateAccess.emit($event.value)"
            ></nx-select>
        </div>
    </div>
</div>
