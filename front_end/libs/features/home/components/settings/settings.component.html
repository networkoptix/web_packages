<ng-template
    #channelPartnersView
    let-state
>
    <ng-container *ngIf="state.item">
        <div class="row">
            <div class="col-8">
                <nx-settings-general
                    [view]="settingsViews.CHANNEL_PARTNERS"
                    [name]="currentName$ | async"
                    [disableNameInput]="!permissions$$().canConfigure"
                    (updateName)="handleNameUpdate($event)"
                ></nx-settings-general>
            </div>
        </div>
    </ng-container>
</ng-template>

<ng-template
    #extendedView
    let-state
>
    <ng-container *ngIf="state.item">
        <div class="row">
            <div class="col-8">
                <nx-settings-general
                    *ngIf="permissions$$().canConfigure"
                    [view]="state.view"
                    [name]="currentName$ | async"
                    [channelPartnerAccessLevel]="currentPartnerAccess$ | async"
                    [disableNameInput]="!permissions$$().canConfigure"
                    (updateName)="handleNameUpdate($event)"
                    (updateAccess)="handleAccessUpdate($event)"
                ></nx-settings-general>
            </div>
        </div>
        <div class="row">
            <div class="col-8">
                <nx-settings-state
                    *ngIf="canChangeStateUI && permissions$$().canAlterState"
                    (updateState)="handleStateUpdate($event)"
                    [currState]="currentState$ | async"
                    [canChange]="state.canUpdateStatus"
                ></nx-settings-state>
            </div>
        </div>
        <!-- <nx-settings-disconnect
            [organizationId]="currentOrg$$().id"
        ></nx-settings-disconnect> -->
    </ng-container>
</ng-template>

<div
    class="settings"
    *ngIf="currentState$$() as state"
>
    <div class="settings-container">
        <ng-container
            *ngTemplateOutlet="
                state.view === settingsViews.CHANNEL_PARTNERS ? channelPartnersView : extendedView;
                context: { $implicit: state }
            "
        >
        </ng-container>
    </div>
    <div
        class="footer"
        *ngIf="hasChange"
    >
        <nx-process-button
            [buttonDisabled]="
                !currentName$.getValue()?.length ||
                currentName$.getValue()?.length > MAX_ORG_NAME_LENGTH
            "
            [process]="updateStateProcess"
            [buttonText]="'Save' | translate"
        >
        </nx-process-button>
        <nx-cancel-button
            [process]="updateStateProcess"
            [discardFn]="resetUpdates"
        >
        </nx-cancel-button>
    </div>
</div>
