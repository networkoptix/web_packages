<ng-template
    #channelPartnersView
    let-state
>
    <ng-container *ngIf="state.item">
        <nx-settings-general
            [view]="settingsViews.CHANNEL_PARTNERS"
            [item]="state.item"
            (updateName)="handleNameUpdate($event)"
        ></nx-settings-general>
    </ng-container>
</ng-template>

<ng-template
    #extendedView
    let-state
>
    <ng-container *ngIf="state.item">
        <nx-settings-general
            [view]="state.view"
            [item]="state.item"
            (updateName)="handleNameUpdate($event)"
            (updateAccess)="handleAccessUpdate($event)"
        ></nx-settings-general>
        <nx-settings-state
            (updateState)="handleStateUpdate($event)"
            [currState]="state.item.state"
            [canChange]="state.canUpdateStatus"
        ></nx-settings-state>
    </ng-container>
</ng-template>

<div
    class="settings"
    *ngIf="currentState$$() as state"
>
    <ng-container
        *ngTemplateOutlet="
            state.view === settingsViews.CHANNEL_PARTNERS ? channelPartnersView : extendedView;
            context: { $implicit: state }
        "
    >
    </ng-container>
    <div
        class="footer"
        *ngIf="hasChange"
    >
        <nx-process-button
            [process]="updateStateProcess"
            [buttonText]="'Save' | translate"
        >
        </nx-process-button>
        <nx-cancel-button [process]="updateStateProcess"> </nx-cancel-button>
    </div>
</div>
