<ng-template
    #channelPartnersView
    let-state
>
    <nx-settings-general
        [view]="settingsViews.CHANNEL_PARTNERS"
        [item]="state.item"
        (updateName)="handleUpdate(updatedName, $event)"
    ></nx-settings-general>
</ng-template>

<ng-template
    #extendedView
    let-state
>
    <nx-settings-general
        [view]="state.view"
        [item]="state.item"
        (updateName)="handleUpdate(updatedName, $event)"
        (updateAccess)="handleUpdate(updatedPartnerAccess, $event)"
    ></nx-settings-general>
    <nx-settings-state
        (updateState)="handleUpdate(updatedState, $event)"
        [currState]="State.Active"
        [canChange]="state.canUpdateStatus"
    ></nx-settings-state>
</ng-template>

<div
    class="settings"
    *ngIf="currentState$$() as state"
>
    <ng-container
        *ngTemplateOutlet="
            state.view === settingsViews.CHANNEL_PARTNERS ? channelPartnersView : extendedView;
            context: { $implicit: state }
        "
    >
    </ng-container>
    <div
        class="footer"
        *ngIf="hasUpdate"
    >
        <nx-process-button
            [process]="updateStateProcess"
            [buttonText]="'Save' | translate"
        >
        </nx-process-button>
        <nx-cancel-button [process]="updateStateProcess"> </nx-cancel-button>
    </div>
</div>
