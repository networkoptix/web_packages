<!-- Issue with "Unable to preventDefault inside passive event listener invocation." caused by monitoring? -->
<!-- https://github.com/angular/components/issues/24979#issuecomment-1203583528 -->
<div class="actions p-3">
    <button
        [disabled]="!isAdmin"
        class="btn btn-default"
        translate
        (click)="newGroupDialog()"
    >
        New Group
    </button>
    <div class="input px-2">
        <span class="glyphicon web-icon-search icon-search"></span>
        <input
            class="pl-2"
            [placeholder]="'Search' | translate"
        />
    </div>
</div>
<div
    *ngIf="!currentGroups$$()?.length && !currentSystems$$()?.length; else showGroups"
    class="no-systems"
>
    <nx-no-systems-cards></nx-no-systems-cards>
</div>

<ng-template
    #showGroups
    let-groups="groups"
    let-systems="systems"
>
    <div class="px-3 cards-container">
        <div
            *ngFor="let group of currentGroups$$(); trackBy: trackItem"
            class="group-card"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="group"
            (cdkDropListDropped)="onDrop($event)"
        >
            <div
                class="card-container"
                cdkDrag
                [cdkDragData]="group"
            >
                <div *cdkDragPlaceholder></div>
                <nx-group-card
                    [group]="group"
                    [currentOrgId]="currentOrgId$$()"
                ></nx-group-card>
            </div>
            <div class="placeholder-shadow"></div>
        </div>
        <div
            *ngFor="let system of inRoot ? [] : currentSystems$$(); trackBy: trackItem"
            class="system-card"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="system"
        >
            <div
                cdkDrag
                [cdkDragData]="system"
            >
                <div *cdkDragPlaceholder></div>
                <nx-system-card
                    [system]="system"
                    [search]="''"
                    [account]="account$$()"
                ></nx-system-card>
            </div>
            <div class="placeholder-shadow"></div>
        </div>
    </div>
</ng-template>
