<ul
    *ngIf="openGroups"
    [ngClass]="{
        'closed-level': groupId ? !openGroups[groupId] : false
    }"
>
    <li *ngIf="rootOrg; else level">
        <div
            class="group-drop-list"
            [ngClass]="{ selected: !this.currentGroupId$$() }"
            cdkDropList
            (cdkDropListDropped)="moveToRoot($event)"
        >
            <svg-icon
                (click)="toggleOpenState(rootOrg.id)"
                nx-add-svg-src
                [src]="
                    icons.dirTextButtons +
                    (openGroups[rootOrg.id] ? 'arrow_down.svg' : 'arrow_right.svg')
                "
                [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
                svgClass="triangle"
            ></svg-icon>
            <svg-icon
                nx-add-svg-src
                [src]="icons.dir + 'organization.svg'"
                [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
            ></svg-icon>
            <div class="group">
                <a
                    (click)="toRoot()"
                    class="level-name"
                    [nxTooltip]="rootOrg.name"
                    >{{ rootOrg.name }}</a
                >
            </div>
        </div>
        <nx-sidebar-level
            [groups]="groups"
            [groupId]="rootOrg.id"
            [openGroups]="openGroups"
        ></nx-sidebar-level>
    </li>
    <ng-template #level>
        <li *ngFor="let group of groups; trackBy: trackItem">
            <div
                class="group-drop-list"
                [ngClass]="{
                    selected: currentGroupId$$() === group.id,
                    'no-nested-groups': !group.children.length
                }"
                cdkDropList
                cdkDropListSortingDisabled
                [cdkDropListData]="group"
                (cdkDropListDropped)="onDrop($event)"
            >
                <svg-icon
                    (click)="toggleOpenState(group.id)"
                    *ngIf="group.children.length; else spacer"
                    nx-add-svg-src
                    [src]="
                        icons.dirTextButtons +
                        (openGroups[group.id] ? 'arrow_down.svg' : 'arrow_right.svg')
                    "
                    [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
                    svgClass="triangle"
                ></svg-icon>
                <ng-template #spacer>
                    <span class="spacer"></span>
                </ng-template>
                <svg-icon
                    nx-add-svg-src
                    [src]="
                        icons.dir +
                        (openGroups[group.id] ? 'ws_folder_open.svg' : 'ws_folder_close.svg')
                    "
                    [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
                    svgClass="folder"
                ></svg-icon>
                <div
                    (click)="toggleOpenState(group.id)"
                    cdkDrag
                    [cdkDragDisabled]="!canManageSystems$$()"
                    [cdkDragData]="group"
                    cdkDragBoundary=".sidebar"
                    class="group"
                >
                    <span *cdkDragPlaceholder></span>
                    <a
                        (click)="toGroup(group.id)"
                        class="level-name"
                        [nxTooltip]="group.name"
                        >{{ group.name }}</a
                    >
                </div>
            </div>
            <nx-sidebar-level
                *ngIf="group.children.length"
                [groups]="group.children"
                [groupId]="group.id"
                [openGroups]="openGroups"
            ></nx-sidebar-level>
        </li>
    </ng-template>
</ul>
