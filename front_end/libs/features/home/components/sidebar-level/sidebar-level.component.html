<h3
    *ngIf="userLevel"
    class="user-level"
>
    <svg-icon
        (click)="toggleOpenState(userLevel)"
        nx-add-svg-src
        [src]="icons.dir + (openGroups[userLevel] ? 'triangle_opened.svg' : 'triangle_closed.svg')"
        [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
        svgClass="triangle"
    ></svg-icon>
    <svg-icon
        nx-add-svg-src
        [src]="icons.dir + 'user.svg'"
        [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
    ></svg-icon>
    <a (click)="selectUserFilter(userLevel)"> {{ userLevel }} </a>
</h3>
<ul
    [ngClass]="{
        'closed-level': userLevel ? !openGroups[userLevel] : groupId ? !openGroups[groupId] : false
    }"
>
    <li *ngFor="let group of groups; trackBy: trackItem">
        <div
            class="group-drop-list"
            [ngClass]="{
                selected: (currentGroupId$ | async) === group.id,
                'no-nested-groups': !group.groups.length
            }"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="group"
            (cdkDropListDropped)="onDrop($event)"
        >
            <ng-container *ngIf="!group.parent_group_id; else groupIcons">
                <svg-icon
                    nx-add-svg-src
                    [src]="icons.dir + 'organization.svg'"
                    [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
                ></svg-icon>
            </ng-container>
            <ng-template #groupIcons>
                <svg-icon
                    (click)="toggleOpenState(group.id)"
                    *ngIf="group.groups.length"
                    nx-add-svg-src
                    [src]="
                        icons.dirTextButtons +
                        (openGroups[group.id] ? 'arrow_right.svg' : 'arrow_down.svg')
                    "
                    [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
                    svgClass="triangle"
                ></svg-icon>
                <svg-icon
                    nx-add-svg-src
                    [src]="
                        icons.dir +
                        (openGroups[group.id] ? 'ws_folder_open.svg' : 'ws_folder_close.svg')
                    "
                    [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
                    svgClass="folder"
                ></svg-icon>
            </ng-template>
            <div
                (click)="toggleOpenState(group.id)"
                cdkDrag
                [cdkDragData]="group"
                cdkDragBoundary=".sidebar"
                class="group"
            >
                <span *cdkDragPlaceholder></span>
                <a
                    (click)="toGroup(group.id)"
                    class="level-name"
                    [nxTooltip]="group.name"
                    >{{ group.name }}</a
                >
            </div>
        </div>
        <nx-sidebar-level
            *ngIf="group.groups.length"
            [groups]="group.groups"
            [groupId]="group.id"
            [openGroups]="openGroups"
        ></nx-sidebar-level>
    </li>
</ul>
