<div
    class="channel-partner"
    *ngIf="routeData$ | async as routeData"
    [ngClass]="{ root: !routeData.parentData.inOrganization && !routeData.parentData.inSubchannel }"
>
    <ng-container
        *ngIf="
            !routeData.parentData.inOrganization && !routeData.parentData.inSubchannel;
            else outlet
        "
    >
        <div
            class="header pb-3"
            *ngIf="currentPartner$$() as currentPartner"
        >
            <h2>{{ currentPartner.name }}</h2>
            <nx-tag
                *ngIf="currentPartner.effectiveState !== 'active'"
                [type]="currentPartner.effectiveState === 'suspended' ? 'warning' : 'danger'"
                size="large"
                [locked]="true"
                [customClass]="
                    'status' + (currentPartner.effectiveState === 'suspended' ? ' dark-text' : '')
                "
            >
                {{ currentPartner.effectiveState | translate | uppercase }}
            </nx-tag>
        </div>
        <nx-tabs
            animated
            [currentTabIndex]="currentTabIndex$$()"
        >
            <nx-base-tab
                *ngFor="let tab of tabs$$()"
                [displayName]="tab.displayName"
                (tabClick)="onTabClick($event)"
            >
                {{ tab.displayName }}
            </nx-base-tab>
        </nx-tabs>
        <ng-container *ngIf="showOrganizations; else tabOutlet">
            <div class="actions p-3">
                <button
                    *ngIf="canCreateOrganizations$$() && (organizations$ | async)?.length > 0"
                    class="btn btn-default"
                    translate
                    (click)="newOrgDialog()"
                >
                    New Organization
                </button>
                <nx-search
                    *ngIf="
                        (organizations$ | async).length >
                        searchConfig.channelPartners.searchMinimumCards
                    "
                    class="input-overlay"
                    [style.width.px]="searchConfig.channelPartners.searchWidth"
                    [ngModel]="search"
                    (ngModelChange)="setSearch($event)"
                    layout="compact"
                    [placeholder]="'Search' | translate"
                    instant
                ></nx-search>
            </div>
            <nx-pre-loader *ngIf="isLoading$$(); else cards"></nx-pre-loader>
            <ng-template #cards>
                <ng-container *ngIf="(filteredOrganizations$ | async)?.length > 0; else noOrgs">
                    <div class="px-3 cards-container">
                        <ng-container *ngFor="let organization of filteredOrganizations$ | async">
                            <nx-card
                                class="card-content"
                                (click)="handleOrgClick(organization.id)"
                                [icon]="icons.dir + 'organization.svg'"
                                [svgStyle]="{ 'height.px': '64', 'width.px': '54' }"
                            >
                                <h3>{{ organization.name }}</h3>
                                <div>{{ organization.systemCount }}</div>
                            </nx-card>
                        </ng-container>
                    </div>
                </ng-container>
                <ng-template #noOrgs>
                    <ng-container *ngIf="search.value; else addOrg">
                        <div class="no-orgs-placeholder">
                            <svg-icon
                                nx-add-svg-src
                                [svgStyle]="{
                                    'width.px': '64',
                                    'height.px': '64'
                                }"
                                [src]="icons.dirPageV2Placeholder + 'not_found.svg'"
                            ></svg-icon>
                            <h3 translate>No Results</h3>
                            <p translate>Try changing the search string</p>
                        </div>
                    </ng-container>
                    <ng-template #addOrg>
                        <div class="no-orgs-placeholder">
                            <svg-icon
                                nx-add-svg-src
                                [svgStyle]="{
                                    'width.px': '64',
                                    'height.px': '64'
                                }"
                                [src]="icons.dirPageV2Placeholder + 'no_organizations.svg'"
                            ></svg-icon>
                            <h3 translate>No Organizations</h3>
                            <p translate>You have not yet created any organizations</p>
                            <button
                                *ngIf="canCreateOrganizations$$()"
                                class="btn btn-primary new-org-btn"
                                translate
                                (click)="newOrgDialog()"
                            >
                                New Organization
                            </button>
                        </div>
                    </ng-template>
                </ng-template>
            </ng-template>
        </ng-container>
        <ng-template #tabOutlet>
            <router-outlet></router-outlet>
        </ng-template>
    </ng-container>

    <ng-template #outlet>
        <nx-pre-loader *ngIf="isLoading$$(); else router"></nx-pre-loader>
        <ng-template #router>
            <router-outlet></router-outlet>
        </ng-template>
    </ng-template>
</div>
