<div
    class="channel-partner"
    [ngClass]="{ root: !inOrganization }"
    *ngIf="loadingState$ | async as loadingState"
>
    <ng-container *ngIf="!inOrganization; else outlet">
        <div class="header pb-3">
            <h2 translate>Channel Partners</h2>
        </div>
        <nx-tabs
            [onLoadTab]="currentTab"
            (tabClick)="onTabClick($event)"
        >
            <ng-container *ngFor="let tab of tabs">
                <div *tab="tab"></div>
            </ng-container>
        </nx-tabs>
        <ng-container *ngIf="!currentTab.route; else tabOutlet">
            <div class="actions p-3">
                <button
                    [disabled]="isAdmin"
                    class="btn btn-default"
                    translate
                    (click)="newOrgDialog()"
                >
                    New Organization
                </button>
                <div class="input px-2">
                    <span class="glyphicon web-icon-search icon-search"></span>
                    <input
                        class="pl-2"
                        [placeholder]="'Search' | translate"
                    />
                </div>
            </div>
            <nx-pre-loader
                *ngIf="loadingState === LoadingState.LOADING; else cards"
            ></nx-pre-loader>
            <ng-template #cards>
                <div class="px-3 cards-container">
                    <ng-container *ngFor="let organization of channelPartners$ | async">
                        <div
                            class="system-button card-condensed system-card"
                            (click)="handleOrgClick(organization.id)"
                        >
                            <div class="card-body">
                                <img [src]="organization.icon" />
                                <div class="bottom">
                                    <h3>{{ organization.orgName }}</h3>
                                    <div class="status px-2 mt-1">
                                        {{ organization.status }}
                                    </div>
                                </div>
                            </div>
                            <div
                                class="three-dots"
                                [cdkMenuTriggerFor]="menu"
                            >
                                <div class="dot"></div>
                                <div class="dot"></div>
                                <div class="dot"></div>
                            </div>
                            <ng-template #menu>
                                <div class="card-menu"></div>
                            </ng-template>
                        </div>
                    </ng-container>
                </div>
            </ng-template>
        </ng-container>
        <ng-template #tabOutlet>
            <router-outlet></router-outlet>
        </ng-template>
    </ng-container>

    <ng-template
        #outlet
        [ngSwitch]="loadingState"
    >
        <nx-pre-loader *ngSwitchCase="LoadingState.LOADING"></nx-pre-loader>
        <ng-container *ngSwitchCase="LoadingState.LOADED">
            <router-outlet></router-outlet>
        </ng-container>
        <ng-container
            *ngSwitchDefault
            translate
        >
            No organizations found</ng-container
        >
    </ng-template>
</div>
