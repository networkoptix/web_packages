<div
    class="channel-partner"
    *ngIf="routeData$ | async as routeData"
    [ngClass]="{ root: !routeData.parentData.inOrganization && !routeData.parentData.inSubchannel }"
>
    <ng-container
        *ngIf="
            !routeData.parentData.inOrganization && !routeData.parentData.inSubchannel;
            else outlet
        "
    >
        <div
            class="header pb-3"
            *ngIf="currentPartner$ | async as currentPartner"
        >
            <h2>{{ currentPartner.name }}</h2>
        </div>
        <nx-tabs
            [onLoadTab]="currentTab"
            (tabClick)="onTabClick($event)"
        >
            <ng-container *ngFor="let tab of tabs">
                <div *tab="tab"></div>
            </ng-container>
        </nx-tabs>
        <ng-container *ngIf="!currentTab.route; else tabOutlet">
            <div class="actions p-3">
                <button
                    *ngIf="isAdmin"
                    class="btn btn-default"
                    translate
                    (click)="newOrgDialog()"
                >
                    New Organization
                </button>
                <div class="input px-2">
                    <span class="glyphicon web-icon-search icon-search"></span>
                    <input
                        class="pl-2"
                        [placeholder]="'Search' | translate"
                    />
                </div>
            </div>
            <nx-pre-loader *ngIf="isLoading; else cards"></nx-pre-loader>
            <ng-template #cards>
                <div class="px-3 cards-container">
                    <ng-container *ngFor="let organization of organizations$ | async">
                        <div
                            class="system-button card-condensed system-card"
                            (click)="handleOrgClick(organization.id)"
                        >
                            <div class="card-body">
                                <img [src]="defaultImage" />
                                <div class="bottom">
                                    <h3>{{ organization.name }}</h3>
                                    <div class="status px-2 mt-1">
                                        {{ organization.effectiveState | translate }}
                                    </div>
                                </div>
                            </div>
                            <div
                                class="three-dots"
                                [cdkMenuTriggerFor]="menu"
                            >
                                <div class="dot"></div>
                                <div class="dot"></div>
                                <div class="dot"></div>
                            </div>
                            <ng-template #menu>
                                <div class="card-menu"></div>
                            </ng-template>
                        </div>
                    </ng-container>
                </div>
            </ng-template>
        </ng-container>
        <ng-template #tabOutlet>
            <router-outlet></router-outlet>
        </ng-template>
    </ng-container>

    <ng-template #outlet>
        <nx-pre-loader *ngIf="isLoading; else router"></nx-pre-loader>
        <ng-template #router>
            <router-outlet></router-outlet>
        </ng-template>
    </ng-template>
</div>
