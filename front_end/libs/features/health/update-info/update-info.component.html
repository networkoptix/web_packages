<div>
    <a
        class="anchor btn-text pl-1"
        href
        (click)="updateHealth.emit(true); (false)"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirTextButtons + 'reload.svg'"
            [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
            title="Reload"
        ></svg-icon>
        <span>{{ '{time} min ago' | translate: { time: lastUpdate } }}</span>
    </a>
</div>
