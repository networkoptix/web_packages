<div [ngSwitch]="healthService.alertsValues ? healthService.alertsValues.length : 0">
    <nx-page-generic-placeholder
        class="placeholder"
        *ngSwitchCase="0"
    >
        <svg-icon
            [src]="icons.dirPagePlaceholder + 'NoActions.svg'"
            [svgStyle]="{ 'height.px': 200 }"
        />
        <h2
            class="title"
            translate
        >
            No Alerts
        </h2>
        <div
            class="message"
            translate
        >
            Your system must be doing well!
        </div>
    </nx-page-generic-placeholder>

    <div *ngSwitchDefault>
        <div
            class="gridAlertsCards"
            *ngIf="!healthLayoutService.mobileDetailMode"
            #tiles
        >
            <div class="d-flex flex-wrap p-0">
                <div
                    *ngFor="let alert of alertCards; trackBy: trackItem"
                    class="mb-3 mr-3 card-container"
                >
                    <nx-system-alert-card-component [data]="alert"></nx-system-alert-card-component>
                </div>
                <ng-container *ngIf="alertCardCount % 2">
                    <div class="mb-3 mr-3 card-container"></div>
                </ng-container>
            </div>
            <hr class="nx-hr--bottom-margin" />
        </div>

        <div
            class="gridMetricContent"
            #area
            [ngClass]="fixedLayoutClass"
        >
            <div
                class="gridMetricContentComponent"
                [hidden]="healthLayoutService.mobileDetailMode && healthLayoutService.activeEntity"
            >
                <div class="gridMetricContentComponentWrapper">
                    <div
                        [hidden]="healthLayoutService.mobileDetailMode"
                        [ngClass]="{ 'data-wrapper': !healthLayoutService.activeEntity }"
                    >
                        <div
                            *ngIf="!healthLayoutService.mobileDetailMode"
                            #search
                        >
                            <nx-search
                                name="filterModel"
                                [ngModel]="filterModel"
                                (ngModelChange)="modelChanged($event)"
                                layout="selectors"
                                [layoutMod]="smallDesktopMode ? true : false"
                                ngDefaultControl
                            >
                            </nx-search>
                        </div>
                        <nx-dynamic-table
                            [tableHeader]="LANG.alertsCount | translate: { count: alertsCount }"
                            [headers]="tableHeaders"
                            [showGroups]="false"
                            [elements]="alerts"
                            (onRowClick)="setActiveEntity($event)"
                        >
                        </nx-dynamic-table>
                    </div>
                </div>
            </div>

            <div
                class="gridMetricContentPanelComponent"
                *ngIf="layoutReady"
                [style.visibility]="healthService.tableReady && layoutReady ? undefined : 'hidden'"
            >
                <div class="gridMetricContentPanelComponentWrapper pb-3">
                    <div
                        class="mb-3 all-results-btn"
                        [style.display]="!healthLayoutService.mobileDetailMode ? 'none' : 'block'"
                    >
                        <button
                            class="btn btn-default btn-back"
                            (click)="resetActiveEntity()"
                        >
                            <svg-icon
                                nx-add-svg-src
                                [src]="icons.dir + 'arrow_back.svg'"
                                [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                            ></svg-icon>
                            <span translate>All results</span>
                        </button>
                    </div>

                    <nx-dynamic-table-panel-component
                        [panelParams]="activePanelParams"
                        (onCloseView)="resetActiveEntity()"
                    >
                    </nx-dynamic-table-panel-component>
                </div>
            </div>
        </div>
    </div>
</div>
