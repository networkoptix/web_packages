<div class="card card-default">
    <div class="card-body flex-md">
        <div class="col-md-8 order-1 order-md-1 p-0">
            <div class="clearfix">
                <p
                    class="paragraph mobile-os"
                    translate
                >
                    Choose your mobile OS:
                </p>
                @for (platform of CONFIG.downloads.mobile; track platform.name) {
                    <div class="mobile-badge">
                        @if (LANG.downloads.mobile[platform.name].link !== 'disabled') {
                            <a
                                class="anchor mobile-link"
                                [ngClass]="platform.os"
                                [href]="LANG.downloads.mobile[platform.name].link | translate"
                            >
                            </a>
                        }
                    </div>
                }
            </div>
        </div>
    </div>
</div>
