<div class="block-container">
    <div class="d-flex">
        <div
            class="menu-container"
            [ngStyle]="{ height: 'calc(100% - (' + headerHeight + 'px + 16px))' }"
        >
            <nx-menu
                [content]="content"
                [autoFit]="true"
            ></nx-menu>
        </div>

        <div class="content">
            <router-outlet></router-outlet>
            <nx-footer></nx-footer>
        </div>
    </div>
</div>
