<button
    class="arrow-btn arrow-btn--decrement"
    data-escape-global-style
    cdkOverlayOrigin
    #origin="cdkOverlayOrigin"
    (click)="decrement()"
>
    <svg-icon [src]="icons.dirTextButtons + 'arrow_expand.svg'"></svg-icon>
</button>
<button
    class="menu-trigger-btn"
    data-escape-global-style
    (click)="toggleMenu()"
>
    {{ display() }}
</button>
<button
    class="arrow-btn arrow-btn--increment"
    data-escape-global-style
    (click)="increment()"
>
    <svg-icon [src]="icons.dirTextButtons + 'arrow_expand.svg'"></svg-icon>
</button>
<ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="isMenuOpen()"
    (overlayOutsideClick)="onOutsideClick($event)"
>
    <div class="month-menu">
        @for (month of longMonths; track $index) {
            <button
                class="month-menu-item"
                data-escape-global-style
                [class]="{ 'is-selected': $index === monthIndex() }"
                (click)="monthIndex.set($index); isMenuOpen.set(false)"
            >
                {{ month }}
            </button>
        }
    </div>
</ng-template>
