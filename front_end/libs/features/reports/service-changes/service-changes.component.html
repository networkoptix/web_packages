<nx-reports-header
    [heading]="LANG.channelPartnerReports.serviceChanges"
    [selectedEntityName]="selectedEntityName$$()"
    [monthIndex]="monthIndex()"
    [year]="year()"
    [initExport]="initExport"
    (onMonthIndexChange)="monthIndex.set($event)"
    (onYearChange)="year.set($event)"
></nx-reports-header>
<div class="service-changes-table-wrapper">
    @if (serviceChangesStore.isLoading()) {
        <nx-pre-loader></nx-pre-loader>
    } @else if (serviceChangesStore.errorMessage()) {
        <p>{{ serviceChangesStore.errorMessage() }}</p>
    } @else if (
        formattedPartnerServiceChangeRecords$$().length ||
        formattedOrgServiceChangeRecords$$().length
    ) {
        <div>
            <nx-service-changes-table
                [entityType]="entityType$$()"
                [partnerRecords]="formattedPartnerServiceChangeRecords$$()"
                [orgRecords]="formattedOrgServiceChangeRecords$$()"
                (onPageChange)="handlePageChange($event)"
            ></nx-service-changes-table>
        </div>
    } @else {
        <nx-page-placeholder-no-reports></nx-page-placeholder-no-reports>
    }
</div>
