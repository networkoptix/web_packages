<nx-table
    ngClass="service-changes-table"
    set-pagination
    set-sorting
    [set-row-expand]="false"
    [set-selected-item-id]="selectedRecordId"
    [data]="records$$()"
    (onPageChange)="handlePageChange($event)"
>
    <ng-template #header>
        @for (head of headers; track head.name) {
            <div
                class="table-header"
                [style.justify-content]="head.align || 'flex-end'"
            >
                <span>{{ head.value | translate }}</span>
            </div>
        }
    </ng-template>
    <ng-template
        #rows
        let-row
    >
        <div>
            {{ row.serviceName }}
        </div>
        <div class="align-right">
            <nx-quantity-change [number]="row.amount"></nx-quantity-change>
        </div>
        <div>
            @if (isPartnerTable$$()) {
                {{ row.changedAtName }}
            } @else {
                <nx-group-path [groupPath]="row.changedAtPath" />
            }
        </div>
        <div class="align-right">
            {{ row.date }}
        </div>
    </ng-template>
</nx-table>
