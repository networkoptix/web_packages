<nx-table
    ngClass="service-usage-details-table"
    [style.height]="'calc(100% - 12px)'"
    set-pagination
    set-sorting
    set-rows-auto
    [set-row-expand]="false"
    [set-selected-item-id]="selectedRecordId"
    [data]="records()"
    (onRowClick)="openDetailsDialog($event)"
>
    <ng-template #header>
        @for (head of headers; track head.name) {
            <div
                class="table-header"
                [attr.id]="head.name"
                [style.justify-content]="head.align || 'flex-end'"
            >
                <span>{{ head.value }}</span>
                @if (head.tooltip) {
                    <span class="hint-icon">
                        <nx-hint [tooltipText]="head.tooltip | translate"></nx-hint
                    ></span>
                }
            </div>
        }
    </ng-template>
    <ng-template
        #rows
        let-row
    >
        <div>
            {{ row.usedBy }}
        </div>
        <div class="align-right">
            {{ row.changed }}
        </div>
        <div class="align-right">
            {{ row.channels }}
        </div>
        <div class="align-right">
            {{ row.monthlyRate }}
        </div>
        <div class="align-right">
            {{ row.fractionalUsage }}
        </div>
    </ng-template>
    <ng-template #summaryRow
        ><div></div>
        <div class="align-right"></div>
        <div class="align-right">{{ totals().channels }}</div>
        <div class="align-right">{{ totals().monthlyRate }}</div>
        <div class="align-right">{{ totals().fractionalUsage }}</div></ng-template
    >
</nx-table>
