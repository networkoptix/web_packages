<nx-table
    ngClass="service-usage-details-table"
    [style.height]="'calc(100% - 12px)'"
    set-pagination
    set-sorting
    set-rows-auto
    [set-row-expand]="false"
    [set-selected-item-id]="selectedRecordId"
    [data]="records()"
    (onRowClick)="openDetailsDialog($event)"
>
    <ng-template #header>
        @for (head of headers; track head.name) {
            <div
                [attr.id]="head.name"
                [style.justify-content]="head.align || 'flex-start'"
            >
                <span
                    class="head-title"
                    title="{{ head.value }}"
                    >{{ head.value }}</span
                >
            </div>
        }
    </ng-template>
    <ng-template
        #rows
        let-row
    >
        <div>
            {{ row.usedBy }}
        </div>
        <div>
            {{ row.changed }}
        </div>
        <div>
            {{ row.activeChannels }}
        </div>
        <div>
            {{ row.monthlyRate }}
        </div>
        <div>
            {{ row.fractionalUsage }}
        </div>
    </ng-template>
</nx-table>
