<div
    class="go-back"
    (click)="goBack()"
>
    <svg-icon
        class="left-arrow-icon"
        nx-add-svg-src
        [src]="icons.dirTextButtons + 'arrow_left.svg'"
        [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
    ></svg-icon>
    <span translate>All Services</span>
</div>
<nx-reports-header
    [heading]="regularServiceDetailsStore.selectedService()?.displayName"
    [selectedEntityName]="selectedEntityName$$()"
    [monthIndex]="monthIndex()"
    [year]="year()"
    (onMonthIndexChange)="monthIndex.set($event)"
    (onYearChange)="year.set($event)"
></nx-reports-header>
@if (regularServiceDetailsStore.isLoading()) {
    <nx-pre-loader></nx-pre-loader>
} @else {
    <div class="service-details-table-wrapper">
        @if (formattedPartnerRecords$$().length || formattedOrgRecords$$().length) {
            <nx-regular-service-table
                [partnerRecords]="formattedPartnerRecords$$()"
                [orgRecords]="formattedOrgRecords$$()"
                [totals]="regularServiceTotals$$()"
                [serviceId]="serviceId$$()"
                [entityId]="entityId$$()"
                [isPartnerTable]="isPartner$$()"
                [startTs]="startTs()"
            ></nx-regular-service-table>
        } @else {
            <nx-page-placeholder-no-reports></nx-page-placeholder-no-reports>
        }
    </div>
}
