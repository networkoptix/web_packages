<div class="nx-reports-sidebar">
    <nx-searchable-select
        class="fs-mask org-dropdown"
        [items]="dropdownItems$$()"
        [ngModel]="selectedItem$$()"
        (ngModelChange)="selectItem($event)"
        [selected]="selectedItem$$()"
        [noMatchMsg]="'No options' | translate"
        [ngModelOptions]="{ standalone: true }"
        [placeholder]="'Select a partner or org' | translate"
    ></nx-searchable-select>
</div>
<router-outlet></router-outlet>
