<div class="nx-reports-sidebar">
    <nx-autocomplete-v2
        class="fs-mask w-100 mx-2"
        [(ngModel)]="search"
        (select)="selectItem($event)"
        [noMatchesContent]="'No options'"
        [placeholder]="'Select a partner or org'"
    >
        @for (item of dropdownItems$$(); track $index) {
            <nx-autocomplete-item
                [name]="item.name"
                [value]="item"
                >{{ item.name }}</nx-autocomplete-item
            >
        }
    </nx-autocomplete-v2>
</div>
<router-outlet></router-outlet>
