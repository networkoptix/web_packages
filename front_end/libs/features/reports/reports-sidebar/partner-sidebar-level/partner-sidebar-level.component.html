<div
    class="partner-level"
    [ngClass]="{
        'is-subchannel': isSubChannel$$(),
        'is-selected': isSelected$$()
    }"
>
    <svg-icon
        (click)="toggleOpen(partnerStructure$$().id)"
        nx-add-svg-src
        [src]="icons.dirTextButtons + 'arrow_close.svg'"
        [svgStyle]="{
            'width.px': '20',
            'height.px': '20',
            transform: isOpen$$() ? 'rotate(90deg)' : 'rotate(0deg)'
        }"
        class="open-toggle"
        [ngStyle]="{ visibility: isOpenIconVisible$$() ? 'visible' : 'hidden' }"
    ></svg-icon>
    <svg-icon
        nx-add-svg-src
        [src]="icons.dir + 'partner_small.svg'"
        [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
        class="partner-icon"
    ></svg-icon>
    <a
        class="anchor"
        [routerLink]="routerLink$$()"
        [queryParams]="{ page: 1 }"
        queryParamsHandling="merge"
        (click)="openPartner($event)"
        [ngClass]="{
            'is-selected': isSelected$$()
        }"
        ><nx-search-highlight
            [text]="partnerStructure$$().name"
            [search]="highlightRegex$$()"
        ></nx-search-highlight
    ></a>
</div>
@if (isOpen$$()) {
    <div class="children">
        @for (subChannel of partnerStructure$$().subChannels; track subChannel.id) {
            <nx-partner-sidebar-level
                [parentMap]="parentMap$$()"
                [partnerStructure]="subChannel"
                [openLevels]="openLevels$$()"
                [selectedEntityId]="selectedEntityId$$()"
                [search]="search$$()"
                (toggleOpenEvent)="toggleOpen($event)"
                (openEvent)="open($event)"
            ></nx-partner-sidebar-level>
        }
        @for (org of partnerStructure$$().organizations; track org.id) {
            <nx-org-sidebar-level
                [organization]="org"
                [openLevels]="openLevels$$()"
                [selectedEntityId]="selectedEntityId$$()"
                [search]="search$$()"
                (openParentEvent)="open($event)"
            ></nx-org-sidebar-level>
        }
    </div>
}
