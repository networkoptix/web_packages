<div class="sidebar">
    <div class="search">
        <nx-simple-search
            [ngModel]="search$$()"
            (ngModelChange)="search$$.set($event)"
        ></nx-simple-search>
    </div>

    @for (partner of searchFilteredChannelStructure$$()?.channelPartners; track partner.id) {
        <nx-partner-sidebar-level
            [partnerStructure]="partner"
            [parentMap]="parentMap$$()"
            [openLevels]="openLevels$$()"
            [selectedEntityId]="entityId$$()"
            [search]="search$$()"
            (toggleOpenEvent)="toggleOpen($event)"
            (openEvent)="open($event)"
        ></nx-partner-sidebar-level>
    }
    @for (org of searchFilteredChannelStructure$$()?.organizations; track org.id) {
        <nx-org-sidebar-level
            [organization]="org"
            [openLevels]="openLevels$$()"
            [selectedEntityId]="entityId$$()"
            [search]="search$$()"
        ></nx-org-sidebar-level>
    }
</div>
