<div
    class="org-level"
    [ngClass]="{ 'is-selected': isSelected$$() }"
>
    <svg-icon
        nx-add-svg-src
        [src]="icons.dir + 'organization.svg'"
        [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
        class="org-icon"
    ></svg-icon>
    <a
        [routerLink]="routerLink$$()"
        (click)="$event.stopPropagation()"
        [ngClass]="{
            'is-selected': isSelected$$()
        }"
        >{{ organization$$().name }}</a
    >
</div>
