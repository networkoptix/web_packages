<div
    class="org-level"
    [ngClass]="{ 'is-selected': isSelected$$() }"
>
    <svg-icon
        nx-add-svg-src
        [src]="icons.dir + 'organization.svg'"
        [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
        class="org-icon"
    ></svg-icon>
    <a
        [routerLink]="routerLink$$()"
        [queryParams]="{ page: 1 }"
        queryParamsHandling="merge"
        (click)="handleSelection($event)"
        [ngClass]="{
            'is-selected': isSelected$$()
        }"
        ><nx-search-highlight
            [text]="organization$$().name"
            [search]="highlightRegex$$()"
        ></nx-search-highlight
    ></a>
</div>
