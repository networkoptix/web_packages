<div class="row d-flex align-items-start">
    <div class="col-12 mt-3">
        <ng-container>
            <nx-block header-style="extended">
                <header class="header-users">
                    <h4 translate>Partner</h4>
                </header>

                <nx-section type="no-spacing">
                    <div *ngIf="partner; else noPartners">
                        <div class="mt-2"><span translate>Name</span>:&nbsp;{{ partner.name }}</div>
                        <div
                            class="mt-2"
                            *ngIf="organizations.length"
                        >
                            <a
                                [routerLink]="'/organizations/'"
                                translate
                                >see organizations</a
                            >
                        </div>
                    </div>
                </nx-section>

                <nx-section type="no-spacing">
                    <div>
                        <button
                            class="btn btn-default"
                            translate
                        >
                            Add Organization
                        </button>
                    </div>
                </nx-section>
            </nx-block>
        </ng-container>

        <ng-template #noPartners>
            <div
                class="mt-2"
                translate
            >
                Please add a partner
            </div>
        </ng-template>
    </div>

    <div
        class="col-12 mt-3"
        *ngFor="let organization of organizations"
    >
        <ng-container>
            <nx-block header-style="extended">
                <header class="header-organizations">
                    <h4>{{ organization.name }}</h4>
                </header>

                <nx-section type="no-spacing">
                    <div class="mt-2"><span translate>Id</span>:&nbsp;{{ organization.id }}</div>
                    <div class="mt-2">
                        <span translate>Users</span>:&nbsp;{{ organization.users }}
                    </div>
                    <div class="mt-2">
                        <span translate>Systems</span>:&nbsp;{{ organization.cloudSystems }}
                    </div>
                    <div class="mt-2">
                        <span translate>Name</span>:&nbsp;{{ organization.name }}
                    </div>
                    <div class="mt-2">
                        <span translate>Channel</span>:&nbsp;{{ organization.channelPartner }}
                    </div>
                </nx-section>
            </nx-block>
        </ng-container>
    </div>

    <ng-container #pageApply></ng-container>
</div>
