<div *ngIf="!showOverlay && (errorEncryption || errorPlayback); else player">
    <nx-player-placeholder
        *ngIf="errorEncryption"
        svgFileName="camera_archive_encrypted"
        [heading]="LANG.errorCodes.archiveEncrypted | translate"
        [description]="LANG.errorCodes.archiveEncryptedMessage | translate"
    >
    </nx-player-placeholder>

    <nx-player-placeholder
        *ngIf="errorPlayback"
        svgFileName="alert"
        [heading]="LANG.common.cameraStates.error | translate"
        [description]="errorPlaybackDescription"
    >
    </nx-player-placeholder>
</div>

<ng-template #player>
    <div
        *ngIf="showOverlay"
        class="overlay"
        [ngClass]="{ active: showOverlay }"
        (dblclick)="onDblClick($event)"
    >
        <nx-pre-loader></nx-pre-loader>
    </div>
    <nx-player-js
        *ngIf="playback.subject | async | as: PlaybackStateTemp as playbackState"
        (click)="handleClick($event)"
        (videoEnded)="videoEnded($event)"
        (videoError)="videoErrorEventHandler($event)"
        (bufferingChange)="onBufferingChange($event)"
        [mode]="playbackState.mode"
        [paused]="playbackState.paused"
        [posterUrl]="playbackState.posterUrl | async"
        [rotation]="rotateDeg"
        [sourceUrl]="playbackState.sourceUrl"
    >
    </nx-player-js>
</ng-template>
