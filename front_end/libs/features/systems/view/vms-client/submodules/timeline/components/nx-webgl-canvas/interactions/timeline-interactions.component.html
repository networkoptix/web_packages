<div
    (mousemove)="handleMouseMove($event)"
    (mouseleave)="handleMouseLeave()"
    (wheel)="handleMouseWheel($event)"
    (nxClick)="handleMouseClick($event)"
    (nxHoldStart)="handleMouseHold($event, true)"
    (nxHoldStop)="handleMouseHold($event, false)"
>
    <nx-webgl-time-under-mouse [position]="timeUnderPosition"></nx-webgl-time-under-mouse>

    <nx-webgl-timeline-playback-indicator
        [position]="playbackPosition"
    ></nx-webgl-timeline-playback-indicator>

    <nx-webgl-timeline-selection
        [enabled]="actions.mode === MODE.SELECTION"
        (onHover)="handleSelectionOnHover($event)"
    ></nx-webgl-timeline-selection>
</div>
