<div
    class="button zoom-in"
    [ngClass]="{ enabled: canZoomIn }"
    (nxClick)="doZoom(ZOOM_DIRECTION.in)"
    (nxDblClick)="doZoom(ZOOM_DIRECTION.forceZoomIn)"
    (nxHoldStart)="doZoom(ZOOM_DIRECTION.constantIn)"
    (nxHoldStop)="stopZoom(ZOOM_DIRECTION.constantIn)"
>
    +
</div>
<div
    class="button zoom-out"
    [ngClass]="{ enabled: canZoomOut }"
    (nxClick)="doZoom(ZOOM_DIRECTION.out)"
    (nxDblClick)="doZoom(ZOOM_DIRECTION.forceZoomOut)"
    (nxHoldStart)="doZoom(ZOOM_DIRECTION.constantOut)"
    (nxHoldStop)="stopZoom(ZOOM_DIRECTION.constantOut)"
>
    –
</div>
