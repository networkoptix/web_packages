<div
    #canvasWrapper
    class="timeline"
    (mouseleave)="timelineMouseLeaveHandler($event)"
    [ngClass]="{
        dragging: isDragging
    }"
>
    <canvas
        #canvas
        (wheel)="canvasWheelHandler($event)"
        (mousemove)="canvasMouseMoveHandler($event)"
        (mouseenter)="canvasMouseEnterHandler($event)"
        (mouseleave)="canvasMouseLeaveHandler($event)"
        (mousedown)="canvasMouseDownHandler($event)"
        (mouseup)="canvasMouseUpHandler($event)"
        (touchmove)="canvasMouseMoveHandler($event)"
        (touchstart)="canvasMouseDownHandler($event)"
        (touchend)="canvasMouseUpHandler($event)"
    ></canvas>
    <nx-time-under-mouse *ngIf="!isDragging && !hideTimeUnderMouse"></nx-time-under-mouse>
    <nx-timeline-scrollbar></nx-timeline-scrollbar>
    <nx-timeline-playback-indicator
        *ngIf="ux.state.isTimelineShown"
        [ngStyle]="{
            visibility: ux.state.isTimelineShown && !selection.isActive ? 'visible' : 'hidden'
        }"
    ></nx-timeline-playback-indicator>
    <nx-timeline-selection
        *ngIf="archiveSelectionEnabled"
        [ngStyle]="{ visibility: ux.state.isTimelineShown ? 'visible' : 'hidden' }"
    ></nx-timeline-selection>
</div>
