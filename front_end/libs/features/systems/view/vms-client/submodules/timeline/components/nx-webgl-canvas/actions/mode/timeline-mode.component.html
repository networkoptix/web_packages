<div>
    <nx-button
        [type]="ButtonType.action"
        [active]="mode === MODE.SELECTION"
        (click)="handleModeClick()"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirActions + 'selection.svg'"
            [svgStyle]="{
                'width.px': '20',
                'height.px': '20'
            }"
            [applyClass]="true"
        ></svg-icon>
    </nx-button>
</div>
