<div
    class="button left"
    #left
    [ngClass]="{ enabled: canScrollLeft && !disabled && !onSelectionDrag && !onScrollBarScroll }"
    (nxClick)="scrollTo(SCROLL_DIRECTION.left)"
    (nxDblClick)="scrollTo(SCROLL_DIRECTION.beginning)"
    (nxHoldStart)="scrollTo(SCROLL_DIRECTION.constantLeft)"
    (nxHoldStop)="scrollStop(SCROLL_DIRECTION.left)"
>
    <svg-icon
        nx-add-svg-src
        [src]="images.dir + 'timeline_scroll.svg'"
    ></svg-icon>
</div>
<div
    class="background"
    #background
    id="background"
    (click)="handleBarClick($event)"
>
    <div
        class="current-playback-indicator"
        [ngClass]="{ active: playbackPos }"
        [style.left.px]="playbackPos - 1"
    ></div>

    <div
        class="current-selection-indicator"
        [ngClass]="{ active: selectionWidth > 0 }"
        [style.left.px]="selectionStart"
        [style.width.px]="selectionWidth"
    ></div>

    <div
        class="bar"
        #bar
        id="bar"
        [style.width.px]="barWidth"
        [style.left.px]="barPos"
        [ngClass]="{ grabbed: isBarGrabbed }"
        (cdkDragMoved)="handleBarDragMove($event)"
        (cdkDragEnded)="handleBarDragEnd($event)"
        cdkDragBoundary=".background"
        cdkDragLockAxis="x"
        cdkDrag
    >
        <span class="stripe"></span>
        <span class="stripe"></span>
        <span class="stripe"></span>
    </div>

    <!--    <div-->
    <!--        class="honest-bar"-->
    <!--        #honestBar-->
    <!--        [ngClass]="{ visible: showHonestBar }"-->
    <!--    ></div>-->
</div>

<div
    class="button right"
    #right
    [ngClass]="{ enabled: canScrollRight && !disabled && !onSelectionDrag && !onScrollBarScroll }"
    (nxClick)="scrollTo(SCROLL_DIRECTION.right)"
    (nxDblClick)="scrollTo(SCROLL_DIRECTION.end)"
    (nxHoldStart)="scrollTo(SCROLL_DIRECTION.constantRight)"
    (nxHoldStop)="scrollStop(SCROLL_DIRECTION.right)"
>
    <svg-icon
        nx-add-svg-src
        [src]="images.dir + 'timeline_scroll.svg'"
    ></svg-icon>
</div>
