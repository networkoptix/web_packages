<div
    class="button left"
    #left
    [ngClass]="{ enabled: canScrollLeft && !disabled }"
    (nxClick)="scrollTo(SCROLL_DIRECTION.left)"
    (nxDblClick)="scrollTo(SCROLL_DIRECTION.beginning)"
    (nxHoldStart)="scrollTo(SCROLL_DIRECTION.constantLeft)"
    (nxHoldStop)="scrollStop(SCROLL_DIRECTION.left)"
>
    <svg-icon
        nx-add-svg-src
        [src]="images.dir + 'timeline_scroll.svg'"
    ></svg-icon>
</div>
<div
    class="background"
    #background
>
    <!--    <div-->
    <!--        class="current-playback-indicator"-->
    <!--        #currentPlayback-->
    <!--        [ngClass]="{ active: isPlaying }"-->
    <!--    ></div>-->

    <!--    <div-->
    <!--        class="current-selection-indicator"-->
    <!--        #currentSelection-->
    <!--        [ngClass]="{ active: isSelected }"-->
    <!--    ></div>-->

    <div
        class="bar"
        #bar
        [ngStyle]="{ width: barWidth }"
        [ngClass]="{ grabbed: isBarGrabbed }"
        (mousedown)="handleBarMouseDown($event)"
        (mouseup)="handleBarMouseUp($event)"
        (mouseleave)="handleBarMouseUp($event)"
        (cdkDragMoved)="handleBarDragMouseMove($event)"
        (cdkDragStarted)="setDraggable($event)"
        cdkDragBoundary=".background"
        cdkDragLockAxis="x"
        cdkDrag
    >
        <span class="stripe"></span>
        <span class="stripe"></span>
        <span class="stripe"></span>
    </div>

    <div
        class="honest-bar"
        #honestBar
        [ngClass]="{ visible: showHonestBar }"
    ></div>
</div>

<div
    class="button right"
    #right
    [ngClass]="{ enabled: canScrollRight && !disabled }"
    (nxClick)="scrollTo(SCROLL_DIRECTION.right)"
    (nxDblClick)="scrollTo(SCROLL_DIRECTION.end)"
    (nxHoldStart)="scrollTo(SCROLL_DIRECTION.constantRight)"
    (nxHoldStop)="scrollStop(SCROLL_DIRECTION.right)"
>
    <svg-icon
        nx-add-svg-src
        [src]="images.dir + 'timeline_scroll.svg'"
    ></svg-icon>
</div>
