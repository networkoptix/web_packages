<div
    #selectedRange
    class="selected-range"
>
    <div
        class="left-draggable"
        (mouseover)="leftEarMouseInOutHandler(true)"
        (mouseout)="leftEarMouseInOutHandler(false)"
        (mousedown)="leftEarMouseDownHandler($event)"
    ></div>
    <div
        #leftEar
        *ngIf="!hideLeftEar"
        class="ear left"
    >
        <span class="date">{{ leftDate }}</span>
        <span class="time">{{ leftTime }}</span>
        <svg viewbox="0 0 140 5">
            <polygon [attr.points]="svgLeftArrowPoints" />
        </svg>
    </div>
    <div
        #rightEar
        *ngIf="!hideRightEar"
        class="ear right"
    >
        <span class="date">{{ rightDate }}</span>
        <span class="time">{{ rightTime }}</span>
        <svg viewbox="0 0 140 5">
            <polygon [attr.points]="svgRightArrowPoints" />
        </svg>
    </div>
    <div
        class="right-draggable"
        (mouseover)="rightEarMouseInOutHandler(true)"
        (mouseout)="rightEarMouseInOutHandler(false)"
        (mousedown)="rightEarMouseDownHandler($event)"
    ></div>
</div>
