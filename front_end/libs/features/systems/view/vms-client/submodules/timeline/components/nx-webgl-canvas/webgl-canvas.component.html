<nx-pre-loader
    *ngIf="cameras.length && (!data?.length || !dataAllCameras?.length)"
    [minHeight]="85"
></nx-pre-loader>
<div
    class="d-flex timeline-container"
    *ngIf="data?.length || dataAllCameras?.length"
>
    <div>
        <nx-timeline-zoom
            (onZoom)="doZoom($event)"
            (constantZoom)="constantZoom($event)"
        ></nx-timeline-zoom>
    </div>
    <div class="nx-timeline-wrapper">
        <div id="nx-x-axis-major"></div>
        <div id="nx-x-axis-minor"></div>
        <div
            [ngClass]="{ 'multi-layer': cameras.length > 1 }"
            (mousemove)="mouseMoveHandler($event)"
            (mouseleave)="mouseLeaveHandler()"
            id="chart"
            use-device-pixel-ratio
        ></div>
        <div
            *ngIf="cameras.length > 1"
            (mousemove)="mouseMoveHandler($event)"
            (mouseleave)="mouseLeaveHandler()"
            id="chartAll"
            use-device-pixel-ratio
        ></div>
        <nx-timeline-scroll
            [barWidth]="scrollBarWidth"
            [barPos]="scrollBarPos"
            [playbackPos]="scrollPlaybackPosition"
            (scrollToPos)="scrollToPos($event)"
            (scrollEnd)="scrollEnd()"
            (singleScroll)="singleScroll($event)"
            (constantScroll)="constantScroll($event)"
        >
        </nx-timeline-scroll>

        <div
            class="canvas-camera-name"
            [ngClass]="{ short: cameras.length > 1 }"
        >
            {{ selectedCamera?.name || selectedCamera?.model }}
        </div>

        <nx-webgl-time-under-mouse
            [position]="timeLabelPosition"
            [timeUnder]="currentPointer"
        ></nx-webgl-time-under-mouse>

        <nx-webgl-timeline-playback-indicator
            [playbackPosition]="playbackLabelPosition"
            [playbackTime]="playbackPointer"
        ></nx-webgl-timeline-playback-indicator>

        <nx-webgl-timeline-selection
            [cursorTime]="currentPointer"
            (posChange)="getSelectionDate($event)"
            (scrollShift)="scrollShift($event)"
        ></nx-webgl-timeline-selection>

        <nx-webgl-timeline-selection-action-panel></nx-webgl-timeline-selection-action-panel>
    </div>
</div>
