<div class="media-server-list">
    <nx-media-server-list-header
        (ipVisibilityStateChange)="updateShowIP($event)"
        (filterTokenChange)="updateFilteredList($event)"
    >
    </nx-media-server-list-header>

    <div class="server-list">
        <div
            class="server"
            *ngFor="let server of mediaservers; trackBy: serverID"
            [ngClass]="{
                'show-ip': showIP,
                expanded: isServerExpanded[server.id],
                online: server.status === 'Online',
                offline: server.status === 'Offline',
                empty: !server.cameras.length
            }"
        >
            <div
                class="server-name"
                (click)="changeServerVisibility(server.id)"
                [title]="server.ip"
            >
                <svg-icon
                    nx-add-svg-src
                    [src]="
                        icons.dir +
                        (server.status === 'Offline' ? 'server_offline.svg' : 'server.svg')
                    "
                    [applyClass]="true"
                ></svg-icon>
                <span
                    class="name"
                    [ngClass]="server.status"
                >
                    <nx-search-highlight
                        [text]="server.name"
                        [search]="token"
                    ></nx-search-highlight>
                </span>
                <span
                    *ngIf="showIP"
                    class="ip-info"
                >
                    <nx-search-highlight
                        [text]="server.ip"
                        [search]="token"
                    ></nx-search-highlight
                ></span>
                <svg-icon
                    nx-add-svg-src
                    class="expand"
                    [src]="icons.dirTextButtons + 'arrow_expand.svg'"
                ></svg-icon>
            </div>

            <div
                class="cameras"
                *ngIf="isServerExpanded[server.id]"
            >
                <a
                    class="camera"
                    *ngFor="let camera of server.cameras; trackBy: cameraId"
                    [routerLink]="[camera.id]"
                    [ngClass]="{
                        online: camera.isOnline,
                        live: camera.isLive,
                        recording: camera.isRecording,
                        hasArchive: camera.hasArchive,
                        offline: !camera.isOnline,
                        unauthorized: !camera.isAuthorized,
                        isScheduleEnabled: camera.isScheduleEnabled,
                        error: previewLoaded[camera.id] === -1,
                        selected: camera.id === selectedCameraId
                    }"
                >
                    <div
                        class="preview"
                        (nxOnIntersect)="
                            isCameraVisible[camera.id] =
                                isCameraVisible[camera.id] || $event === 'Visible'
                        "
                        [intersectionThreshold]="0.1"
                    >
                        <nx-pre-loader
                            class="preloader"
                            *ngIf="
                                isCameraVisible[camera.id] &&
                                (camera.thumbnailUrl | async) &&
                                !previewLoaded[camera.id]
                            "
                        ></nx-pre-loader>
                        <img
                            alt="thumbnail preview"
                            class="fs-exclude"
                            *ngIf="
                                isCameraVisible[camera.id] &&
                                (camera.thumbnailUrl | async) !== undefined
                            "
                            [src]="camera.thumbnailUrl | async | safe: 'resourceUrl'"
                            (load)="handlePreviewLoaded(camera.id)"
                            (error)="handlePreviewError(camera.id)"
                        />
                        <svg-icon
                            nx-add-svg-src
                            *ngIf="
                                (camera.thumbnailUrl | async) === undefined ||
                                !camera.isAuthorized ||
                                previewLoaded[camera.id] === -1 ||
                                !camera.isOnline
                            "
                            [src]="
                                icons.dirNonStandardView +
                                'cameras_list_placeholder_' +
                                (!camera.isOnline
                                    ? 'offline'
                                    : !camera.isAuthorized
                                    ? 'unauthorized'
                                    : 'alert') +
                                '.svg'
                            "
                            [applyClass]="true"
                        ></svg-icon>
                    </div>
                    <span
                        class="name"
                        [ngClass]="camera.status"
                    >
                        <nx-search-highlight
                            [text]="camera.name"
                            [search]="token"
                        ></nx-search-highlight
                    ></span>
                    <span class="ip-info">
                        <nx-search-highlight
                            [text]="camera.url"
                            [search]="token"
                        ></nx-search-highlight
                    ></span>
                </a>
            </div>
        </div>
    </div>
</div>
