<nx-pre-loader *ngIf="!initialized; else uninitialized"></nx-pre-loader>

<ng-template #uninitialized>
    <nx-page-placeholder
        *ngIf="initializedWithError; else primary"
        type="OFFLINE"
        class="page-placeholder"
    >
    </nx-page-placeholder>

    <ng-template #primary>
        @if (useNewCloud) {
            <nx-media-server-list
                *nxMenuProjection
                [selectedCameraId]="selectedCameraId"
                [systemId]="systemId"
                [mediaservers]="mediaservers"
            ></nx-media-server-list>
        } @else {
            <div
                class="nx-view-sidebar"
                *ngIf="hasCameras; else noCameras"
            >
                <div
                    class="sidebar-toggling-ear--wrapper"
                    [ngClass]="{
                        shown: isSidebarShown,
                        visible: isSidebarShown || showElementsInFSM
                    }"
                    (click)="handleSidebarTogglingEarClick()"
                >
                    <div class="sidebar-toggling-ear">
                        <svg-icon
                            nx-add-svg-src
                            [src]="icons.dirTextButtons + 'arrow_expand.svg'"
                        ></svg-icon>
                    </div>
                </div>
            </div>
        }
        <router-outlet *ngIf="hasCameras"></router-outlet>
        <ng-template #noCameras>
            <div
                class="no-cameras-placeholder"
                translate
            >
                No Cameras
            </div>
        </ng-template>
    </ng-template>
</ng-template>
