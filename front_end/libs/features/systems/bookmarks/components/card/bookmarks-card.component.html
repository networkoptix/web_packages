<div
    #targetThis
    class="bookmarks-tooltip"
></div>
<div
    (click)="openBookmarkModal()"
    role="button"
    (nxOnIntersect)="bookmark$$().isVisible = $event === 'Visible'"
    [intersectionThreshold]="0.01"
    [nxTooltip]="enableTooltip ? bookmark$$().name : ''"
    alternateSecondary
    horizontal
    tooltipMediumFont
    [alternativeTargetRef]="targetThis"
>
    <div class="bookmarks-image-wrapper">
        <span class="bookmarks-duration">
            {{ duration }}
        </span>
        <div class="bookmarks-image">
            <div class="bookmarks-image-loaded">
                <ng-container *ngIf="bookmark$$().isVisible">
                    <ng-container *ngIf="bookmark$$().deviceName && bookmark$$().canViewBookmark">
                        <ng-template #thumbnailPreLoader>
                            <nx-pre-loader></nx-pre-loader>
                        </ng-template>
                        <div *ngIf="bookmark$$().thumbnail | async; else thumbnailPreLoader">
                            <ng-container *ngIf="!thumbnailError; else noThumbnail">
                                <svg-icon
                                    nx-add-svg-src
                                    [src]="icons.dir + 'play.svg'"
                                    [svgStyle]="{ 'width.px': '40', 'height.px': '40' }"
                                    class="bookmarks-image-playIcon"
                                ></svg-icon>
                                <img
                                    [src]="bookmark$$().thumbnail | async | safe: 'resourceUrl'"
                                    [alt]="'thumbnail of ' + bookmark$$().name"
                                    (error)="thumbnailError = true"
                                />
                            </ng-container>
                            <ng-template #noThumbnail>
                                <nx-player-placeholder
                                    class="thumbnailError noImage"
                                    [description]="'No image available' | translate"
                                ></nx-player-placeholder>
                            </ng-template>
                        </div>
                    </ng-container>

                    <ng-container *ngIf="!bookmark$$().canViewBookmark && bookmark$$().deviceName">
                        <nx-player-placeholder
                            class="noPermissions"
                            [description]="
                                'View Bookmarks and View Archive permissions are required to access this Bookmark.'
                                    | translate
                            "
                        ></nx-player-placeholder>
                    </ng-container>

                    <ng-container *ngIf="bookmark$$().canViewBookmark && !bookmark$$().deviceName">
                        <nx-player-placeholder
                            class="thumbnailError"
                            [description]="'Device permission required.' | translate"
                        ></nx-player-placeholder>
                    </ng-container>
                </ng-container>
            </div>
        </div>
    </div>
    <div class="bookmarks-info">
        <span class="bookmarks-info-timestamp">
            <span>{{ startDate }}</span> • <span>{{ startTime }}</span>
        </span>
        <nx-ml-ellipsis
            class="bookmarks-info-title"
            gradientOnly
            [viewHeight]="40"
            [viewLineHeight]="19"
            [viewLines]="2"
            (longText)="enableTooltip = $event"
        >
            {{ bookmark$$().name }}
        </nx-ml-ellipsis>
        <div class="bottom-row-container">
            <p class="bookmarks-info-name">{{ bookmark$$().deviceName }}</p>
            @if ((bookmark$$() | as: BookmarkV4).share) {
                <svg-icon
                    nx-add-svg-src
                    [src]="icons.dir + 'shared.svg'"
                    [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                ></svg-icon>
            }
        </div>
        <!-- FOR DEV DEBUGGING ONLY -->
        <!-- <div
            [ngStyle]="{
                display: 'flex',
                gap: '0.5rem'
            }"
        >
            <span
                *ngFor="let tag of bookmark$$().tags"
                [ngStyle]="{
                    background: 'var(--bookmarks-filter-button-bg)',
                    padding: '0 0.5rem',
                    border: '1px solid var(--border-color)'
                }"
                >{{ tag }}</span
            >
        </div> -->
        <!-- /FOR DEV DEBUGGING ONLY -->
    </div>
</div>
