<div class="dtf-header">
    <span translate>Date and Time</span>
    <button
        *ngIf="dateRange"
        class="clear"
        (click)="clear()"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirTextButtons + 'close.svg'"
            [svgStyle]="{ 'width.rem': '0.9', 'height.rem': '0.9' }"
        ></svg-icon>
    </button>
</div>
<div class="dtf-body">
    <div class="quick-selects">
        <button
            translate
            [ngClass]="{ selected: quickSelectMatch(lastDay) }"
            (click)="quickSelect(lastDay)"
            (mouseover)="preview = lastDay"
            (mouseout)="preview = null"
            (focus)="preview = lastDay"
            (blur)="preview = null"
        >
            Last Day
        </button>
        <button
            translate
            [ngClass]="{ selected: quickSelectMatch(last7Days) }"
            (click)="quickSelect(last7Days)"
            (mouseover)="preview = last7Days"
            (mouseout)="preview = null"
            (focus)="preview = last7Days"
            (blur)="preview = null"
        >
            Last 7 Days
        </button>
        <button
            translate
            [ngClass]="{ selected: quickSelectMatch(last30Days) }"
            (click)="quickSelect(last30Days)"
            (mouseover)="preview = last30Days"
            (mouseout)="preview = null"
            (focus)="preview = last30Days"
            (blur)="preview = null"
        >
            Last 30 Days
        </button>
    </div>
    <mat-calendar
        [selected]="dateRange || preview"
        (selectedChange)="selectedChange($event)"
    ></mat-calendar>
    <div class="time-inputs">
        <div>
            <span translate>From</span>
            <nx-time-selector
                [time]="timeRange.start"
                (timeChange)="setStartTime($event)"
            ></nx-time-selector>
        </div>
        <div>
            <span translate>To</span>
            <nx-time-selector
                [time]="timeRange.end"
                (timeChange)="setEndTime($event)"
            ></nx-time-selector>
        </div>
    </div>
</div>
