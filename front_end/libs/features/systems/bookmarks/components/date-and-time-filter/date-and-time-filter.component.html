<div class="dtf-header">
    <span translate>Date and Time</span>
    <button
        *ngIf="dateRange || timeRange.start !== null || timeRange.end !== null"
        class="clear"
        (click)="clear()"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirTextButtons + 'close.svg'"
            [svgStyle]="{ 'width.rem': '0.9', 'height.rem': '0.9' }"
        ></svg-icon>
    </button>
</div>
<div class="dtf-body">
    <div class="quick-selects">
        <button
            translate
            [ngClass]="{ selected: quickSelectMatch(lastDay) }"
            (click)="quickSelect(lastDay)"
            (mouseover)="quickPreview = lastDay"
            (mouseout)="quickPreview = null"
            (focus)="quickPreview = lastDay"
            (blur)="quickPreview = null"
        >
            Last Day
        </button>
        <button
            translate
            [ngClass]="{ selected: quickSelectMatch(last7Days) }"
            (click)="quickSelect(last7Days)"
            (mouseover)="quickPreview = last7Days"
            (mouseout)="quickPreview = null"
            (focus)="quickPreview = last7Days"
            (blur)="quickPreview = null"
        >
            Last 7 Days
        </button>
        <button
            translate
            [ngClass]="{ selected: quickSelectMatch(last30Days) }"
            (click)="quickSelect(last30Days)"
            (mouseover)="quickPreview = last30Days"
            (mouseout)="quickPreview = null"
            (focus)="quickPreview = last30Days"
            (blur)="quickPreview = null"
        >
            Last 30 Days
        </button>
    </div>
    <mat-calendar
        #matCalendar
        [ngClass]="{
            'quick-preview': !dateRange
        }"
        [selected]="dateRange || quickPreview"
        (selectedChange)="selectedChange($event)"
        [comparisonStart]="comparisonStart"
        [comparisonEnd]="comparisonEnd"
    ></mat-calendar>
    <div class="time-inputs">
        <div>
            <span translate>From</span>
            <nx-time-selector
                [time]="timeRange.start"
                (timeChange)="setTimePoint('start', $event)"
                point="start"
            ></nx-time-selector>
        </div>
        <div>
            <span translate>To</span>
            <nx-time-selector
                [time]="timeRange.end"
                (timeChange)="setTimePoint('end', $event)"
                point="end"
                [error$]="timeRangeError$"
            ></nx-time-selector>
        </div>
    </div>
    <div
        *ngIf="timeRangeError$ | async"
        id="datetime-warning"
        class="mt-2 error-label"
        translate
    >
        End time is earlier than start time
    </div>
</div>
