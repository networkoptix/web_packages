<div class="header">
    <span translate>Tags</span>
    <button
        *ngIf="selection.hasValue()"
        class="clear"
        (click)="selection.clear(); selectionChange.emit()"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirTextButtons + 'close.svg'"
            [svgStyle]="{ 'width.rem': '0.9', 'height.rem': '0.9' }"
        ></svg-icon>
    </button>
</div>
<div class="body">
    <div class="tags">
        <button
            class="tag"
            *ngFor="let tag of tags | slice: 0:displayLimit"
            [ngClass]="{ selected: selection.isSelected(tag) }"
            (click)="selection.toggle(tag); selectionChange.emit()"
        >
            {{ tag }}
        </button>
    </div>
    <div>
        <button
            *ngIf="tags.length > displayLimit"
            translate
            (click)="moreTagsDialog()"
        >
            More tags
        </button>
    </div>
</div>
