<input
    [(ngModel)]="value"
    (ngModelChange)="emitValue($event)"
    [pattern]="timeRegex"
    [placeholder]="placeholder"
    maxlength="5"
    class="form-control"
    [ngClass]="{ 'not-empty': value }"
    (blur)="onBlur()"
/>
<button
    class="period"
    *ngIf="hour12 && value"
    (click)="period = this.period === AM ? PM : AM; emitValue()"
>
    {{ period }}
</button>
<button
    *ngIf="value"
    class="clear-btn"
    (click)="value = ''; emitValue('')"
>
    <svg-icon
        nx-add-svg-src
        [src]="icons.dirTextButtons + 'close.svg'"
        [svgStyle]="{ 'width.rem': '0.9', 'height.rem': '0.9' }"
    ></svg-icon>
</button>
