<div
    class="input-wrapper"
    [ngStyle]="{ order: postPeriod ? 0 : 1 }"
>
    <input
        [(ngModel)]="value"
        (ngModelChange)="emitValue($event)"
        [pattern]="timeRegex"
        [placeholder]="placeholder"
        maxlength="5"
        class="form-control"
        [ngClass]="{ 'not-empty': value, error: point === 'end' && error$ | async }"
        (blur)="onBlur()"
    />
    <button
        *ngIf="value"
        class="legacy-btn clear-btn"
        (click)="value = ''; emitValue('')"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirTextButtons + 'close.svg'"
            [svgStyle]="{ 'width.rem': '0.9', 'height.rem': '0.9' }"
        ></svg-icon>
    </button>
</div>
<button
    #periodBtn
    class="legacy-btn period"
    [ngClass]="{ error: point === 'end' && error$ | async }"
    *ngIf="hour12"
    [cdkMenuTriggerFor]="periods"
>
    <span>{{ period }}</span>
</button>
<ng-template #periods>
    <div
        class="periods-menu"
        cdkMenu
        [ngStyle]="{ 'min-width.px': periodBtn.nativeElement.offsetWidth }"
    >
        <button
            class="legacy-btn"
            cdkMenuItem
            [ngClass]="{ selected: period === AM }"
            (cdkMenuItemTriggered)="period = AM; emitValue()"
        >
            {{ AM }}
        </button>
        <button
            class="legacy-btn"
            cdkMenuItem
            [ngClass]="{ selected: period === PM }"
            (cdkMenuItemTriggered)="period = PM; emitValue()"
        >
            {{ PM }}
        </button>
    </div>
</ng-template>
