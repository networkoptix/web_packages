<div class="header">
    <span translate>Device</span>
    <button
        *ngIf="selection.hasValue()"
        class="clear"
        (click)="selection.clear(); selectionChange.emit()"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirTextButtons + 'close.svg'"
            [svgStyle]="{ 'width.rem': '0.9', 'height.rem': '0.9' }"
        ></svg-icon>
    </button>
</div>
<div class="body">
    <nx-simple-search [(ngModel)]="search"></nx-simple-search>
    <div class="devices">
        <label
            *ngFor="let device of searchMatches | slice: 0 : displayLimit"
            [ngClass]="{ selected: selection.isSelected(device) }"
        >
            <nx-checkbox
                [ngModel]="selection.isSelected(device)"
                (ngModelChange)="updateSelection(device, $event)"
            ></nx-checkbox>
            <span>{{ device }}</span>
        </label>
    </div>
    <div>
        <button
            *ngIf="items.length > displayLimit"
            translate
            (click)="moreDevicesDialog()"
        >
            More devices
        </button>
    </div>
</div>
