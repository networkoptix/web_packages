<nx-page-placeholder
    *ngIf="system && !system.isOnline; else page"
    type="OFFLINE"
    class="page-placeholder"
>
</nx-page-placeholder>

<ng-template #page>
    <div class="page">
        <ng-template #sidebar>
            <nx-date-and-time-filter
                #dateAndTimeFilterComp
                [(dateRange)]="dateFilter"
                (dateRangeChange)="updateParam('date')"
                [timeRange]="timeFilter"
                (timeRangeChange)="updateParam('time')"
            ></nx-date-and-time-filter>
            <div class="filters-container">
                <nx-filter-container [header]="LANG.bookmarks.headers.devices">
                    <nx-multi-filter
                        [(ngModel)]="selectedDevices$$"
                        [displayLimit]="7"
                    >
                        @for (device of devices$$(); track device.id) {
                            <nx-checkbox-filter-item
                                [value]="device.id"
                                [searchString]="device.name"
                            >
                                {{ device.name }}
                            </nx-checkbox-filter-item>
                        }
                    </nx-multi-filter>
                </nx-filter-container>
                <nx-filter-container [header]="LANG.bookmarks.headers.tags">
                    <nx-multi-filter
                        [(ngModel)]="selectedTags$$"
                        [displayLimit]="15"
                    >
                        @for (tagName of tagNames$$(); track tagName) {
                            <nx-chip-filter-item
                                [value]="tagName"
                                [searchString]="tagName"
                            >
                                {{ tagName }}
                            </nx-chip-filter-item>
                        }
                    </nx-multi-filter>
                </nx-filter-container>
                @if (bookmarkSharingEnabled$$()) {
                    <nx-filter-container [header]="LANG.bookmarkSharing.filterHeader">
                        <nx-single-filter
                            [(ngModel)]="sharingFilter"
                            (ngModelChange)="updateParam('sharing')"
                            [searchable]="false"
                        >
                            <nx-radio-filter-item
                                value="shared"
                                translate
                            >
                                Shared
                            </nx-radio-filter-item>
                            <nx-radio-filter-item
                                value="notShared"
                                translate
                            >
                                Not Shared
                            </nx-radio-filter-item>
                        </nx-single-filter>
                    </nx-filter-container>
                }
            </div>
        </ng-template>

        @if (useNewCloud) {
            <div
                *nxMenuProjection
                class="projected-bookmark-sidebar"
            >
                <div>
                    <ng-container *ngTemplateOutlet="sidebar"></ng-container>
                </div>
            </div>
        } @else {
            <div class="sidebar">
                <ng-container *ngTemplateOutlet="sidebar"></ng-container>
            </div>
        }
        <div class="body">
            <nx-alert-block
                *ngIf="(newCreationCutOffTimeMS$ | async) > (creationCutOffTimeMS$ | async)"
                type="info"
                [iconSrc]="icons.dirNonStandard + 'info' + '.svg'"
                [line1]="'New Bookmarks available' | translate"
                [btnIconSrc]="icons.dirTextButtons + 'reload.svg'"
                [btnCaption]="'Refresh'"
                (onAction)="refreshBookmarks()"
            >
            </nx-alert-block>

            <nx-simple-search
                [(ngModel)]="search"
                (ngModelChange)="updateParam('search')"
                [suggestions]="suggestions$$()"
            ></nx-simple-search>
            <ng-template #stillLoading>
                <nx-pre-loader class="bookmarks-preloader"></nx-pre-loader>
            </ng-template>
            <ng-container *ngIf="bookmarks$ | async as bookmarks; else stillLoading">
                <div
                    #bookmarksContainer
                    [class]="bookmarks.length ? 'bookmarks' : 'no-bookmarks'"
                    *ngIf="!(loading$ | async); else stillLoading"
                    [style]="{
                        '--grid-padding': css.gridPadding + 'px',
                        '--bookmark-card-width': css.bookmarkWidth + 'px'
                    }"
                >
                    <ng-container *ngIf="!bookmarks.length">
                        <svg-icon
                            nx-add-svg-src
                            [src]="noBksImgSrc"
                        >
                        </svg-icon>
                        <div
                            *ngIf="noMatchingResults; else noBookmarksText"
                            class="no-bookmarks-content"
                        >
                            <nx-page-generic-placeholder-v2>
                                <div class="placeholder">
                                    <svg-icon
                                        [src]="
                                            icons.dirPagePlaceholder + 'noBookmarksCloudIcon.svg'
                                        "
                                    ></svg-icon>
                                    <h2
                                        class="title"
                                        translate
                                    >
                                        No matching results.
                                    </h2>
                                    <button
                                        (click)="clearAllFilters()"
                                        class="clear-filters"
                                        type="button"
                                        translate
                                    >
                                        Clear Filters
                                    </button>
                                </div>
                            </nx-page-generic-placeholder-v2>
                        </div>
                        <ng-template #noBookmarksText>
                            <nx-page-generic-placeholder-v2>
                                <div class="placeholder">
                                    <svg-icon
                                        [src]="
                                            icons.dirPagePlaceholder + 'noBookmarksCloudIcon.svg'
                                        "
                                    ></svg-icon>
                                    <h2
                                        class="title"
                                        translate
                                    >
                                        You don't have any Bookmarks yet.
                                    </h2>
                                </div>
                            </nx-page-generic-placeholder-v2>
                        </ng-template>
                    </ng-container>
                    <div
                        *ngFor="let bookmark of bookmarks; trackBy: trackBookmarkById"
                        class="bookmarks-container"
                    >
                        <div
                            #targetThis
                            class="bookmarks-tooltip"
                        ></div>
                        <nx-bookmarks-card [bookmark]="bookmark"></nx-bookmarks-card>
                    </div>
                    <ng-container *ngIf="infLoading$ | async">
                        <div *ngFor="let _ of [].constructor(loadingBuffer$ | async)">
                            <nx-dummy-bookmark></nx-dummy-bookmark>
                        </div>
                    </ng-container>
                    <div
                        *ngIf="!(infLoading$ | async) && bookmarks.length"
                        class="bookmarks-container"
                        (nxOnIntersect)="loadMore$.next($event === 'Visible')"
                        [intersectionThreshold]="0.1"
                    ></div>
                </div>
            </ng-container>
        </div>
    </div>
</ng-template>
