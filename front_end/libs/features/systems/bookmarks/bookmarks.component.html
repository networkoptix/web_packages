<div class="sidebar">
    <nx-date-and-time-filter
        [(dateRange)]="dateFilter"
        (dateRangeChange)="updateParam('date')"
        [timeRange]="timeFilter"
        (timeRangeChange)="updateParam('time')"
    ></nx-date-and-time-filter>
    <nx-device-filter
        [items]="devices"
        [selection]="deviceFilter"
        (selectionChange)="updateParam('devices')"
    ></nx-device-filter>
    <nx-tag-filter
        [tags]="tags"
        [selection]="tagFilter"
        (selectionChange)="updateParam('tags')"
    ></nx-tag-filter>
</div>
<div class="body">
    <nx-simple-search
        [(ngModel)]="search"
        (ngModelChange)="updateParam('search')"
        [suggestions]="suggestions"
    ></nx-simple-search>
    <div
        class="no-bookmarks"
        *ngIf="!(bookmarks | async)?.length"
    >
        <svg-icon
            nx-add-svg-src
            [src]="noBksImgSrc"
        >
        </svg-icon>
        <h2
            class="no-bookmarks-text"
            [ngClass]="{
                'no-bookmarks-text-dark': this.CONFIG.isDarkTheme
            }"
            translate
        >
            You don't have any Bookmarks yet.
        </h2>
    </div>
    <div
        class="bookmarks"
        *ngIf="(bookmarks | async)?.length"
    >
        <div
            *ngFor="let bookmark of bookmarks | async"
            class="bookmarks-container"
            [nxTooltip]="bookmark.description"
            alternateStyle
            horizontal
            [alternativeTargetRef]="targetThis"
        >
            <div
                #targetThis
                class="bookmarks-tooltip"
            ></div>
            <nx-bookmarks-card [bookmark]="bookmark"></nx-bookmarks-card>
        </div>
    </div>
</div>
