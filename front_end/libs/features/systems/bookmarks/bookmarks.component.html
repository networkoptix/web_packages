<nx-page-placeholder
    *ngIf="system && !system.isOnline; else page"
    type="OFFLINE"
    class="page-placeholder"
>
</nx-page-placeholder>

<ng-template #page>
    <div class="page">
        <div class="sidebar">
            <nx-date-and-time-filter
                #dateAndTimeFilterComp
                [(dateRange)]="dateFilter"
                (dateRangeChange)="updateParam('date')"
                [timeRange]="timeFilter"
                (timeRangeChange)="updateParam('time')"
            ></nx-date-and-time-filter>
            <nx-device-filter
                [items]="deviceNames$ | async"
                [selection]="deviceFilter"
                (selectionChange)="updateParam('devices')"
            ></nx-device-filter>
            <nx-tag-filter
                [tags]="tagNames$ | async"
                [selection]="tagFilter"
                (selectionChange)="updateParam('tags')"
            ></nx-tag-filter>
        </div>
        <div class="body">
            <nx-alert-block
                *ngIf="(newCreationCutOffTimeMS$ | async) !== (creationCutOffTimeMS$ | async)"
                type="info"
                [iconSrc]="icons.dirNonStandard + 'info' + '.svg'"
                [line1]="'New Bookmarks available' | translate"
                [btnIconSrc]="icons.dirTextButtons + 'reload.svg'"
                [btnCaption]="'Refresh'"
                (onAction)="refreshBookmarks()"
            >
            </nx-alert-block>

            <nx-simple-search
                [(ngModel)]="search"
                (ngModelChange)="updateParam('search')"
                [suggestions]="suggestions$ | async"
            ></nx-simple-search>
            <ng-template #stillLoading>
                <nx-pre-loader class="bookmarks-preloader"></nx-pre-loader>
            </ng-template>
            <div
                #bookmarksContainer
                [class]="bookmarks.length ? 'bookmarks' : 'no-bookmarks'"
                *ngIf="bookmarks$ | async as bookmarks; else stillLoading"
                [style]="{
                    '--grid-padding': css.gridPadding + 'px',
                    '--bookmark-card-width': css.bookmarkWidth + 'px'
                }"
            >
                <ng-container *ngIf="!bookmarks.length">
                    <svg-icon
                        nx-add-svg-src
                        [src]="noBksImgSrc"
                    >
                    </svg-icon>
                    <div
                        class="no-bookmarks-content"
                        *ngIf="creationCutOffTimeMS$ | async; else noBookmarksText"
                    >
                        <h2 translate>Nothing found</h2>
                        <span
                            class="no-bookmarks-info"
                            translate
                            >Please change search keywords</span
                        >
                        <button
                            (click)="clearAllFilters()"
                            class="btn btn-primary clear-filters"
                            type="button"
                            translate
                        >
                            Clear search
                        </button>
                    </div>
                    <ng-template #noBookmarksText>
                        <span translate>You don't have any Bookmarks yet.</span>
                    </ng-template>
                </ng-container>
                <div
                    *ngFor="let bookmark of bookmarks; trackBy: trackBookmarkById"
                    class="bookmarks-container"
                >
                    <div
                        #targetThis
                        class="bookmarks-tooltip"
                    ></div>
                    <nx-bookmarks-card [bookmark]="bookmark"></nx-bookmarks-card>
                </div>
                <ng-container *ngIf="loading$ | async">
                    <div *ngFor="let _ of [].constructor(loadingBuffer$ | async)">
                        <nx-dummy-bookmark></nx-dummy-bookmark>
                    </div>
                </ng-container>
                <div
                    *ngIf="!(loading$ | async) && bookmarks.length"
                    class="bookmarks-container"
                    (nxOnIntersect)="loadMore$.next($event === 'Visible')"
                    [intersectionThreshold]="0.1"
                ></div>
            </div>
        </div>
    </div>
</ng-template>
