<div class="sidebar">
    <nx-date-and-time-filter
        [(dateRange)]="dateFilter"
        [(timeRange)]="timeFilter"
    ></nx-date-and-time-filter>
    <nx-device-filter
        [items]="devices"
        [selection]="deviceFilter"
    ></nx-device-filter>
    <nx-tag-filter
        [tags]="tags"
        [selection]="tagFilter"
    ></nx-tag-filter>
</div>
<div class="body">
    <div
        class="no-bookmarks"
        *ngIf="bookmarks && !bookmarks.length"
    >
        <svg-icon
            nx-add-svg-src
            [src]="cloudSrc"
        >
        </svg-icon>
        <h2
            class="no-bookmarks-text"
            [ngClass]="{
                'no-bookmarks-text-dark': this.CONFIG.isDarkTheme
            }"
            translate
        >
            You don't have any Bookmarks yet.
        </h2>
    </div>
    <div
        class="bookmarks"
        *ngIf="bookmarks?.length"
    >
        <div
            *ngFor="let bookmark of bookmarks; index as i"
            class="bookmarks-container"
            [nxTooltip]="bookmark.description"
        >
            <nx-bookmarks-card [bookmark]="bookmark"></nx-bookmarks-card>
        </div>
    </div>
</div>
