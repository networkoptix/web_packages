<div class="system-button card card-condensed">
    <div
        class="card-body"
        [ngClass]="{ 'not-online': systemNotOnline }"
        (click)="openSystem()"
    >
        <h2>
            <nx-search-highlight
                [text]="system.name"
                [search]="search"
            ></nx-search-highlight>
        </h2>
        <!-- <span class="system-owner user-name">
            <nx-search-highlight
                [text]="getSystemOwnerName"
                [search]="search"
            ></nx-search-highlight>
        </span> -->
        <div class="system-list-bottom-bar">
            <div class="system-status">
                <svg-icon
                    *ngIf="needToConfigureTwoFactor"
                    nx-add-svg-src
                    [src]="CONFIG.icons.dir + 'lock.svg'"
                    [svgStyle]="{ 'height.px': '20' }"
                    [applyClass]="true"
                ></svg-icon>
                <span
                    *ngIf="systemNotOnline"
                    class="user-name"
                    >{{ systemState }}</span
                >
            </div>
        </div>
    </div>
    <div
        class="three-dots"
        (click)="menuOpen = !menuOpen"
        (nxClickElsewhere)="menuOpen = false"
    >
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div
            *ngIf="menuOpen"
            class="card-menu"
        >
            <div
                *ngIf="!openClient.processing"
                (click)="openClient.run()"
                class="card-menu-option"
                translate
            >
                Open in %VMS_NAME%
            </div>
            <div
                *ngIf="openClient.processing"
                class="card-menu-option no-hover"
                translate
            >
                Opening %VMS_NAME%...
            </div>
            <!-- eslint-disable-next-line nx/template/no-untranslated -->
            <div class="card-menu-option">Another system menu option</div>
        </div>
    </div>
</div>
