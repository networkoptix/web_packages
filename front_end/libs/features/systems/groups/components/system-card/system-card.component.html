<div class="system-button card card-condensed">
    <div
        class="card-body"
        [ngClass]="{ 'not-online': systemNotOnline }"
        (click)="openSystem()"
    >
        <h2 style="display: block !important">
            <nx-search-highlight
                [text]="system.name"
                [search]="search"
            ></nx-search-highlight>
        </h2>
        <div class="system-list-bottom-bar">
            <span
                *ngIf="showOwner && getSystemOwnerName"
                class="system-owner user-name"
            >
                <nx-search-highlight
                    [text]="getSystemOwnerName"
                    [search]="search"
                ></nx-search-highlight>
            </span>
            <div class="system-status">
                <span
                    *ngIf="systemNotOnline"
                    class="user-name"
                    >{{ systemState }}</span
                >
                <svg-icon
                    *ngIf="needToConfigureTwoFactor"
                    nx-add-svg-src
                    [src]="icons.dir + 'lock.svg'"
                    [svgStyle]="{ 'height.px': '20' }"
                    [applyClass]="true"
                ></svg-icon>
            </div>
        </div>
    </div>
    <div
        class="three-dots"
        [cdkMenuTriggerFor]="menu"
    >
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
    <ng-template #menu>
        <div
            class="card-menu"
            cdkMenu
        >
            <div
                *ngIf="!openClient.processing"
                (cdkMenuItemTriggered)="openClient.run()"
                class="card-menu-option"
                cdkMenuItem
                translate
            >
                Open in %VMS_NAME%
            </div>
            <div
                *ngIf="openClient.processing"
                class="card-menu-option no-hover"
                translate
            >
                Opening %VMS_NAME%...
            </div>
            <hr />
            <!-- eslint-disable-next-line nx/template/no-untranslated -->
            <div
                class="card-menu-option"
                cdkMenuItem
            >
                Another system menu option
            </div>
        </div>
    </ng-template>
</div>
