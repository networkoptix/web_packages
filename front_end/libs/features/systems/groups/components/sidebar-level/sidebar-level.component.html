<ul>
    <h3
        *ngIf="userLevel"
        class="user-level"
    >
        <svg-icon
            nx-add-svg-src
            [src]="
                icons.dir + (openState[userLevel] ? 'triangle_opened.svg' : 'triangle_closed.svg')
            "
            [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
            svgClass="triangle"
        ></svg-icon>
        <svg-icon
            nx-add-svg-src
            [src]="icons.dir + 'user.svg'"
            [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
        ></svg-icon>
        <a (click)="selectUserFilter(userLevel)"> {{ userLevel }} </a>
    </h3>
    <li *ngFor="let group of groups; trackBy: trackItem">
        <div
            class="group-drop-list"
            [ngClass]="{
                selected: (currentGroupId$ | async) === group.id,
                'no-nested-groups': !group.groups.length
            }"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="group"
            (cdkDropListDropped)="onDrop($event)"
        >
            <svg-icon
                (click)="openState[group.id] = !openState[group.id]"
                *ngIf="group.groups.length"
                nx-add-svg-src
                [src]="
                    icons.dir +
                    (openState[group.id] ? 'triangle_opened.svg' : 'triangle_closed.svg')
                "
                [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
                svgClass="triangle"
            ></svg-icon>
            <svg-icon
                nx-add-svg-src
                [src]="icons.dir + (openState[group.id] ? 'folder_open.svg' : 'folder.svg')"
                [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
                svgClass="folder"
            ></svg-icon>
            <h3
                cdkDrag
                [cdkDragData]="group"
                cdkDragBoundary=".sidebar"
            >
                <span *cdkDragPlaceholder></span>
                <a
                    [routerLink]="'/groups/' + group.id"
                    class="level-name"
                    >{{ group.name }}</a
                >
            </h3>
        </div>
        <nx-sidebar-level
            *ngIf="group.groups.length"
            [ngClass]="{ 'closed-level': !openState[group.id] }"
            [groups]="group.groups"
        ></nx-sidebar-level>
    </li>
</ul>
