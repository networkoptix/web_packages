<h3
    *ngIf="userLevel"
    class="user-level"
>
    <svg-icon
        (click)="toggleOpenState(userLevel)"
        nx-add-svg-src
        [src]="icons.dir + (openGroups[userLevel] ? 'triangle_opened.svg' : 'triangle_closed.svg')"
        [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
        svgClass="triangle"
    ></svg-icon>
    <svg-icon
        nx-add-svg-src
        [src]="icons.dir + 'user.svg'"
        [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
    ></svg-icon>
    <a (click)="selectUserFilter(userLevel)"> {{ userLevel }} </a>
</h3>
<ul
    [ngClass]="{
        'closed-level': userLevel ? !openGroups[userLevel] : groupId ? !openGroups[groupId] : false
    }"
>
    <li *ngFor="let group of groups; trackBy: trackItem">
        <div
            class="group-drop-list"
            [ngClass]="{
                selected: (currentGroupId$ | async) === group.id,
                'no-nested-groups': !group.groups.length
            }"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="group"
            (cdkDropListDropped)="onDrop($event)"
        >
            <svg-icon
                (click)="toggleOpenState(group.id)"
                *ngIf="group.groups.length"
                nx-add-svg-src
                [src]="
                    icons.dir +
                    (openGroups[group.id] ? 'triangle_opened.svg' : 'triangle_closed.svg')
                "
                [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
                svgClass="triangle"
            ></svg-icon>
            <svg-icon
                nx-add-svg-src
                [src]="icons.dir + (openGroups[group.id] ? 'folder_open.svg' : 'folder.svg')"
                [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
                svgClass="folder"
            ></svg-icon>
            <h3
                (click)="toggleOpenState(group.id)"
                cdkDrag
                [cdkDragData]="group"
                cdkDragBoundary=".sidebar"
            >
                <span *cdkDragPlaceholder></span>
                <a
                    [routerLink]="'/groups/' + group.id"
                    class="level-name"
                    [nxTooltip]="group.name"
                    >{{ group.name }}</a
                >
            </h3>
        </div>
        <nx-sidebar-level
            *ngIf="group.groups.length"
            [groups]="group.groups"
            [groupId]="group.id"
            [openGroups]="openGroups"
        ></nx-sidebar-level>
    </li>
</ul>
