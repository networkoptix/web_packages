<div class="system-button card card-condensed hoverable">
    <div
        class="card-body"
        (click)="openGroup()"
    >
        <h2 class="old-h12 d-block">
            <nx-search-highlight
                [text]="group.name"
                [search]="search"
            ></nx-search-highlight>
        </h2>
        <div class="system-list-bottom-bar">
            <span class="user-name">{{
                LANG.systemGroups.groupCount({ count: group.groups.length })
            }}</span>
            <span class="user-name">{{
                LANG.systemGroups.systemCount({ count: group.systemsCount })
            }}</span>
        </div>
    </div>
    <div
        class="three-dots"
        (click)="menuOpen = !menuOpen"
        (nxClickElsewhere)="menuOpen = false"
    >
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div
            *ngIf="menuOpen"
            class="card-menu"
        >
            <div
                class="card-menu-option"
                (click)="deleteGroup()"
                translate
            >
                Delete group
            </div>
            <!-- eslint-disable-next-line nx/template/no-untranslated -->
            <div class="card-menu-option">Another group menu option</div>
        </div>
    </div>
</div>
