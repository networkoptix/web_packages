<div class="system-button card card-condensed">
    <div
        class="card-body"
        (click)="openGroup()"
    >
        <h2>
            <svg-icon
                nx-add-svg-src
                [src]="icons.dir + 'folder2.svg'"
                [svgStyle]="{ 'width.rem': '1.5', 'height.rem': '2' }"
            ></svg-icon>
            <nx-search-highlight
                [text]="group.name"
                [search]="search"
            ></nx-search-highlight>
        </h2>
        <div class="system-list-bottom-bar">
            <div class="group-children">
                <span class="user-name">{{
                    LANG.systemGroups.groupCount({ count: group.groups.length })
                }}</span>
                <span class="user-name">{{
                    LANG.systemGroups.systemCount({ count: group.systemsCount })
                }}</span>
            </div>
        </div>
    </div>
    <div
        class="three-dots"
        [cdkMenuTriggerFor]="menu"
    >
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
    <ng-template #menu>
        <div
            class="card-menu"
            cdkMenu
        >
            <div
                class="card-menu-option"
                cdkMenuItem
                (cdkMenuItemTriggered)="deleteGroup()"
                translate
            >
                Delete group
            </div>
            <!-- eslint-disable-next-line nx/template/no-untranslated -->
            <div
                class="card-menu-option"
                cdkMenuItem
            >
                Another group menu option
            </div>
        </div>
    </ng-template>
</div>
