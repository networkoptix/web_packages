<div class="sidebar">
    <!-- No Groups View-->
    <div
        *ngIf="!hasGroups; else groupsSidebar"
        class="no-groups"
    >
        <!-- <img alt="placeholder image" /> -->
        <div class="intro-container">
            <div class="image-placeholder"></div>
            <h2 translate>Introducing System Groups</h2>
            <p [innerHTML]="LANG.systemGroups.introduction | translate"></p>
            <button
                class="btn btn-default"
                (click)="newGroupDialog()"
                translate
            >
                Create First Group
            </button>
        </div>
        <div class="intro-footer">
            <button
                class="cmb-2"
                (click)="dismissIntroduction()"
            >
                <svg-icon
                    nx-add-svg-src
                    [src]="icons.dirTextButtons + 'close.svg'"
                    [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                ></svg-icon>
                <p
                    class="mb-0 ml-2"
                    translate
                >
                    Not interested
                </p>
            </button>
        </div>
    </div>

    <!--Groups Sidebar-->
    <ng-template #groupsSidebar>
        <div
            [ngClass]="{
                selected: !currentGroupId
            }"
            cdkDropList
            (cdkDropListDropped)="moveToRoot($event)"
        >
            <h3 class="root">
                <a routerLink="/groups/">
                    {{
                        (showPersonal ? LANG.systemGroups.mySystems : LANG.systemGroups.shared)
                            | translate
                    }}
                </a>

                <button
                    *ngIf="showPersonal"
                    (click)="newGroupDialog()"
                >
                    <svg-icon
                        nx-add-svg-src
                        [src]="icons.dir + 'plus.svg'"
                        [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                    ></svg-icon>
                </button>
            </h3>
        </div>

        <nx-sidebar-level
            *ngIf="showPersonal; else showShared"
            [groups]="(personalSidebarItems$ | async)?.groups"
            [openGroups]="openGroups"
        ></nx-sidebar-level>
        <ng-template #showShared>
            <div
                *ngFor="let user of sharedSidebarItems$ | async | keyvalue"
                class="user-level"
            >
                <nx-sidebar-level
                    [groups]="(sharedSidebarItems$ | async)[user.key]?.groups"
                    [userLevel]="user.key"
                    [openGroups]="openGroups"
                >
                </nx-sidebar-level>
            </div>
        </ng-template>
    </ng-template>
</div>
