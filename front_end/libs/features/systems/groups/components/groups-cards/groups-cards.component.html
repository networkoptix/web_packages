<!-- Issue with "Unable to preventDefault inside passive event listener invocation." caused by monitoring? -->
<!-- https://github.com/angular/components/issues/24979#issuecomment-1203583528 -->
<div
    *ngIf="!(currentGroups$ | async).length && !(currentSystems$ | async).length; else showGroups"
    class="no-systems"
    translate
>
    No systems
</div>

<ng-template
    #showGroups
    let-groups="groups"
    let-systems="systems"
>
    <div class="px-3 cards-container">
        <div
            *ngFor="let group of currentGroups$ | async; trackBy: trackItem"
            class="group-card"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="group"
            (cdkDropListDropped)="onDrop($event)"
        >
            <div
                cdkDrag
                [cdkDragData]="group"
            >
                <div *cdkDragPlaceholder></div>
                <nx-group-card [group]="group"></nx-group-card>
            </div>
            <div class="placeholder-shadow"></div>
        </div>
        <div
            *ngFor="
                let system of (inRoot$ | async) ? [] : (currentSystems$ | async);
                trackBy: trackItem
            "
            class="system-card"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="system"
        >
            <div
                cdkDrag
                [cdkDragData]="system"
            >
                <div *cdkDragPlaceholder></div>
                <nx-system-card
                    [system]="system"
                    [search]="''"
                    [account]="account$ | async"
                ></nx-system-card>
            </div>
            <div class="placeholder-shadow"></div>
        </div>
    </div>
</ng-template>
