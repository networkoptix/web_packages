<!-- Issue with "Unable to preventDefault inside passive event listener invocation." caused by monitoring? -->
<!-- https://github.com/angular/components/issues/24979#issuecomment-1203583528 -->
<div
    *ngIf="emptyGroup; else showGroups"
    class="no-systems"
    translate
>
    No systems
</div>

<ng-template
    #user
    let-user
>
    <svg-icon
        nx-add-svg-src
        [src]="icons.dir + 'user.svg'"
        [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
    ></svg-icon>
    {{ user }}
</ng-template>

<ng-template
    #cards
    let-groups="groups"
    let-systems="systems"
>
    <div class="px-3 cards-container">
        <div
            *ngFor="let group of groups; trackBy: trackItem"
            class="group-card"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="group"
            (cdkDropListDropped)="onDrop($event)"
        >
            <div
                cdkDrag
                [cdkDragData]="group"
            >
                <div *cdkDragPlaceholder></div>
                <nx-group-card [group]="group"></nx-group-card>
            </div>
            <div class="placeholder-shadow"></div>
        </div>
        <div
            *ngFor="let system of systems; trackBy: trackItem"
            class="system-card"
            cdkDropList
            cdkDropListSortingDisabled
            [cdkDropListData]="system"
        >
            <div
                cdkDrag
                [cdkDragData]="system"
            >
                <div *cdkDragPlaceholder></div>
                <nx-system-card
                    [system]="system"
                    [search]="''"
                    [account]="account"
                ></nx-system-card>
            </div>
            <div class="placeholder-shadow"></div>
        </div>
    </div>
</ng-template>

<ng-template #showGroups>
    <ng-container *ngIf="showPersonal; else showShared">
        <ng-container
            *ngTemplateOutlet="
                cards;
                context: { groups: personalItems.groups, systems: personalItems.systems }
            "
        ></ng-container>
    </ng-container>
    <ng-template #showShared>
        <ng-container *ngIf="!currentSharedOwner; else userFilteredGroups">
            <div
                *ngFor="let owner of sharedItems | keyvalue"
                class="sharedGroups"
            >
                <ng-container
                    *ngTemplateOutlet="user; context: { $implicit: owner.key }"
                ></ng-container>
                <ng-container
                    *ngTemplateOutlet="
                        cards;
                        context: { groups: owner.value.groups, systems: owner.value.systems }
                    "
                ></ng-container>
            </div>
        </ng-container>
        <ng-template
            #userFilteredGroups
            class="sharedGroups"
        >
            <ng-template
                *ngTemplateOutlet="user; context: { $implicit: currentSharedOwner }"
            ></ng-template>
            <ng-container
                *ngTemplateOutlet="
                    cards;
                    context: {
                        groups: sharedItems[currentSharedOwner].groups,
                        systems: sharedItems[currentSharedOwner].systems
                    }
                "
            ></ng-container>
        </ng-template>
    </ng-template>
</ng-template>
