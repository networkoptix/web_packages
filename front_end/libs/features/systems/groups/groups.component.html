<div
    id="groups"
    cdkDropListGroup
>
    <div
        class="sidebar-container"
        [ngClass]="{ shown: (sidebarSetting.value$ | async)?.showSidebarState }"
    >
        <nx-pre-loader
            *ngIf="
                (sidebarSetting.value$ | async)?.showSidebarState &&
                    (loadingState$ | async) === LoadingState.LOADING;
                else loadedContent
            "
        ></nx-pre-loader>

        <ng-template #loadedContent>
            <div
                class="sidebar-toggling-ear-wrapper"
                (click)="handleSidebarTogglingEarClick()"
            >
                <div class="sidebar-toggling-ear">
                    <svg-icon
                        nx-add-svg-src
                        [src]="icons.dirTextButtons + 'arrow_expand.svg'"
                    >
                    </svg-icon>
                </div>
            </div>
            <div
                *ngIf="
                    (sidebarSetting.value$ | async)?.showSidebarState &&
                        !(rootGroups$ | async).length &&
                        !(currentGroups$ | async).length;
                    else groupsSidebar
                "
                class="sidebar no-groups"
            >
                <div class="intro-content">
                    <img alt="placeholder image" />
                    <h2 translate>Introducing System Groups</h2>
                    <p [innerHTML]="LANG.systemGroups.introduction | translate"></p>
                    <button
                        class="btn btn-default"
                        (click)="newGroupDialog()"
                        translate
                    >
                        Create First Group
                    </button>
                </div>

                <button (click)="dismissIntroduction()">
                    <svg-icon
                        nx-add-svg-src
                        [src]="icons.dirTextButtons + 'close.svg'"
                        [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                    ></svg-icon>
                    <p translate>Not interested</p>
                </button>
                <nx-sidebar-level [groups]="rootGroups$ | async"></nx-sidebar-level>
            </div>
            <ng-template #groupsSidebar>
                <div
                    class="sidebar"
                    *ngIf="(sidebarSetting.value$ | async)?.showSidebarState"
                >
                    <div
                        class="group-drop-list"
                        [ngClass]="{
                            selected: !(currentGroupId$ | async)
                        }"
                        cdkDropList
                        (cdkDropListDropped)="moveToRoot($event)"
                    >
                        <h3 class="root">
                            <a
                                routerLink="/groups/"
                                translate
                                >My Systems</a
                            >

                            <button
                                (click)="newGroupDialog()"
                                class="close-button"
                            >
                                <svg-icon
                                    nx-add-svg-src
                                    [src]="icons.dir + 'plus.svg'"
                                    [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                                ></svg-icon>
                            </button>
                        </h3>
                    </div>
                    <nx-sidebar-level [groups]="rootGroups$ | async"></nx-sidebar-level>
                </div>
            </ng-template>
        </ng-template>
    </div>
    <div class="cards">
        <nx-pre-loader *ngIf="(loadingState$ | async) === LoadingState.LOADING"></nx-pre-loader>
        <ng-container *ngIf="(loadingState$ | async) === LoadingState.LOADED">
            <div class="crumbs">
                <a
                    routerLink="/groups/"
                    translate
                    >My Systems</a
                >
                <ng-container *ngFor="let crumb of crumbs$ | async; trackBy: trackItem">
                    {{ ' / ' }}
                    <a [routerLink]="'/groups/' + crumb.id">{{ crumb.name }}</a>
                </ng-container>
            </div>
            <nx-groups-cards
                [groups]="currentGroups$ | async"
                [systems]="currentSystems$ | async"
            ></nx-groups-cards>
        </ng-container>
        <!-- TODO: Replace with actual placeholder -->
        <!-- eslint-disable-next-line nx/template/no-untranslated -->
        <div *ngIf="(loadingState$ | async) === LoadingState.NOT_FOUND">No group found</div>
    </div>
</div>
