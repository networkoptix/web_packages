<div
    id="groups"
    cdkDropListGroup
>
    <div
        class="sidebar-container"
        [ngClass]="{ shown: isSidebarShown }"
    >
        <nx-pre-loader *ngIf="(loadingState$ | async) === LoadingState.LOADING"></nx-pre-loader>
        <div
            class="sidebar-toggling-ear-wrapper"
            (click)="handleSidebarTogglingEarClick()"
            *ngIf="(loadingState$ | async) !== LoadingState.LOADING"
        >
            <div class="sidebar-toggling-ear">
                <svg-icon
                    nx-add-svg-src
                    [src]="icons.dirTextButtons + 'arrow_expand.svg'"
                >
                </svg-icon>
            </div>
        </div>
        <div
            class="sidebar"
            *ngIf="isSidebarShown && (loadingState$ | async) !== LoadingState.LOADING"
        >
            <div class="buttons">
                <button
                    class="btn btn-default mr-2"
                    (click)="newGroupDialog()"
                    [disabled]="(loadingState$ | async) === LoadingState.NOT_FOUND"
                    translate
                >
                    New group
                </button>
                <!-- eslint-disable-next-line nx/template/no-untranslated -->
                <!-- <button (click)="__crash()">Crash!</button> -->
            </div>
            <!-- TODO: Add styling when spec is updated  -->
            <div class="buttons">
                <button
                    class="btn btn-default mr-2"
                    (click)="setSidebarAll(true)"
                    translate
                >
                    Open all
                </button>
                <button
                    class="btn btn-default"
                    (click)="setSidebarAll(false)"
                    translate
                >
                    Collapse all
                </button>
            </div>
            <div
                class="group-drop-list"
                [ngClass]="{ selected: (currentGroupId$ | async) === undefined }"
                cdkDropList
                (cdkDropListDropped)="moveToRoot($event)"
            >
                <h3>
                    <a
                        routerLink="/groups/"
                        translate
                        >My Systems</a
                    >
                </h3>
            </div>
            <nx-sidebar-level [groups]="rootGroups$ | async"></nx-sidebar-level>
        </div>
    </div>
    <div class="cards">
        <nx-pre-loader *ngIf="(loadingState$ | async) === LoadingState.LOADING"></nx-pre-loader>
        <ng-container *ngIf="(loadingState$ | async) === LoadingState.LOADED">
            <div class="crumbs">
                <a
                    routerLink="/groups/"
                    translate
                    >My Systems</a
                >
                <ng-container *ngFor="let crumb of crumbs$ | async; trackBy: trackItem">
                    {{ ' / ' }}
                    <a [routerLink]="'/groups/' + crumb.id">{{ crumb.name }}</a>
                </ng-container>
            </div>
            <nx-groups-cards
                [groups]="currentGroups$ | async"
                [systems]="currentSystems$ | async"
            ></nx-groups-cards>
        </ng-container>
        <!-- TODO: Replace with actual placeholder -->
        <!-- eslint-disable-next-line nx/template/no-untranslated -->
        <div *ngIf="(loadingState$ | async) === LoadingState.NOT_FOUND">No group found</div>
    </div>
</div>
