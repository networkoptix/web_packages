<div
    id="groups"
    cdkDropListGroup
>
    <div class="sidebar">
        <nx-pre-loader
            *ngIf="(loadingState$ | async) === LoadingState.LOADING; else sideBarContent"
        ></nx-pre-loader>
        <ng-template #sideBarContent>
            <div class="buttons">
                <button
                    class="btn btn-default mr-2"
                    (click)="newGroupDialog()"
                    [disabled]="(loadingState$ | async) === LoadingState.NOT_FOUND"
                    translate
                >
                    New group
                </button>
                <!-- eslint-disable-next-line nx/template/no-untranslated -->
                <!-- <button (click)="__crash()">Crash!</button> -->
            </div>
            <!-- TODO: Add styling when spec is updated  -->
            <div class="buttons">
                <button
                    class="btn btn-default mr-2"
                    (click)="setSidebarAll(true)"
                    translate
                >
                    Open all
                </button>
                <button
                    class="btn btn-default"
                    (click)="setSidebarAll(false)"
                    translate
                >
                    Collapse all
                </button>
            </div>
            <div
                class="group-drop-list"
                [ngClass]="{ selected: (currentGroupId$ | async) === 'root' }"
                cdkDropList
                (cdkDropListDropped)="moveToRoot($event)"
            >
                <svg-icon
                    nx-add-svg-src
                    [src]="icons.dir + 'folder.svg'"
                    [svgStyle]="{ 'width.px': '25', 'height.px': '25' }"
                    svgClass="folder"
                ></svg-icon>
                <h3>
                    <a
                        routerLink="/systems/groups/root"
                        translate
                        >(root)</a
                    >
                </h3>
            </div>
            <nx-sidebar-level
                [groups]="rootGroups$ | async"
                [systems]="rootSystems$ | async"
            ></nx-sidebar-level>
        </ng-template>
    </div>
    <div class="cards">
        <nx-pre-loader *ngIf="(loadingState$ | async) === LoadingState.LOADING"></nx-pre-loader>
        <ng-container *ngIf="(loadingState$ | async) === LoadingState.LOADED">
            <div class="crumbs">
                <a
                    routerLink="/systems/groups/root"
                    translate
                    >(root)</a
                >
                <ng-container *ngFor="let crumb of crumbs$ | async; trackBy: trackItem">
                    {{ ' / ' }}
                    <a [routerLink]="'/systems/groups/' + crumb.id">{{ crumb.name }}</a>
                </ng-container>
            </div>
            <nx-groups-cards
                [groups]="currentGroups$ | async"
                [systems]="currentSystems$ | async"
            ></nx-groups-cards>
        </ng-container>
        <!-- TODO: Replace with actual placeholder -->
        <!-- eslint-disable-next-line nx/template/no-untranslated -->
        <div *ngIf="(loadingState$ | async) === LoadingState.NOT_FOUND">No group found</div>
    </div>
</div>
