@if (!system?.isOnline || !system.isAvailable) {
    <div class="placeholder-container">
        <nx-page-placeholder-no-settings></nx-page-placeholder-no-settings>
    </div>
} @else {
    <div class="placeholder-container no-cams">
        <nx-page-generic-placeholder>
            <svg-icon
                [src]="icons.dirPagePlaceholder + 'NoCams.svg'"
                [svgStyle]="{ 'height.px': 200 }"
            />
            <h2
                class="h2 title"
                translate
            >
                No Cameras
            </h2>
            <div class="message unique-message">
                <div translate>There are no accessible cameras for you in the system.</div>
                <div translate>
                    Connect a few cameras to the server’s local network to make them discoverable,
                    or ask the system administrator to change your access level.
                </div>
            </div>
        </nx-page-generic-placeholder>
    </div>
}
