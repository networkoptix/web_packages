<nx-pre-loader
    *ngIf="
        (!system?.show404 && showPreloader && !canEditCamera$$()) ||
        (system.isOnline && !system.isAvailable)
    "
>
</nx-pre-loader>
<div
    *ngIf="system && !system.show404 && canEditCamera$$()"
    class="row auth-visible"
>
    <ng-container>
        <div
            *ngIf="showUnauthorized || errors || warnings"
            class="col-12 camera-settings-info"
        >
            <nx-alert-block
                *ngIf="showUnauthorized"
                type="error"
                id="unauthorized-warning"
                [iconSrc]="icons.dirNonStandard + 'error.svg'"
                [line1]="'Camera is unauthorized' | translate"
                [btnCaption]="'Edit Credentials' | translate"
                (onAction)="updateCredentials()"
            >
            </nx-alert-block>
            <nx-alert-block
                *ngIf="showOffline"
                type="error"
                [iconSrc]="icons.dirNonStandard + 'error.svg'"
                [line1]="'Camera is offline' | translate"
            >
            </nx-alert-block>
            <nx-alert-block
                *ngFor="let error of errors"
                type="error"
                [iconSrc]="icons.dirNonStandard + 'error.svg'"
                [line1]="error"
            >
            </nx-alert-block>
            <nx-alert-block
                *ngFor="let warning of warnings"
                type="warning"
                [iconSrc]="icons.dirNonStandard + 'warning.svg'"
                [line1]="warning"
            >
            </nx-alert-block>
        </div>
        <div class="col-12 camera-settings-info">
            <nx-block header-style="extended">
                <header>
                    <div class="header-editable mb-3">
                        <nx-editable-heading
                            name="cameraName"
                            [(editMode)]="editMode"
                            [(nameWatcherValue)]="cameraNameWatcher.value"
                            [editEnabled]="canEditCamera$$()"
                        >
                        </nx-editable-heading>
                        <div
                            *ngIf="!editMode"
                            class="camera-button-div"
                        >
                            <button
                                *ngIf="canSeeView$$()"
                                class="legacy-btn camera-buttons"
                                [routerLink]="cameraViewPath"
                                id="view-camera"
                            >
                                <span>
                                    <svg-icon
                                        nx-add-svg-src
                                        [src]="icons.dirTextButtons + 'play.svg'"
                                        [applyClass]="true"
                                    ></svg-icon>
                                </span>
                                <span
                                    class="ml-1"
                                    translate
                                    >View</span
                                >
                            </button>
                            <button
                                *ngIf="canSeeInfo$$()"
                                class="legacy-btn camera-buttons"
                                id="detailed-info"
                                [routerLink]="fullInfoPath"
                                [queryParams]="{ id: camera.id }"
                            >
                                <span>
                                    <svg-icon
                                        nx-add-svg-src
                                        [src]="icons.dirTextButtons + 'info.svg'"
                                        [applyClass]="true"
                                    ></svg-icon>
                                </span>
                                <span
                                    class="ml-1"
                                    translate
                                    >Detailed Info</span
                                >
                            </button>
                        </div>
                    </div>
                    <div
                        class="camera-feed-img"
                        [style.width.px]="previewWidth"
                        [style.height.px]="120"
                    >
                        <nx-health-image
                            [isPrimary]="true"
                            aspect="override"
                            [preloader]="true"
                            [state]="canSeeLiveView$$() ? camera.status : CameraStatus.Unauthorized"
                            [url]="preview$ | async"
                            [lightBackground]="true"
                        ></nx-health-image>
                    </div>
                    <nx-info-block
                        [sectionsOrColumns]="cameraDetailColumns"
                        [infoBlockSize]="infoBlockSizeEnum.COMPACT"
                    ></nx-info-block>
                </header>
                <ng-template #deviceNotSupported>
                    <nx-open-client-section-placeholder
                        [translatedMessage]="
                            'Settings for this device are not available.' | translate
                        "
                    >
                    </nx-open-client-section-placeholder>
                </ng-template>
                <ng-container *ngIf="!settingsDisabled; else deviceNotSupported">
                    <nx-section>
                        <h4
                            class="h4 mb-3"
                            translate
                        >
                            Image
                        </h4>

                        <div class="grid-container">
                            <div class="grid-item">
                                <span
                                    class="text-right"
                                    translate
                                    >Aspect Ratio</span
                                >
                            </div>
                            <div class="grid-item mb-2 mb-md-0">
                                <nx-select-v2 [(ngModel)]="selectedAspectWatcher.value">
                                    <nx-select-item
                                        [value]="defaultAspectRatio"
                                        [selected]="
                                            selectedAspectWatcher.value === defaultAspectRatio
                                        "
                                    >
                                        {{ LANG.common.resolution.auto }}
                                    </nx-select-item>
                                    <nx-select-item
                                        *ngFor="let aspectRatio of aspectRatioOptions | keyvalue"
                                        [value]="aspectRatio.value"
                                        [selected]="
                                            aspectRatio.value === selectedAspectWatcher.value
                                        "
                                    >
                                        {{ aspectRatio.key }}
                                    </nx-select-item>
                                </nx-select-v2>
                            </div>
                            <div class="grid-item">
                                <span
                                    class="text-right"
                                    translate
                                    >Rotation</span
                                >
                            </div>
                            <div class="grid-item">
                                <nx-select-v2 [(ngModel)]="selectedRotationWatcher.value">
                                    <nx-select-item
                                        *ngFor="let rotation of rotationOptions"
                                        [value]="rotation"
                                        [selected]="rotation === selectedRotationWatcher.value"
                                    >
                                        {{ rotation }}˚
                                    </nx-select-item>
                                </nx-select-v2>
                            </div>
                        </div>
                    </nx-section>
                    <nx-section>
                        <h4
                            class="h4 mb-3"
                            translate
                        >
                            Audio
                        </h4>
                        <div class="d-flex checkbox-block align-items-center mt-1">
                            <nx-checkbox
                                name="audioEnabled"
                                componentId="audioEnabled"
                                [(ngModel)]="audioEnabled"
                                [disabled]="!camera.audioSupported"
                            >
                            </nx-checkbox>
                            <label
                                class="label control-label mb-0"
                                [ngClass]="!camera.audioSupported ? 'disabled-audio-label' : ''"
                                for="audioEnabled"
                            >
                                <span translate>Enable Audio</span>
                            </label>
                        </div>
                    </nx-section>
                    <nx-section>
                        <h4
                            class="h4 mb-3"
                            translate
                        >
                            Authentication
                        </h4>
                        <button
                            class="btn btn-default"
                            (click)="updateCredentials()"
                            id="update-credentials"
                        >
                            <span translate>Edit Credentials</span>
                        </button>
                    </nx-section>
                </ng-container>
            </nx-block>
        </div>
        <ng-container *ngIf="!settingsDisabled">
            <nx-recording-settings
                class="col-12 camera-settings-info mt-3"
                #recordingSettings
                [hidden]="settingsRecordingDisabled"
                [system]="system"
                [recordingWatcher]="recordingWatcher"
                [motionEnabledWatcher]="motionEnabledWatcher"
                [recordingModesWatcher]="recordingModesWatcher"
                [selectedFpsWatcher]="selectedFpsWatcher"
                [selectedCamera]="camera"
                [selectedQualityWatcher]="selectedQualityWatcher"
            >
            </nx-recording-settings>
            <nx-motion-detection-settings
                class="col-12 camera-settings-info mt-3"
                [motionEnabled]="recordingSettings?.motionEnabled"
                [enableMotion]="recordingSettings?.enableMotion"
                [disableMotion]="recordingSettings?.disableMotion"
                [resetSensitivity]="resetSensitivity"
                [sensitivityButtons$]="sensitivityButtons$"
                [healthImageUrl]="preview$"
                [selectedRotation]="selectedRotationWatcher.value || 0"
                [selectedAspectRatio]="selectedAspectWatcher.value || aspectRatioOptions['16:9']"
                [imageState]="canSeeLiveView$$() ? camera.status : CameraStatus.Unauthorized"
                [overlayEnabled]="overlayEnabled()"
                [(motionMaskString)]="motionMaskWatcher.value"
            ></nx-motion-detection-settings>
        </ng-container>
    </ng-container>
</div>
