<ng-template #showPreloader>
    <nx-pre-loader></nx-pre-loader>
</ng-template>

<div
    *ngIf="system && system.userManager.users && selectedUser && userGroupForm; else showPreloader"
    class="row d-flex align-items-start auth-visible"
>
    <form
        class="col-12"
        [formGroup]="userGroupForm"
    >
        <nx-block
            *ngIf="selectedUser"
            header-style="extended"
        >
            <header class="header-users">
                <div
                    class="header-username"
                    [ngClass]="{ 'mb-2': isCloud$$() }"
                >
                    <h2 class="fs-mask heading-style">{{ username }}</h2>
                    <div class="user-status-switch-wrapper">
                        <span
                            *ngIf="!userGroupForm.controls.isEnabled.value"
                            class="text-danger"
                            [ngClass]="{ 'pr-2': canBeEdited$$() }"
                            translate
                            >User disabled</span
                        >
                        <nx-switch
                            formControlName="isEnabled"
                            *ngIf="systemAvailable && editPermissions$$().enable"
                            id="user-active-status"
                            name="user-active-status"
                            showWarning
                        ></nx-switch>
                    </div>
                </div>
                <div>
                    <span
                        *ngIf="isCloud$$()"
                        class="fs-mask user-name"
                        >{{ selectedUser.fullName }}</span
                    >
                </div>
            </header>

            <nx-section>
                <div
                    *ngIf="editPermissions$$().changePermissions"
                    class="mr-2 mt-2 mb-3 pl-2"
                    style="width: 300px"
                >
                    <label
                        for="edit-user-groups"
                        class="font-weight-bold"
                        translate
                        >Permission Groups</label
                    >
                    <nx-multi-select
                        formControlName="groupIds"
                        *ngIf="editPermissions$$().changePermissions"
                        [componentId]="'edit-user-groups'"
                        name="userGroupsSelect"
                        [dataType]="DATA_TYPE.GROUPS"
                        [canSelectAll]="false"
                        [canSearch]="false"
                        [tooltipAlternateSecondary]="true"
                        [tooltipHorizontal]="true"
                        description="User Groups"
                        [items]="filteredGroups$$()"
                        [moreLeftPadding]="true"
                    >
                    </nx-multi-select>
                </div>
                <div
                    class="pl-2"
                    [ngClass]="{ 'mt-2': !canBeEdited$$() }"
                >
                    <ng-container *ngIf="canBeEdited$$(); else cantEdit">
                        <div
                            class="group-list-item edit"
                            *ngFor="let group of selectedGroupsList"
                        >
                            <ng-container *ngIf="selectedGroupsList.length > 1; else singleGroup">
                                <div class="multiple-groups">
                                    <span class="font-weight-bold group-name">
                                        {{ group.name | translate
                                        }}<span *ngIf="group.description">:</span>
                                    </span>
                                    <span class="help-block">{{
                                        group.description | translate
                                    }}</span>
                                </div>
                            </ng-container>
                            <ng-template #singleGroup>
                                <span class="help-block">{{ group.description | translate }}</span>
                            </ng-template>
                        </div>
                    </ng-container>
                    <ng-template #cantEdit>
                        <div
                            class="group-list-item"
                            *ngFor="let group of selectedGroupsList"
                        >
                            <div class="font-weight-bold group-name">
                                {{ group.name | translate }}
                            </div>
                            <div class="help-block">{{ group.description | translate }}</div>
                        </div>
                    </ng-template>
                </div>
                <div *ngIf="hasCustomPermissions$$()">
                    <nx-alert-block
                        type="info"
                        [iconSrc]="icons.dirNonStandard + 'info.svg'"
                        [line1]="LANG.toastMessage.customPermissions | translate"
                    ></nx-alert-block>
                </div>
            </nx-section>

            <nx-section
                type="no-spacing"
                *ngIf="!isCloud$$()"
            >
                <div
                    name="userSettingsForm"
                    class="d-table user-settings-form form inputs w-100 mw-100 col-lg-7 col-m-8"
                >
                    <div class="form-group d-flex">
                        <label
                            for="fullName"
                            class="control-label text-nowrap user-form-labels text-right"
                            [ngClass]="{
                                'disabled-input-label':
                                    !editPermissions$$().changeInfo || isLdap$$()
                            }"
                            translate
                            >Name</label
                        >
                        <input
                            formControlName="fullName"
                            type="text"
                            class="fs-mask form-control mx-0 w-100 mx-md-2 d-md-table-cell col-md-7"
                            name="fullName"
                            id="fullName"
                            [readonly]="isLdap$$()"
                            maxlength="255"
                        />
                    </div>
                    <div class="form-group d-flex">
                        <label
                            for="email"
                            class="control-label text-nowrap user-form-labels text-right"
                            [ngClass]="{
                                'disabled-input-label':
                                    !editPermissions$$().changeInfo || isLdap$$()
                            }"
                            translate
                            >Email</label
                        >
                        <input
                            formControlName="email"
                            type="email"
                            class="fs-mask form-control mx-0 w-100 mx-md-2 d-md-table-cell col-md-7"
                            name="email"
                            id="email"
                            pattern="{{ credentialsValidation.emailRegex }}"
                            maxlength="255"
                        />
                        <span
                            class="input-error mt-1 ml-2 d-block"
                            *ngIf="
                                userGroupForm?.controls &&
                                userGroupForm.controls.email.invalid &&
                                userGroupForm.controls.email.touched
                            "
                            translate
                            >Email format incorrect</span
                        >
                    </div>
                </div>
            </nx-section>

            <nx-section *ngIf="isAccountBlockFooterVisible$$()">
                <div
                    *ngIf="accountBlockFooterSettings$$().cloudAccountSettings"
                    class="float-left"
                >
                    <button
                        class="btn btn-default"
                        id="accountSettingsButton"
                        (click)="routeToAccountSettings()"
                        translate
                    >
                        Account Settings
                    </button>
                </div>
                <div
                    *ngIf="accountBlockFooterSettings$$().changePassword"
                    class="float-left"
                >
                    <button
                        class="btn btn-default"
                        (click)="changePassword()"
                        translate
                    >
                        Change Password
                    </button>
                </div>
                <div
                    class="float-right"
                    *ngIf="accountBlockFooterSettings$$().delete"
                >
                    <button
                        class="btn btn-default has-icon"
                        [disabled]="!systemAvailable"
                        (click)="removeUser()"
                    >
                        <svg-icon
                            nx-add-svg-src
                            [src]="icons.dir + 'delete.svg'"
                            [applyClass]="true"
                            [svgStyle]="{
                                'width.px': '24',
                                'height.px': '24',
                                'pointer-events': 'none'
                            }"
                        ></svg-icon>
                        <ng-container>{{ deleteMessage | translate }}</ng-container>
                    </button>
                </div>
            </nx-section>
        </nx-block>
    </form>
</div>

<nx-apply
    [standaloneMode]="true"
    [save]="editUser"
    [discard]="resetForm"
    [show]="userGroupForm?.dirty"
>
</nx-apply>
