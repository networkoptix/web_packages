<nx-pre-loader *ngIf="!system || !system.userManager.users || !selectedUser"></nx-pre-loader>

<div
    *ngIf="system"
    class="row d-flex align-items-start auth-visible"
>
    <div class="col-12">
        <nx-block
            *ngIf="selectedUser"
            header-style="extended"
        >
            <header class="header-users">
                <form
                    #userEnabledForm="ngForm"
                    name="userEnabledForm"
                    novalidate
                >
                    <div
                        class="header-username"
                        [ngClass]="{ 'mb-2': isCloud() }"
                    >
                        <h2 class="fs-mask heading-style">{{ username }}</h2>
                        <div class="user-status-switch-wrapper">
                            <span
                                *ngIf="!selectedUser.isEnabled"
                                class="text-danger"
                                [ngClass]="{ 'pr-2': canBeEdited() }"
                                translate
                                >User disabled</span
                            >
                            <nx-switch
                                *ngIf="systemAvailable && canBeEdited()"
                                [(ngModel)]="selectedUser.isEnabled"
                                id="user-active-status"
                                name="user-active-status"
                                showWarning
                            ></nx-switch>
                        </div>
                    </div>
                </form>
                <div>
                    <span
                        *ngIf="isCloud()"
                        class="fs-mask user-name"
                        >{{ selectedUser.fullName }}</span
                    >
                </div>
            </header>

            <nx-section>
                <div
                    *ngIf="canBeEdited() && !temporaryUser()"
                    class="mr-2 mt-2 mb-3 pl-2"
                    style="width: 300px"
                >
                    <form
                        #userGroupsForm="ngForm"
                        name="userGroupsForm"
                        novalidate
                    >
                        <label
                            for="user-groups"
                            class="font-weight-bold"
                            translate
                            >Permission Groups</label
                        >
                        <nx-multi-select
                            *ngIf="canBeEdited()"
                            id="user-groups"
                            name="userGroupsSelect"
                            [canSelectAll]="false"
                            [canSearch]="false"
                            [tooltipAlternateSecondary]="true"
                            [tooltipHorizontal]="true"
                            description="User Groups"
                            [items]="filteredGroups"
                            [ngModel]="selectedGroups"
                            (ngModelChange)="toggleGroup($event)"
                            [moreLeftPadding]="true"
                        >
                        </nx-multi-select>
                    </form>
                </div>
                <div
                    class="pl-2"
                    [ngClass]="{ 'mt-2': !canBeEdited() }"
                >
                    <p
                        class="group-list-item"
                        *ngFor="let group of selectedGroupsList"
                    >
                        <span class="font-weight-bold group-name"
                            >{{ group.name | translate
                            }}<span *ngIf="group.description">:</span></span
                        >
                        <span class="help-block">{{ group.description | translate }}</span>
                    </p>
                </div>
            </nx-section>

            <nx-section
                type="no-spacing"
                *ngIf="!isCloud()"
            >
                <form
                    #userSettingsForm="ngForm"
                    name="userSettingsForm"
                    class="d-table user-settings-form form inputs w-100 mw-100 col-lg-7 col-m-8"
                    novalidate
                >
                    <div class="form-group d-flex">
                        <label
                            for="fullName"
                            class="control-label text-nowrap user-form-labels text-right"
                            [ngClass]="{
                                'disabled-input-label': formDisabled()
                            }"
                            translate
                            >Name</label
                        >
                        <input
                            type="text"
                            class="fs-mask form-control mx-0 w-100 mx-md-2 d-md-table-cell col-md-7"
                            [(ngModel)]="fullName"
                            name="fullName"
                            id="fullName"
                            [disabled]="formDisabled() || temporaryUser()"
                            maxlength="255"
                        />
                    </div>
                    <div class="form-group d-flex">
                        <label
                            for="email"
                            class="control-label text-nowrap user-form-labels text-right"
                            [ngClass]="{
                                'disabled-input-label': formDisabled()
                            }"
                            translate
                            >Email</label
                        >
                        <input
                            type="email"
                            class="fs-mask form-control mx-0 w-100 mx-md-2 d-md-table-cell col-md-7"
                            [(ngModel)]="email"
                            name="email"
                            id="email"
                            #emailInput="ngModel"
                            pattern="{{ credentialsValidation.emailRegex }}"
                            [readonly]="isLdap()"
                            [disabled]="formDisabled() || temporaryUser()"
                            maxlength="255"
                        />
                        <span
                            class="input-error mt-1 ml-2 d-block"
                            *ngIf="emailInput.invalid && emailInput.touched"
                            translate
                            >Email format incorrect</span
                        >
                    </div>
                </form>
            </nx-section>

            <nx-section
                *ngIf="
                    (!environment.isLocal && isCloud() && isMe()) ||
                    (!isCloud() && canBeEdited()) ||
                    (isLocal() && isMe()) ||
                    canBeEdited()
                "
            >
                <div
                    *ngIf="!environment.isLocal && isCloud() && isMe()"
                    class="float-left"
                >
                    <button
                        class="btn btn-default"
                        id="accountSettingsButton"
                        (click)="routeToAccountSettings()"
                        translate
                    >
                        Account Settings
                    </button>
                </div>
                <div
                    *ngIf="
                        (!isCloud() && canBeEdited() && !temporaryUser()) || (isLocal() && isMe())
                    "
                    class="float-left"
                >
                    <button
                        class="btn btn-default"
                        (click)="changePassword()"
                        [disabled]="isLdap()"
                        translate
                    >
                        Change Password
                    </button>
                </div>
                <div
                    class="float-right"
                    *ngIf="canBeEdited()"
                >
                    <button
                        class="btn btn-default has-icon"
                        [disabled]="!systemAvailable"
                        (click)="removeUser()"
                    >
                        <svg-icon
                            nx-add-svg-src
                            [src]="icons.dir + 'delete.svg'"
                            [applyClass]="true"
                            [svgStyle]="{
                                'width.px': '24',
                                'height.px': '24',
                                'pointer-events': 'none'
                            }"
                        ></svg-icon>
                        <ng-container>{{ deleteMessage | translate }}</ng-container>
                    </button>
                </div>
            </nx-section>
        </nx-block>
    </div>
</div>

<ng-container #pageApply></ng-container>
