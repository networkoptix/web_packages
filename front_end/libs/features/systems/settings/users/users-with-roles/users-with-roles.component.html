<nx-pre-loader *ngIf="!system || !system.userManager.users || !selectedUser"></nx-pre-loader>

<div
    *ngIf="system"
    class="row d-flex align-items-start auth-visible"
>
    <form
        class="col-12"
        [formGroup]="userRoleForm"
    >
        <nx-block
            *ngIf="selectedUser"
            header-style="extended"
        >
            <header class="header-users">
                <div
                    class="header-username"
                    [ngClass]="{ 'mb-2': isCloud$$() }"
                >
                    <h2 class="fs-mask heading-style">{{ username }}</h2>
                    <div class="user-status-switch-wrapper">
                        <span
                            *ngIf="!userRoleForm.controls.isEnabled.value"
                            class="text-danger"
                            [ngClass]="{ 'pr-2': canBeEdited$$() }"
                            translate
                            >User disabled</span
                        >
                        <nx-switch
                            *ngIf="systemAvailable && canBeEdited$$()"
                            formControlName="isEnabled"
                            id="user-active-status"
                            name="user-active-status"
                            showWarning
                        ></nx-switch>
                    </div>
                </div>
                <div>
                    <span
                        *ngIf="isCloud$$()"
                        class="fs-mask user-name"
                        >{{ selectedUser.fullName }}</span
                    >
                </div>
            </header>

            <nx-section>
                <div
                    *ngIf="canBeEdited$$(); else roleName"
                    class="mr-2 my-2"
                    style="width: 300px"
                >
                    <label
                        for="permissionsSelect"
                        translate
                        >Access level</label
                    >
                    <nx-permissions-select
                        id="permissionsSelect"
                        name="permissionsSelect"
                        formControlName="role"
                        [system]="system"
                        [roles]="permissionRoles"
                    >
                    </nx-permissions-select>
                </div>
                <ng-template #roleName>
                    <h4>{{ role | translate }}</h4>
                </ng-template>
                <div>
                    <span
                        class="help-block pt-0"
                        [innerText]="accessDescription | translate"
                    ></span>
                </div>
            </nx-section>

            <nx-section
                type="no-spacing"
                *ngIf="!isCloud$$()"
            >
                <div
                    name="userSettingsForm"
                    class="d-table user-settings-form form inputs w-100 mw-100 col-lg-7 col-m-8"
                >
                    <div class="form-group d-flex">
                        <label
                            for="fullName"
                            class="control-label text-nowrap user-form-labels text-right"
                            [ngClass]="{
                                'disabled-input-label':
                                    !editPermissions$$().changeInfo || isLdap$$()
                            }"
                            translate
                            >Name</label
                        >
                        <input
                            formControlName="fullName"
                            type="text"
                            class="fs-mask form-control mx-0 w-100 mx-md-2 d-md-table-cell col-md-7"
                            name="fullName"
                            id="fullName"
                            maxlength="255"
                        />
                    </div>
                    <div class="form-group d-flex">
                        <label
                            for="email"
                            class="control-label text-nowrap user-form-labels text-right"
                            [ngClass]="{
                                'disabled-input-label':
                                    !editPermissions$$().changeInfo || isLdap$$()
                            }"
                            translate
                            >Email</label
                        >
                        <input
                            formControlName="email"
                            type="email"
                            class="fs-mask form-control mx-0 w-100 mx-md-2 d-md-table-cell col-md-7"
                            name="email"
                            id="email"
                            pattern="{{ credentialsValidation.emailRegex }}"
                            maxlength="255"
                        />
                        <span
                            class="input-error mt-1 ml-2 d-block"
                            *ngIf="
                                userRoleForm?.controls &&
                                userRoleForm.controls.email.invalid &&
                                userRoleForm.controls.email.touched
                            "
                            translate
                            >Email format incorrect</span
                        >
                    </div>
                </div>
            </nx-section>

            <nx-section *ngIf="canBeEdited$$() || isMe$$()">
                <div
                    *ngIf="!environment.isLocal && isCloud$$() && isMe$$()"
                    class="float-left"
                >
                    <button
                        class="btn btn-default"
                        id="accountSettingsButton"
                        (click)="routeToAccountSettings()"
                        translate
                    >
                        Account Settings
                    </button>
                </div>
                <div
                    *ngIf="editPermissions$$().changePassword"
                    class="float-left"
                >
                    <button
                        class="btn btn-default"
                        (click)="changePassword()"
                        [disabled]="isLdap$$()"
                        translate
                    >
                        Change Password
                    </button>
                </div>
                <div
                    class="float-right"
                    *ngIf="editPermissions$$().delete"
                >
                    <button
                        class="btn btn-default has-icon"
                        [disabled]="!systemAvailable"
                        (click)="removeUser()"
                    >
                        <svg-icon
                            nx-add-svg-src
                            [src]="icons.dir + 'delete.svg'"
                            [applyClass]="true"
                            [svgStyle]="{
                                'width.px': '24',
                                'height.px': '24',
                                'pointer-events': 'none'
                            }"
                        ></svg-icon>
                        {{ deleteMessage | translate }}
                    </button>
                </div>
            </nx-section>
        </nx-block>
    </form>
</div>
<nx-apply
    [standaloneMode]="true"
    [save]="editUser"
    [discard]="resetForm"
    [show]="userRoleForm?.dirty"
>
</nx-apply>
