<nx-pre-loader *ngIf="!before5dot2 && !fiveDot2Plus"></nx-pre-loader>

<nx-system-user-with-roles-component

    [selectedUser]="user"
    [system]="system"
></nx-system-user-with-roles-component>
<nx-system-user-with-groups-component
    *ngIf="fiveDot2Plus"

    [system]="system"
></nx-system-user-with-groups-component>
