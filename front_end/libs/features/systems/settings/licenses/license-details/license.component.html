<nx-block
    type="gray"
    *ngFor="let license of licenses"
    class="d-block mt-3"
>
    <header>
        <h4 class="fs-mask">{{ license.key }}</h4>
    </header>
    <nx-section>
        <nx-info-block
            [sectionsOrColumns]="orderedLicense[license.key]"
            [removeTopMargin]="true"
            [infoLineStyle]="infoLineStyle"
        >
        </nx-info-block>
    </nx-section>
</nx-block>
