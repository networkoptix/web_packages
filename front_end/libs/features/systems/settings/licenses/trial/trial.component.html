<nx-block
    class="d-block mt-3"
    *ngIf="!haveTrialLicense && trialLicense"
>
    <nx-section>
        <form
            class="form"
            role="form"
            id="trialLicenseForm"
            name="trialLicenseForm"
            #trialLicenseForm="ngForm"
            novalidate
            autocomplete="off"
        >
            <div>
                <div
                    id="trial_license_line1"
                    translate
                >
                    You have an unused time license.
                </div>
                <div
                    id="trial_license_line2"
                    translate
                >
                    Once activated, it will allow you to record up to 4 cameras for 30 days.
                </div>
            </div>
        </form>
    </nx-section>
    <nx-section>
        <nx-process-button
            [actionType]="'default'"
            [form]="trialLicenseForm"
            [process]="activateTrialKey"
            [buttonText]="'Activate Time License' | translate"
        >
        </nx-process-button>
    </nx-section>
</nx-block>
