<nx-block class="d-block mt-3">
    <header>
        <h4 translate>Log settings</h4>
    </header>
    <nx-section>
        <form
            class="form"
            role="form"
            name="logLevelsForm"
            #logLevelsForm="ngForm"
            novalidate
        >
            <nx-pre-loader *ngIf="loading"></nx-pre-loader>
            <div
                *ngIf="!loading && !showLoggers"
                translate
            >
                System is offline. This information is not available.
            </div>
            <div
                *ngFor="let logger of systemLoggers; let idx = index"
                class="form-group row"
            >
                <label
                    class="col-12 col-md-4 m-0 pr-0 d-flex align-items-center justify-content-end"
                    [innerText]="
                        (LANG.system.loggerDropdownLabel
                            | translate : { loggerName: logger.key }) || logger.key
                    "
                ></label>
                <div class="col-11 col-md-8">
                    <!--                    <mat-select disableRipple>-->
                    <!--                        <mat-option-->
                    <!--                            *ngFor="let option of loggerOptions"-->
                    <!--                            [ngModel]="selectedLevel(logger)"-->
                    <!--                            (ngModelChange)="onLevelSelect($event, logger)"-->
                    <!--                            [value]="option.value"-->
                    <!--                        >-->
                    <!--                            {{ option.name }}-->
                    <!--                        </mat-option>-->
                    <!--                    </mat-select>-->
                    <nx-select
                        [id]="logger.key"
                        [name]="logger.key"
                        [items]="loggerOptions"
                        [ngModel]="selectedLevel(logger)"
                        (ngModelChange)="onLevelSelect($event, logger)"
                        [forcePosition]="idx !== 0 ? { top: 'auto', bottom: 36 } : undefined"
                    ></nx-select>
                </div>
            </div>
        </form>
    </nx-section>
</nx-block>
