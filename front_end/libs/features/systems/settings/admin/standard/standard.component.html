<nx-alexa
    *ngIf="CONFIG.cloudCapabilities.alexaIntegrationEnabled"
    [system]="system"
></nx-alexa>

<form
    name="systemAndSecuritySettingsForm"
    class="form-horizontal"
    #systemAndSecuritySettingsForm="ngForm"
    novalidate
>
    <nx-block type="mt-3">
        <header><h4 translate>System Settings</h4></header>
        <nx-section-placeholder
            *ngIf="(system && settings === false) || !system.isOnline; else systemSettingsTemplate"
            svgFileName="system_settings_placeholder"
            width="64"
            [translatedMessage]="LANG.system.settings.notAbleToLoadSystem | translate"
        >
        </nx-section-placeholder>

        <ng-template #systemSettingsTemplate>
            <nx-pre-loader
                *ngIf="!settingsWatchersSet"
                [minHeight]="100"
            ></nx-pre-loader>
            <nx-section *ngIf="settingsWatchersSet">
                <div class="m-0">
                    <div class="form-check pl-0">
                        <div *ngIf="systemAndSecuritySettings.autoDiscoveryEnabled !== undefined">
                            <div class="d-flex checkbox-block align-items-center">
                                <nx-checkbox
                                    name="autoDiscoveryEnabled"
                                    componentId="autoDiscoveryEnabled"
                                    [(ngModel)]="systemAndSecuritySettings.autoDiscoveryEnabled"
                                    #autoDiscoveryEnabled="ngModel"
                                    description="autoDiscoveryEnabledHelpBlock"
                                >
                                </nx-checkbox>
                                <label
                                    class="control-label mb-0"
                                    for="autoDiscoveryEnabled"
                                >
                                    <span translate
                                        >Enable auto discovery of cameras and servers</span
                                    >
                                </label>
                            </div>
                            <label
                                id="autoDiscoveryEnabledHelpBlock"
                                class="form-text helper-block col-11 col-lg-9 col-xl-8 p-0"
                                for="autoDiscoveryEnabled"
                                translate
                                >When enabled, the system will discover new cameras and servers.
                                Also, it will automatically and persistently send discovery requests
                                to cameras in order to get the camera's status update. Status check
                                prohibition may be skipped on some servers that have failover
                                enabled.</label
                            >
                        </div>
                        <div *ngIf="systemAndSecuritySettings.statisticsAllowed !== undefined">
                            <div class="d-flex checkbox-block align-items-center mt-1">
                                <nx-checkbox
                                    name="statisticsAllowed"
                                    componentId="statisticsAllowed"
                                    [(ngModel)]="systemAndSecuritySettings.statisticsAllowed"
                                    #statisticsAllowed="ngModel"
                                    description="statisticsAllowedHelpBlock"
                                >
                                </nx-checkbox>

                                <label
                                    class="control-label mb-0"
                                    for="statisticsAllowed"
                                >
                                    <span translate
                                        >Send anonymous usage and crash statistics to
                                        developers</span
                                    >
                                </label>
                            </div>
                            <label
                                id="statisticsAllowedHelpBlock"
                                class="form-text helper-block col-11 col-lg-9 col-xl-8 p-0"
                                for="statisticsAllowed"
                                translate
                                >Includes information about the System, such as camera modules,
                                firmware versions, number of servers, etc. Does not include any
                                personal information and is completely anonymous.</label
                            >
                        </div>
                        <div
                            class="d-flex checkbox-block align-items-center mt-1"
                            *ngIf="
                                systemAndSecuritySettings.cameraSettingsOptimization !== undefined
                            "
                        >
                            <nx-checkbox
                                name="cameraSettingsOptimization"
                                componentId="cameraSettingsOptimization"
                                [(ngModel)]="systemAndSecuritySettings.cameraSettingsOptimization"
                                #cameraSettingsOptimization="ngModel"
                            >
                            </nx-checkbox>

                            <label
                                class="control-label mb-0"
                                for="cameraSettingsOptimization"
                            >
                                <span translate>Allow system to optimize camera settings</span>
                            </label>
                        </div>
                    </div>
                </div>
            </nx-section>
        </ng-template>
    </nx-block>
    <nx-block
        type="mt-3"
        *ngIf="canEditSecurity"
    >
        <header><h4 translate>Security</h4></header>
        <nx-section-placeholder
            *ngIf="
                (system && settings === false) || !system.isOnline;
                else securitySettingsTemplate
            "
            svgFileName="system_settings_placeholder"
            width="64"
            [translatedMessage]="LANG.system.settings.notAbleToLoadSecurity | translate"
        >
        </nx-section-placeholder>
        <ng-template #securitySettingsTemplate>
            <nx-pre-loader
                *ngIf="!settingsWatchersSet"
                [minHeight]="100"
            ></nx-pre-loader>
            <nx-section *ngIf="settingsWatchersSet">
                <div class="form-check p-0 mr-4">
                    <ng-container *ngIf="systemAndSecuritySettings.auditTrailEnabled !== undefined">
                        <div class="d-flex checkbox-block align-items-center">
                            <nx-checkbox
                                name="auditTrailEnabled"
                                componentId="auditTrailEnabled"
                                [(ngModel)]="systemAndSecuritySettings.auditTrailEnabled"
                                #auditTrailEnabled="ngModel"
                                description="auditTrailEnabledHelpBlock"
                            >
                            </nx-checkbox>

                            <label
                                class="control-label mb-0"
                                for="auditTrailEnabled"
                            >
                                <span translate>Enable audit trail</span>
                            </label>
                        </div>
                        <label
                            id="auditTrailEnabledHelpBlock"
                            class="form-text helper-block col-11 col-lg-9 col-xl-8 p-0"
                            for="auditTrailEnabled"
                            translate
                        >
                            Tracks and logs all user actions.
                        </label>
                    </ng-container>
                    <div
                        class="d-flex checkbox-block align-items-center mt-1"
                        *ngIf="systemAndSecuritySettings.trafficEncryptionForced !== undefined"
                    >
                        <nx-checkbox
                            name="trafficEncryptionForced"
                            componentId="trafficEncryptionForced"
                            [(ngModel)]="systemAndSecuritySettings.trafficEncryptionForced"
                            #trafficEncryptionForced="ngModel"
                        >
                        </nx-checkbox>

                        <label
                            class="control-label mb-0"
                            for="trafficEncryptionForced"
                        >
                            <span translate
                                >Force servers to accept only encrypted connections</span
                            >
                        </label>
                    </div>
                    <label
                        id="trafficEncryptionForcedHelpBlock"
                        class="form-text helper-block col-11 col-lg-9 col-xl-8 p-0"
                        for="trafficEncryptionForced"
                        ><span translate
                            >Does not affect the connections established by server.</span
                        >
                    </label>
                    <ng-container
                        *ngIf="systemAndSecuritySettings.videoTrafficEncryptionForced !== undefined"
                    >
                        <div class="d-flex checkbox-block align-items-center mt-1">
                            <nx-checkbox
                                name="videoTrafficEncryptionForced"
                                componentId="videoTrafficEncryptionForced"
                                [(ngModel)]="systemAndSecuritySettings.videoTrafficEncryptionForced"
                                (click)="setWarningMessageThroughApplyService()"
                                #videoTrafficEncryptionForced="ngModel"
                            >
                            </nx-checkbox>

                            <label
                                class="control-label mb-0"
                                for="videoTrafficEncryptionForced"
                            >
                                <span translate
                                    >Encrypt video traffic to desktop and mobile clients</span
                                >
                            </label>
                        </div>
                        <label
                            id="videoTrafficEncryptionForcedHelpBlock"
                            class="form-text helper-block col-11 col-lg-9 col-xl-8 p-0"
                            for="videoTrafficEncryptionForced"
                        >
                            <span translate>Enables RTSP traffic encryption.</span>
                        </label>
                    </ng-container>
                    <ng-container
                        *ngIf="
                            !environment.isLocal &&
                            system.useRest &&
                            system.permissionManager.isOwner$$()
                        "
                    >
                        <div class="d-flex checkbox-block align-items-center mt-1">
                            <nx-checkbox
                                name="mandatory2fa"
                                componentId="mandatory2fa"
                                (click)="handleMandatory2fa($event)"
                                [(ngModel)]="system2faEnabled"
                                [ngModelOptions]="{ standalone: true }"
                            >
                            </nx-checkbox>

                            <label
                                class="control-label mb-0"
                                for="mandatory2fa"
                                (click)="handleMandatory2fa($event)"
                            >
                                <span translate
                                    >Mandatory two-factor authentication for cloud users</span
                                >
                            </label>
                        </div>
                        <label
                            id="mandatory2faHelpBlock"
                            class="form-text helper-block col-11 col-lg-9 col-xl-8 p-0"
                            for="mandatory2fa"
                            (click)="handleMandatory2fa($event)"
                        >
                            <span translate
                                >Cloud users without two-factor authentication will not be able to
                                log in to the system. Does not affect local and LDAP users.</span
                            >
                        </label>
                    </ng-container>
                    <div class="d-flex checkbox-block align-items-center mt-1">
                        <nx-checkbox
                            name="sessionLimitMinutesToggle"
                            componentId="sessionLimitMinutesToggle"
                            [(ngModel)]="sessionLimitToggle"
                            (ngModelChange)="handleSessionLimitToggle()"
                            [ngModelOptions]="{ standalone: true }"
                            #sessionLimitMinutes="ngModel"
                        >
                        </nx-checkbox>

                        <label
                            class="control-label mb-0"
                            for="sessionLimitMinutesToggle"
                        >
                            <span translate>Limit session duration to</span>
                        </label>

                        <input
                            type="hidden"
                            name="sessionLimitMinutes"
                            [(ngModel)]="systemAndSecuritySettings.sessionLimitMinutes"
                        />
                    </div>
                    <div class="session-alert">
                        <nx-alert-block
                            *ngIf="!sessionLimitToggle"
                            type="warning"
                            [iconSrc]="icons.dirNonStandard + 'warning.svg'"
                            [line1]="
                                'Unlimited user session lifetime threatens overall system security'
                                    | translate
                            "
                            [nxForceVisibility]="sessionLimitMinutes.touched"
                            [intersectionDebounce]="50"
                            [visibilityMargin]="'0px 0px -105px 0px'"
                            [visibilityThreshold]="1"
                            forceVisibilityOnce
                        ></nx-alert-block>
                    </div>
                    <div class="row ml-4 my-2">
                        <div
                            class="mr-2"
                            style="width: 70px"
                        >
                            <nx-numeric
                                [class]="'pl-2'"
                                [min]="1"
                                [max]="currentMaxTimeUnit"
                                [disabled]="!sessionLimitToggle"
                                [(ngModel)]="sessionLimitValue"
                                [ngModelOptions]="{ standalone: true }"
                                (onChange)="updateSessionLimitValue($event)"
                                #sessionLimitValueInput="ngModel"
                            ></nx-numeric>
                        </div>
                        <nx-select
                            [componentId]="'serverTimeUnitSelect'"
                            #selectorTracker
                            class="time-unit-select"
                            [disabled]="!sessionLimitToggle"
                            [items]="limitSessionTimeItems"
                            [selected]="selectedTimeUnit"
                            (onSelected)="updateTimeUnitInput($event)"
                        ></nx-select>
                    </div>
                    <div class="session-alert">
                        <nx-alert-block
                            *ngIf="
                                sessionLimitToggle &&
                                systemAndSecuritySettings.sessionLimitMinutes > 30 * DAY_MINS
                            "
                            type="warning"
                            [iconSrc]="icons.dirNonStandard + 'warning.svg'"
                            [line1]="
                                'The recommended maximum user session lifetime is 30 days.'
                                    | translate
                            "
                            [nxForceVisibility]="sessionLimitValueInput?.touched || false"
                            [intersectionDebounce]="50"
                            [visibilityMargin]="'0px 0px -65px 0px'"
                            [visibilityThreshold]="1"
                            forceVisibilityOnce
                        ></nx-alert-block>
                    </div>
                </div>
            </nx-section>
        </ng-template>
    </nx-block>
</form>
