<ng-template #systemNotReady>
    <nx-pre-loader></nx-pre-loader>
</ng-template>
<nx-block
    type="mt-3"
    *ngIf="haveAdvSettings; else systemNotReady"
>
    <header>
        <h4 translate>Advanced System Settings</h4>
    </header>
    <nx-section *ngIf="(systemSettings | keyvalue)?.length > 0">
        <form
            class="form form-horizontal"
            role="form"
            name="advancedSystemSettingsForm"
            id="advancedSystemSettingsForm"
            #advancedSystemSettingsForm="ngForm"
            novalidate
            autocomplete="off"
        >
            <div
                class="form-group col-12 row p-0 m-0 mb-3"
                *ngFor="let setting of systemSettings | keyvalue; trackBy: trackSettingsObject"
            >
                <div class="form-group col-12 row p-0 m-0">
                    <div class="col-12 row p-0 d-flex align-items-center">
                        <div
                            class="col-12 col-md-4 pr-1 pl-3 m-0 d-flex flex-column key-align text-right item align-self-start"
                        >
                            <div
                                class="setting-title"
                                [innerHTML]="getDescription(setting.key) | translate | safe: 'html'"
                            ></div>
                            <div
                                class="text-muted break-long"
                                *ngIf="LANG.settingsConfig[setting.key]"
                            >
                                {{ setting.key | translate }}
                            </div>
                        </div>

                        <div
                            class="col-12 col-md-8 d-flex align-items-start justify-content-start flex-column item"
                        >
                            <!-- Switch required for number handling due to Angulur issue #13243 -->
                            <ng-container
                                [ngSwitch]="settingsConfig[setting.key]?.type"
                                *ngIf="editable(setting.key)"
                            >
                                <input
                                    *ngSwitchCase="'number'"
                                    type="number"
                                    autocomplete="off"
                                    [id]="setting.key"
                                    [name]="setting.key"
                                    [ngModel]="systemSettings[setting.key]"
                                    class="form-control input-sm"
                                />
                                <nx-checkbox
                                    *ngSwitchCase="'checkbox'"
                                    style="margin-top: 2px"
                                    [componentId]="setting.key"
                                    name="{{ setting.key }}"
                                    [ngModel]="systemSettings[setting.key]"
                                >
                                </nx-checkbox>
                                <nx-system-detailed-setting-component
                                    *ngSwitchCase="'object'"
                                    [settingsObject]="systemSettings[setting.key]"
                                    (settingsObjectChange)="
                                        systemSettingsChanged($event, setting.key)
                                    "
                                ></nx-system-detailed-setting-component>
                                <input
                                    *ngSwitchDefault
                                    [type]="settingsConfig[setting.key]?.type"
                                    [autocomplete]="
                                        settingsConfig[setting.key]?.type === 'password'
                                            ? 'new-password'
                                            : 'off'
                                    "
                                    [id]="setting.key"
                                    [name]="setting.key"
                                    [ngModel]="systemSettings[setting.key]"
                                    class="form-control input-sm"
                                />
                            </ng-container>
                            <p
                                *ngIf="
                                    ['static', 'undefined'].includes(
                                        settingsConfig[setting.key]?.type || 'undefined'
                                    )
                                "
                                class="input-sm m-0"
                            >
                                {{ systemSettings[setting.key] || 'empty' | json }}
                            </p>

                            <div
                                class="help-block text-left"
                                *ngIf="settingsConfig[setting.key]?.alert"
                                [innerHTML]="settingsConfig[setting.key]?.alert | safe: 'html'"
                            ></div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </nx-section>
</nx-block>
