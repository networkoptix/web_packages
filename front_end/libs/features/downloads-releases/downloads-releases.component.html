<div class="fixed-sidebar col-12 d-flex flex-column fill-screen-height">
    <nx-menu [content]="content"></nx-menu>

    <!-- FOR TESTING ONLY: REMOVE -->
    <hr />
    <nx-checkbox
        componentId="releases"
        [(ngModel)]="data.releases"
        [ngModelOptions]="{ standalone: true }"
        labelText="releases"
        disabled
        [checked]="true"
    >
    </nx-checkbox>
    <nx-checkbox
        componentId="betas"
        [(ngModel)]="data.betas"
        [ngModelOptions]="{ standalone: true }"
        (onClick)="initMenu()"
        labelText="betas"
        [checked]="true"
    ></nx-checkbox>
    <nx-checkbox
        componentId="patches"
        [(ngModel)]="data.patches"
        [ngModelOptions]="{ standalone: true }"
        (onClick)="initMenu()"
        labelText="patches"
        [checked]="true"
    ></nx-checkbox>
    <nx-checkbox
        componentId="other"
        [(ngModel)]="data.other"
        [ngModelOptions]="{ standalone: true }"
        (onClick)="initMenu()"
        labelText="other"
        [checked]="true"
    ></nx-checkbox>
    <!-- FOR TESTING ONLY: REMOVE -->
</div>

<div class="col-12 col-md-8 col-xl-7 pt-3 pt-md-0">
    <router-outlet></router-outlet>
    <nx-footer></nx-footer>
</div>
