<input
    #input
    type="number"
    inputmode="numeric"
    pattern="[0-9]*"
    class="form-control"
    id="{{ componentId }}"
    name="{{ componentId }}"
    min="{{ min }}"
    max="{{ max }}"
    [placeholder]="placeholder"
    [ngClass]="class"
    [step]="step || 1"
    [disabled]="disabled"
    [(ngModel)]="_value"
    (paste)="onPaste($event)"
    (input)="valueChanged($event)"
    (keydown)="onKeyDown($event)"
    (keyup)="valueChanged()"
/>
<div
    class="spinner-button spinner-button--increment"
    (mousedown)="increment($event)"
>
    <svg-icon
        nx-add-svg-src
        [src]="icons.dirTextButtons + 'arrow_expand.svg'"
    ></svg-icon>
</div>
<div
    class="spinner-button spinner-button--decrement"
    (mousedown)="decrement($event)"
>
    <svg-icon
        nx-add-svg-src
        [src]="icons.dirTextButtons + 'arrow_expand.svg'"
    ></svg-icon>
</div>
