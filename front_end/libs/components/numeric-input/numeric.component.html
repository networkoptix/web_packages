<input
    type="number"
    inputmode="numeric"
    pattern="[0-9]*"
    style="padding-right: 2px !important"
    class="form-control"
    id="{{ componentId }}"
    name="{{ componentId }}"
    min="{{ min }}"
    max="{{ max }}"
    [placeholder]="placeholder"
    [ngClass]="class"
    [step]="step || 1"
    [disabled]="disabled"
    [(ngModel)]="_value"
    (paste)="onPaste($event)"
    (change)="valueChanged($event)"
    (keyup)="setValue($event)"
    (keydown)="checkValue($event)"
/>
<div class="spinner-button spinner-button--increment">
    <svg-icon
        nx-add-svg-src
        [src]="icons.dirTextButtons + 'arrow_expand.svg'"
    ></svg-icon>
</div>
<div class="spinner-button spinner-button--decrement">
    <svg-icon
        nx-add-svg-src
        [src]="icons.dirTextButtons + 'arrow_expand.svg'"
    ></svg-icon>
</div>
