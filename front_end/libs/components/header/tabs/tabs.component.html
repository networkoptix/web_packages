<ng-template #tabDropdown>
    <nx-nav-dropdown [dropdownNode]="node"></nx-nav-dropdown>
</ng-template>

<li
    class="tab-link"
    *ngIf="node && !node.new_window"
    [ngClass]="{ active: headerService.currentLocation.path === node.url }"
    [attr.data-testid]="headerService.currentLocation.path === node.url ? 'activeTabLink' : null"
>
    <a
        *ngIf="!node.nodes?.length; else tabDropdown"
        [routerLink]="node.url"
        [queryParamsHandling]="node.queryParamsHandling"
        class="pl-3 pr-3 d-block w-100 h-100"
        (click)="headerService.handleNav(node, $event); $event.preventDefault()"
        [textContent]="node.display_name | translate"
    ></a>
</li>
