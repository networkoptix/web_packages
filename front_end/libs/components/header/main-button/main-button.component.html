<li>
    <div
        class="d-flex flex-row main-button"
        [ngClass]="{ 'hide-arrow': hideArrow }"
    >
        <div
            class="dropdown"
            (nxClickElsewhere)="headerService.show$ = false"
            [ngClass]="{ show: headerService.showSubject | async, 'hide-title': !hideArrow }"
        >
            <button
                class="inset btn btn-dropdown-toggle dropdown-toggle-transparent dropdown-toggle"
                (click)="headerService.show$ = !headerService.show$"
                type="button"
                id="systemsDropdown"
                data-toggle="dropdown"
            >
                <div
                    class="popup arrow up"
                    [ngClass]="{ center: !headerService.activeSystem }"
                ></div>
                <div class="icon-wrapper">
                    <svg-icon
                        [src]="icon"
                        [applyClass]="true"
                        [svgStyle]="{
                            'width.px': '24',
                            'height.px': '24',
                            display: 'inline-block'
                        }"
                    ></svg-icon>
                </div>
                <ng-container [ngSwitch]="getState()">
                    <span
                        *ngSwitchCase="'system'"
                        class="ellipsis"
                        [style.max-width.px]="maxWidth"
                        >{{ headerService.activeSystem?.name || node?.display_name }}</span
                    >
                    <span *ngSwitchCase="'systems'"
                        >{{ systemCounter }}&nbsp;<span translate>Systems</span></span
                    >
                    <span
                        *ngSwitchCase="'node'"
                        [innerText]="node.display_name"
                    ></span>
                    <span
                        *ngSwitchCase="'all'"
                        translate
                        >All Site</span
                    >
                </ng-container>
            </button>
            <nx-drop-menu
                [endpoint]="endpoint"
                [systems]="systems"
            ></nx-drop-menu>
        </div>
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirHeader + 'header_arrow.svg'"
        ></svg-icon>
    </div>
</li>
