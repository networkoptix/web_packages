@if (isMobile$ | async) {
    @defer {
        <nx-header-mobile
            [loggedIn]="loggedIn$ | async"
            [menuNodes]="displayedNodes"
            [systemCount]="systemCount$ | async"
        ></nx-header-mobile>
    }
} @else {
    @defer {
        <nx-header-level-one
            [menuNodes]="displayedNodes"
            [selectedNode]="selectedNode"
            [noSystems]="(systemCount$ | async) === 0"
            (nodeSelect)="handleNodeSelect($any($event))"
            [loggedIn]="loggedIn$ | async"
        >
        </nx-header-level-one>
        <nx-header-level-two
            [subNodes]="selectedNode?.nodes"
            (systemNav)="navigateToSystemsList()"
            [systemCount]="systemCount$ | async"
        >
        </nx-header-level-two>
    }
    @defer (when themeGeneratorLayout === 'test') {
        <nx-theme-generator [generatorLayout]="themeGeneratorLayout"></nx-theme-generator>
    }
}
