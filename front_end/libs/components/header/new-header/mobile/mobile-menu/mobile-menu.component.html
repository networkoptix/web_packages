<div
    class="menu-container"
    [ngClass]="{ tablet: isTablet }"
>
    <div
        class="menu-items-container"
        *ngIf="!isProfile; else profile"
    >
        <ng-container *ngFor="let node of menuNodes">
            <div
                *ngIf="!node.invisible && !(singleSystem && node.url === '/systems')"
                class="menu-item"
            >
                <div class="node-name">{{ node.display_name | translate }}</div>
                <ng-container
                    *ngTemplateOutlet="menuItems; context: { subnodes: node.nodes }"
                ></ng-container>
            </div>
            <div
                class="menu-item"
                *ngIf="showCurrentSystem && node.url === '/systems'"
            >
                <div class="node-name">
                    {{ currentSystemMenu.display_name | translate }}
                </div>
                <ng-container
                    *ngTemplateOutlet="menuItems; context: { subnodes: currentSystemMenu.nodes }"
                ></ng-container>
            </div>
        </ng-container>
    </div>
    <div
        class="account-button-wrapper"
        *ngIf="!loggedIn"
    >
        <a
            [href]="headerService.authorizeUrl"
            class="btn btn-primary account-button"
            translate
        >
            Log In
        </a>
    </div>
</div>

<ng-template #profile>
    <div class="menu-items">
        <div
            *ngFor="let node of profileMenu"
            class="level-two-item"
        >
            <div
                class="subnode"
                (click)="nodeClick(node, $event)"
                [ngClass]="{
                    active:
                        headerService.currentLocation?.path === node.url ||
                        (!headerService.currentLocation?.path && node.url === 'content/about')
                }"
            >
                {{ node.display_name | translate }}
                <svg-icon
                    *ngIf="node.new_window"
                    [src]="images.dirHeader + 'external_link.svg'"
                ></svg-icon>
            </div>
        </div>
    </div>
    <div
        class="account-button-wrapper"
        [ngClass]="{ tablet: isTablet }"
    >
        <div
            class="logout-button btn account-button"
            (click)="logout()"
            translate
        >
            Log Out
        </div>
    </div>
</ng-template>

<ng-template
    #menuItems
    let-subnodes="subnodes"
>
    <div class="menu-items">
        <div
            *ngFor="let subnode of subnodes"
            class="level-two-item"
        >
            <div
                class="subnode"
                (click)="nodeClick(subnode, $event)"
                [ngClass]="{
                    active:
                        headerService.currentLocation?.path === subnode.url ||
                        (!headerService.currentLocation?.path && subnode.url === 'content/about')
                }"
            >
                {{ subnode.display_name | translate }}
                <svg-icon
                    *ngIf="subnode.new_window"
                    [src]="images.dirHeader + 'external_link.svg'"
                ></svg-icon>
            </div>
        </div>
    </div>
</ng-template>

<ng-template #currentSystem>
    <div
        class="menu-item"
        *ngIf="showCurrentSystem"
    >
        <div class="node-name">
            {{ currentSystemMenu.display_name | translate }}
        </div>
        <ng-container
            *ngTemplateOutlet="menuItems; context: { subnodes: currentSystemMenu.nodes }"
        ></ng-container>
    </div>
</ng-template>
