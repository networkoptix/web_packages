<div class="menu-level-one">
    <ng-container *ngFor="let node of menuNodes">
        <ng-container
            *ngTemplateOutlet="
                node.new_window ? externalLink : internalLink;
                context: { node: node }
            "
        ></ng-container>
    </ng-container>
    <ng-container *ngIf="loggedIn !== undefined">
        <nx-account-settings-select *ngIf="loggedIn"></nx-account-settings-select>
        <a
            *ngIf="!loggedIn"
            [href]="headerService.createUrl"
            class="create-account"
        >
            {{ LANG.createAccount | translate | uppercase }}
        </a>
        <nx-header-language-select
            *ngIf="!loggedIn"
            class="auto"
            short="true"
            altStyle="true"
            id="languageSelect3"
            inHeader
        ></nx-header-language-select>
    </ng-container>
</div>

<ng-template
    #internalLink
    let-node="node"
>
    <a
        *ngIf="!node.invisible"
        (click)="node?.name !== selectedNode?.name ? onNodeSelect(node, $event) : null"
        [ngClass]="{ active: node?.name === selectedNode?.name }"
        class="menu-item btn btn-menu"
    >
        {{ node.display_name | translate }}
    </a>
</ng-template>

<ng-template
    #externalLink
    let-node="node"
>
    <a
        *ngIf="!node.invisible"
        [href]="node.url"
        target="_blank"
        class="menu-item btn btn-menu"
    >
        {{ node.display_name | translate }}
    </a>
</ng-template>
