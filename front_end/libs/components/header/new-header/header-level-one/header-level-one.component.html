<div class="menu-level-one">
    <ng-container *ngFor="let node of menuNodes">
        <button
            *ngIf="!node.invisible"
            (click)="handleNavigation(node, $event); onNodeSelect(node)"
            [ngClass]="{ active: node?.name === selectedNode?.name }"
            class="menu-item btn btn-menu"
        >
            {{ node.display_name }}
        </button>
    </ng-container>
    <ng-container *ngIf="loggedIn !== undefined">
        <nx-account-settings-select *ngIf="loggedIn"></nx-account-settings-select>
        <a
            *ngIf="!loggedIn"
            [href]="headerService.createUrl"
            class="create-account"
            translate
        >
            CREATE ACCOUNT
        </a>
        <nx-header-language-select
            *ngIf="!loggedIn"
            class="auto"
            short="true"
            altStyle="true"
            id="languageSelect3"
            [newHeader]="true"
        ></nx-header-language-select>
    </ng-container>
</div>
