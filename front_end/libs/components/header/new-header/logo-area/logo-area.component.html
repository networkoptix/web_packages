<div
    class="logo-wrapper"
    [ngClass]="isMobile ? 'logo-mobile' : null"
>
    <div
        class="logo"
        [ngSwitch]="logoState"
    >
        <div
            *ngSwitchCase="'system'"
            class="current-system-display"
        >
            <div
                class="arrow-btn"
                *ngIf="!isMobile && !singleSystem"
                (click)="
                    headerService.handleNav({ url: '/systems', new_window: false }, $event);
                    emitClick('systems-list')
                "
            >
                <svg-icon
                    nx-add-svg-src
                    [svgStyle]="{ 'width.px': '24' }"
                    [src]="icons.dir + 'arrow_back.svg'"
                ></svg-icon>
            </div>
            <span
                class="system-name"
                [nxTooltip]="headerService.activeSystem.name"
            >
                {{ headerService.activeSystem.name }}
            </span>
        </div>
        <ng-container *ngSwitchCase="'logo'">
            <img
                [alt]="CONFIG.cloudName + ' logo'"
                [src]="'/static/images/dark_logo.png'"
                class="logo-png"
                onerror="this.onerror=null;this.src='/static/images/logo.png'"
                data-testid="logo"
            />
        </ng-container>
        <div
            *ngSwitchCase="'mobileMenu'"
            translate
        >
            Menu
        </div>
        <div
            *ngSwitchCase="'mobileProfile'"
            translate
        >
            Profile
        </div>
    </div>
</div>
