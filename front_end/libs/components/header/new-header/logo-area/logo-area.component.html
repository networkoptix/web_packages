<div
    class="logo-wrapper"
    [ngClass]="isMobile ? 'logo-mobile' : null"
>
    <div
        class="logo"
        [ngSwitch]="logoState"
    >
        <div
            *ngSwitchCase="'system'"
            class="current-system-display"
        >
            <div
                class="arrow-btn"
                *ngIf="!isMobile && !singleSystem"
                (click)="
                    headerService.handleNav({ url: '/systems', new_window: false }, $event);
                    emitClick('systems-list')
                "
            >
                <svg-icon
                    nx-add-svg-src
                    [svgStyle]="{ 'width.px': '24' }"
                    [src]="icons.dir + 'arrow_back.svg'"
                ></svg-icon>
            </div>
            <span
                class="system-name"
                [nxTooltip]="headerService.activeSystem.name"
            >
                {{ headerService.activeSystem.name }}
            </span>
        </div>
        <svg-icon
            *ngSwitchCase="'logo'"
            nx-add-svg-src
            [svgStyle]="isMobile ? { 'width.px': '130', 'height.px': '32' } : null"
            [src]="images.dirHeader + 'logo.svg'"
            data-testid="logo"
        >
        </svg-icon>
        <div
            *ngSwitchCase="'mobileMenu'"
            translate
        >
            Menu
        </div>
        <div
            *ngSwitchCase="'mobileProfile'"
            translate
        >
            Profile
        </div>
    </div>
</div>
