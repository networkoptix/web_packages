<div class="menu-level-two">
    <nx-header-logo-area
        (logoClick)="handleLogoClick($event)"
        [singleSystem]="systemCount === 1"
    ></nx-header-logo-area>
    <div
        class="menu-items"
        [ngStyle]="{ 'width.px': menuItemsWidth$$() }"
        #menuItems
    >
        <div
            class="nav-arrow-container"
            (click)="scrollMenuItems('left')"
            *ngIf="navArrowState.visible && navArrowState.left"
        >
            <div class="nav-arrow left">
                <svg-icon
                    [src]="icons.dirHeader + 'nav_arrow.svg'"
                    [svgStyle]="{ 'width.px': '32', 'height.px': '16' }"
                ></svg-icon>
            </div>
        </div>
        <ng-container *ngFor="let node of subNodes">
            <div
                *ngIf="!node.invisible"
                class="outer-menu-item"
            >
                <ng-container
                    *ngTemplateOutlet="
                        node === optimisticSelectedSubNode ||
                        (!optimisticSelectedSubNode &&
                            headerService.currentLocation?.path === node.url)
                            ? activeItem
                            : menuItem;
                        context: { node: node }
                    "
                ></ng-container>
            </div>
        </ng-container>
        <div
            class="nav-arrow-container"
            (click)="scrollMenuItems('right')"
            *ngIf="navArrowState.visible && navArrowState.right"
            [ngStyle]="{ 'right.px': mainActionWidth }"
        >
            <div class="nav-arrow right">
                <svg-icon
                    [src]="icons.dirHeader + 'nav_arrow.svg'"
                    [svgStyle]="{ 'width.px': '16', 'height.px': '16' }"
                ></svg-icon>
            </div>
        </div>
    </div>
    <nx-main-action (widthChange)="onActionWidthChange($event)"></nx-main-action>
</div>

<ng-template
    #menuItem
    let-node="node"
>
    <a
        class="inner-menu-item"
        (click)="node.url !== undefined ? nodeClick(node, $event) : null"
        [href]="node.url"
    >
        {{ node.display_name | translate }}
        <svg-icon
            *ngIf="node.new_window"
            [src]="images.dirHeader + 'external_link.svg'"
        ></svg-icon>
        <span class="active-border"> </span>
    </a>
</ng-template>

<ng-template
    #activeItem
    let-node="node"
>
    <div class="inner-menu-item active">
        {{ node.display_name | translate }}
        <svg-icon
            *ngIf="node.new_window"
            [src]="images.dirHeader + 'external_link.svg'"
        ></svg-icon>
        <span class="active-border"> </span>
    </div>
</ng-template>
