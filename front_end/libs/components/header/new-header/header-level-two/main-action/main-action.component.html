<div
    #mainAction
    [ngSwitch]="action$ | async"
>
    <div
        *ngSwitchCase="'login'"
        class="auth-hidden context-button-container"
    >
        <a
            class="login nx-button--primary text-nowrap"
            [href]="headerService.authorizeUrl"
            translate
            >Log In</a
        >
    </div>
    <div
        *ngSwitchCase="'logout'"
        class="context-button-container"
    >
        <div
            (click)="logout()"
            class="logout"
        >
            <span translate>Log Out</span>
            <svg-icon [src]="icons.dirHeader + 'logout.svg'"></svg-icon>
        </div>
    </div>
</div>
