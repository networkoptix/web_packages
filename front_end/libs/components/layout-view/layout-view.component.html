<div class="layout-wrapper">
    @if (systemOnline$ | async) {
        @defer (when selectedSystem$ | async) {
            <nx-layout-grid
                (layoutChanged)="updateLayout($event)"
                (showPtz)="ptzControlTarget = $event"
                [layout]="selectedLayout$ | async"
                [layoutItemLookup]="layoutItemLookup$ | async"
                [system]="selectedSystem$ | async"
            ></nx-layout-grid>
        }
    } @else {
        <nx-page-placeholder
            type="OFFLINE"
            class="page-placeholder"
        ></nx-page-placeholder>
    }

    @defer (
        when ptzControlTarget && (CONFIG.featureFlags.layoutsPtz || CONFIG.featureFlags.layoutsDemo)
    ) {
        <nx-layout-ptz
            [camera]="ptzControlTarget"
            [system]="selectedSystem$ | async"
            (exitPtz)="ptzControlTarget = null"
        ></nx-layout-ptz>
    }
</div>
