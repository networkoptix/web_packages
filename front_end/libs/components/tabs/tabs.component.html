<div class="tabs-component">
    <div class="tabs-row">
        <ng-container *ngFor="let tab of tabItems; index as i">
            <div
                class="tab-container"
                [ngClass]="{ selected: tab.selected }"
            >
                <input
                    class="tab"
                    [id]="'t' + i"
                    (click)="handleTabClick(tab, i)"
                    type="radio"
                    [disabled]="tab.disabled"
                />
                <label
                    class="content"
                    [for]="'t' + i"
                >
                    {{ tab.displayName }}
                </label>
            </div>
        </ng-container>
    </div>
</div>
