<div class="tabs-component">
    <div class="row">
        <button
            class="tab"
            *ngFor="let tab of tabs; index as i"
            (click)="handleClick(tab, i)"
            [ngClass]="{ selected: tab.name === tabsMap[currentTabIndex] }"
        >
            {{ tab.name.charAt(0).toUpperCase() + tab.name.slice(1) }}
        </button>
    </div>

    <div class="display">
        <ng-container *ngTemplateOutlet="currentTabTemplate"></ng-container>
    </div>
</div>
