<div class="tabs-component">
    <div class="row">
        <ng-container *ngFor="let tab of tabItems; index as i">
            <input
                class="tab"
                [id]="'t' + i"
                (click)="handleTabClick(tab, i)"
                type="radio"
                [disabled]="tab.disabled"
                [ngClass]="{ selected: tab.selected }"
            />
            <label
                class="content"
                [for]="'t' + i"
                [ngClass]="{ hidden: tab.hidden }"
            >
                {{ tab.displayName }}
            </label>
        </ng-container>
        <div
            class="slider"
            *ngIf="tabItems.length"
            [ngStyle]="{
                transition:
                    animated || animationSpeed
                        ? animationSpeed
                            ? 'transform ' + animationSpeed
                            : 'transform 0.5s'
                        : '',
                transform: 'translate(' + currTabTranslate$$() + 'rem, 0)'
            }"
        ></div>
    </div>
</div>
