<div class="tabs-component">
    <div class="row">
        <button
            class="tab"
            *ngFor="let tab of tabs; index as i"
            (click)="handleClick(tab, i)"
            [ngClass]="{ selected: tab.data.displayName === tabsMap[currentTabIndex] }"
        >
            {{ tab.data.displayName }}
        </button>
    </div>

    <div class="display">
        <ng-container *ngTemplateOutlet="currentTabTemplate"></ng-container>
    </div>
</div>
