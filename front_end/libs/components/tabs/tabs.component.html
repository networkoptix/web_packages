<div class="tabs-component">
    <div class="tabs-row">
        @for (tab of tabs(); track tab.route) {
            <div
                class="tab-container"
                [class.selected]="currentTab$$() === tab.route"
            >
                <a [routerLink]="tab.route | mapWith: routeState.getTabLink$$()">
                    {{ tab.displayName }}
                </a>
            </div>
        }
    </div>
</div>
