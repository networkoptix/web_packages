<nx-pre-loader
    type="page"
    *ngIf="!systems"
></nx-pre-loader>

<div
    *ngIf="systems && showList"
    class="auth-visible"
    [ngClass]="[atBase ? 'container' : 'm-2']"
>
    <ng-template #noSystems>
        <nx-no-systems></nx-no-systems>
    </ng-template>
    <ng-container *ngIf="systems.length; else noSystems">
        <div
            class="search-block row border-bottom"
            *ngIf="!disableSearch && showSearch"
        >
            <nx-search
                class="col-sm-9 col-md-8 col-lg-6 input-overlay"
                [ngModel]="search"
                (ngModelChange)="setSearch($event)"
                layout="compact"
                [placeholder]="'Search systems' | translate"
                instant
            ></nx-search>
        </div>
        <div *ngIf="systems.length">
            <div
                *ngIf="atBase"
                class="p-0 mb-3 mt-3"
            >
                <h1 class="old-h12">
                    <span *ngIf="search.value">{{
                        LANG.systemsCount | translate: { count: filteredSystems.length }
                    }}</span>
                    <span
                        *ngIf="!search.value"
                        translate
                        >Systems</span
                    >
                </h1>
            </div>
            <div class="row">
                <ng-container *ngFor="let system of filteredSystems; trackBy: trackItem">
                    <div
                        class="system-card-spacing col-sm-12 mb-3 mb-lg-0"
                        [ngClass]="{
                            'col-lg-4 col-xl-3': size === 'full',
                            'col-md-6': size !== 'compact',
                            'col-12': size === 'compact'
                        }"
                    >
                        <nx-system-card
                            [system]="system"
                            [search]="search.value"
                            [account]="account"
                            [openSystem]="openSystem"
                        ></nx-system-card>
                    </div>
                </ng-container>
            </div>
        </div>
    </ng-container>
    <nx-footer *ngIf="atBase && !show2faRequired"></nx-footer>
</div>
