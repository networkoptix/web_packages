<div class="system-button card card-condensed hoverable">
    <div
        class="card-body"
        (click)="openSystem(system)"
    >
        <h2 class="old-h12 d-block">
            <nx-search-highlight
                [text]="system.name"
                [search]="search"
            ></nx-search-highlight>
        </h2>
        <span
            class="fs-mask user-name"
            *ngIf="getSystemOwnerName() as ownerName"
        >
            <ng-container *ngIf="ownerName === LANG.system.yourSystem">{{
                LANG.system.yourSystem | translate
            }}</ng-container>
            <nx-search-highlight
                *ngIf="ownerName !== LANG.system.yourSystem"
                [text]="ownerName"
                [search]="search"
            ></nx-search-highlight
        ></span>
        <div class="system-list-bottom-bar">
            <nx-tag
                style="display: block; margin-top: 24px"
                [clickable]="false"
                [type]="tagType"
                *ngIf="canShowTag"
            >
                <ng-container>{{ systemState | translate }}</ng-container>
            </nx-tag>
            <nx-client-button
                [system]="system"
                [actionType]="system ? 'default' : 'primary'"
                *ngIf="canShowButton"
            ></nx-client-button>
            <svg-icon
                [ngClass]="{
                    'margin-system-list-status': canShowTag
                }"
                *ngIf="needToConfigureTwoFactor"
                nx-add-svg-src
                [src]="icons.dir + 'lock.svg'"
                [svgStyle]="{ 'height.px': '20' }"
                [applyClass]="true"
            ></svg-icon>
        </div>
    </div>
</div>
