<ng-template
    #actionButton
    let-value="value"
    let-label="label"
>
    <ng-template #buttonTooltip>
        @if (value === 'exit') {
            <ng-container translate>Exit PTZ Mode</ng-container>
        } @else {
            Click action to perform fine adjustments. Hold down to do larger adjustments.
        }
    </ng-template>
    <button
        class="legacy-btn"
        [style]="{ 'grid-area': value }"
        [ngClass]="{ 'active-action': value === (action$ | async) }"
        [value]="value"
        [nxTooltip]="buttonTooltip"
    >
        {{ LANG.layouts.ptzActionLabels[value] | translate }}
    </button>
</ng-template>

<h3
    (mouseenter)="showPtz = true"
    class="h3 show-ptz-title"
    translate
>
    Show PTZ Controls
</h3>
<div
    (mouseleave)="showPtz = false"
    class="control-wrapper"
>
    <h3 class="h3">{{ camera.name }}</h3>
    <div
        class="control-center"
        (mousedown)="triggerAction($event)"
        (mouseup)="triggerAction()"
        (mouseleave)="triggerAction()"
    >
        @for (action of LANG.layouts.ptzActionLabels | keyvalue; track action) {
            <ng-container
                *ngTemplateOutlet="actionButton; context: { value: action.key }"
            ></ng-container>
        }
    </div>
</div>
