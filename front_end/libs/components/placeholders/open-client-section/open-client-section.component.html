<div
    class="section-placeholder"
    [style.height.px]="wrapperHeightPx"
>
    <svg-icon
        nx-add-svg-src
        [svgStyle]="{
            'height.px': svgHeightPx,
            'width.px': svgWidthPx,
            'pointer-events': 'none'
        }"
        [src]="icons.dirSectionPlaceholder + svgFileName + '.svg'"
    ></svg-icon>
    <span>{{ translatedMessage }}</span>
    <nx-vms-client-text></nx-vms-client-text>
</div>
