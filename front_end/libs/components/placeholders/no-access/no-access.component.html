<nx-page-generic-placeholder-v2>
    <svg-icon
        [src]="icons.dirPagePlaceholder + 'NoAccess.svg'"
        [svgStyle]="{ 'height.px': 200 }"
    />
    <h2 class="title">
        {{
            this.LANG.pageTitles.systemSuspendedShutdown | translate: { systemName: systemName$$() }
        }}
    </h2>
    <div class="unique-message">{{ this.LANG.errorCodes.systemSuspendedShutdown | translate }}</div>
    <button
        class="nx-button--primary main-butto"
        data-escape-global-style
    >
        <a
            routerLink="/"
            translate
            data-escape-global-style
            >Go to Main Page</a
        >
    </button>
</nx-page-generic-placeholder-v2>
