<nx-page-generic-placeholder>
    <svg-icon
        [src]="icons.dirPagePlaceholder + 'NoAccess.svg'"
        [svgStyle]="{ 'height.px': 200 }"
    />
    <h2 class="title">
        {{
            this.LANG.pageTitles.systemSuspendedShutdown | translate: { systemName: systemName$$() }
        }}
    </h2>
    <div class="message">{{ this.LANG.errorCodes.systemSuspendedShutdown | translate }}</div>
    <button class="nx-button--primary main-button">
        <a
            routerLink="/"
            translate
            >Go to Main Page</a
        >
    </button>
</nx-page-generic-placeholder>
