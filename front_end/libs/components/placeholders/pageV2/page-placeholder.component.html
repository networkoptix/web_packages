<nx-page-generic-placeholder-v2>
    <div image>
        <svg-icon
            nx-add-svg-src
            [src]="imagePath"
        ></svg-icon>
    </div>
    <div title>{{ title }}</div>
    <div message>{{ message }}</div>
    @if (buttonText) {
        <div button>
            <nx-button
                [type]="ButtonType.secondary"
                [text]="buttonText"
                (click)="clickHandler($event)"
            ></nx-button>
        </div>
    }
</nx-page-generic-placeholder-v2>
