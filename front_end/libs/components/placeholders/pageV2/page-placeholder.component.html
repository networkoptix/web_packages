<nx-page-generic-placeholder-v2>
    <div image>
        <svg-icon
            nx-add-svg-src
            [src]="imagePath"
        ></svg-icon>
    </div>
    <div title>{{ title }}</div>
    <div message>{{ message }}</div>
    @if (buttonText) {
        <div button>
            <nx-button
                type="secondary"
                (click)="clickHandler($event)"
                >{{ buttonText | translate }}</nx-button
            >
        </div>
    }
</nx-page-generic-placeholder-v2>
