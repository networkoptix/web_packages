<div
    class="w-100"
    [ngClass]="{ 'show-preloader': preloader, 'h-100': condition }"
>
    <div
        class="page-placeholder"
        [ngClass]="{
            'has-preloader': preloader,
            'with-footer': withFooter,
            'with-padding': addPadding
        }"
        [ngStyle]="{ 'padding-top': withFooter && iconVisible ? '16px' : undefined }"
    >
        <div class="placeholder-content {{ constrainWidth ? 'constrain-width' : '' }}">
            <div
                *ngIf="preloader && !condition"
                class="placeholder-preloader"
            >
                <div class="circleG circleG_1"></div>
                <div class="circleG circleG_2"></div>
                <div class="circleG circleG_3"></div>
            </div>
            <div
                *ngIf="condition"
                class="mx-2"
            >
                <div
                    *ngIf="iconClass"
                    class="placeholder-icon"
                    [ngClass]="iconClass"
                ></div>
                <div
                    *ngIf="!iconClass && iconVisible"
                    [attr.name]="type"
                    class="placeholder-icon"
                >
                    <svg-icon
                        nx-add-svg-src
                        [src]="icons.dirPagePlaceholder + iconName + '.svg'"
                        [svgStyle]="{ 'width.px': iconSize.toString() }"
                    ></svg-icon>
                </div>
                <h2
                    *ngIf="placeholderTitle"
                    [attr.name]="type"
                    class="h2 placeholder-title"
                    data-testid="placeholderTitle"
                    [innerText]="placeholderTitle | nxTranslate"
                ></h2>
                <div
                    *ngIf="message"
                    [attr.name]="type"
                    class="placeholder-message"
                    [innerHTML]="message | translate | safe: 'html'"
                ></div>
                <button
                    *ngIf="showMainButton"
                    data-escape-global-style
                    class="nx-button--primary main-button mx-auto"
                >
                    <a
                        routerLink="/"
                        translate
                        >Go to Main Page</a
                    >
                </button>
                <ng-content></ng-content>
            </div>
        </div>
    </div>
    <nx-footer
        *ngIf="withFooter"
        [center]="true"
        [ngClass]="'footer'"
    ></nx-footer>
</div>
