<nx-page-generic-placeholder>
    <svg-icon
        [src]="icons.dirPagePlaceholder + '404.svg'"
        [svgStyle]="{ 'height.px': 200 }"
    />
    <div class="placeholder-body">
        <h2
            translate
            class="title"
        >
            Page not found
        </h2>
        @if (showButton()) {
            <button class="nx-button--primary main-button">
                <a
                    routerLink="/"
                    translate
                    >Go to Main Page</a
                >
            </button>
        }
    </div>
</nx-page-generic-placeholder>
