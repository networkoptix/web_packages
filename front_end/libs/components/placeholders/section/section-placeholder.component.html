<div
    class="section-placeholder"
    [style.height.px]="wrapperHeight"
>
    <svg-icon
        nx-add-svg-src
        [svgStyle]="{
            'height.px': height,
            'width.px': width,
            'pointer-events': 'none'
        }"
        [src]="icons.dirSectionPlaceholder + svgFileName + '.svg'"
    ></svg-icon>
    <span>{{ translatedMessage }}</span>
</div>
