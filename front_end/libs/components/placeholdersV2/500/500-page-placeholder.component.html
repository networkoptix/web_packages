<nx-page-generic-placeholder-v2>
    <svg-icon
        [src]="icons.dirPagePlaceholder + '500.svg'"
        [svgStyle]="{ 'height.px': 200, 'width.px': 560 }"
    />
    <div class="placeholder-body">
        <h2
            translate
            class="title"
        >
            Internal server error
        </h2>
        <div
            class="message"
            translate
        >
            An error occurred, please try again later. If the problem continues, please contact your
            support team.
        </div>
        <a
            class="nx-button--primary"
            [href]="CONFIG.company.links.support"
            target="_blank"
            rel="noopener"
            translate
            data-escape-global-style
            >Go to Support Page</a
        >
    </div>
</nx-page-generic-placeholder-v2>
