<nx-page-generic-placeholder-v2>
    <svg-icon
        nx-add-svg-src
        [src]="icons.dirPageV2Placeholder + 'open_folder.svg'"
        [svgStyle]="{ 'width.px': '64', 'height.px': '64' }"
        [applyClass]="true"
    ></svg-icon>
    <div class="title">
        {{ LANG.placeholderV2Texts.noItems.title | translate }}
    </div>
    <div class="message">
        {{ LANG.placeholderV2Texts.noItems.message | translate | translateCut: 0 }}
        <span
            (click)="addFolder()"
            class="inline-button"
            >{{ LANG.placeholderV2Texts.noItems.message | translate | translateCut: 1 }}</span
        >
    </div>
</nx-page-generic-placeholder-v2>
