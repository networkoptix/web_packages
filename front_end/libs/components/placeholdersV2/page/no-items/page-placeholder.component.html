<nx-page-generic-placeholder-v2>
    <svg-icon
        nx-add-svg-src
        [src]="icons.dirPageV2Placeholder + 'open_folder.svg'"
        [svgStyle]="{ 'width.px': '64', 'height.px': '64' }"
        [applyClass]="true"
    ></svg-icon>
    <div
        class="title"
        translate
    >
        Folder is empty
    </div>
    <div
        class="message"
        translate
    >
        You can move systems to this folder, add new system or add new folder.
    </div>
</nx-page-generic-placeholder-v2>
