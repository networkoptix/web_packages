<nx-page-generic-placeholder-v2>
    <svg-icon
        nx-add-svg-src
        [src]="icons.dirPageV2Placeholder + 'no_info.svg'"
        [svgStyle]="{ 'width.px': '64', 'height.px': '64' }"
        [applyClass]="true"
    ></svg-icon>
    <div
        class="title"
        translate
    >
        No Information
    </div>
    <div
        class="message"
        translate
    >
        You have not yet added any information.
    </div>
    <div class="button-container">
        <button
            type="button"
            class="button btn btn-default"
            (click)="clickHandler($event)"
            translate
        >
            Add Information
        </button>
    </div>
</nx-page-generic-placeholder-v2>
