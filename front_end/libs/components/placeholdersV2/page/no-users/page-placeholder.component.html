<nx-page-generic-placeholder-v2>
    <svg-icon
        nx-add-svg-src
        [src]="icons.dirPageV2Placeholder + 'no_users.svg'"
        [svgStyle]="{ 'width.px': '64', 'height.px': '64' }"
        [applyClass]="true"
    ></svg-icon>
    <div
        class="title"
        translate
    >
        No Users
    </div>
    <div
        class="message"
        translate
    >
        You have not yet added any users
    </div>
    <nx-button
        class="button"
        [type]="ButtonType.secondary"
        [text]="'Add User' | translate"
        (click)="clickHandler($event)"
    ></nx-button>
</nx-page-generic-placeholder-v2>
