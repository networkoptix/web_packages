<nx-page-generic-placeholder-v2>
    <svg-icon
        [src]="icons.dirPagePlaceholder + 'NoAccess.svg'"
        [svgStyle]="{ 'height.px': 200 }"
    />
    <div class="placeholder-body">
        <h2 class="title">
            {{ LANG.pageTitles.failedToAccess2FA | translate: { systemName: systemName() } }}
        </h2>
        <div class="message">
            <p
                class="nx-paragraph"
                translate
            >
                Two-factor authentication is required to access this system.
            </p>
            <p class="nx-paragraph">
                <span translate> You can enable two-factor authentication in your </span>
                <a
                    href="/account/security"
                    translate
                    >account settings</a
                >.
            </p>
        </div>
    </div>
    <button class="nx-button--primary unique-button">
        <a
            routerLink="/"
            translate
            >Go to Main Page</a
        >
    </button>
</nx-page-generic-placeholder-v2>
