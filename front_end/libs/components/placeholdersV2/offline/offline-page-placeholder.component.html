<nx-page-generic-placeholder-v2>
    <div class="content-container">
        <svg-icon
            [src]="icons.dirPagePlaceholder + 'Offline.svg'"
            [svgStyle]="{ 'height.px': 200 }"
        />
        <div class="placeholder-text">
            <h2
                translate
                data-escape-global-style
            >
                System Offline
            </h2>
            <div
                class="unique-message"
                translate
            >
                This system is offline and cannot be accessed right now.
            </div>
        </div>
    </div>
</nx-page-generic-placeholder-v2>
