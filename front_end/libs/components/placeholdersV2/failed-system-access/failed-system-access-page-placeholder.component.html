<nx-page-generic-placeholder-v2>
    <svg-icon
        [src]="icons.dirPagePlaceholder + 'NoAccess.svg'"
        [svgStyle]="{ 'height.px': 200 }"
    />
    <div class="placeholder-text">
        <h2 translate>Failed to access system</h2>
        <div class="unique-message">{{ LANG.errorCodes.failedToAccessSystem | translate }}</div>
        <button
            class="nx-button--primary main-button"
            data-escape-global-style
        >
            <a
                routerLink="/"
                translate
                data-escape-global-style
                >Go to Main Page</a
            >
        </button>
    </div>
</nx-page-generic-placeholder-v2>
