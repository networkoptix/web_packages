<nx-page-generic-placeholder-v2>
    <svg-icon
        [src]="icons.dirPagePlaceholder + 'NoAccess.svg'"
        [svgStyle]="{ 'height.px': 200 }"
    />
    <div class="placeholder-body">
        <h2
            translate
            class="title"
        >
            Failed to access system
        </h2>
        <div class="message">{{ LANG.errorCodes.failedToAccessSystem | translate }}</div>
        <button class="nx-button--primary main-button">
            <a
                routerLink="/"
                translate
                >Go to Main Page</a
            >
        </button>
    </div>
</nx-page-generic-placeholder-v2>
