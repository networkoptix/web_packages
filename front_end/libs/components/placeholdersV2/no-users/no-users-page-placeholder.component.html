<nx-page-generic-placeholder-v2>
    <svg-icon
        nx-add-svg-src
        [src]="icons.dirPageV2Placeholder + 'no_users.svg'"
        [svgStyle]="{ 'width.px': '64', 'height.px': '64' }"
        [applyClass]="true"
    ></svg-icon>
    <div class="placeholder-body">
        <div
            class="dark-title"
            translate
        >
            No Users
        </div>
        <div
            class="dark-message"
            translate
        >
            You have not yet added any users
        </div>
        <button
            type="button"
            class="button btn btn-default"
            (click)="clickHandler($event)"
            translate
        >
            Add User
        </button>
    </div>
</nx-page-generic-placeholder-v2>
