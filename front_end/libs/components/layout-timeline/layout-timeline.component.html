<nx-pre-loader
    *ngIf="!records"
    type="short"
></nx-pre-loader>
<div
    *ngIf="records && records.length === 0"
    translate
>
    No Archives
</div>

<div
    *ngIf="tooltipDetails.selected.length"
    class="timeline-tooltip"
    [style.left.px]="tooltipDetails.x"
>
    <h4>{{ tooltipDetails.position | date: 'mediumDate' }}</h4>
    <h3>{{ tooltipDetails.position | date: 'HH:mm:ss' }}</h3>
    <h5 translate>Devices</h5>
    <ul>
        <li *ngFor="let selected of tooltipDetails.selected">
            {{ selected }}
        </li>
    </ul>
</div>
<div
    *ngIf="tooltipDetails.selected.length"
    class="position-indicator"
    [style.left.px]="tooltipDetails.xActual"
></div>

<div class="canvas-wrapper">
    <canvas
        (mousemove)="updateTooltip($event)"
        (mouseleave)="clearTooltip()"
        (click)="updatePosition()"
        #timelineCanvas
        [height]="height"
        [width]="width"
        [style.width.%]="scale"
    ></canvas>
    <div
        *ngIf="records?.length"
        class="timeline-controls"
    >
        <h5 translate>Controls</h5>
        <div class="controls">
            <button
                (click)="zoom(1.6)"
                [disabled]="scale === MAX_ZOOM"
            >
                +
            </button>
            <button
                (click)="zoom(0.625)"
                [disabled]="scale === MIN_ZOOM"
            >
                -
            </button>
            <button
                *ngIf="position"
                (click)="togglePlaying()"
            >
                {{ playing ? '||' : '►' }}
            </button>
            <button
                [disabled]="!position"
                (click)="updatePosition()"
                class="live-button"
            >
                <ng-template
                    #showLive
                    translate
                    >Show Live</ng-template
                >
                <ng-container
                    *ngIf="!position; else showLive"
                    translate
                    >Showing Live</ng-container
                >
            </button>
            <button
                (click)="scroll()"
                [disabled]="scrollLeft === 0"
            >
                {{ '<' }}
            </button>
            <button
                (click)="scroll(true)"
                [disabled]="scrollWidth === endScroll"
            >
                {{ '>' }}
            </button>
        </div>
    </div>
</div>
