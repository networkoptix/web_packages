<video
    [ngClass]="{ 'd-none': posterLoadingError && false }"
    [src]="sourceUrl"
    [poster]="posterLoadingError ? internalPoster : (posterUrl | safe: 'resourceUrl')"
    (error)="handler($event)"
    (loadeddata)="handler($event)"
    preload="auto"
    playsinline
    loop
    controls
    [controlsList]="disableDownload ? 'nodownload' : ''"
    [attr.disablePictureInPicture]="disablePictureInPicture"
    [attr.autoplay]="autoplay"
></video>
