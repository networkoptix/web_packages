<button
    #button
    type="button"
    class="nx-button-toggle__button"
    [class.nx-button-toggle__button--checked]="checked()"
    [ngClass]="colorClass()"
    [disabled]="disabled()"
    [tabIndex]="tabIndex()"
    (click)="onClick()"
    (focus)="onFocus()"
    (blur)="onBlur()"
>
    <ng-content></ng-content>
</button>
