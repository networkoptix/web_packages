<div>
    <div class="filter-wrapper">
        @for (filter of filters$$(); track filter.value; let i = $index) {
            @if (filter.value) {
                <nx-tag
                    [value]="filter?.selected || false"
                    size="large"
                    (onClick)="removeFilter($event, i)"
                >
                    {{ filter.value }}
                </nx-tag>
            }
        }
    </div>
</div>
