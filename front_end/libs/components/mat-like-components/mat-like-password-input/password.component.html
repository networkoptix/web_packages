<div
    class="mat-like-input-wrapper"
    [ngClass]="{ 'hide-errors': hideErrors }"
>
    <input
        [id]="componentId"
        [name]="componentId"
        class="fs-exclude form-control"
        [ngClass]="{
            hasValue: value,
            'hide-errors': hideErrors,
            'has-error': hasError
        }"
        type="{{ passwordToggle ? 'password' : 'text' }}"
        required
        [readonly]="readonly"
        autocomplete="current-password"
        [(ngModel)]="value"
        (keyup)="setValue()"
        (blur)="onBlur()"
        (focus)="_blur = false; showLegend(popValidationTemplate, passwordInput)"
        nxFocusMe
        [setFocus]="setFocus"
        #passwordInput
        #passwordInputModel="ngModel"
    />
    <div class="mat-like-label">{{ label }}</div>

    <nx-mat-like-input
        *ngIf="confirmation"
        class="mt-3"
        name="confirm"
        [type]="'password'"
        [autocomplete]="'new-password'"
        [label]="'Confirm password' | translate"
        [(ngModel)]="confirm"
        (onChange)="checkConfirmed()"
        (focus)="_blur = false"
        (blur)="onBlurConfirmed()"
        [required]="true"
        #confirmPassword
    ></nx-mat-like-input>

    <div
        class="addons d-flex align-items-center"
        #addons
    >
        <span
            class="input-group-addon"
            (click)="passwordToggle = !passwordToggle"
            style="cursor: pointer"
        >
            <svg-icon
                nx-add-svg-src
                *ngIf="passwordToggle"
                [src]="icons.dirTextButtons + 'eye_closed.svg'"
                [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                [applyClass]="true"
            ></svg-icon>
            <svg-icon
                nx-add-svg-src
                *ngIf="!passwordToggle"
                [src]="icons.dirTextButtons + 'eye.svg'"
                [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                [applyClass]="true"
            ></svg-icon>
        </span>
    </div>

    <ng-template #popValidationTemplate>
        <div class="mat-like-validation-wrapper">
            <div
                class="validation-msg"
                [ngClass]="{
                    'validation-success': !_minlength,
                    'validation-error': passwordInputModel.touched && (_required || _minlength)
                }"
            >
                <span class="marker-success">&check;</span>
                <span class="marker-error">&dash;</span>
                <span translate>minimum 8 chars</span>
            </div>
            <div
                class="validation-msg"
                [ngClass]="{
                    'validation-success': _hasLowerCase,
                    'validation-error': passwordInputModel.touched && !_hasLowerCase
                }"
            >
                <span class="marker-success">&check;</span>
                <span class="marker-error">&dash;</span>
                <span translate>contains a lowercase char</span>
            </div>
            <div
                *ngIf="!relaxedRequirements"
                class="validation-msg"
                [ngClass]="{
                    'validation-success': _hasUpperCase,
                    'validation-error': passwordInputModel.touched && !_hasUpperCase
                }"
            >
                <span class="marker-success">&check;</span>
                <span class="marker-error">&dash;</span>
                <span translate>contains a uppercase char</span>
            </div>
            <div
                class="validation-msg"
                [ngClass]="{
                    'validation-success': _hasDigit,
                    'validation-error': passwordInputModel.touched && !_hasDigit
                }"
            >
                <span class="marker-success">&check;</span>
                <span class="marker-error">&dash;</span>
                <span translate>contains a number</span>
            </div>
            <div
                *ngIf="!relaxedRequirements"
                class="validation-msg"
                [ngClass]="{
                    'validation-success': _hasSymbol,
                    'validation-error': passwordInputModel.touched && !_hasSymbol
                }"
            >
                <span class="marker-success">&check;</span>
                <span class="marker-error">&dash;</span>
                <span translate>contains a (! &#64; # $ % ^ & * ( ) _ - +)</span>
            </div>
            <div
                *ngIf="confirmation"
                class="validation-msg"
                [ngClass]="{
                    'validation-success': _hasConfirmed,
                    'validation-error': passwordInputModel.touched && !_hasConfirmed
                }"
            >
                <span class="marker-success">&check;</span>
                <span class="marker-error">&dash;</span>
                <span translate>confirm password</span>
            </div>
        </div>
    </ng-template>
</div>
