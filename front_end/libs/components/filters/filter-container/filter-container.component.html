<div>
    <div class="header">
        <span>{{ header() }}</span>
        @if (filterComponent().selectedValueExists()) {
            <button
                class="legacy-btn clear-button"
                (click)="onClearClick()"
            >
                <svg-icon
                    nx-add-svg-src
                    [src]="icons.dirTextButtons + 'close.svg'"
                    [svgStyle]="{ 'width.rem': '0.9', 'height.rem': '0.9' }"
                ></svg-icon>
            </button>
        }
    </div>
    <div class="body">
        <ng-content></ng-content>
    </div>
</div>
