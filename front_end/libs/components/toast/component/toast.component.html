<div
    class="alert alert-{{ toast.type }} toast"
    [ngClass]="{ 'alert-dismissible': !toast.autohide }"
>
    <ng-container *ngIf="isTemplate(toast.content); else text">
        <ng-template [ngTemplateOutlet]="toast.content"></ng-template>
    </ng-container>
    <ng-template #text>
        <span
            *ngIf="toast.showHTML"
            class="toast-content"
            data-testid="toast-content"
            [innerHTML]="toast.content | translate"
        ></span>
        <span
            *ngIf="!toast.showHTML"
            class="toast-content"
            [innerText]="toast.content | translate"
        ></span>
        <button
            type="button"
            class="close"
            data-testid="toast-content-close"
            data-dismiss="alert"
            aria-label="Close"
            *ngIf="!toast.autohide"
            (click)="remove()"
        >
            <span aria-hidden="true">&times;</span>
        </button>
    </ng-template>
</div>
