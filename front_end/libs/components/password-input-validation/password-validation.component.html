<div
    name="error-labels"
    *ngIf="!forElement.valid && forElement.touched && forElement.errors"
    [ngClass]="{ 'hide-errors': hideErrors }"
>
    <div
        class="input-error"
        [ngClass]="customClass"
        *ngIf="
            forElement.errors.weak &&
            !forElement.errors.common &&
            !forElement.errors.pattern &&
            !forElement.errors.required &&
            !forElement.errors.minlength
        "
    >
        {{ LANG.passwordRequirements.weakMessage }}
    </div>
    <div
        class="input-error"
        [ngClass]="customClass"
        *ngIf="forElement.errors.common && !forElement.errors.required"
        id="passwordCommonError"
    >
        {{ LANG.passwordRequirements.commonMessage }}
    </div>
    <div
        class="input-error"
        [ngClass]="customClass"
        *ngIf="forElement.errors.minlength"
        id="passwordLengthError"
    >
        {{ LANG.passwordRequirements.minLengthMessage }}
    </div>
    <div
        class="input-error"
        [ngClass]="customClass"
        *ngIf="forElement.errors.pattern && !forElement.errors.minlength"
        id="passwordPatternError"
    >
        {{ LANG.passwordRequirements.requiredMessage }}
    </div>
    <div
        class="input-error"
        [ngClass]="customClass"
        *ngIf="forElement.errors.required"
        id="passwordRequiredError"
    >
        {{ LANG.passwordRequirements.missingMessage }}
    </div>
</div>
