<div
    name="error-labels"
    *ngIf="!forElement.valid && forElement.touched && forElement.errors"
    [ngClass]="{ 'hide-errors': hideErrors }"
>
    <div
        class="input-error"
        [ngClass]="customClass"
        *ngIf="
            forElement.errors.weak &&
            !forElement.errors.common &&
            !forElement.errors.pattern &&
            !forElement.errors.required &&
            !forElement.errors.minlength
        "
    >
        {{ LANG.passwordRequirements.weakMessage | translate }}
    </div>
    <div
        class="input-error"
        [ngClass]="customClass"
        *ngIf="forElement.errors.common && !forElement.errors.required"
    >
        {{ LANG.passwordRequirements.commonMessage | translate }}
    </div>
    <div
        class="input-error"
        [ngClass]="customClass"
        *ngIf="forElement.errors.minlength"
    >
        {{ LANG.passwordRequirements.minLengthMessage | translate }}
    </div>
    <div
        class="input-error"
        [ngClass]="customClass"
        *ngIf="forElement.errors.pattern && !forElement.errors.minlength"
    >
        {{ LANG.passwordRequirements.requiredMessage | translate }}
    </div>
    <div
        class="input-error"
        [ngClass]="customClass"
        *ngIf="forElement.errors.required"
    >
        {{ LANG.passwordRequirements.missingMessage }}
    </div>
</div>
