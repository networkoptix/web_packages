@if (!adjustedStatus()) {
    <div
        class="not-supported"
        translate
    >
        Not supported
    </div>
} @else if (!layoutsItemNewPlaceholder) {
    <nx-layout-grid-item-placeholder-template-legacy
        [placeholderIcon]="placeholderIcon()"
        [placeholderMessage]="placeholderMessage()"
        [placeholderAdditionalMessage]="placeholderAdditionalMessage()"
        [action]="action()"
        [hasAction]="hasAction()"
        [notSupported]="notSupported()"
        [renderConfig]="renderConfig()"
    >
    </nx-layout-grid-item-placeholder-template-legacy>
} @else {
    <nx-layout-grid-item-placeholder-template
        *ngrxLet="placeholder() as placeholder"
        [icon]="placeholder.icon"
        [message]="placeholder.message"
        [hint]="placeholder.hint"
        [description]="placeholder.description"
        [action]="action()"
        [actionName]="placeholder.actionName"
        [isError]="placeholder.isError"
        [hasAction]="hasAction()"
    >
    </nx-layout-grid-item-placeholder-template>
}
