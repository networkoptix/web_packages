<div
    #selectWrapper
    class="select-wrapper"
    [ngClass]="{ disabled: disabled }"
    tabIndex="{{ disabled ? -1 : 0 }}"
    (click)="toggleDropdown()"
    (keydown)="onKeyDown($event)"
    (blur)="onBlur($event)"
    role="listbox"
    [attr.aria-multiselectable]="ariaMultiselectable"
>
    <div
        #select
        [attr.id]="inputId"
        [attr.aria-label]="ariaLabel || null"
        [innerHTML]="displayText"
        class="select-box"
        [ngClass]="{
            error: error,
            disabled: disabled,
            placeholder: showPlaceholder
        }"
    ></div>
    <svg-icon
        class="dropdown-arrow rotationTransition"
        [ngClass]="{
            rotate: dropdownOpen$$()
        }"
        nx-add-svg-src
        [src]="icons.dirTextButtons + 'arrow_expand.svg'"
    ></svg-icon>
</div>
<ng-template
    cdk-portal
    #overlayTemplate="cdkPortal"
    class="dropdown"
>
    <div
        *ngIf="!this.dropdownAbortingOpen$$()"
        #dropdown
        class="custom-dropdown-menu"
    >
        <ng-content></ng-content>
    </div>
</ng-template>
