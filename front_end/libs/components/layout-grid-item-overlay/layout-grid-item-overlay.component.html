<ng-template #nodeActionMenu>
    <nx-context-menu
        [context]="node$$()"
        [menuItems]="menuItemsByType[node$$().type]"
    />
</ng-template>

<ng-template #tooSmall>
    <div
        [nxTooltip]="'Too Small' | translate"
        class="too-small"
        translate
    >
        Too Small
    </div>
</ng-template>

<div
    class="nx-layout-grid-item-overlay"
    [ngStyle]="getScaleStyle$ | async"
    [cdkContextMenuTriggerFor]="nodeActionMenu"
    [cdkMenuTriggerFor]="scaled$$() ? nodeActionMenu : null"
    (dblclick)="$event.stopPropagation(); fullscreenAction$$().action?.($event)"
    [ngClass]="{ show: (isMenuOpened$$() || isFullscreen$$()) && !hide$$(), hide: hide$$() }"
>
    <ng-template
        #svgIcon
        let-menuItem="menuItem"
        let-size="size"
        let-tooltipExtra="tooltipExtra"
    >
        <svg-icon
            *ngIf="menuItem"
            nx-add-svg-src
            [ngClass]="{
                checked: menuItem.checked$$?.()
            }"
            [src]="menuItem.icon"
            [svgStyle]="{
                'width.px': '{{size || 24}}',
                'height.px': '{{size || 24}}'
            }"
            [nxTooltip]="(menuItem.tooltip | translate) + (tooltipExtra || '')"
            (click)="handleIconClick(menuItem.action, $event)"
        ></svg-icon>
    </ng-template>

    <div class="name">
        <ng-container
            *ngTemplateOutlet="
                svgIcon;
                context: {
                    menuItem: recordingIcon$$(),
                    size: 16,
                    tooltipExtra: extraCameraTooltip$$()
                }
            "
        />
        <div
            class="resource-name ellipsis"
            [nxTooltip]="node$$()?.name || ('Not Supported' | translate)"
        >
            {{ node$$()?.name || ('Not Supported' | translate) }}
        </div>
    </div>

    <div class="quick-actions">
        <div
            class="action-icon"
            *ngIf="quickActionsMenu$$()"
            [cdkMenuTriggerFor]="!scaled$$() ? nodeActionMenu : null"
            (cdkMenuOpened)="isMenuOpened$$.set(true)"
            (cdkMenuClosed)="isMenuOpened$$.set(false)"
        >
            <ng-container
                *ngTemplateOutlet="svgIcon; context: { menuItem: quickActionsMenu$$() }"
            />
        </div>
        <ng-container *ngIf="quickActions$$()">
            <div
                *ngFor="let quickActionItem of quickActions$$()"
                class="action-icon"
            >
                <ng-container *ngTemplateOutlet="svgIcon; context: { menuItem: quickActionItem }" />
            </div>
        </ng-container>
    </div>

    <div class="menu-group">
        <div class="fullscreen">
            <ng-container
                *ngTemplateOutlet="svgIcon; context: { menuItem: fullscreenAction$$() }"
            />
        </div>
        <div
            class="remove"
            *ngIf="removeAction$$()"
        >
            <ng-container *ngTemplateOutlet="svgIcon; context: { menuItem: removeAction$$() }" />
        </div>
    </div>

    <div
        *ngIf="displayInfo$$() && cameraOnline$$()"
        class="info"
    >
        <ng-template #preloader>
            <nx-pre-loader type="short"></nx-pre-loader>
        </ng-template>
        <ng-container *ngIf="bitrateInfo$ | async as bitrateInfo; else preloader">
            <div
                *ngFor="let metric of bitrateInfo; let i = index"
                [ngClass]="{ 'info-type': !i }"
            >
                {{ metric | nxTranslate }}
            </div>
        </ng-container>
    </div>

    <div
        class="status"
        *ngIf="layoutsItemStatus && !!statusText$$()"
    >
        {{ statusText$$().toUpperCase() | translate }}
    </div>

    <div class="content">
        <ng-container *ngIf="!scaled$$(); else tooSmall">
            <ng-content />
        </ng-container>
    </div>
</div>
