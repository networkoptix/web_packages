<div
    class="nx-layout-grid-item-overlay"
    [ngClass]="{ show: (isMenuOpened$$() || isFullscreen$$()) && !hide, hide: hide }"
>
    <ng-template
        #svgIcon
        let-menuItem="menuItem"
        let-size="size"
        let-tooltipExtra="tooltipExtra"
    >
        <svg-icon
            *ngIf="menuItem"
            nx-add-svg-src
            [ngClass]="{
                active: menuItem.checked$$?.()
            }"
            [src]="menuItem.icon"
            [svgStyle]="{
                'width.px': '{{size || 24}}',
                'height.px': '{{size || 24}}'
            }"
            [nxTooltip]="(menuItem.tooltip | translate) + (tooltipExtra || '')"
            (click)="handleIconClick(menuItem.action, $event)"
        ></svg-icon>
    </ng-template>

    <div class="name">
        <ng-container
            *ngTemplateOutlet="
                svgIcon;
                context: {
                    menuItem: recordingIcon$$(),
                    size: 16,
                    tooltipExtra: extraCameraTooltip$$()
                }
            "
        />
        <div
            class="resource-name ellipsis"
            [nxTooltip]="node$$()?.name || ('Not Supported' | translate)"
        >
            {{ node$$()?.name || ('Not Supported' | translate) }}
        </div>
    </div>

    <div
        class="quick-actions"
        *ngIf="layoutsEditable"
    >
        <div
            class="action-icon"
            *ngIf="menu$$()"
            [cdkMenuTriggerFor]="nodeActionMenu"
            (cdkMenuOpened)="isMenuOpened$$.set(true)"
            (cdkMenuClosed)="isMenuOpened$$.set(false)"
        >
            <ng-container *ngTemplateOutlet="svgIcon; context: { menuItem: menu$$() }" />
            <ng-template #nodeActionMenu>
                <nx-context-menu
                    [context]="node$$()"
                    [menuItems]="menuItemsByType[node$$().type]"
                />
            </ng-template>
        </div>
        <ng-container *ngIf="quickActions$$()">
            <div
                *ngFor="let quickActionItem of quickActions$$()"
                class="action-icon"
            >
                <ng-container *ngTemplateOutlet="svgIcon; context: { menuItem: quickActionItem }" />
            </div>
        </ng-container>
    </div>

    <div class="menu-group">
        <div class="fullscreen">
            <ng-container
                *ngTemplateOutlet="svgIcon; context: { menuItem: fullscreenAction$$() }"
            />
        </div>
        <div
            class="remove"
            *ngIf="removeAction$$()"
        >
            <ng-container *ngTemplateOutlet="svgIcon; context: { menuItem: removeAction$$() }" />
        </div>
    </div>

    <div
        *ngIf="displayInfo$$() && allowDebugMode"
        class="info"
    >
        <div
            class="info-type"
            translate
        >
            Stream (stub data)
        </div>
        <div translate>1920x1080</div>
        <div translate>29.00 fps</div>
        <div translate>2.72 Mbps</div>
        <div translate>Hi-Res</div>
    </div>

    <div
        class="status"
        *ngIf="!!statusText$$()"
    >
        {{ statusText$$().toUpperCase() | translate }}
    </div>

    <div class="content">
        <ng-content />
    </div>
</div>
