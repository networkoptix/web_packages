            class="btn"
            (click)="manualRefresh()"
        >

                    version="1.1"

                    xmlns="http://www.w3.org/2000/svg"
                    class="circular"

            <span class="ml-1">{{ refreshMessage }}</span>
        </button>
        <p
            class="btn-helper mt-2 mb-0"
            [ngClass]="{ invisible: !(timeoutUntilRefresh$ | async) }"
        >
            {{ 'servers.autoRefresh' | translate: { time: (timeoutUntilRefresh$ | async) } }}
        </p>
    </div>
    <div
        class="overlay-modal"
        *ngIf="servers && servers.length"
    >
        <div class="overlay-modal-body">
            <p
                class="overlay-modal-title mb-3"
                translate
            >
                You can try to connect to other servers in this system:
            </p>
            <ul class="overlay-modal-servers pl-0 mb-0">
                <li *ngFor="let server of servers">
                    <a
                        target="_blank"
                        [href]="server.url + currentRoute | safe: 'url'"
                    >
                        <svg
                            version="1.1"
                            id="Layer_1"
                            xmlns="http://www.w3.org/2000/svg"
                            xmlns:xlink="http://www.w3.org/1999/xlink"
                            x="0px"
                            y="0px"
                            viewBox="0 0 24 24"
                            style="enable-background: new 0 0 24 24; width: 20px; height: 20px"
                            xml:space="preserve"
                        >
                            <style type="text/css">
                                .om2-st0 {
                                    fill-rule: evenodd;
                                    clip-rule: evenodd;
                                    fill: #2b383f;
                                }
                            </style>
                            <path
                                class="om2-st0"
                                d="M19,15c0.6,0,1,0.4,1,1v2c0,0.6-0.4,1-1,1H5c-0.6,0-1-0.4-1-1v-2c0-0.6,0.4-1,1-1H19z M6,16c-0.6,0-1,0.4-1,1

                                H19z M6,6C5.4,6,5,6.4,5,7s0.4,1,1,1s1-0.4,1-1S6.6,6,6,6z"
                            />
                        </svg>
                        <span class="server-name px-1">{{ server.name }}</span>
                        <span class="server-ip">{{ server.ip }}</span>
                    </a>
                </li>
            </ul>
        </div>
