<div class="preset-container">
    <nx-control-message
        key="maxlength"
        [text]="LANG.customValidatorMsg.characterLimit"
        translateWith="data"
    ></nx-control-message>
    @if (pattern()) {
        <nx-control-message
            key="pattern"
            [text]="LANG.patternValidatorMsg[pattern()!] | translate"
        ></nx-control-message>
    }
    <nx-control-message
        key="required"
        [text]="'Required' | translate"
    ></nx-control-message>
</div>
<div
    class="sizing-container"
    [ngStyle]="{ 'width.px': width() }"
>
    <ng-content></ng-content>
</div>
<ng-template [cdkPortalOutlet]="selectedMessage()"></ng-template>
