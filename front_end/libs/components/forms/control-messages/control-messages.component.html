<div
    class="sizing-container"
    [ngStyle]="{ 'width.px': width() }"
>
    @if (preset() === 'requiredEmail') {
        <ng-container [ngTemplateOutlet]="requiredEmailPreset"></ng-container>
    }
    <ng-content></ng-content>
</div>
<ng-template [cdkPortalOutlet]="selectedMessage()"></ng-template>

<ng-template #requiredEmailPreset>
    <nx-control-message
        key="required"
        [text]="'Email is required' | translate"
    ></nx-control-message>
    <nx-control-message
        key="pattern"
        [text]="'Invalid email' | translate"
    ></nx-control-message>
    <nx-control-message
        key="maxlength"
        [text]="LANG.customValidatorMsg.charLimitExceeded"
        translateWith="data"
    ></nx-control-message>
</ng-template>
