<div class="preset-container">
    <nx-control-message
        key="maxlength"
        [text]="LANG.customValidatorMsg.characterLimit"
        translateWith="data"
    ></nx-control-message>
    @if (pattern(); as pattern) {
        <nx-control-message
            key="pattern"
            [text]="LANG.builtinValidatorMsg[pattern].invalid | translate"
        ></nx-control-message>
    }
    @if (required(); as required) {
        <nx-control-message
            key="required"
            [text]="LANG.builtinValidatorMsg[required].required | translate"
        ></nx-control-message>
    }
</div>
<div
    class="sizing-container"
    [ngStyle]="{ 'width.px': width() }"
>
    <ng-content></ng-content>
</div>
<ng-template [cdkPortalOutlet]="selectedMessage()"></ng-template>
