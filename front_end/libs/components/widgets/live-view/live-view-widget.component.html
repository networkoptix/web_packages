<ng-template #editMode>
    <ng-template #saveButton>
        <button
            class="btn btn-primary"
            (click)="saveSettings()"
            translate
        >
            Save Settings
        </button>
    </ng-template>
    <div class="edit-wrapper">
        <nx-stepper
            [saveButton]="saveButton"
            [customButtonLabels]="CUSTOM_LABELS"
            [columns]="card.size.value.cols"
        >
            <cdk-step>
                <div class="h-100">
                    <h4 translate>Select to system find camera</h4>
                    <nx-select
                        [items]="systemsDropdownItems$ | async"
                        [selected]="selectedSystem"
                        [stillLoading]="!selectedSystem"
                        (onSelected)="updateSystem($event)"
                    ></nx-select>
                </div>
            </cdk-step>
            <cdk-step>
                <div class="h-100">
                    <h4 translate>Select a camera</h4>
                    <nx-select
                        [items]="camerasDropdownItems$ | async"
                        [selected]="selectedCamera"
                        [stillLoading]="!selectedCamera"
                        (onSelected)="updateCamera($event)"
                    ></nx-select>
                </div>
            </cdk-step>
            <cdk-step>
                <div class="h-100">
                    <h4 translate>Auto update settings</h4>
                    <div>
                        <nx-checkbox
                            [(ngModel)]="card.config.autoUpdate"
                            componentId="autoUpdate"
                        ></nx-checkbox>
                        <label
                            class="mb-0"
                            for="autoUpdate"
                            translate
                            >Auto update</label
                        >
                    </div>
                    <div>
                        <nx-numeric
                            [min]="1"
                            [max]="60"
                            [(ngModel)]="card.config.updateInterval"
                        ></nx-numeric>
                    </div>
                </div>
            </cdk-step>
        </nx-stepper>
    </div>
</ng-template>

<ng-template #preloader>
    <nx-pre-loader [minHeight]="64"></nx-pre-loader>
</ng-template>

<div
    *ngIf="
        (card.config.selectedCamera && card.config.selectedSystem) || card.editMode;
        else preloader
    "
    class="live-view-wrapper"
    (resize)="updateContainerSize($event)"
>
    <ng-container *ngIf="card.config.selectedCamera && !card.editMode; else editMode">
        <ng-container *ngIf="cameraThumbnails$ | async as thumbnails">
            <span class="camera-name">{{ thumbnails[card.config.selectedCamera].name }}</span>
            <img
                class="fs-exclude"
                [src]="thumbnails[card.config.selectedCamera].previewUrl | async"
            />
        </ng-container>
    </ng-container>
</div>
