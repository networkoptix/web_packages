<button
    data-escape-global-style
    class="nx-button"
    [ngClass]="{
        'nx-button--brand': type === ButtonType.brand,
        'nx-button--secondary': type === ButtonType.secondary,
        'nx-button--danger': type === ButtonType.danger
    }"
    [innerText]="text"
    (click)="handleClick()"
    [disabled]="disabled"
></button>
