<div
    class="dropdown {{ direction }}"
    [ngClass]="{
        'dropdown-show': show,
        short: short,
        'alt-style': altStyle,
        'in-header': inHeader,
        'in-footer': inFooter
    }"
    (nxClickElsewhere)="show = false"
>
    <ng-template #loadingButton>
        <button
            class="btn btn-dropdown-toggle dropdown-toggle loading"
            type="button"
            disabled
        >
            <div>
                <span class="dot1"></span><span class="dot2"></span><span class="dot3"></span>
            </div>
        </button>
    </ng-template>

    <ng-template
        *ngIf="inHeader && CONFIG.featureFlags.newHeader; then newHeaderLangDropdown"
    ></ng-template>
    <ng-template
        *ngIf="inFooter && CONFIG.featureFlags.newHeader; then newFooterLangDropdown"
    ></ng-template>
    <div *ngIf="!isLoading$$() || short || inHeader || inFooter; else loadingButton">
        <button
            *ngIf="!CONFIG.featureFlags.newHeader || (!inHeader && !inFooter)"
            class="btn btn-dropdown-toggle dropdown-toggle"
            (click)="show = !show"
            type="button"
            id="dropdownMenuButton"
            data-toggle="dropdown"
        >
            <span
                *ngIf="!CONFIG.featureFlags.newHeader"
                class="lang-sm"
                data-testid="activeLang"
                lang="{{ activeLanguage?.language }}"
            ></span>
            <span
                *ngIf="CONFIG.featureFlags.newHeader"
                id="activeLang"
                class="lang-code"
                >{{ activeLanguage?.name.slice(0, 2) | uppercase }}</span
            >
            <span *ngIf="!short">{{ activeLanguage?.name }}</span>
            <div class="arrow-flip">
                <svg-icon
                    nx-add-svg-src
                    [src]="icons.dirTextButtons + 'arrow_expand.svg'"
                ></svg-icon>
            </div>
        </button>
    </div>
    <ul
        class="dropdown-menu"
        [ngClass]="{ 'new-header': CONFIG.featureFlags.newHeader }"
        *ngIf="languages?.length <= 12"
        [nxArrowNav]="show"
        [style.display]="show ? 'inline-block' : 'none'"
        aria-labelledby="dropdownMenuButton"
    >
        <li
            class="dropdown-item-container"
            *ngFor="let lang of languages"
        >
            <a
                class="anchor dropdown-item inset"
                href
                (click)="show = false; change(lang.language)"
                [ngClass]="{ selected: lang.language === activeLanguage.language }"
            >
                <span *ngIf="!CONFIG.featureFlags.newHeader">
                    <span
                        class="lang-sm"
                        attr.data-testid="{{ lang.name }}"
                        lang="{{ lang.language }}"
                    ></span>
                    <span>{{ lang.name }}</span>
                </span>
                <span *ngIf="CONFIG.featureFlags.newHeader">
                    <span class="lang-code">{{ lang.name.slice(0, 2) | uppercase }}</span>
                    <span>{{ lang.name }}</span>
                </span>
            </a>
        </li>
    </ul>

    <ul
        class="dropdown-menu multi-column columns-2"
        [ngClass]="{ 'new-header': CONFIG.featureFlags.newHeader, 'in-footer': inFooter }"
        *ngIf="languages?.length > 12"
        [nxArrowNav]="show"
        [style.display]="show ? 'inline-block' : 'none'"
        aria-labelledby="dropdownMenuButton"
    >
        <div class="row m-0">
            <ng-container *ngFor="let col of langColumns">
                <div
                    class="p-0"
                    [ngClass]="!!(inHeader || inFooter) ? 'col-6' : 'col-4'"
                >
                    <ul class="multi-column-dropdown">
                        <li
                            class="dropdown-item-container"
                            *ngFor="let lang of col"
                        >
                            <a
                                class="anchor dropdown-item inset"
                                href
                                (click)="show = false; change(lang.language)"
                                [ngClass]="{
                                    selected: lang.language === activeLanguage?.language
                                }"
                            >
                                <ng-container
                                    *ngTemplateOutlet="langItem; context: { lang: lang }"
                                ></ng-container>
                            </a>
                        </li>
                    </ul>
                </div>
            </ng-container>
        </div>
    </ul>
</div>

<ng-template
    #langItem
    let-lang="lang"
>
    <span *ngIf="!CONFIG.featureFlags.newHeader">
        <span
            class="lang-sm"
            attr.data-testid="{{ lang.language }}"
            lang="{{ lang.language }}"
        ></span>
        <span>{{ lang.name }}</span>
    </span>
    <span
        *ngIf="CONFIG.featureFlags.newHeader"
        id="{{ lang.language }}"
        lang="{{ lang.language }}"
    >
        <span class="lang-code">{{ lang.name.slice(0, 2) | uppercase }}</span>
        <span class="lang-name">{{ lang.name }}</span>
    </span>
</ng-template>

<ng-template #newHeaderLangDropdown>
    <button
        type="button"
        id="dropdownMenuButton"
        (click)="show = !show"
        data-toggle="dropdown"
        class="legacy-btn btn-dropdown-toggle new-header-lang"
        [ngClass]="{ active: show }"
    >
        <svg-icon
            class="language-icon"
            nx-add-svg-src
            [src]="images.dirHeader + 'language.svg'"
        ></svg-icon>
        <span id="activeLang">{{ activeLanguage?.name.slice(0, 2) | uppercase }}</span>
        <div class="dropdown-arrow-wrapper">
            <svg-icon
                nx-add-svg-src
                class="dropdown-arrow"
                [src]="icons.dirHeader + 'profile_dropdown_arrow.svg'"
            ></svg-icon>
        </div>
    </button>
</ng-template>

<ng-template #newFooterLangDropdown>
    <button
        type="button"
        id="dropdownMenuButton"
        (click)="show = !show"
        data-toggle="dropdown"
        class="legacy-btn btn-dropdown-toggle new-header-lang"
    >
        <svg-icon
            class="language-icon"
            nx-add-svg-src
            [src]="images.dirHeader + 'language.svg'"
        ></svg-icon>
        <span id="activeLang">{{ activeLanguage?.name.slice(0, 2) | uppercase }}</span>
    </button>
</ng-template>
