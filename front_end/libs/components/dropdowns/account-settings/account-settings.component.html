<div
    class="dropdown"
    #dropdown
    [ngClass]="{ show: show, 'new-header': newHeader }"
    (nxClickElsewhere)="show = false"
>
    <button
        class="inset btn btn-dropdown-toggle dropdown-toggle-transparent dropdown-toggle"
        *ngIf="!newHeader; else newHeaderButton"
        [ngClass]="{ 'small-icon-overrides': small }"
        (resize)="buttonWidth.next($event.width)"
        (click)="show = !show"
        type="button"
        id="accountSettingsSelect"
        data-toggle="dropdown"
    >
        <div
            class="popup arrow up"
            [ngClass]="{ invisible: !dropdownWidth$.value, 'small-override': small }"
        ></div>
        <svg-icon
            nx-add-svg-src
            [src]="icons.dir + 'user.svg'"
            [svgStyle]="{ 'width.px': '24', 'height.px': '24', 'margin.px': small ? '8' : '10' }"
            [applyClass]="true"
        ></svg-icon>
        <span
            *ngIf="!small"
            class="fs-mask username"
            [innerText]="environment.isLocal ? settings.name : settings.email"
        ></span>
    </button>
    <div
        class="dropdown-menu"
        [ngClass]="{ invisible: !show }"
        (resize)="dropdownWidth$.next($event.width)"
        [nxArrowNav]="show"
        [style.display]="'inline-block'"
        [style.right.px]="rightOffset$.value"
        aria-labelledby="accountSettingsSelect"
        data-testid="accountSettingsDropdown"
    >
        <ul class="dropdown-menu--list width-override">
            <ng-container *ngIf="!environment.isLocal">
                <li
                    class="dropdown-item-container"
                    *ngFor="let dropdownItem of accountDropdown; let i = index"
                >
                    <ng-container
                        *ngTemplateOutlet="
                            dropdownItem.newWindow ? externalLink : routerLink;
                            context: { dropdownItem: dropdownItem, index: i }
                        "
                    ></ng-container>
                </li>
            </ng-container>
            <li class="dropdown-item-container">
                <a
                    class="dropdown-item inset"
                    data-testid="logoutHeader"
                    (click)="show = false; logout()"
                >
                    <span translate>Log Out</span>
                </a>
            </li>
        </ul>
        <ul
            class="dropdown-menu--footer"
            *ngIf="settings.is_staff"
        >
            <li
                class="dropdown-divider"
                role="separator"
            ></li>
            <li
                class="dropdown-item-container"
                *ngFor="let dropdownItem of accountDropdownStaff; let i = index"
            >
                <ng-container
                    *ngTemplateOutlet="
                        dropdownItem.newWindow ? externalLink : routerLink;
                        context: { dropdownItem: dropdownItem, index: i }
                    "
                ></ng-container>
            </li>
        </ul>
    </div>
</div>

<ng-template
    #routerLink
    let-dropdownItem="dropdownItem"
    let-index="index"
>
    <a
        class="dropdown-item inset"
        id="dropdownItem{{ index }}"
        (click)="hide()"
        [routerLink]="dropdownItem.route"
    >
        <span>{{ dropdownItem.name | translate }}</span>
    </a>
</ng-template>

<ng-template
    #externalLink
    let-dropdownItem="dropdownItem"
    let-index="index"
>
    <a
        class="dropdown-item inset"
        id="dropdownItem{{ index }}"
        [href]="dropdownItem.route"
    >
        <span>{{ dropdownItem.name | translate }}</span>
    </a>
</ng-template>

<ng-template #newHeaderButton>
    <button
        class="btn auth-section"
        [ngClass]="{ active: show || isAccountRoute }"
        (click)="show = !show"
    >
        <a class="user-section logged-in">
            <span class="user-svg-wrapper">
                <svg-icon
                    nx-add-svg-src
                    class="user-svg"
                    [svgStyle]="{ 'width.px': '20' }"
                    [src]="icons.dir + 'user.svg'"
                ></svg-icon>
            </span>
            <span class="displayed-name">
                {{ displayedFullName }}
            </span>
            <div class="dropdown-arrow-wrapper">
                <svg-icon
                    nx-add-svg-src
                    class="dropdown-arrow"
                    [src]="icons.dirHeader + 'profile_dropdown_arrow.svg'"
                ></svg-icon>
            </div>
        </a>
    </button>
</ng-template>
