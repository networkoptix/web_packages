<div
    class="dropdown"
    [ngClass]="{ 'multi-select-show': show }"
    (nxClickElsewhere)="show = false"
>
    <button
        class="btn btn-dropdown-toggle dropdown-toggle"
        (click)="show = !show"
        [id]="componentId"
        type="button"
        data-toggle="dropdown"
    >
        <span
            [innerText]="textSelected || '' | nxTranslate"
            class="ellipsis d-contents d-md-block"
        ></span>
        <div class="arrow-flip">
            <svg-icon
                nx-add-svg-src
                [src]="icons.dirTextButtons + 'arrow_expand.svg'"
            ></svg-icon>
        </div>
    </button>
    <div
        class="dropdown-menu"
        [nxArrowNav]="show"
        [style.display]="show ? 'inline-block' : 'none'"
        [attr.aria-labelledby]="componentId"
    >
        <div
            *ngIf="canSearch"
            class="search-box"
        >
            <svg-icon
                nx-add-svg-src
                class="web-icon-search icon-search"
                [src]="icons.dir + 'search.svg'"
            ></svg-icon>
            <input
                class="form-control search-input inset"
                autocomplete="off"
                [placeholder]="'Search' | translate"
                [ngModel]="filter"
                (ngModelChange)="applyLocalFilter($event)"
            />
            <span
                class="glyphicon close-icon search-clear"
                [hidden]="filter === ''"
                (click)="applyLocalFilter('')"
            ></span>
        </div>
        <ul
            class="dropdown-menu--header"
            *ngIf="canSelectAll"
        >
            <li class="dropdown-item-container">
                <a
                    [id]="componentId + '-selectAll'"
                    class="dropdown-item dropdown-item--non-checkbox inset"
                    (click)="clearSelected(); show = false"
                    translate
                    >Any</a
                >
            </li>
            <li
                *ngIf="items.length"
                role="separator"
                class="dropdown-divider"
            ></li>
        </ul>

        <ul class="dropdown-menu--list">
            <cdk-virtual-scroll-viewport
                *ngIf="items.length > 50; else normalLengthItems"
                [itemSize]="16"
                class="vsv-viewport"
            >
                <li
                    class="dropdown-item-container"
                    *cdkVirtualFor="let item of items; last as isLast"
                >
                    <ng-container
                        *ngTemplateOutlet="
                            defaultItemTemplate;
                            context: { $implicit: item, isLast: isLast }
                        "
                    ></ng-container>
                </li>
            </cdk-virtual-scroll-viewport>
        </ul>
    </div>
</div>

<ng-template #normalLengthItems>
    <li
        class="dropdown-item-container"
        *ngFor="let item of items; trackBy: trackItem; last as isLast"
    >
        <ng-container
            *ngTemplateOutlet="defaultItemTemplate; context: { $implicit: item, isLast: isLast }"
        ></ng-container>
    </li>
</ng-template>

<ng-template
    #defaultItemTemplate
    let-item
    let-isLast
>
    <div
        class="dropdown-item inset"
        [nxTooltip]="item.tooltip"
        [alternateSecondary]="tooltipAlternateSecondary"
        [horizontal]="tooltipHorizontal"
        [ngClass]="{
            'default-cursor': ['horizontal', 'title'].includes(item.id),
            'mb-1': isLast
        }"
        [ngSwitch]="item.id"
    >
        <hr *ngSwitchCase="'horizontal'" />
        <h4
            class="h4 pl-3"
            *ngSwitchCase="'title'"
        >
            {{ item.label | translate }}
        </h4>
        <ng-container *ngSwitchDefault>
            <nx-checkbox
                [disabled]="item.disabled"
                componentId="{{ componentId + '-' + item.id }}"
                [checked]="item.selected"
                (click)="change(item)"
            ></nx-checkbox>
            <label
                class="ellipsis"
                [ngClass]="{
                    'more-left-padding': moreLeftPadding,
                    'text-muted': item.disabled
                }"
                [style.pointer-events]="item.disabled ? 'none' : ''"
                [htmlFor]="componentId + '-' + item.id"
                >{{ item.label | translate }}</label
            >
        </ng-container>
    </div>
</ng-template>
