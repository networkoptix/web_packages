<div
    *ngIf="visible"
    class="placeholder-text unsaved-changes"
>
    <div
        *ngIf="warn"
        class="warning-text pb-3"
    >
        {{ warn }}
    </div>
    <div class="d-flex">
        <nx-button
            [type]="ButtonType.brand"
            [disabled]="saveDisabled"
            (onClick)="save()"
        >
            <span [innerText]="'Save' | translate"></span>
        </nx-button>
        <nx-button
            [type]="ButtonType.secondary"
            (onClick)="discard()"
        >
            <span [innerText]="'Cancel' | translate"></span>
        </nx-button>
    </div>
</div>
