<div
    *ngIf="visible"
    class="placeholder-text unsaved-changes"
>
    <div
        *ngIf="warn"
        class="warning-text pb-3"
    >
        {{ warn }}
    </div>
    <div class="d-flex">
        <button
            type="button"
            class="btn btn-primary"
            (click)="save()"
            [disabled]="saveDisabled"
            translate
        >
            Save
        </button>
        <button
            type="button"
            class="ml-2 btn btn-default"
            (click)="discard()"
            translate
        >
            Cancel
        </button>
    </div>
</div>
