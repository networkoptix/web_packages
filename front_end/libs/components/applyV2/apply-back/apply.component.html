@if (visible) {
    <div class="placeholder-text unsaved-changes">
        @if (warn) {
            <div class="warning-text pb-3">
                {{ warn }}
            </div>
        }
        <div class="d-flex">
            <nx-button
                type="brand"
                [disabled]="saveDisabled"
                (onClick)="save()"
                text="{{ 'Save' | translate }}"
            ></nx-button>
            <nx-button
                class="ml-2"
                type="secondary"
                (onClick)="discard()"
                text="{{ 'Cancel' | translate }}"
            ></nx-button>
        </div>
    </div>
}
