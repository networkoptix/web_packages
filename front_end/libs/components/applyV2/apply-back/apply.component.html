@if (visible) {
    <div class="placeholder-text unsaved-changes">
        @if (warn) {
            <div class="warning-text pb-3">
                {{ warn }}
            </div>
        }
        <div class="d-flex">
            <nx-button
                type="brand"
                [disabled]="saveDisabled"
                (onClick)="save()"
                >{{ 'Save' | translate }}</nx-button
            >
            <nx-button
                class="ml-2"
                type="secondary"
                (onClick)="discard()"
                ><span>{{ 'Cancel' | translate }}</span></nx-button
            >
        </div>
    </div>
}
