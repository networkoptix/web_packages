@if (visible) {
    <div class="placeholder-text unsaved-changes">
        @if (warn) {
            <div class="warning-text pb-3">
                {{ warn }}
            </div>
        }
        <div class="d-flex">
            <button
                type="button"
                class="btn btn-primary"
                (click)="save()"
                [disabled]="saveDisabled"
                translate
            >
                Save
            </button>
            <button
                type="button"
                class="ml-2 btn btn-default"
                (click)="discard()"
                translate
            >
                Cancel
            </button>
        </div>
    </div>
}
