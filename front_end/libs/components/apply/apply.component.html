<div
    *ngIf="ready && isOnline"
    class="pt-3 placeholder-text"
    [ngClass]="{ 'unsaved-changes': show }"
>
    <div
        *ngIf="show && warn"
        class="warning-text pb-3"
    >
        {{ warn }}
    </div>
    <div
        *ngIf="show; else noChanges"
        class="d-flex"
    >
        <ng-container *ngIf="showSectionWarning; else applyButtons">
            <div
                class="warning-text pb-3"
                translate
            >
                Page contains unsaved changes.
            </div>
        </ng-container>
        <ng-template #applyButtons>
            <nx-process-button
                [process]="save"
                [actionType]="'primary min-w-120'"
                [buttonDisabled]="!isOnline || isSaveDisabled"
                [clickFn]="submitFn"
                buttonText="{{ 'Save' | translate }}"
                data-testid="saveSettingsBtn"
            ></nx-process-button>
            <nx-cancel-button
                [process]="save"
                [discardFn]="discard"
                [showDiscard]="showDiscard"
                customClass="ml-2"
                data-testid="cancelSettingsBtn"
            ></nx-cancel-button>
        </ng-template>
    </div>
    <ng-template #noChanges>
        <div
            *ngIf="applyVisible"
            class="placeholder-text-no-changes"
            translate
        >
            No unsaved changes
        </div>
    </ng-template>
</div>
