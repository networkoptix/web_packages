<div
    cdkMenu
    [ngClass]="isSubMenu ? 'sub-menu' : ''"
>
    @for (item of menu; track item) {
  
        @if (item.name === 'divider') {
<mat-divider />
}

        @if (!!item.subMenu && !item.disabled$$?.()) {

            <button
                cdkMenuItem
                [cdkMenuTriggerFor]="subMenu"
            >
                {{ item.name | translate }}
                <svg-icon
                    nx-add-svg-src
                    [svgStyle]="{
                                    'width.px': '16',
                                    'height.px': '16',
                                }"
                    [src]="icons.dirTextButtons + 'arrow_right.svg'"
                >
                </svg-icon>
            </button>
            <ng-template #subMenu>
                @if (!!item.subMenu) {
<nx-context-menu
                   
                    [menuItems]="item.subMenu"
                    [context]="context"
                    [isSubMenu]="true"
                />
}
            </ng-template>
        
}

        @if (!item.subMenu && !!item.action && !!item.name && !item.disabled$$?.()) {

            <button
                cdkMenuItem
                (click)="item.action($event, context); $event.stopPropagation()"
                [ngClass]="{checked: item.checked$$?.()}"
                [disabled]="item.disabled$$?.()"
            >
                {{ item.name | translate }}
                @if (item.checked$$?.()) {
<svg-icon
                   
                    nx-add-svg-src
                    [svgStyle]="{
                                    'width.px': '16',
                                    'height.px': '16',
                                }"
                    [src]="icons.dirLayouts + 'yes.svg'"
                >
                </svg-icon>
}
            </button>
        
}

        @if (item.disabled$$?.()) {

            <button
                cdkMenuItem
                [disabled]="item.disabled$$?.()"
            >
                {{ item.name | translate }}
            </button>
        
}
    
}
</div>
