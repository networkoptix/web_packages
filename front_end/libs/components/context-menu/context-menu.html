<div
    cdkMenu
    [ngClass]="isSubMenu ? 'sub-menu' : ''"
>
    <ng-container *ngFor="let item of menu">
        <mat-divider *ngIf="item.name === 'divider'" />

        <ng-container *ngIf="!!item.subMenu && !item.disabled$$?.()">
            <button
                cdkMenuItem
                [cdkMenuTriggerFor]="subMenu"
            >
                {{ item.name | translate }}
                <svg-icon
                    nx-add-svg-src
                    [svgStyle]="{
                                    'width.px': '16',
                                    'height.px': '16',
                                }"
                    [src]="icons.dirTextButtons + 'arrow_right.svg'"
                >
                </svg-icon>
            </button>
            <ng-template #subMenu>
                <nx-context-menu
                    *ngIf="!!item.subMenu"
                    [menuItems]="item.subMenu"
                    [context]="context"
                    [isSubMenu]="true"
                />
            </ng-template>
        </ng-container>

        <ng-container *ngIf="!item.subMenu && !!item.action && !!item.name && !item.disabled$$?.()">
            <button
                cdkMenuItem
                (click)="item.action($event, context); $event.stopPropagation()"
                [ngClass]="{checked: item.checked$$?.()}"
                [disabled]="item.disabled$$?.()"
            >
                {{ item.name | translate }}
                <svg-icon
                    *ngIf="item.checked$$?.()"
                    nx-add-svg-src
                    [svgStyle]="{
                                    'width.px': '16',
                                    'height.px': '16',
                                }"
                    [src]="icons.dirLayouts + 'yes.svg'"
                >
                </svg-icon>
            </button>
        </ng-container>

        <ng-container *ngIf="item.disabled$$?.()">
            <button
                cdkMenuItem
                [disabled]="item.disabled$$?.()"
            >
                {{ item.name | translate }}
            </button>
        </ng-container>
    </ng-container>
</div>
