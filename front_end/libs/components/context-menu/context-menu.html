<div
    cdkMenu
    [ngClass]="subMenu ? 'sub-menu' : ''"
>
    <ng-container *ngFor="let item of menu">
        <mat-divider *ngIf="item.name === 'divider'" />

        <ng-container *ngIf="!!item.subMenu">
            <button
                cdkMenuItem
                [cdkMenuTriggerFor]="subMenu"
            >
                {{ item.name | translate }}
                <svg-icon
                    nx-add-svg-src
                    [svgStyle]="{
                                    'width.px': '16',
                                    'height.px': '16',
                                }"
                    [src]="icons.dirTextButtons + 'arrow_right.svg'"
                >
                </svg-icon>
            </button>
            <ng-template #subMenu>
                <nx-context-menu
                    [menuItems]="item.subMenu"
                    [context]="context"
                    [subMenu]="true"
                />
            </ng-template>
        </ng-container>

        <ng-container *ngIf="!item.subMenu && !!item.action && !!item.name">
            <button
                cdkMenuItem
                (click)="item.action($event, context); $event.stopPropagation()"
                [ngClass]="{checked: item.checked}"
            >
                {{ item.name | translate }}
                <svg-icon
                    *ngIf="item.checked"
                    nx-add-svg-src
                    [svgStyle]="{
                                    'width.px': '16',
                                    'height.px': '16',
                                }"
                    [src]="icons.dirLayouts + 'yes.svg'"
                >
                </svg-icon>
            </button>
        </ng-container>
    </ng-container>
</div>
