<a
    name="{{ _name ? 'tag-' + _name : _name }}"
    id="{{ _id ? 'tag-' + _id : _id }}"
    [ngClass]="[element, size, badgeType, locked ? 'static' : '']"
    class="{{ type && type !== 'default' ? 'theme-override' : '' }} {{ customClass }}"
    data-theme="light"
    [attr.href]="tagHref"
    (click)="clickChange(true)"
>
    <ng-content></ng-content>
    <span
        *ngIf="selected"
        class="close-button"
        (click)="$event.stopPropagation(); clickChange(false)"
    >
        <span class="glyphicon tag-close-icon"></span>
    </span>
</a>
