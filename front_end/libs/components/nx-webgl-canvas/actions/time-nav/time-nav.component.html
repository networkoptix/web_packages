<div>
    <!--    <nx-time></nx-time>-->

    <div id="calendar-nav">
        <nx-timeline-button
            [type]="TimelineButtonType.action"
            (click)="handleCalendarClick()"
        >
            <svg-icon
                nx-add-svg-src
                [src]="icons.dirActions + 'calendar.svg'"
                [svgStyle]="{
                    'width.px': '20',
                    'height.px': '20'
                }"
                [applyClass]="true"
            ></svg-icon>
        </nx-timeline-button>
    </div>
    <div id="jump-to-nav">
        <nx-select-v2
            [placeholder]="'Jump to...' | translate"
            [ngModel]="selectedJumpTarget"
            (ngModelChange)="handleJumpTargetChange($event)"
        >
            <nx-select-item
                class="text-action"
                *ngFor="let jump of jumpLabels | keyvalue"
                [value]="jump.value"
                [selected]="jump.value === selectedJumpTarget"
            >
                {{ jump.key }}
            </nx-select-item>
        </nx-select-v2>
    </div>
</div>
