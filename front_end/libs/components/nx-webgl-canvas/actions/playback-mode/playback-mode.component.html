<div>
    <nx-timeline-button
        class="regular"
        [type]="TimelineButtonType.action"
        (click)="handleActionClick(TimelineButtonAction.actionSkipPrev)"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirActions + 'skip.svg'"
            [svgStyle]="{
                'width.px': '20',
                'height.px': '20'
            }"
            [applyClass]="true"
        ></svg-icon>
    </nx-timeline-button>
    <nx-timeline-button
        class="regular"
        [type]="TimelineButtonType.action"
        (click)="handleActionClick(TimelineButtonAction.actionRewindBackward)"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirActions + 'rewind.svg'"
            [svgStyle]="{
                'width.px': '20',
                'height.px': '20'
            }"
            [applyClass]="true"
        ></svg-icon>
    </nx-timeline-button>
    <nx-timeline-button
        [type]="TimelineButtonType.action"
        (click)="handleActionClick(TimelineButtonAction.actionPlay)"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirActions + 'play_arrow.svg'"
            [svgStyle]="{
                'width.px': '20',
                'height.px': '20'
            }"
            [applyClass]="true"
        ></svg-icon>
    </nx-timeline-button>
    <nx-timeline-button
        class="regular stacked"
        [type]="TimelineButtonType.action"
        (click)="handleActionClick(TimelineButtonAction.actionSpeed)"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirActions + 'play_speed.svg'"
            [svgStyle]="{
                'width.px': '20',
                'height.px': '20'
            }"
            [applyClass]="true"
        ></svg-icon>
    </nx-timeline-button>
    <nx-timeline-button
        class="regular"
        [type]="TimelineButtonType.action"
        (click)="handleActionClick(TimelineButtonAction.actionSRewindForward)"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirActions + 'rewind.svg'"
            [svgStyle]="{
                'width.px': '20',
                'height.px': '20'
            }"
            [applyClass]="true"
        ></svg-icon>
    </nx-timeline-button>
    <nx-timeline-button
        class="regular"
        [type]="TimelineButtonType.action"
        (click)="handleActionClick(TimelineButtonAction.actionSkipNext)"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirActions + 'skip.svg'"
            [svgStyle]="{
                'width.px': '20',
                'height.px': '20'
            }"
            [applyClass]="true"
        ></svg-icon>
    </nx-timeline-button>
    <nx-timeline-button
        [type]="TimelineButtonType.action"
        [active]="mode === MODE.SELECTION"
        (click)="handleActionClick(TimelineButtonAction.actionMode)"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirActions + 'selection.svg'"
            [svgStyle]="{
                'width.px': '20',
                'height.px': '20'
            }"
            [applyClass]="true"
        ></svg-icon>
    </nx-timeline-button>
</div>
