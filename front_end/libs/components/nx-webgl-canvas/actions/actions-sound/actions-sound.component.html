<div>
    <nx-timeline-button
        class="regular"
        [type]="TimelineButtonType.action"
        (click)="handleActionClick(TimelineButtonAction.actionBookmarks)"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirActions + 'bookmarks.svg'"
            [svgStyle]="{
                'width.px': '20',
                'height.px': '20'
            }"
            [applyClass]="true"
        ></svg-icon>
    </nx-timeline-button>
    <nx-timeline-button
        class="regular"
        [type]="TimelineButtonType.action"
        (click)="handleActionClick(TimelineButtonAction.actionChunkMode)"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirActions + 'chunk_mode.svg'"
            [svgStyle]="{
                'width.px': '20',
                'height.px': '20'
            }"
            [applyClass]="true"
        ></svg-icon>
    </nx-timeline-button>
    <nx-timeline-button
        class="regular"
        [type]="TimelineButtonType.action"
        (click)="handleActionClick(TimelineButtonAction.actionSync)"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirActions + 'sync.svg'"
            [svgStyle]="{
                'width.px': '20',
                'height.px': '20'
            }"
            [applyClass]="true"
        ></svg-icon>
    </nx-timeline-button>
    <nx-timeline-button
        class="regular padded"
        [type]="TimelineButtonType.action"
        (click)="handleActionClick(TimelineButtonAction.actionLive)"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirActions + 'live.svg'"
            [svgStyle]="{
                'width.px': '20',
                'height.px': '20'
            }"
            [applyClass]="true"
        ></svg-icon>
    </nx-timeline-button>
    <nx-timeline-button
        class="regular"
        [type]="TimelineButtonType.action"
        (click)="handleActionClick(TimelineButtonAction.actionVolume)"
    >
        <svg-icon
            nx-add-svg-src
            [src]="icons.dirActions + 'volume.svg'"
            [svgStyle]="{
                'width.px': '20',
                'height.px': '20'
            }"
            [applyClass]="true"
        ></svg-icon>
    </nx-timeline-button>
</div>
