@if (position()) {
    <div
        #timePlaybackEar
        [ngClass]="{ 'show-go-to-live': showGoToLiveAndPlayingArchive() }"
    >
        <span class="date">{{ date$$() }}</span>
        <span class="time">{{ time$$() }}</span>
        <svg
            class="bottom-arrow"
            viewbox="0 0 180 5"
        >
            <polygon [attr.points]="svgArrow" />
        </svg>
        <div class="side-arrow"></div>
        <div
            #timePlaybackLine
            class="vertical-line"
            [ngStyle]="{ 'left.px': vlPosition }"
        ></div>
        @if (showGoToLiveAndPlayingArchive()) {
            <span
                class="go-to-live-action"
                (click)="goToLive()"
                translate
                >Go to Live</span
            >
        }
    </div>
}
