<!-- keep false until cookieBanner reimplemented -->
<div
    class="banner"
    *ngIf="cookiePolicyExists && !cookieBannerReviewed"
>
    <p
        class="paragraph"
        *ngrxLet="LANG.cookieWarning | translate as cookieWarning"
    >
        <span [innerText]="cookieWarning | translateCut: 0"></span
        ><a
            [routerLink]="cookiePolicyURL"
            [innerText]="cookieWarning | translateCut: 1"
        ></a
        ><span [innerText]="cookieWarning | translateCut: 2"></span>
    </p>
    <svg-icon
        nx-add-svg-src
        (click)="onCookieBannerClose()"
        [src]="icons.dirTextButtons + 'close.svg'"
        [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
        [applyClass]="true"
    >
    </svg-icon>
</div>
