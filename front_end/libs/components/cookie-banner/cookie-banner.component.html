<!-- keep false until cookieBanner reimplemented -->
<div
    class="banner"
    *ngIf="false && !cookieBannerReviewed"
>
    <p>
        <span [innerHTML]="'cookieWarning' | translate | translateCut: 0"></span
        ><a
            routerLink="/"
            [innerText]="'cookieWarning' | translate | translateCut: 1"
        ></a
        ><span [innerHTML]="'cookieWarning' | translate | translateCut: 2"></span>
    </p>
    <svg-icon
        nx-add-svg-src
        (click)="onCookieBannerClose()"
        [src]="icons.dirTextButtons + 'close.svg'"
        [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
        [applyClass]="true"
    >
    </svg-icon>
</div>
