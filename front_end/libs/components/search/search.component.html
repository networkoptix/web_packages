<div class="nx-search">
    <div
        class="row m-0"
        [ngClass]="{ 'mb-2': layout === 'selectors' }"
    >
        <div
            class="col-12 p-0"
            *ngIf="layout !== 'selectors'"
        >
            <div class="d-block d-md-inline-flex flex-md-row w-100">
                <div
                    class="search-group"
                    [class]="layout"
                    [ngClass]="{ 'mr-3': layout === 'full' }"
                >
                    <input
                        [ngModel]="localFilter.query"
                        (ngModelChange)="onSearchType($event)"
                        [ngClass]="{ 'non-empty': localFilter.query }"
                        [maxLength]="search.maxLength"
                        (focus)="setOnFocus()"
                        (focusout)="setOnFocusOut()"
                        (keydown.arrowup)="navArrow(buttonArrowTypeUp)"
                        (keydown.arrowdown)="navArrow(buttonArrowTypeDown)"
                        (keyup.enter)="navSelect()"
                        type="text"
                        class="form-control search-input"
                        name="query"
                        autocomplete="off"
                        [placeholder]="placeholder | translate"
                    />
                    <span class="glyphicon web-icon-search icon-search"></span>
                    <button
                        class="inset search-clear btn btn-clear"
                        *ngIf="localFilter.query"
                        (click)="resetQuery()"
                    >
                        <svg-icon
                            [src]="icons.dirTextButtons + 'close.svg'"
                            [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                        ></svg-icon>
                    </button>
                </div>
                <div
                    class="float-left btn btn-big btn-tag btn-tag-selected mt-3 mt-md-0 mr-1"
                    *ngIf="numberFilters !== 0 && layout === 'full'"
                >
                    <span
                        class="filter-label"
                        [dir]="'auto' | as: Direction"
                        >{{ filtersSelected }}</span
                    >
                    <span
                        class="close-button"
                        (click)="resetFilters()"
                    >
                        <span class="glyphicon tag-close-icon"></span>
                    </span>
                </div>

                <div
                    class="btn btn-arrow btn-big btn-tag float-left mt-3 mt-md-0"
                    [ngClass]="{ 'cam-table-show btn-tag-selected': showAdvancedOptions }"
                    (click)="toggleAdvOptions()"
                    *ngIf="layout === 'full'"
                >
                    <div class="arrow-flip">
                        <svg-icon
                            nx-add-svg-src
                            [src]="icons.dirTextButtons + 'arrow_expand.svg'"
                        ></svg-icon>
                    </div>
                    <span
                        class="btn-tag-label"
                        translate
                        >Advanced Search</span
                    >
                </div>
            </div>
        </div>

        <div
            class="row col-12 m-0 p-0"
            [ngClass]="{ 'mt-3': layout !== 'selectors' }"
            [hidden]="!showAdvancedOptions && layout !== 'selectors'"
            *ngIf="canShowSelectors || canShowTags"
        >
            <div
                class="drop-container row col-12 m-0 p-0"
                [ngClass]="{ 'flex-row': layout !== 'selectors' }"
                [ngStyle]="{ 'max-width': layout === 'selectors' ? '100%' : '992px' }"
                *ngIf="canShowSelectors"
            >
                <div
                    class="drop {{ select.css || '' }}"
                    *ngFor="let select of localFilter.selects"
                    [ngClass]="{
                        'mb-2': layout === 'selectors',
                        'mb-3': layout !== 'selectors',
                        'col-xl-12': layoutMod
                    }"
                    [ngStyle]="{ flex: layoutMod ? '0 0 100%' : '' }"
                >
                    <label
                        style="text-transform: capitalize"
                        *ngIf="select.label !== ''"
                        >{{ select.label | translate }}</label
                    >
                    <nx-select
                        [componentId]="select.id"
                        [name]="select.label"
                        [items]="select.items"
                        [(ngModel)]="select.selected"
                        (ngModelChange)="onModelChange()"
                        [selected]="select.selected ? select.selected : null"
                    ></nx-select>
                </div>

                <div
                    class="drop mb-3"
                    *ngFor="let multiselect of localFilter.multiselects"
                    [ngClass]="{
                        'mb-2': layout === 'selectors',
                        'mb-3': layout !== 'selectors'
                    }"
                >
                    <label style="text-transform: capitalize">{{
                        multiselect.label | translate
                    }}</label>
                    <nx-multi-select
                        [componentId]="multiselect.id"
                        [name]="multiselect.label"
                        [items]="multiselect.items"
                        [(ngModel)]="multiselect.selected"
                        (ngModelChange)="onModelChange()"
                        canSelectAll
                    ></nx-multi-select>
                </div>

                <div
                    class="drop col-12 col-lg-1"
                    style="min-width: auto"
                    [ngClass]="{ 'mb-2': numberFilters }"
                    *ngIf="layout === 'selectors'"
                >
                    <button
                        class="float-right float-md-left btn btn-text has-icon"
                        *ngIf="numberFilters"
                        (click)="resetFilters()"
                    >
                        <span class="close"></span>
                        <span translate>Clear</span>
                    </button>
                </div>
            </div>

            <div
                class="search-tags m-0 p-0"
                [ngClass]="{ 'mt-2': layout !== 'full' }"
                *ngIf="canShowTags"
            >
                <div class="col-12 p-0">
                    <div class="form-group m-0">
                        <label
                            *ngIf="layout === 'full'"
                            translate
                            >Features</label
                        >
                        <nav aria-label="Cameras table navigation">
                            <ul class="pagination m-0">
                                <li
                                    class="tags ml-0"
                                    *ngFor="let tag of localFilter.tags"
                                >
                                    <nx-tag
                                        element="btn"
                                        size="large"
                                        [name]="tag.label"
                                        [(ngModel)]="tag.value"
                                        (onClick)="onModelChange()"
                                        [value]="tag.value"
                                    >
                                        <ng-container>{{ tag.label | translate }}</ng-container>
                                    </nx-tag>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
