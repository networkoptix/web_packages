<div
    [ngClass]="{ 'switch-with-label': label }"
    (click)="changeState()"
    [id]="componentId + '-wrapper'"
>
    <div class="switch position-relative">
        <label class="switch-element">
            <input
                type="checkbox"
                [ngClass]="{ selected: value }"
                [id]="componentId"
                [name]="componentId"
                [checked]="value"
                (click)="$event.stopPropagation()"
                [disabled]="disabled"
            />
            <span
                class="slider round"
                [ngClass]="{ disable: disabled, 'show-warning': showWarning }"
            ></span>

            <div
                class="bar"
                [ngClass]="{ disable: disabled, 'show-warning': showWarning }"
            ></div>
            <div
                class="circle"
                [ngClass]="{ disable: disabled, 'show-warning': showWarning }"
            ></div>
        </label>
    </div>
    <h4
        *ngIf="label"
        class="h4 pl-3 switch-label"
    >
        {{ label }}
    </h4>
</div>
