<ng-template #currentItemContext>
    <nx-context-menu
        [context]="currentNode"
        [menuItems]="menuItemsByType[currentNode.type]"
    />
</ng-template>

<div class="resource-tree-wrapper">
    <nx-search
        *ngIf="layoutGridService.isLeftMenuOpen$$()"
        [ngModel]="layoutStateService.paramStateHandler.state$$().queryParams.search"
        layout="search"
        instant
    >
    </nx-search>
    <div
        cdkDropList
        tourAnchor="cloud-layouts_left-menu"
        [cdkDropListDisabled]="layout.locked"
        [cdkDropListEnterPredicate]="preventDrop"
        [ngClass]="{ 'tree-invisible': !layoutGridService.isLeftMenuOpen$$() }"
        class="cdk-tree"
    >
        <ng-template
            #expandableNode
            let-node="node"
        >
            <!-- This is the tree node template for expandable nodes -->
            <div
                class="tree-node cdk-tree-node"
                [tourAnchor]="'cloud-layouts_' + node.type"
            >
                <div
                    cdkDrag
                    (click)="toggleNode(node)"
                    [cdkDragDisabled]="dragDisabled[node.type] || layout.locked"
                    (cdkDragMoved)="
                        layoutGridService.moveAddedItem.next({
                            event: $event
                        })
                    "
                    (cdkDragReleased)="layoutGridService.addItem.next(node)"
                    class="root-node"
                >
                    <ng-container
                        *ngTemplateOutlet="
                            nodeInfo;
                            context: {
                                node: node,
                                expandable: node.children.length && !node.hidden,
                                expanded: !treeControl.isExpanded(node) && !tourService.currentStep
                            }
                        "
                    ></ng-container>
                </div>
                <div
                    [class.tree-invisible]="
                        !treeControl.isExpanded(node) && !tourService.currentStep
                    "
                    class="expanded-tree"
                >
                    <!-- <span
                    *ngIf="!node.children.length"
                    class="no-children"
                    translate
                    >No Items</span
                > -->
                    <ng-container
                        *ngTemplateOutlet="renderChildren; context: { nodes: node.children }"
                    ></ng-container>
                </div></div
        ></ng-template>
        <ng-template
            #leafNode
            let-node="node"
        >
            <!-- This is the tree node template for leaf nodes -->
            <div
                #currentItem
                cdkDropList
                [cdkDropListEnterPredicate]="preventDrop"
                [nxForceVisibility]="node.details.id === this.layout?.id"
                forceVisibilityOnce
                visibilityMargin="32px"
                scrollBehavior="instant"
                class="tree-node cdk-tree-node"
                [ngClass]="{ 'hidden-node': node.hidden }"
            >
                <div
                    cdkDrag
                    [cdkDragDisabled]="
                        !node.details ||
                        layout.locked ||
                        !node.type ||
                        node.details?.id === layout.id
                    "
                    (click)="handleSingleClick(node)"
                    (dblclick)="handleDoubleClick(node)"
                    (cdkDragMoved)="
                        layoutGridService.moveAddedItem.next({
                            event: $event,
                            itemParent: currentItem,
                            type: node.type
                        })
                    "
                    (cdkDragReleased)="layoutGridService.addItem.next(node)"
                    [alternativeTargetRef]="tooltipOffsetTarget"
                    [nxTooltip]="
                        (showTooltip$ | async) &&
                        (node.type === RESOURCE_TYPE.CAMERA
                            ? cameraTooltip
                            : node.type === RESOURCE_TYPE.SERVER && CONFIG.featureFlags.layoutsDemo
                            ? serverTooltip
                            : '')
                    "
                    (mouseenter)="updateTooltipTarget(node.details.id)"
                    (mouseleave)="unsubTooltips()"
                    horizontal
                    alternateStyle
                    [tourAnchor]="
                        layout?.id &&
                        cleanId(changingLayout || layout?.id) === cleanId(node?.details?.id)
                            ? 'cloud-layouts_selected-' +
                              (node.type === RESOURCE_TYPE.LAYOUT ? RESOURCE_TYPE.LAYOUT : 'focus')
                            : ''
                    "
                    [ngClass]="{
                        selected:
                            layout?.id &&
                            cleanId(changingLayout || layout?.id) === cleanId(node?.details?.id),
                        offline:
                            node.type !== RESOURCE_TYPE.LAYOUT &&
                            !node.details.unauthorized &&
                            !node.details.online
                    }"
                    class="tooltip-offset-parent"
                >
                    <div
                        #tooltipOffsetTarget
                        class="tooltip-offset-target"
                    ></div>
                    <div *cdkDragPreview>
                        <div
                            class="add-preview"
                            *ngIf="node.type !== RESOURCE_TYPE.CAMERA"
                        >
                            <ng-container
                                [ngTemplateOutlet]="nodeInfo"
                                [ngTemplateOutletContext]="{ node: node, preview: true }"
                            ></ng-container>
                        </div>
                        <ng-container
                            *ngIf="node.type == RESOURCE_TYPE.CAMERA"
                            [ngTemplateOutlet]="cameraTooltip"
                        ></ng-container>
                    </div>

                    <ng-container
                        *ngTemplateOutlet="
                            nodeInfo;
                            context: {
                                node: node,
                                expandable: false,
                                expanded: !treeControl.isExpanded(node) && !tourService.currentStep
                            }
                        "
                    ></ng-container>
                </div>

                <ng-template #cameraTooltip>
                    <div class="camera-tooltip-wrapper">
                        <nx-health-image
                            [isPrimary]="true"
                            aspect="override"
                            [preloader]="true"
                            [state]="node.details.status"
                            [unavailableMessage]="'Cannot load preview' | translate"
                            [url]="node?.details?.previewUrl | async"
                            class="generic"
                        ></nx-health-image>
                    </div>
                </ng-template>

                <ng-template #serverTooltip>
                    <ng-template #tooltipLoading>
                        <nx-pre-loader [minHeight]="108"></nx-pre-loader>
                    </ng-template>
                    <div class="server-tooltip-wrapper">
                        <h4>
                            {{
                                { value: LANG.layouts.statistics, params: node.details }
                                    | nxTranslate
                            }}
                        </h4>
                        <ng-container *ngIf="serverStats$ | async as res; else tooltipLoading">
                            <div
                                *ngIf="res.statistics | as : ServerStats as stats"
                                class="stats-grid"
                            >
                                <div translate>Description</div>
                                <div translate>Usage</div>
                                <ng-container *ngFor="let type of stats">
                                    <div>
                                        {{ type.description }}
                                    </div>
                                    <div>
                                        {{ type.value }}
                                    </div>
                                </ng-container>
                            </div>
                            <div
                                *ngIf="res.error as error"
                                class="error-label"
                            >
                                {{ error | translate }}
                            </div>
                        </ng-container>
                    </div>
                </ng-template>
            </div>
        </ng-template>
        <ng-template
            #renderChildren
            let-nodes="nodes"
        >
            <ng-container *ngFor="let node of nodes; trackBy: nodeId">
                <ng-container
                    *ngTemplateOutlet="
                        node?.children?.length ? expandableNode : leafNode;
                        context: { node: node }
                    "
                ></ng-container>
            </ng-container>
        </ng-template>
        <ng-container
            *ngTemplateOutlet="renderChildren; context: { nodes: (dataSource$ | async) }"
        ></ng-container>

        <ng-template
            #nodeInfo
            let-node="node"
            let-expandable="expandable"
            let-expanded="expanded"
            let-preview="preview"
        >
            <ng-container
                *ngIf="
                    !preview && ![RESOURCE_TYPE.CAMERA, RESOURCE_TYPE.LAYOUT].includes(node.type);
                    then expandStateIcon
                "
            />
            <ng-container
                *ngIf="preview || node.type === RESOURCE_TYPE.CAMERA; then recordingIcon"
            />
            <svg-icon
                *ngIf="node.type === RESOURCE_TYPE.LAYOUT"
                nx-add-svg-src
                [svgStyle]="{
                    'width.px': '20',
                    'height.px': '20',
                    opacity:
                        layoutStateService.unsavedLayoutsIds$$()[node.id] || node.locked ? '1' : '0'
                }"
                [nxTooltip]="
                    node.locked
                        ? 'Layout locked'
                        : (layoutStateService.unsavedLayoutsIds$$()[node.id] | translate)
                "
                svgClass="recording-icon  {{ node.locked ? 'locked-icon' : '' }}"
                [src]="icons.dirLayouts + (node.locked ? 'locked.svg' : 'unsaved.svg')"
            >
            </svg-icon>
            <ng-container *ngTemplateOutlet="nodeTypeIcon" />
            <ng-container *ngIf="!menuItemsByType[node.type]; then simpleNodeText" />
            <ng-container *ngIf="menuItemsByType[node.type] as menuItems">
                <ng-container
                    *ngIf="
                        node.type === RESOURCE_TYPE.LAYOUTS;
                        then layoutsNode;
                        else nodeWithContextMenu
                    "
                />

                <ng-template #layoutsNode>
                    <ng-container [ngTemplateOutlet]="simpleNodeText" />
                    <button
                        *ngFor="let menuItem of menuItems"
                        class="action-button"
                        [nxTooltip]="menuItem.tooltip | translate : node.details"
                        (click)="menuItem.action($event, node)"
                        [tourAnchor]="'cloud-layouts_add_layout'"
                    >
                        <svg-icon
                            nx-add-svg-src
                            [svgStyle]="{
                                'width.px': '20',
                                'height.px': '20'
                            }"
                            [src]="icons.dirLayouts + 'add.svg'"
                        >
                        </svg-icon>
                    </button>
                </ng-template>

                <ng-template #nodeWithContextMenu>
                    <div
                        class="node-editable"
                        [cdkContextMenuTriggerFor]="nodeActionMenu"
                    >
                        <ng-template #searchHighlight>
                            <nx-search-highlight
                                class="ellipsis node-name"
                                [text]="node.name"
                                [search]="query$ | async"
                            ></nx-search-highlight>
                        </ng-template>
                        <nx-text-editable
                            *ngIf="
                                layoutStateService.editedLayout$$() === node.id;
                                else searchHighlight
                            "
                            class="node-name"
                            [(ngModel)]="node.name"
                            [allowUserFocus]="false"
                            [editEnabled]="true"
                            [required]="true"
                            (onFocusChanged)="!$event && handleRename(node)"
                            (onEditModeCancelled)="layoutStateService.editedLayout$$.set(null)"
                        >
                        </nx-text-editable>
                    </div>
                    <button
                        [cdkMenuTriggerFor]="nodeActionMenu"
                        (click)="$event.stopPropagation()"
                        [tourAnchor]="''"
                        class="action-button"
                    >
                        <svg-icon
                            nx-add-svg-src
                            [svgStyle]="{
                                'width.px': '20',
                                'height.px': '20',
                            }"
                            [src]="icons.dirLayouts + 'menu.svg'"
                        >
                        </svg-icon>
                    </button>
                    <ng-template #nodeActionMenu>
                        <nx-context-menu
                            [context]="node"
                            [menuItems]="menuItemsByType[node.type]"
                        />
                    </ng-template>
                </ng-template>
            </ng-container>

            <ng-template #recordingIcon>
                <svg-icon
                    *ngIf="
                        ['recording', 'scheduled', 'archive'].includes(node.details.status)
                            ? '1'
                            : '0' as opacity
                    "
                    nx-add-svg-src
                    [svgStyle]="{
                        'width.px': '20',
                        'height.px': '20',
                        opacity: opacity,
                        display: opacity === '0' && preview && 'none'
                    }"
                    svgClass="recording-icon"
                    [src]="icons.dirLayouts + node.type + '_' + node.details.status + '.svg'"
                >
                </svg-icon>
            </ng-template>
            <ng-template #expandStateIcon>
                <svg-icon
                    nx-add-svg-src
                    [svgStyle]="{
                'width.px': '20',
                'height.px': '20',
                fill: 'none !important',
                opacity: expandable ? '1' : '0',
                }"
                    svgClass="dark-17-svg"
                    [src]="icons.dirLayouts + (expanded ? 'arrow_close.svg' : 'arrow_open.svg')"
                >
                </svg-icon>
            </ng-template>
            <ng-template #nodeTypeIcon>
                <svg-icon
                    nx-add-svg-src
                    [svgStyle]="{
                'width.px': '20',
                'height.px': '20',
                }"
                    [src]="
                        icons.dirLayouts +
                        node.type +
                        (node.details && (errorIcons[node.details.id] || node.details.status)
                            ? '_' +
                              (node.type !== 'camera' ||
                              ['warning', 'unauthorized'].includes(
                                  errorIcons[node.details.id] || node.details.status
                              )
                                  ? (errorIcons[node.details.id] || node.details.status).replace(
                                        'mismatchedCertificate',
                                        'incompatible'
                                    )
                                  : node.details.unauthorized
                                  ? 'unauthorized'
                                  : node.details.online && node.details.requiresTranscoding
                                  ? 'warning'
                                  : node.details.online
                                  ? 'online'
                                  : 'offline')
                            : '') +
                        (node.shared ? '_shared' : '') +
                        '.svg'
                    "
                />
            </ng-template>
            <ng-template #simpleNodeText>
                <!-- node.name is also used for Layouts, Cameras, etc. root nodes. Needs to be translated -->
                <span
                    class="ellipsis node-name"
                    #nodeName
                    >{{ node.name }}</span
                ></ng-template
            >
        </ng-template>
    </div>
</div>
