<video
    #webRtcPlayer
    autoplay
    muted
></video>

<ng-container *ngIf="webRtcPlayer.paused && error">
    <div class="connection-error">
        {{ error }}
    </div>
</ng-container>

<div
    class="full-screen parent-hover"
    (click)="enterFullscreen()"
    translate
>
    Full Screen
</div>

<div
    *ngIf="
        !streamManager.position &&
        (CONFIG.featureFlags.layoutsPtz || CONFIG.featureFlags.layoutsDemo) &&
        camera.controlEnabled
    "
    class="ptz parent-hover"
    (click)="showPtz.emit(camera)"
    translate
>
    Ptz Controls
</div>
