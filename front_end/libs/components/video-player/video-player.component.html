<div
    *ngIf="ribbonContent$ | async as ribbonContent"
    class="status-banner"
    [ngClass]="ribbonContent.type"
>
    {{ ribbonContent.message | nxTranslate }}
</div>
<div
    *ngIf="lostConnection && lostConnectionPlaceholder"
    class="placeholder-wrapper"
>
    <ng-container *ngTemplateOutlet="lostConnectionPlaceholder"></ng-container>
</div>

<video
    #originalStream
    autoplay
    class="original-stream"
    muted
></video>

<video
    #webRtcStream
    class="web-rtc-stream"
    autoplay
    muted
    [style.opacity]="lostConnection ? 0 : 1"
    [nxRotate]="rotation"
></video>

<nx-pre-loader
    *ngIf="
        !error && (loading || lostConnection || webRtcStream.paused || !webRtcStream.currentTime)
    "
></nx-pre-loader>

<ng-container *ngIf="webRtcStream.paused && error">
    <div class="connection-error">
        {{ error }}
    </div>
</ng-container>

<div
    *ngIf="
        !streamManager.position &&
        (CONFIG.featureFlags.layoutsPtz || CONFIG.featureFlags.layoutsDemo) &&
        camera.controlEnabled
    "
    class="ptz parent-hover"
    (click)="showPtz.emit(camera)"
    translate
>
    Ptz Controls
</div>
