<div
    *ngIf="ribbonContent$ | async as ribbonContent"
    class="status-banner"
    [ngClass]="ribbonContent.type"
>
    {{ ribbonContent.message | nxTranslate }}
</div>
<div
    *ngIf="lostConnection && lostConnectionPlaceholder"
    class="placeholder-wrapper"
>
    <ng-container *ngTemplateOutlet="lostConnectionPlaceholder"></ng-container>
</div>

<video
    #originalStream
    autoplay
    class="original-stream"
    muted
></video>

<video
    #webRtcPlayer
    autoplay
    muted
    [style.opacity]="lostConnection ? 0 : 1"
    [nxRotate]="rotation"
></video>

<nx-pre-loader
    *ngIf="
        !error && (loading || lostConnection || webRtcPlayer.paused || !webRtcPlayer.currentTime)
    "
></nx-pre-loader>

<ng-container *ngIf="webRtcPlayer.paused && error">
    <div class="connection-error">
        {{ error }}
    </div>
</ng-container>

<div
    *ngIf="lostConnection ? document.fullscreenElement : showFullScreenButton"
    class="full-screen parent-hover"
    [ngClass]="{ 'is-full-screen': document.fullscreenElement }"
    (click)="toggleFullScreen()"
>
    <ng-template
        #close
        translate
    >
        Exit Full Screen
    </ng-template>
    <ng-container
        *ngIf="!document.fullscreenElement; else close"
        translate
    >
        Full Screen
    </ng-container>
</div>

<div
    *ngIf="
        !streamManager.position &&
        (CONFIG.featureFlags.layoutsPtz || CONFIG.featureFlags.layoutsDemo) &&
        camera.controlEnabled
    "
    class="ptz parent-hover"
    (click)="showPtz.emit(camera)"
    translate
>
    Ptz Controls
</div>
