<ng-template #preloader>
    <nx-pre-loader type="page"></nx-pre-loader>
</ng-template>

<ng-template #placeholder>
    <ng-container *ngIf="offline; else preloader">
        <ng-container *ngIf="lostConnectionPlaceholder; else unavailable">
            <ng-container *ngTemplateOutlet="lostConnectionPlaceholder"></ng-container>
        </ng-container>
    </ng-container>
</ng-template>

<ng-template #chart>
    <ngx-charts-line-chart
        *ngIf="this.multi?.length && !offline; else placeholder"
        [view]="view"
        [curve]="curve"
        [animations]="animations"
        [scheme]="'vivid'"
        [legend]="legend"
        [legendTitle]="legendTitle"
        [legendPosition]="legendPosition"
        [showXAxisLabel]="showXAxisLabel"
        [showYAxisLabel]="showYAxisLabel"
        [showGridLines]="true"
        [xAxis]="xAxis"
        [yAxis]="yAxis"
        [xAxisLabel]="xAxisLabel"
        [yAxisLabel]="yAxisLabel"
        [timeline]="timeline"
        [results]="multi"
    ></ngx-charts-line-chart>
</ng-template>

<ng-template #unavailable>
    <nx-section-placeholder
        svgFileName="system_settings_placeholder"
        [wrapperHeight]="250"
        [translatedMessage]="LANG.monitoring.unavailable | translate"
    >
    </nx-section-placeholder>
</ng-template>

<nx-block
    *ngIf="!noFrame; else chart"
    class="d-block"
>
    <header>
        <h4 translate>System Monitoring</h4>
    </header>
    <nx-section *ngIf="selectedServerId && !offline; else unavailable">
        <ng-container *ngTemplateOutlet="chart"></ng-container>
    </nx-section>
</nx-block>

<div
    *ngIf="showFullscreen"
    class="full-screen parent-hover"
    [ngClass]="{ 'is-full-screen': window.document.fullscreenElement }"
    (click)="toggleFullScreen()"
>
    <ng-template
        #close
        translate
    >
        Exit Full Screen
    </ng-template>
    <ng-container
        *ngIf="!window.document.fullscreenElement; else close"
        translate
    >
        Full Screen
    </ng-container>
</div>
