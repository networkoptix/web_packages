<div class="d-flex align-items-center justify-content-end">
    <svg-icon
        *ngIf="count !== 0"
        nx-add-svg-src
        [src]="icons.dirNonStandardTriangle + type + '.svg'"
        [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
    ></svg-icon>
    <span
        *ngIf="count !== undefined"
        [innerText]="count"
        class="pl-1"
    ></span>
</div>
