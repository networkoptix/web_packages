<a
    class="menu-level-2 ellipsis"
    [ngClass]="{ selected: selected, 'item-disabled': item.disabled }"
    [id]="item.id"
    [routerLink]="[itemPath]"
    [queryParams]="item.query"
>
    <div
        class="menu-level-2-icon"
        *ngIf="item.icon"
    >
        <span
            class="m-0 glyphicon {{ item.icon }}"
            [ngClass]="{ selected: selected, 'item-disabled': item.disabled }"
        ></span>
    </div>
    <div class="ellipsis">
        <span
            [innerText]="item.label | translate"
            class="user"
        ></span>
        <span
            *ngIf="item.additionalLabel"
            class="menu-level-2-additional"
        >
            <span class="ml-1 mr-1">&ndash;</span> {{ item.additionalLabel | translate }}
        </span>
    </div>
</a>
