<div class="modal-header">
    <h3 class="modal-title">Serwer jest odłączony</h3>
</div>
<form class="form" role="form" id="restartDialog">
    <div class="modal-body">
        <p>Serwer nie może teraz obsłużyć żądań. Próba ponownego podłączenia.</p>
        <uib-progressbar class="progress-striped active" type="info" value="100" id="restartingProgress">{{state}}</uib-progressbar>
        <p>If nothing happens for a while - you could check server condition manually or refresh the page</p>
    </div>
</form>
