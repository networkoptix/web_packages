<ng-container *ngIf="LANG.system">
    <nx-process-button
        [customClass]="customClass"
        [process]="openClient"
        *ngIf="system"
        [actionType]="actionType ? actionType : 'default'"
        [buttonDisabled]="!system.isOnline && system.stateOfHealth !== CONFIG.system.status.online"
        (click)="$event.stopPropagation()"
        [textOnly]="textOnly"
        [buttonText]="'Open in %VMS_NAME%' | translate"
    ></nx-process-button>

    <nx-process-button
        [customClass]="customClass"
        [process]="openClient"
        *ngIf="!system"
        [actionType]="'primary'"
        [buttonDisabled]="false"
        (click)="$event.stopPropagation()"
        [textOnly]="textOnly"
        [buttonText]="'Open %VMS_NAME%' | translate"
    ></nx-process-button>
</ng-container>
