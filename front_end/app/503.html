    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <meta name="description" content="">

    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link rel="shortcut icon" href="/static/images/favicon.ico">
    <link rel="stylesheet" href="fonts/roboto/roboto_bold/stylesheet.css" />
    <link rel="stylesheet" href="fonts/roboto/roboto_light/stylesheet.css" />
    <link rel="stylesheet" href="fonts/roboto/roboto_regular/stylesheet.css" />

    <style>
        body {
            font-family : "robotolight", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        h1 {
            margin-top    : 20px;
            margin-bottom : 20px;
            padding       : 0;
            font-size     : 22px;
            display       : flex;
            align-items   : center;
            color         : #2B383F;
            line-height   : 2.5rem;
        }

        .error-page {
            color          : #303f47;
            display        : flex;
            margin         : 0 auto;
            flex-direction : column;
            align-items    : center;
            justify-content: center;
            height         : 55vh;
            max-width      : 550px;
        }

         @media screen and (max-width: 740px)  {
            .error-page {
                height     : 65vh !important;
            }
        }

        .error-page h1 {
            font-family: 'Roboto-Medium', 'Roboto Medium', 'Roboto', sans-serif;
            font-weight: 500;
            font-style: normal;
            font-size: 24px;
            color: #2B383F;
            text-align: center;
        }

        .error-page p {
            font-family: 'Roboto-Regular', 'Roboto', sans-serif;
            font-weight: 400;
            font-style: normal;
            font-size: 15px;
            color: #2B383F;
            text-align: center;
            line-height: 22px;
        }

        .error-page p + p {
            font-size  : 14px;
            margin-top : 0;
        }

        .error-page a {
            text-decoration : underline;
            font-weight     : 200;
        }

        .error-page img {
            margin: 40px 0;
        }
    </style>

</head>

<body>

<!-- Add your site or application content here -->

<div class="jumbotron error-page px-4">
    <img alt="Maintenance is in progress picture" src="/static/images/placeholders/page/Maintenance.svg">
    %CONTENT%
</div>
