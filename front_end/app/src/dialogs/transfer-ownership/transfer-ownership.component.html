<form
    #transferOwnershipForm="ngForm"
    name="transferOwnershipForm"
    novalidate
    [ngClass]="{ 'hide-errors': hideErrors }"
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
            >Transfer Ownership</h1
        >
        <button
            *ngIf="closable"
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <div class="close-content"><span class="close-icon"></span></div>
        </button>
    </div>
    <ng-container *ngIf="!transferComplete; else transferSuccessTemplate">
        <div class="modal-body mb-4">
            <div class="form-group">
                <label
                    for="newSystemOwner"
                    translate
                    >New system owner email</label
                >
                <nx-select
                    [items]="userItems"
                    [ngModel]="selectedUser"
                    (ngModelChange)="selectUser($event)"
                    [selected]="selectedUser"
                    allowHTML
                    canSearch
                    [ngModelOptions]="{ standalone: true }"
                ></nx-select>
                <div
                    class="col-12 ml-n2 d-flex"
                    *ngIf="transferOwnershipForm.errors"
                >
                    <span
                        *ngIf="transferOwnershipForm.errors.duplicateTransfer"
                        class="input-error"
                        translate
                        >Transfer to this user is already in process</span
                    >
                    <span
                        *ngIf="transferOwnershipForm.errors.userDisabled"
                        class="input-error"
                        translate
                        >User disabled</span
                    >
                </div>
            </div>
            <div class="form-group">
                <p
                    class="input-error"
                    translate
                    >Once the ownership transfer is completed you will be removed from the system.</p
                >
            </div>
        </div>
        <div class="modal-footer">
            <nx-process-button
                [process]="transferOwnership"
                [form]="transferOwnershipForm"
                [buttonText]="'Send Request' | translate"
                [buttonDisabled]="!!transferOwnershipForm.errors"
            ></nx-process-button>
            <nx-cancel-button
                [process]="transferOwnership"
                [discardFn]="close"
            ></nx-cancel-button>
        </div>
    </ng-container>
</form>

<ng-template #transferSuccessTemplate>
    <div class="modal-body d-flex flex-column align-items-center mb-4">
        <svg-icon
            nx-add-svg-src
            class="mt-1 mb-2"
            [svgStyle]="{ 'height.px': '79' }"
            [src]="CONFIG.icons.dirSectionPlaceholder + 'mail_placeholder.svg'"
        ></svg-icon>
        <p
            id="request-sent"
            class="mt-1"
            translate
            >Request has been sent</p
        >
        <p
            class="subtext mt-1"
            translate
            >Ownership change will occur as soon as the new owner accepts the request</p
        >
    </div>
    <div class="modal-footer">
        <button
            class="btn btn-primary min-w-100 mt-4 mb-4"
            (click)="close()"
            translate
            >OK</button
        >
    </div>
</ng-template>
