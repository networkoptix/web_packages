<form
    #transferOwnershipForm="ngForm"
    name="transferOwnershipForm"
    novalidate
    [ngClass]="{ 'hide-errors': hideErrors }"
>
    <div class="modal-header">
        <h1 class="modal-title" translate>Transfer Ownership</h1>
        <button
            *ngIf="closable"
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="activeModal.close()"
        >
            <div class="close-content"><span class="close-icon"></span></div>
        </button>
    </div>
    <ng-container *ngIf="!transferComplete else transferSuccessTemplate">
        <div class="modal-body mb-4">
            <div class="form-group">
                <label for="newOwnerInput" translate>New system owner</label>
                <input
                    #newOwnerInput="ngModel"
                    class="form-control"
                    id="newOwnerInput"
                    name="newOwnerInput"
                    [(ngModel)]="newOwner"
                    [placeholder]="'User' | translate"
                    autofocus
                    required
                >
                <p class="subtext mt-2" translate>Enter the name of the future system owner</p>
            </div>
            <div class="form-group">
                <!-- <label for="permissionsSelect" translate>Your new role in the current system</label> -->
                <!-- <nx-permissions-select
                    id="permissionsSelect"
                    name="permissionsSelect"
                    [system]="system"
                    [roles]="system.accessRoles"
                    [(ngModel)]="newRole"
                ></nx-permissions-select> -->
                <!-- <span class="help-block" [innerText]="accessDescription"></span> -->
                <p translate>Your new role in the current system:</p>
                <p id="new-role-text">{{ newRole }}</p>
            </div>
        </div>
        <div class="modal-footer">
            <nx-process-button
                [process]="transferOwnership"
                [form]="transferOwnershipForm"
                [buttonText]="'Send Request' | translate"
            ></nx-process-button>
            <nx-cancel-button
                [process]="transferOwnership"
                [discardFn]="activeModal.close"
            ></nx-cancel-button>
        </div>
    </ng-container>
</form>

<ng-template #transferSuccessTemplate>
    <div class="modal-body d-flex flex-column align-items-center mb-4">
        <svg-icon
            nx-add-svg-src
            class="mt-1 mb-2"
            [svgStyle]="{ 'height.px': '79' }"
            [src]="CONFIG.icons.dirSectionPlaceholder + 'mail_placeholder.svg'"
        ></svg-icon>
        <p id="request-sent" class="mt-1" translate>Request has been sent</p>
        <p class="subtext mt-1" translate>Ownership change will occur as soon as the new owner accepts the request</p>
    </div>
    <div class="modal-footer">
        <button
            class="btn btn-primary"
            (click)="activeModal.close()"
            [style.width.px]="100"
            translate
        >OK</button>
    </div>
</ng-template>
