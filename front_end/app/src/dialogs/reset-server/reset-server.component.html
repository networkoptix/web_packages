<form #resetServerForm="ngForm" name="resetServerForm" novalidate>
    <div class="modal-header">
        <h1 class="modal-title" translate>Reset server {{ title }} to defaults?</h1>
        <button type="button" class="close"
                data-dismiss="modal" aria-label="Close"
                (click)="activeModal.close()" *ngIf="closable">
            <div class="close-content"><span class="close-icon"></span></div>
        </button>
    </div>

    <div class="modal-body">
        <div class="form-group">
            <p class="modal-paragraph" translate>
                All settings for this server will be reverted to defaults.<br />
                The server will be detached to a separate system.<br />
                Video archive will remain intact.<br />
                <br />
                Enter password for your account to continue.
            </p>
            <input class="form-control"
                   [(ngModel)]="password"
                   id="password"
                   name="password" type="password"
                   required nxFocusMe>
            <p class="help-block"
               *ngIf="!resetServerForm.controls['password']?.valid && resetServerForm.controls['password']?.touched">
                    <span class="input-error"
                          translate>
                        Password is required
                    </span>
            </p>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button [process]="resetServer"
                           [form]="resetServerForm"
                           [actionType]="'primary'"
                           buttonText="{{ 'Reset' | translate }}"></nx-process-button>

        <button type="button" class="btn btn-default" (click)="close()" translate>Cancel</button>
    </div>
</form>
