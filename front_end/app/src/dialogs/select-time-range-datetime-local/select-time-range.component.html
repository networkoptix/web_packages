<form
    name="select-time-range-form"
    novalidate
    [ngClass]="{ 'hide-errors': hideErrors }"
    (submit)="hideErrors = false"
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
        >
            Selection
        </h1>
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close(false)"
        >
            <span class="close-content"><span class="close-icon"></span></span>
        </button>
    </div>

    <div class="modal-body">
        <div class="date-form-group">
            <label
                class="control-label m-0"
                translate
                >Start</label
            >
            <div class="col-12 px-0">
                <input
                    name="start"
                    type="datetime-local"
                    [ngModel]="start | date: 'yyyy-MM-ddTHH:mm'"
                    (ngModelChange)="start = handleDateTimeChanged($event)"
                />
            </div>
        </div>

        <div class="date-form-group">
            <label
                class="control-label m-0"
                translate
                >End</label
            >
            <div class="col-12 px-0">
                <input
                    name="end"
                    type="datetime-local"
                    [ngModel]="end | date: 'yyyy-MM-ddTHH:mm'"
                    (ngModelChange)="end = handleDateTimeChanged($event)"
                />
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button
            (click)="save()"
            translate
        >
            Save
        </button>
        <button
            (click)="close(false)"
            translate
        >
            Cancel
        </button>
    </div>
</form>
