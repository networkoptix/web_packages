<div>
    <div class="modal-header">
        <h1 class="modal-title" translate>Unauthorized</h1>
        <button type="button" class="close"
                data-dismiss="modal" aria-label="Close"
                (click)="close()" *ngIf="closable">
            <div class="close-content"><span class="close-icon"></span></div>
        </button>
    </div>

    <div class="modal-body">
        <p translate>You are not currently authorized to access that page.</p>
    </div>
    <div class="modal-footer">
        <button
            type="button"
            class="btn btn-default login-button"
            (click)="redirectToAuthorize()"
            translate
        >
            Log In
        </button>
    </div>
</div>
