<form #loginForm="ngForm" name="loginForm" novalidate>
    <div class="modal-body">
        <div class="form-group">
            <label for="login_email" translate>Login</label>
            <input type="email" class="form-control"
                   id="login_email" name="login_email" #login_email="ngModel"
                   [ngModel]="auth.email"
                   (ngModelChange)="setEmail($event);"
                   maxlength="255"
                   required nxFocusMe>
        </div>
        <div class="form-group">
            <label for="login_password" translate>Password</label>
            <input type="password" class="form-control"
                   name="login_password" id="login_password" #login_password="ngModel"
                   [(ngModel)]="password"
                   (ngModelChange)="resetForm()"
                   maxlength="255"
                   required>
            <ng-container *ngIf="login_password.invalid">
                <div class="input-error" *ngIf="wrongPassword" translate>Wrong login or password</div>
                <div class="input-error" *ngIf="accountBlocked" translate>Too many attempts. Try again in a minute.</div>
            </ng-container>
        </div>
        <div class="form-group">
            <label class="checkbox">
                <input type="checkbox" checked="checked"
                       [(ngModel)]="remember"
                       name="remember" id="remember">
                <span class="checkmark">
                        <svg viewBox="0 0 20 16">
                            <polygon class="box" points="2.5,2.5 2.5,13.5 13.5,13.6 13.5,2.5"></polygon>
                            <polyline class="box" points="12.5,2.5 2.5,2.5 2.5,13.5 13.5,13.6 13.5,8.5"></polyline>
                            <polyline class="tick" points="5,7.5 8,10.5 15.5,3"></polyline>
                            <line class="tristate" x1="5" y1="8" x2="11" y2="8"></line>
                        </svg>
                    </span>
                <span class="text" translate>Stay logged in</span>
            </label>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button buttonText="{{ 'Log In' | translate }}"
            [style.width.%]="100"
            customButtonClass="full-width"
            customClass="full-width"
            [form]="loginForm"
            [process]="login">
        </nx-process-button>
    </div>
</form>
