<form
    name="select-time-range-form"
    novalidate
    [ngClass]="{ 'hide-errors': hideErrors }"
    (submit)="hideErrors = false"
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
            >Selection</h1
        >
        <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="closeModal($event)"
        >
            <span class="close-content"><span class="close-icon"></span></span>
        </button>
    </div>

    <div class="modal-body">
        <div class="date-form-group">
            <label
                class="control-label m-0"
                translate
                >Start</label
            >
            <div class="col-12 px-0">
                <input
                    class="form-control"
                    name="start-date"
                    type="date"
                    [ngModel]="startDate"
                    (ngModelChange)="handleChange($event, 'start', 'Date')"
                />
                <input
                    class="form-control ml-2"
                    name="start-time"
                    type="time"
                    [ngModel]="startTime"
                    (ngModelChange)="handleChange($event, 'start', 'Time')"
                />
            </div>
        </div>

        <div class="date-form-group">
            <label
                class="control-label m-0"
                translate
                >End</label
            >
            <div class="col-12 px-0">
                <input
                    class="form-control"
                    name="end-date"
                    type="date"
                    [ngModel]="endDate"
                    (ngModelChange)="handleChange($event, 'end', 'Date')"
                />
                <input
                    class="form-control ml-2"
                    name="end-time"
                    type="time"
                    [ngModel]="endTime"
                    (ngModelChange)="handleChange($event, 'end', 'Time')"
                />
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button
            class="btn btn-primary"
            (click)="save($event)"
            translate
            >Save</button
        >
        <button
            class="btn btn-default"
            (click)="closeModal($event)"
            translate
            >Cancel</button
        >
    </div>
</form>
