<form #disconnectForm="ngForm" name="disconnectForm" novalidate>
      <!-- [ngClass]="{'hide-errors': hideErrors}"
      (submit)="hideErrors = false"> -->
    <div class="modal-header">
        <h1 class="modal-title" translate>Disconnect System from %CLOUD_NAME%</h1>
        <button type="button" class="close"
                data-dismiss="modal" aria-label="Close"
                (click)="activeModal.close()" *ngIf="closable">
            <div class="close-content"><span class="close-icon"></span></div>
        </button>
    </div>
    <nx-update-webadmin-session *ngIf="system.useRest && needsUpdate; else ready" [process]="disconnect" [system]="system"></nx-update-webadmin-session>
    <ng-template #ready>
        <div class="modal-body">
            <p translate>You will be logged out.</p>
            <p translate>System will be accessible through local network with local administrator account.</p>
            <p class="warning-label" translate>All cloud users will be deleted.</p>
        </div>
        <div class="modal-footer">
            <nx-process-button [process]="disconnect"
                               [form]="disconnectForm"
                               [actionType]="'danger'"
                               [buttonDisabled]="needsUpdate"
                               buttonText="{{ 'Continue' | translate }}"></nx-process-button>
            <nx-cancel-button [process]="disconnect" [discardFn]="activeModal.close"></nx-cancel-button>
        </div>
    </ng-template>
</form>
