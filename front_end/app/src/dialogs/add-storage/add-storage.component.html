<form #addStorageForm="ngForm" name="addStorageForm" novalidate>
    <div class="modal-header">
        <h1 class="modal-title" translate>Add External Storage</h1>
        <button type="button" class="close"
                data-dismiss="modal" aria-label="Close"
                (click)="activeModal.close()" *ngIf="closable">
            <div class="close-content"><span class="close-icon"></span></div>
        </button>
    </div>

    <div class="modal-body">
        <div class="form-group">
            <label for="addStorageUrl" translate>URL</label>
            <input type="text" class="form-control"
                   [placeholder]="'//<Computer Name>/<Folder>' | translate"
                   [(ngModel)]="storage.url"
                   name="addStorageUrl" id="addStorageUrl" #addStorageUrl="ngModel"
                   maxlength="255"
                   required
                   nxFocusMe>

            <ng-container *ngIf="addStorageUrl.errors && addStorageUrl.touched">
                <span *ngIf="addStorageUrl.errors.required"
                        class="input-error" translate>URL is required</span>
                <span *ngIf="addStorageUrl.errors.pattern"
                      class="input-error" translate>Please enter a valid URL</span>
            </ng-container>
        </div>

        <div class="form-group">
            <label for="login_username" class="control-label m-0 pb-2" translate>Login</label>
            <input type="text" class="form-control"
                   [(ngModel)]="storage.username"
                   maxlength="255"
                   name="login_username" id="login_username" #login_username="ngModel"
                   required>
            <ng-container *ngIf="login_username.errors && login_username.touched">
                <span *ngIf="login_username.errors.required"
                      class="input-error" translate>Login is required</span>
            </ng-container>
        </div>

        <div class="form-group">
            <label for="login_password" class="control-label m-0 pb-md-2" translate>Password</label>
            <input type="password" class="form-control"
                   name="login_password" id="login_password" #login_password="ngModel"
                   [(ngModel)]="storage.password"
                   maxlength="255"
                   required>
            <ng-container *ngIf="login_password.errors && login_password.touched">
                <span *ngIf="login_password.errors.required"
                      class="input-error" translate>Password is required</span>
                <span *ngIf="login_password.errors.no_user"
                      class="input-error" translate>Login or password is incorrect</span>
            </ng-container>
        </div>
    </div>

    <div class="modal-footer">
        <nx-process-button
            [process]="addStorage"
            [form]="addStorageForm"
            [buttonText]="'Add storage' | translate"></nx-process-button>
        <nx-cancel-button [process]="addStorage" [discardFn]="activeModal.close"></nx-cancel-button>
    </div>
</form>
