<form #addStorageForm="ngForm" name="addStorageForm" novalidate>
    <div class="modal-header">
        <h1 class="modal-title" translate>Add User</h1>
        <button type="button" class="close"
                data-dismiss="modal" aria-label="Close"
                (click)="activeModal.close()" *ngIf="closable">
            <div class="close-content"><span class="close-icon"></span></div>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label for="addStorageUrl" translate>URL</label>
            <input
                    class="form-component"
                    id="addStorageUrl"
                    name="addStorageUrl"
                    [(ngModel)]="url"
                    #addUserEmail="ngModel">

            <div class="col-12 ml-n2 d-flex">
                <ng-container *ngIf="addUserEmail.errors">
                    <span *ngIf="addUserEmail.errors.alreadyExists"
                        class="input-error" translate>This Email has been already registered in %CLOUD_NAME%</span>
                    <ng-container *ngIf="addUserEmail.touched">
                        <span *ngIf="addUserEmail.errors.required"
                            class="input-error" translate>Email is required</span>
                        <span *ngIf="addUserEmail.errors.pattern"
                            class="input-error" translate>Please enter a valid Email</span>
                    </ng-container>
                </ng-container>
            </div>
        </div>
        <div class="form-group">
            <label for="login_email" translate>Login</label>
            <input type="email" class="form-control"
                   id="login_email" name="login_email" #login_email="ngModel"
                   [ngModel]="auth.email"
                   pattern="{{ CONFIG.credentialsValidation.emailRegex }}" maxlength="255"
                   required nxFocusMe>
            <ng-container *ngIf="login_email.invalid">
                <div *ngIf="login_email.errors.no_user" class="clearfix">
                    <div class="input-error float-left" translate>Account not found</div>
                    <a class="float-right justify-content-end" routerLink="/register"
                       (click)="activeModal.close('register')" translate>Create account</a>
                </div>
            </ng-container>
        </div>
        <div class="form-group">
            <label for="login_password" translate>Password</label>
            <input type="password" class="form-control"
                   name="login_password" id="login_password" #login_password="ngModel"
                   [(ngModel)]="auth.password"
                   maxlength="255"
                   required>
            <ng-container *ngIf="login_password.invalid">
                <div class="input-error" *ngIf="wrongPassword" translate>Wrong password</div>
            </ng-container>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="addStorage"
            [form]="addStorageForm"
            [buttonText]="'Add' | translate"></nx-process-button>
        <nx-cancel-button [process]="addStorage" [discardFn]="activeModal.close"></nx-cancel-button>
    </div>
</form>
