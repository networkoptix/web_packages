<form #addUserForm="ngForm" name="addUserForm" novalidate>
    <div class="modal-header">
        <h1 class="modal-title" translate>Add User</h1>
        <button type="button" class="close"
                data-dismiss="modal" aria-label="Close"
                (click)="activeModal.close()" *ngIf="closable">
            <div class="close-content"><span class="close-icon"></span></div>
        </button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label for="addUserEmail" translate>Email</label>
            <nx-email-input
                class="form-component"
                id="addUserEmail"
                name="addUserEmail"
                componentId="addUserEmail"
                [(ngModel)]="user.email"
                [form]="addUserForm"
                #addUserEmail="ngModel">
            </nx-email-input>
            <div class="col-12 ml-n2 d-flex">
                <ng-container *ngIf="addUserEmail.errors">
                    <span *ngIf="addUserEmail.errors.alreadyExists"
                        class="input-error" translate>This Email has been already registered in %CLOUD_NAME%</span>
                    <ng-container *ngIf="addUserEmail.touched">
                        <span *ngIf="addUserEmail.errors.required"
                            class="input-error" translate>Email is required</span>
                        <span *ngIf="addUserEmail.errors.pattern"
                            class="input-error" translate>Please enter a valid Email</span>
                    </ng-container>
                </ng-container>
            </div>
        </div>
        <div class="form-group">
            <label for="permissionsSelect" translate>Access Level</label>
            <nx-permissions-select
                    id="permissionsSelect"
                    [user]="user"
                    [system]="system"
                    [roles]="system.accessRoles"
                    [selected]="user.role"
                    (onSelected)="setPermission($event)">
            </nx-permissions-select>
            <span class="help-block" [innerHtml]="accessDescription"></span>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button
            [process]="addUser"
            [form]="addUserForm"
            [buttonText]="'Add' | translate"></nx-process-button>
        <button type="button" class="btn btn-default" (click)="activeModal.close()" translate>Cancel</button>
    </div>
</form>
