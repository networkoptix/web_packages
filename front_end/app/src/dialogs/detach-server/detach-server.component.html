<form #detachServerForm="ngForm" name="detachServerForm" novalidate>
    <div class="modal-header">
        <h1 class="modal-title" translate>Detach server {{ title }} from current system?</h1>
        <button type="button" class="close"
                data-dismiss="modal" aria-label="Close"
                (click)="activeModal.close()" *ngIf="closable">
            <div class="close-content"><span class="close-icon"></span></div>
        </button>
    </div>

    <div class="modal-body">
        <div class="form-group">
            <p class="modal-paragraph" translate>
                The server will be detached to a separate system.<br />
                Database, local users, configuration, and video archive will remain intact.<br />
                Cloud users will not be transferred to the new system.<br />
                <br />
                Enter password for your account to continue.
            </p>
            <input class="form-control"
                   [(ngModel)]="password"
                   id="password"
                   name="password" type="password"
                   required nxFocusMe>
            <p class="help-block"
               *ngIf="!detachServerForm.controls['password']?.valid && detachServerForm.controls['password']?.touched">
                    <span class="input-error"
                          translate>
                        Password is required
                    </span>
            </p>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button [process]="detachServer"
                           [form]="detachServerForm"
                           [actionType]="'primary'"
                           buttonText="{{ 'Detach' | translate }}"></nx-process-button>

        <button type="button" class="btn btn-default" (click)="close()" translate>Cancel</button>
    </div>
</form>
