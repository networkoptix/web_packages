<form #detachServerForm="ngForm" name="detachServerForm" novalidate>
    <div class="modal-header">
        <h1 class="modal-title"
            [innerHTML]="'dialogs.titles.serversDetach'| translate: { title: serverName }"></h1>
        <button type="button" class="close"
                data-dismiss="modal" aria-label="Close"
                (click)="activeModal.close()" *ngIf="closable">
            <div class="close-content"><span class="close-icon"></span></div>
        </button>
    </div>

    <div class="modal-body">
        <div class="form-group">
            <div class="modal-paragraph">
                <span translate>The server will be detached from this system into a new one. Database, local users, configuration, and video archive will remain intact.</span>
                <br>
                <span translate>Cloud users will not be transferred to the new system.</span>
                <br><br>
                <span><ng-container translate>Enter password for your account to continue</ng-container>.</span>
            </div>
            <input class="form-control"
                   [(ngModel)]="password"
                   id="password"
                   name="password" type="password"
                   required nxFocusMe>
            <p class="help-block"
               *ngIf="!detachServerForm.controls['password']?.valid && detachServerForm.controls['password']?.touched">
                    <span class="input-error" translate>Password is required</span>
            </p>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button [process]="detachServer"
                           [form]="detachServerForm"
                           [actionType]="'danger'"
                           buttonText="{{ 'Detach' | translate }}"></nx-process-button>
        <nx-cancel-button [process]="detachServer" [discardFn]="activeModal.close"></nx-cancel-button>
    </div>
</form>
