<form #renameServerForm="ngForm" name="renameServerForm" novalidate>
    <div class="modal-header">
        <h1 class="modal-title" translate>Rename server</h1>
        <button type="button" class="close"
                data-dismiss="modal" aria-label="Close"
                (click)="activeModal.close()" *ngIf="closable">
            <div class="close-content"><span class="close-icon"></span></div>
        </button>
    </div>

    <div class="modal-body">
        <div class="form-group">
            <input class="form-control"
                   [(ngModel)]="serverName"
                   id="serverName"
                   name="serverName" type="text"
                   required nxFocusMe>
            <p class="help-block"
               *ngIf="!renameServerForm.controls['serverName']?.valid && renameServerForm.controls['serverName']?.touched">
                    <span class="input-error" translate>Server name is required</span>
            </p>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button [process]="renameServer"
                           [form]="renameServerForm"
                           [actionType]="'primary'"
                           buttonText="{{ 'Save' | translate }}"></nx-process-button>
        <button type="button" class="btn btn-default" (click)="close()" translate>Cancel</button>
    </div>
</form>
