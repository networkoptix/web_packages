<form
    #deleteForm="ngForm"
    name="deleteForm"
    novalidate
>
    <div class="modal-header">
        <h1
            class="modal-title"
            translate
            >Delete Cloud Storage?</h1
        >
        <button
            *ngIf="closable"
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Close"
            (click)="close()"
        >
            <div class="close-content"><span class="close-icon"></span></div>
        </button>
    </div>

    <div class="modal-body">
        <p translate>Cloud storage will be removed from this system</p>
        <p translate>All existing archives on this storage will be deleted.</p>
        <p
            translate
            class="mb-3"
            >Enter password to continue.</p
        >
        <div class="form-group">
            <label
                for="password"
                translate
                >Password</label
            >
            <input
                class="form-control"
                [(ngModel)]="auth.password"
                #password="ngModel"
                id="password"
                autocomplete="new-password"
                name="password"
                type="password"
                required
                nxFocusMe
            />
            <ng-container *ngIf="password.invalid">
                <div *ngIf="password.touched && password.dirty && !wrongPassword">
                    <div
                        class="input-error"
                        translate
                        >Password is required</div
                    >
                </div>
                <div *ngIf="wrongPassword">
                    <div
                        class="input-error"
                        translate
                        >Wrong password</div
                    >
                </div>
            </ng-container>
        </div>
    </div>
    <div class="modal-footer">
        <!-- delete process still needs to be implemented -->
        <nx-process-button
            [process]="delete"
            [form]="deleteForm"
            [actionType]="'danger'"
            buttonText="{{ 'Delete' | translate }}"
        ></nx-process-button>
        <nx-cancel-button
            [process]="delete"
            [discardFn]="close"
        ></nx-cancel-button>
    </div>
</form>
