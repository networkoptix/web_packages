<form #connectForm="ngForm" name="connectForm" novalidate>
    <div class="modal-header">
        <h1 class="modal-title" translate>Connect System to %CLOUD_NAME%</h1>
        <button type="button" class="close"
                data-dismiss="modal" aria-label="Close"
                (click)="cancel()" *ngIf="closable">
            <div class="close-content"><span class="close-icon"></span></div>
        </button>
    </div>
    <div class="modal-body">
        <div>
            <ng-template #noCode>
                <p class="mb-3" translate>Please complete cloud login to continue.</p>
            </ng-template>
            <p *ngIf="codeExists; else noCode" class="mb-3" translate>Enter password to continue.</p>

            <div class="form-group" *ngIf="environment.isLocal">
                <label for="password" translate>Login</label>
                <input class="form-control"
                       id="login" autocomplete="new-password"
                       name="login" disabled value="admin"
                       [(ngModel)]="auth.username" #login="ngModel">
            </div>

            <div class="form-group">
                <label for="password" translate>Password</label>
                <input class="form-control"
                       [(ngModel)]="auth.password" #password="ngModel"
                       id="password" autocomplete="new-password"
                       name="password" type="password"
                       [disabled]="!codeExists"
                       required nxFocusMe>
                <ng-container *ngIf="password.invalid">
                    <div *ngIf="password.touched && password.dirty && !wrongPassword">
                        <div class="input-error" translate>Password is required</div>
                    </div>
                    <div *ngIf="wrongPassword">
                        <div class="input-error" translate>Wrong password</div>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <nx-process-button [process]="connectProcess"
                           [form]="connectForm"
                           [actionType]="'primary'"
                           [buttonDisabled]="!codeExists"
                           buttonText="{{ 'Connect' | translate }}"></nx-process-button>
        <nx-cancel-button [process]="connectProcess" [discardFn]="cancel"></nx-cancel-button>
    </div>
</form>
