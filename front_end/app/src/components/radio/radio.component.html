<label
    class="nx-radio"
    [for]="componentId"
    [ngClass]="{'disabled': disabled}"
>
    <input type="radio"
        #inputRadioFocus
        [id]="componentId"
        [value]="value"
        [disabled]="disabled"
        (click)="changeState()"
    >
    <span class="check" [ngClass]="state">
        <svg width="24" height="24"
             viewBox="0 0 24 24"
             fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle class="circle" cx="12" cy="12" r="10" />
            <circle class="dot" cx="12" cy="12" r="6" />
        </svg>
<!--        <svg viewBox="0 0 20 16">-->
<!--            <path-->

<!--                1C4.1,1,1,4.1,1,8s3.1,7,7,7s7-3.1,7-7S11.9,1,8,1L8,1z"-->
<!--            ></path>-->
<!--            <circle cx="8" cy="8" r="4"></circle>-->
<!--        </svg>-->
    </span>
    <ng-container>{{ label }}</ng-container>
</label>
