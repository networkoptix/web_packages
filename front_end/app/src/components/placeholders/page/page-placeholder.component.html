<div class="container page-placeholder-wrapper">
    <div class="page-placeholder"
         [ngClass]="{'has-preloader':preloader, 'with-footer': withFooter}"
         [ngStyle]="{'padding-top': (withFooter && iconVisible) ? '16px': undefined}">
        <div class="placeholder-content {{constrainWidth ? 'constrain-width' : ''}}">
            <div *ngIf="preloader && !condition" class="placeholder-preloader">
                <div class="circleG circleG_1"></div>
                <div class="circleG circleG_2"></div>
                <div class="circleG circleG_3"></div>
            </div>
            <div *ngIf="condition" class="mx-2">
                <div *ngIf="iconClass" class="placeholder-icon" [ngClass]="iconClass"></div>
                <div *ngIf="!iconClass && iconVisible" [attr.name]="type" class="placeholder-icon">
                    <svg-icon [src]="CONFIG.icons.dirPagePlaceholder + iconName + '.svg'"
                              [svgStyle]="{ 'width.px': iconSize }"></svg-icon>
                </div>
                <h2 *ngIf="placeholderTitle" [attr.name]="type" class="placeholder-title"
                     [innerHTML]="placeholderTitle"></h2>
                <div *ngIf="message" [attr.name]="type" class="placeholder-message" [innerHTML]="message"></div>

                <ng-content></ng-content>

            </div>
        </div>
    </div>
    <nx-footer *ngIf="withFooter" center="true" [ngClass]="'footer'"></nx-footer>
</div>
