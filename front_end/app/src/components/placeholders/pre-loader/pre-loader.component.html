<div [ngClass]="{ 'placeholder-wrapper' : type == '' }" name="placeholder" [style.minHeight.px]="minHeight">
    <div class="placeholder has-preloader" [ngClass]="type">
        <div class="placeholder-content" [ngClass]="type">
            <div class="placeholder-preloader">
                <div class="circleG circleG_1"></div>
                <div class="circleG circleG_2"></div>
                <div class="circleG circleG_3"></div>
            </div>
        </div>
    </div>
</div>
