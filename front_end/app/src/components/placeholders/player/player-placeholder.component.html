<div class="player-placeholder">
    <svg-icon nx-add-svg-src
        [svgStyle]="{
            'height.px': height,
            'pointer-events': 'none'
        }"
        [src]="CONFIG.icons.dirNonStandardView + svgFileName + '.svg'"></svg-icon>
    <span class="heading" [innerHTML]="heading"></span>
    <span class="description" [innerHTML]="description"></span>
</div>
