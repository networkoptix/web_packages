<div class="player-placeholder">
    <svg-icon nx-add-svg-src
        [svgStyle]="{
            'height.px': height,
            'pointer-events': 'none'
        }"
        [src]="CONFIG.icons.dirNonStandardView + svgFileName + '.svg'"></svg-icon>
    <span class="heading" [innerText]="heading"></span>
    <span class="description"
          [ngStyle]="{'line-break': isUrl ? 'anywhere' : undefined}"
          [innerText]="description"></span>
</div>
