<div [ngClass]="{'switch-with-label': label}" (click)="changeState($event)" [id]="componentId">
    <div class="switch position-relative">
        <label class="switch-element">
            <input type="checkbox"
                [ngClass]="{'selected' : value}"
                [id]="componentId + '-switch'"
                [attr.checked]="value ? '': null"
                (click)="preventBubbling($event)"
                [attr.disabled]="disabled ? '' : null">
            <span class="slider round" [ngClass]="{'disable': disabled}"></span>
        </label>
        <div class="bar" [ngClass]="{'disable': disabled}"></div>
        <div class="circle" [ngClass]="{'disable': disabled}"></div>
    </div>
    <h4 *ngIf="label" class="pl-3 switch-label">{{label}}</h4>
</div>
