<div *ngIf="isOnline" class="pt-3 placeholder-text" [ngClass]="{'unsaved-changes': show}">
    <div *ngIf="show && warn" class="warning-text pb-3">{{ warn }}</div>
    <div *ngIf="show; else noChanges" class="d-flex">
        <nx-process-button [process]="save"
                           [actionType]="'primary min-w-120'"
                           [form]="form"
                           [clickFn]="submitFn"
                           buttonText="{{ 'Save' | translate }}"></nx-process-button>
        <nx-cancel-button 
            [process]="save" 
            [discardFn]="discard"
            [showDiscard]="true"
            customClass="ml-2"></nx-cancel-button>
    </div>
    <ng-template #noChanges>
        <div *ngIf="applyVisible" class="placeholder-text-no-changes" translate>No unsaved changes</div>
    </ng-template>
</div>
