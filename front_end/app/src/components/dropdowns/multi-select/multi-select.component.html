<div
    class="dropdown"
    [ngClass]="{ 'multi-select-show': show }"
    (nxClickElsewhere)="show = false"
>
    <button
        class="btn btn-dropdown-toggle dropdown-toggle"
        (click)="show = !show"
        [id]="id"
        type="button"
        data-toggle="dropdown"
    >
        <span
            [innerText]="textSelected"
            class="ellipsis d-contents d-md-block"
        ></span>
        <div class="arrow-flip">
            <svg-icon
                nx-add-svg-src
                [src]="CONFIG.icons.dirTextButtons + 'arrow_expand.svg'"
            ></svg-icon>
        </div>
    </button>
    <div
        class="dropdown-menu"
        [nxArrowNav]="show"
        [style.display]="show ? 'inline-block' : 'none'"
        [attr.aria-labelledby]="id"
    >
        <div
            *ngIf="canSearch"
            class="search-box"
        >
            <span class="glyphicon web-icon-search icon-search"></span>
            <input
                class="form-control search-input inset"
                autocomplete="off"
                [placeholder]="'Search' | translate"
                [ngModel]="filter"
                (ngModelChange)="applyLocalFilter($event)"
            />
            <span
                class="glyphicon close-icon search-clear"
                [hidden]="filter == ''"
                (click)="applyLocalFilter('')"
            ></span>
        </div>
        <ul
            class="dropdown-menu--header"
            *ngIf="canSelectAll"
        >
            <li class="dropdown-item-container">
                <a
                    class="dropdown-item dropdown-item--non-checkbox inset"
                    (click)="clearSelected(); show = false"
                    translate
                    >Any</a
                >
            </li>
            <li
                *ngIf="items.length"
                role="separator"
                class="dropdown-divider"
            ></li>
        </ul>

        <ul class="dropdown-menu--list">
            <li
                class="dropdown-item-container"
                *ngFor="let item of items; trackBy: trackItem"
            >
                <div class="dropdown-item inset">
                    <nx-checkbox
                        [componentId]="item.id"
                        [checked]="item.selected"
                        (click)="change(item)"
                    ></nx-checkbox>

                    <label
                        class="ellipsis"
                        [htmlFor]="item.id"
                        >{{ item.label }}</label
                    >
                </div>
            </li>
        </ul>
    </div>
</div>
