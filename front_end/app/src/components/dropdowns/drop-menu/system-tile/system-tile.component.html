<div class="system-tile" [ngClass]="{active: active}" [style.width.px]="width">
    <div class="system-status">
        <svg-icon [src]="icon" [applyClass]="true"></svg-icon>
    </div>
    <div class="system-info">
        <span class="system-name">{{system.name}}</span>
        <span class="owner">Owner - {{system.ownerFullName}}</span>
    </div>
</div>
