<div class="dropdown"
     [ngClass]="{'show': show}"
     (nxClickElsewhere)="show = false">

    <button class="btn btn-dropdown-toggle dropdown-toggle"
            #dropdownButtonFocus
            (click)="show = !show"
            type="button" id="{{id}}" data-toggle="dropdown">
        <div class="btn loading" *ngIf="merge && stillLoading">
            <div><span class="dot1"></span><span class="dot2"></span><span class="dot3"></span></div>
        </div>
        <span *ngIf="merge && !stillLoading || !merge" [ngClass]="{ 'ellipsis-merge': merge, ellipsis: !merge }" [innerHtml]="_selected && _selected.name"></span>
        <div class="nav-arrow">
            <span></span>
            <span></span>
        </div>
    </button>

    <div class="dropdown-menu" [nxArrowNav]="show"
         [style.display]="show ? 'inline-block' : 'none'"
         [attr.aria-labelledby]="id">

        <ul class="dropdown-menu--list">
            <li class="dropdown-item-container" *ngFor="let item of items; trackBy: trackItem">
                <hr *ngIf="item.name === 'horizontal'; else systemSelect">
                <ng-template #systemSelect>
                    <a class="dropdown-item inset" (keyup)="handleKeyup($event, item)" tabindex="0"
                        [ngClass]="{ 'selected': _selected && _selected.value === item.value }"
                        (click)="show = false; change(item)"
                    >
                        <span [innerHTML]="item.name"></span>
                </a>
                </ng-template>
            </li>
        </ul>
    </div>
</div>
