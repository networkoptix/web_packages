<div
    class="dropdown {{ dropdownType }}"
    [ngClass]="{
        'dropdown-show': show,
        'display-only': items?.length === 1 || stillLoading
    }"
    (nxClickElsewhere)="show = false"
>
    <button
        class="btn btn-dropdown-toggle dropdown-toggle"
        #dropdownButtonFocus
        (click)="show = !show"
        type="button"
        [id]="id"
        data-toggle="dropdown"
    >
        <div class="btn loading" *ngIf="stillLoading">
            <div>
                <span class="dot1"></span>
                <span class="dot2"></span>
                <span class="dot3"></span>
            </div>
        </div>
        <item-icon
            *ngIf="_selectedItem?.icon && !stillLoading"
            [item]="_selectedItem"
            marginLeft="4"
        ></item-icon>
        <span
            *ngIf="!stillLoading"
            [ngClass]="{
                'ellipsis-mr': merge || ellipsisMargin,
                ellipsis: !merge
            }"
            [innerHTML]="
                allowHTML
                    ? _selectedItem && _selectedItem.name
                    : (_selectedItem && _selectedItem.name | unsafe)
            "
        ></span>
        <div class="arrow-flip">
            <svg-icon
                nx-add-svg-src
                [src]="CONFIG.icons.dirTextButtons + 'arrow_expand.svg'"
            ></svg-icon>
        </div>
    </button>

    <div
        class="dropdown-menu"
        [nxArrowNav]="show"
        [style]="{
            display: show ? 'inline-block' : 'none',
            width: forcePosition?.width ? forcePosition.width + 'px' : '100%'
        }"
        [style.left.px]="forcePosition?.left || 0"
        [style.top.px]="
            forcePosition?.top ||
            nativeElementTop - (forcePosition?.offsetTop || 0)
        "
        [attr.aria-labelledby]="id"
    >
        <ul class="dropdown-menu--list">
            <li
                class="dropdown-item-container"
                *ngFor="let item of items; trackBy: trackItem"
            >
                <ng-container
                    *ngIf="
                        !hideSelectedItem ||
                        !(_selectedItem && _selectedItem.value === item.value)
                    "
                    [ngTemplateOutlet]="dropdownRow"
                ></ng-container>
                <ng-template #dropdownRow [ngSwitch]="item.name">
                    <hr
                        *ngSwitchCase="'horizontal'"
                        [ngClass]="{ 'narrow-hr': hrMargin }"
                    />
                    <div *ngSwitchCase="'seperator'" class="seperator"></div>
                    <ng-container
                        *ngSwitchDefault
                        [ngTemplateOutlet]="
                            !item.disabled ? enabledItem : disabledItem
                        "
                    >
                    </ng-container>
                </ng-template>
                <ng-template #enabledItem>
                    <a
                        class="dropdown-item inset"
                        (keyup)="handleKeyup($event, item)"
                        tabindex="0"
                        [ngClass]="{
                            selected:
                                _selectedItem &&
                                _selectedItem.value === item.value
                        }"
                        (click)="show = false; change(item)"
                    >
                        <item-icon
                            *ngIf="item.icon"
                            [item]="item"
                            marginLeft="15"
                        ></item-icon>
                        <span
                            [innerHTML]="
                                allowHTML ? item.name : (item.name | unsafe)
                            "
                        ></span>
                    </a>
                </ng-template>
                <ng-template #disabledItem>
                    <a
                        class="dropdown-item inset disabled"
                        (click)="show = false"
                    >
                        <item-icon
                            *ngIf="item.icon"
                            [item]="item"
                            marginLeft="15"
                        ></item-icon>
                        <span
                            class="disabled"
                            [innerHTML]="
                                allowHTML ? item.name : (item.name | unsafe)
                            "
                        ></span>
                    </a>
                </ng-template>
            </li>
        </ul>
    </div>
</div>
