<div class="process-button" [ngClass]="customClass">
    <div *ngIf="!textOnly && process && process.processing" [ngClass]="buttonClass"
         class="btn active focus loading {{customButtonClass}} {{process && process.processing && 'disabled'}}">
        <div>
            <span class="dot1"></span><span class="dot2"></span><span class="dot3"></span>
        </div>
    </div>

    <button *ngIf="!textOnly; else textButton" class="btn {{buttonClass}} {{customButtonClass}} min-w-120 process-button"
            [ngClass]="{'processing' : process && process.processing}"
            [ngStyle]="{'cursor': buttonDisabled ? 'not-allowed' : 'pointer'}"
            [disabled]="buttonDisabled"
            type="submit"
            (click)="clickHandler($event)">
        <ng-container>{{buttonText}}</ng-container>
        <ng-container *ngIf="svg"><svg-icon nx-add-svg-src [src]="CONFIG.icons.dir + svg.src + '.svg'"
            [ngClass]="{ 'white-svg': svg.color === 'light1', 'ml-2': true }"
            [svgStyle]="{ 'height.px': svg.height }"
            [applyClass]="true"></svg-icon>
        </ng-container>
    </button>
    <ng-template #textButton>
        <span class="header-button-span">
            <svg-icon [src]="CONFIG.images.dir + 'buttons/external.svg'"
                      [svgStyle]="{'margin-right': '2px', 'width.px': '20'}"></svg-icon>
            <span (click)="clickHandler($event);"
                  translate>Open in %VMS_NAME%</span>
        </span>
    </ng-template>
</div>
