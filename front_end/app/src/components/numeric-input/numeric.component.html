<input
    type="number"
    style="padding-right: 2px !important;"
    class="form-control"
    id="{{componentId}}"
    name="{{componentId}}"
    min="{{min}}"
    max="{{max}}"
    [placeholder]="placeholder"
    [ngClass]="class"
    [step]="step || 1"
    [attr.disabled]="disabled ? disabled : undefined"
    [(ngModel)]="_value"
    (paste)="onPaste($event)"
    (change)="valueChanged($event)"
    (keyup)="setValue($event)"
    (keydown)="checkValue($event)"/>
