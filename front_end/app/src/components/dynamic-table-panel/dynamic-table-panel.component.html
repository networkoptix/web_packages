<div class="panel col-12" *ngIf="activeEntity">
    <nx-block type='gray'>
        <header>
            <div class="panel-title">
                <span>{{activeEntity._ ? activeEntity._.name : activeEntity.info.name}}</span>
            </div>
            <span class="glyphicon close-icon detailsClose"
                  (click)="closeView()">
            </span>
        </header>

        <ng-container *ngFor="let paramGroup of panelParams.values">
            <nx-section *ngIf="paramGroup.id !== '_'">
                <h4 *ngIf="paramGroup.values.length">{{paramGroup.name}}</h4>
                <div class="row" *ngFor="let param of paramGroup.values">
                    <div class="col-7">{{param.name || param.id}}</div>
                    <div class="col-5 ellipsis"
                         *ngIf="activeEntity[paramGroup.id] && activeEntity[paramGroup.id][param.id] != undefined">
                        {{activeEntity[paramGroup.id][param.id]}}
                    </div>
                </div>
            </nx-section>
        </ng-container>
    </nx-block>
</div>
