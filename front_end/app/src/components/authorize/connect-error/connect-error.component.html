<!-- <nx-pre-loader *ngIf=""></nx-pre-loader> -->
<main [ngClass]="{ 'main-w header-w': viewType === 'web', 'main-d header-d': viewType === 'desktop', 'main-m header-m': viewType === 'mobile' }">
    <form #resetForm="ngForm" name="connectErrorForm">
        <svg-icon nx-add-svg-src
            [src]="CONFIG.icons.dirSectionPlaceholder + 'error_placeholder.svg'" 
            [svgStyle]="{'width.px': 280, 'height.px': 120}"
            [applyClass]="true"></svg-icon>
        <div class="for-small">
            <button *ngIf="clientType === 'loginToWebadmin' && smallView"
                class="btn mobile-back-button" type="button" (click)="setCurrentState.emit('email')">
                <svg-icon nx-add-svg-src
                    [src]="CONFIG.icons.dir + 'arrow_back_button.svg'"
                    [svgStyle]="{'width.px': 36, 'height.px': 36}"
                    [applyClass]="true"></svg-icon>
            </button>
            <h3 class="authorize-header mt-3 mb-2" translate>Cannot connect to %CLOUD_NAME%</h3>
        </div>
        <p class="mt-1" [innerHTML]="additionalText"></p>
    </form>
    <footer [ngClass]="{ 'footer-w': viewType === 'web', 'footer-d': viewType === 'desktop', 'footer-m': viewType === 'mobile' }">
        <div class="left">
            <button *ngIf="clientType === 'setupWizard'" class="btn text-button" (click)="setupNonCloudSystem()" type="button">
                <span translate>Setup Non-cloud System</span>
            </button>
        </div>
        <div class="right">
            <button *ngIf="clientType === 'loginToWebadmin' && !smallView"
                class="btn text-button" type="button" (click)="setCurrentState.emit('email')">
                <svg-icon nx-add-svg-src
                    [src]="CONFIG.icons.dir + 'arrow_back_button.svg'"
                    [svgStyle]="{'width.px': 20, 'height.px': 20}"
                    [applyClass]="true"></svg-icon>
                <span translate>Back</span>
            </button>
            <nx-process-button
                buttonText="{{ 'Try Again' | translate }}"
                [process]="processTryAgain">
            </nx-process-button>
        </div>
    </footer>
</main>
