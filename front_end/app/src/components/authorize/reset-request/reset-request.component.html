<!-- <nx-pre-loader *ngIf=""></nx-pre-loader> -->
<header [ngClass]="{ 'header-d': viewType === 'desktop', 'header-m': viewType === 'mobile' }">
    <h3 class="authorize-header">{{LANG.authorize.passResetHeader()}}</h3>
</header>
<main [ngClass]="{ 'main-w': viewType === 'web', 'main-d': viewType === 'desktop', 'main-m': viewType === 'mobile' }">
    <form #resetPasswordForm="ngForm" name="resetPasswordForm">
        <ng-container *ngIf="!confirm; else resetConfirm">
            <label for="authorizeEmail" translate>Email</label>
            <input
            type="email"
            id="resetPasswordEmail"
            name="resetPasswordEmail"
            [ngClass]="{ 'invalid-state': email.invalid && (email.dirty || email.touched) }"
            [(ngModel)]="resetEmail"
            #email="ngModel"
            autocomplete="email"
            required
            email
            nxFocusMe>
            <ng-container *ngIf="email.invalid && (email.dirty || email.touched)">
                <p *ngIf="email.errors.required" class="error-label mt-2 mb-0" translate>Enter email</p>
                <p *ngIf="email.errors.email" class="error-label mt-2 mb-0" translate>Invalid email</p>
                <p *ngIf="email.errors.accountDoesNotExist" class="error-label mt-2 mb-0" translate>Account does not exist.</p>
            </ng-container>
        </ng-container>
        <ng-template #resetConfirm>
            <div class="email-sent">
                <svg-icon nx-add-svg-src
                    [src]="CONFIG.icons.dirSectionPlaceholder + 'mail' + (viewType === 'web' ? '' : '_desktop') + '_placeholder.svg'" 
                    [svgStyle]="{'width.px': 280, 'height.px': 120}"
                    [applyClass]="true"></svg-icon>
                <h3 class="authorize-header" translate>We've sent you an email</h3>
                <p translate>Please follow instructions there to reset your password and return here to log in again.</p>
            </div>
        </ng-template>
    </form>
    <footer [ngClass]="{ 'footer-w': viewType === 'web', 'footer-d': viewType === 'desktop', 'footer-m': viewType === 'mobile' }">
        <div class="d-flex justify-content-end w-100">
            <button class="btn text-button" type="button">
                <!-- (click)="goBack()"  -->
                <svg-icon nx-add-svg-src
                    [src]="CONFIG.icons.dir + 'arrow_back_button.svg'"
                    [svgStyle]="{'width.px': 24, 'height.px': 20}"
                    [applyClass]="true"></svg-icon>
                <span translate>Back</span>
            </button>
            <nx-process-button
                [clickFn]="!confirm && sendEmail"
                buttonText="{{ (confirm ? 'Log In' : 'Reset Password') | translate }}"
                [process]="confirm ? loginProcess : resetRequestProcess">
            </nx-process-button>
        </div>
    </footer>
</main>
