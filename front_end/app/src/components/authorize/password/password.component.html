<!-- <nx-pre-loader *ngIf=""></nx-pre-loader> -->
<header [ngClass]="{ 'header-d': viewType === 'desktop', 'header-m': viewType === 'mobile' }">
    <svg-icon nx-add-svg-src 
        [src]="CONFIG.icons.dirSectionPlaceholder + (CONFIG.isLocal ? 'local_header' : 'cloud_header') + (viewType === 'web' ? '' : '_desktop') + '.svg'" 
        [svgStyle]="{'width.px': 320, 'height.px': 80}"
        [applyClass]="true"></svg-icon>
    <h3 class="authorize-header">{{ header }}</h3>
    <div class="authorize-subheader">
        <span class="sub-header">{{subHeader}}</span>
        <span class="for-account">{{loginEmail}}</span>
    </div>
</header>
<main [ngClass]="{ 'main-w': viewType === 'web', 'main-d': viewType === 'desktop', 'main-m': viewType === 'mobile' }">
    <form>
        <label for="authorizePassword" translate>Password</label>
        <input
            type="password"
            id="authorizePassword"
            name="password"
            [ngClass]="{ 'invalid-state': password.invalid && (password.dirty || password.touched) }"
            [(ngModel)]="loginPassword"
            #password="ngModel"
            autocomplete="password"
            required
            nxFocusMe>
        <div class="mt-2" *ngIf="password.invalid && (password.dirty || password.touched)">
            <p *ngIf="password.errors.required" class="error-label mt-1 mb-0" translate>Enter password</p>
            <p *ngIf="password.errors.wrongPassword" class="error-label mt-1 mb-0" translate>Wrong password</p>
            <p *ngIf="password.errors.lockedOut" class="error-label mt-1 mb-0" translate>Too many attempts. Try again in a minute.</p>
        </div>
        <div class="mt-2 d-flex">
            <nx-checkbox
                [color]="['desktop', 'mobile'].includes(viewType) && 'desktop'"
                name="stayLoggedIn"
                [(ngModel)]="stayLoggedIn"
                #stayLogged="ngModel"
                componentId="stayLoggedIn"
                [description]="LANG.authorize.stayLoggedInHelpText">
            </nx-checkbox>
            <label for="stayLoggedIn" translate>Stay logged in</label>
        </div>
    </form>
    <footer [ngClass]="{ 'footer-w': viewType === 'web', 'footer-d': viewType === 'desktop', 'footer-m': viewType === 'mobile' }">
        <div class="left">
            <button class="btn text-button no-padding" type="button" (click)="setCurrentState.emit('request')">
                <svg-icon nx-add-svg-src
                    [src]="CONFIG.icons.dir + 'question.svg'"
                    [svgStyle]="{'width.px': 20, 'height.px': 20}"
                    [applyClass]="true"></svg-icon>
                <span class="pl-1" translate>Forgot Password?</span>
            </button>
        </div>
        <div class="right">
            <button *ngIf="!['renewSessionWeb', 'renewSessionDesktop'].includes(clientType)"
                class="btn text-button" type="button" (click)="setCurrentState.emit('email')">
                <svg-icon nx-add-svg-src
                    [src]="CONFIG.icons.dir + 'arrow_back_button.svg'"
                    [svgStyle]="{'width.px': 20, 'height.px': 20}"
                    [applyClass]="true"></svg-icon>
                <span class="pl-1" translate>Back</span>
            </button>
            <nx-process-button
                buttonText="{{ 'Log In' | translate }}"
                [clickFn]="sendPassword"
                [process]="passwordProcess"
                svg="arrow_right">
            </nx-process-button>
        </div>
    </footer>
</main>
