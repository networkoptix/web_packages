<div
    class="alert alert-{{ toast.type }} toast"
    [ngClass]="{ 'alert-dismissible': !toast.autohide }"
>
    <ng-container *ngIf="isTemplate; else text">
        <!-- isTemplate does the type discrimination, but this isn't
        detected in the template and we can't use as pipe since TemplateRef
        is a abstract class which can't be instantiated -->
        <ng-template [ngTemplateOutlet]="$any(toast.content)"></ng-template>
    </ng-container>
    <ng-template #text>
        <span
            *ngIf="toast.showHTML"
            class="toast-content"
            [innerHTML]="toast.content"
        ></span>
        <span
            *ngIf="!toast.showHTML"
            class="toast-content"
            [innerText]="toast.content"
        ></span>
        <button
            type="button"
            class="close"
            data-dismiss="alert"
            aria-label="Close"
            *ngIf="!toast.autohide"
            (click)="remove()"
        >
            <span aria-hidden="true">&times;</span>
        </button>
    </ng-template>
</div>
