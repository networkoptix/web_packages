<div class="clearfix ribbon" *ngIf="showRibbon && !type">
    <div class="message">{{message}}</div>
    <div class="action"><a [routerLink]="actionUrl" target="_blank">{{action}}</a></div>
</div>

<div class="clearfix alert-ribbon ribbon" *ngIf="showRibbon && type === 'alert'">
    <div class="message">
        <span class="message-span">{{message}}            
            <a *ngIf="updateFunction" (click)="updateFunction()" target="_blank" class='action-link'>
                <svg-icon
                *ngIf="action === 'Refresh'"
                [src]="CONFIG.icons.dirNonStandard + 'reload.svg'"
                [applyCss]="true"
                [svgStyle]="{'width.px': '20'}" title="Reload"></svg-icon>
                {{action}}
            </a>
        </span>
        <ng-container *ngIf="action">
            <span>&nbsp;</span>
            <a *ngIf="!updateFunction" [href]="actionUrl" target="_blank">{{action}}</a>
        </ng-container>
    </div>
</div>
