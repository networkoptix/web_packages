<input *ngIf="!lockEmail"
       [ngModel]="value"
       (ngModelChange)="setValue($event)"
       (blur)="onTouchedCallback()"
       [id]="componentId" [name]="componentId"
       [ngClass]="{'hide-errors': hideErrors, 'form-control': web}"
       type="email"
       required
       autocomplete="off"
       maxlength="255"
       nxFocusMe
       [setFocus]="setFocus">

<input *ngIf="lockEmail"
       type="text"
       name="registerEmailLocked"
       class="form-control"
       [ngClass]="{'hide-errors': hideErrors}"
       [(ngModel)]="value"
       readonly>
