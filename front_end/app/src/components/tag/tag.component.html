<a
    [class]="[element, size, badgeType].join(' ')"
    name="tag-{{ name }}"
    id="tag-{{ name }}"
    [ngClass]="{ static: locked }"
    [attr.href]="tagHref"
    (click)="clickable && selectTag()"
>
    <ng-content></ng-content>
    <span
        *ngIf="selected"
        class="close-button"
        (click)="$event.stopPropagation(); deselectTag()"
    >
        <span class="glyphicon tag-close-icon"></span>
    </span>
</a>
