<div class="position-relative" [ngClass]="{'hide-errors': hideErrors}">
    <input [id]="componentId" [name]="componentId"
           [ngClass]="{'hide-errors': hideErrors, 'has-error': hasError, 'form-control': web }"
           type="{{ passwordToggle ? 'password' : 'text' }}"
           required
           autocomplete="new-password"
           pattern="{{CONFIG.credentialsValidation.passwordRequirements.requiredRegex}}"
           [(ngModel)]="value"
           [ngStyle]="{ 'padding-right': tagWidth + 'px' }"
           (keyup)="setValue()"
           (blur)="onTouchedCallback()">

    <div class="addons d-flex align-items-center" #addons>
        <nx-password-input-tag-validation
                *ngIf="showTag"
                [forElement]="component">
        </nx-password-input-tag-validation>

        <span class="input-group-addon" (click)="passwordToggle=!passwordToggle">
            <span class="glyphicon glyphicon-eye-close" *ngIf="passwordToggle"></span>
            <span class="glyphicon glyphicon-eye-open" *ngIf="!passwordToggle"></span>
        </span>
    </div>
</div>
