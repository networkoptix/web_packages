<div class="scroll-wrapper" #nxScrollWrapper
    [ngClass]="{'table-scroll-fixed':tableScrollFixed}"
    [style.width]="elementWidth">

<nx-pre-loader type="page" *ngIf="!pagedItems.length"></nx-pre-loader>
<div *ngIf="pagedItems.length">
    <div class="nx-table-wrapper"
        id="nx-table" #nxTable
        [ngClass]="{'extended': showAnalytics}">

            <div class="table-wrapper">
                <nx-pre-loader *ngIf="timesElementSet < 2"></nx-pre-loader>
                <table class="table table-hover nx-table" *ngIf="timesElementSet >= 2">
                    <thead>
                        <tr>
                            <th *ngFor="let header of showHeaders"
                                class="align-bottom"
                                [title]="getCleanTitle(header)"
                                (click)="toggleHeaderSort(header)">

                                <div class="caption d-flex">
                                    <div class="ellipsis" [innerHTML]="header"></div>
                                    <div class="sort-dir nav-arrow"
                                        [style.visibility]="(header == selectedHeader) ? 'visible' : 'hidden'"
                                        [ngClass]="{'up': !sortOrderASC}">

                                        <span></span>
                                        <span></span>
                                    </div>
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="table-row-spacer"></tr>
                        <tr *ngFor="let item of pagedItems; trackBy: trackPagedItem"
                            [ngClass]="{'selected': item.sortKey == selectedCamera}"
                            (click)="setClickedRow(item);">

                            <td *ngFor="let p of showParametersFor(item)" class="text-left">

                                <div *ngIf="!isBoolean(item[p]) && item[p] !== 0 && item[p] !== '0x0'; else icon">{{item[p]}}</div>
                                <ng-template #icon>
                                    <nx-bool-icon [param]="p" [value]="item[p]"></nx-bool-icon>
                                </ng-template>
                            </td>
                        </tr>
                        <tr class="table-row-spacer"></tr>
                    </tbody>
                </table>
            </div>

            <div class="vertical-align ml-0 clearfix">
                <nav aria-label="Cameras table navigation" class="pagination-nav pt-3 pb-3">
                    <ngb-pagination
                            [collectionSize]="results"
                            [maxSize]="pagerMaxSize"
                            [ellipses]="pagerEllipses"
                            [rotate]="true"
                            [pageSize]="pageSize"
                            [page]="currentPage"
                            (pageChange)="setPage($event, true)"></ngb-pagination>
                </nav>

                <div class="csv">
                    <nx-csv-button [data]="csvCameraData"
                                filename="camera_list_{{ csvFilename | date:'yyyy-MM-dd' }}"
                                [options]="csvOptions">
                    </nx-csv-button>
                </div>
            </div>

            <div class=""
                *ngIf="pagedItems.length">

                <p class="m-0" *ngIf="CONFIG.cloudCapabilities.feedbackEnabled && LANG && LANG.ipvd" dir="auto">
                    <span>{{'ipvdDisclaimer' | translate:disclaimerParams}}</span>
                    <span>
                        <ng-container>{{LANG.ipvdFeedback.a_Please()}}&nbsp;</ng-container>
                        <a href (click)="onFeedbackClick.emit('page'); false;">{{LANG.ipvdFeedback.b_Link()}}</a>
                        <ng-container>&nbsp;{{LANG.ipvdFeedback.c_Info()}}</ng-container>
                    </span>
                </p>
                <button *ngIf="debug">reset</button>
            </div>

            <div class="row p-0 m-0">
                <nx-footer></nx-footer>
            </div>
        </div>
    </div>
</div>
