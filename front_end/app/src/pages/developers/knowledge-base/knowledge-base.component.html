<ng-template #preloader>
    <div class="preloader-wrapper">
        <nx-pre-loader></nx-pre-loader>
    </div>
</ng-template>

<!-- Card Templates - Add additional card variants here, should be compatible with node structure -->

<ng-template #normalCard let-node="node" let-index="index">
    <div [ngClass]="{'narrow-section': node.cardClass === CardClasses.NORMAL}">
        <div (NxProjectedLinkHandler)="projectedLinkHandler($event)" NxProjectedCodeBlock [innerHTML]="(index === 0 ? pageNode.title + node.content : node.content) | safe:'html'" class="article-content"></div>
    </div>
</ng-template>

<ng-template #contentCard let-node="node" let-index="index">
    <div [ngClass]="{'narrow-section': node.cardClass === CardClasses.NORMAL}">
        <div (NxProjectedLinkHandler)="projectedLinkHandler($event)" NxProjectedCodeBlock [innerHTML]="(index === 0 ? pageNode.title + node.content : node.content) | safe:'html'" class="article-content"></div>
    </div>
</ng-template>

<ng-template #sideCard let-node="node" let-index="index">
    <nx-block type="mt-3" header-style="side">
        <header>
            <div *ngIf="node.cardIcon" class="heading-icon">
                <svg-icon nx-add-svg-src
                    [src]="CONFIG.icons.dir + node.cardIcon"
                    [svgStyle]="{'width.px': '20', 'height.px': '20'}"
                ></svg-icon>
            </div>
            <p>{{node.cardLead}}</p>
            <h3>{{node.title}}</h3>
        </header>
        <nx-section>
            <div [innerHTML]="(index === 0 ? pageNode.title + node.content : node.content) | safe:'html'"></div>
        </nx-section>
    </nx-block>
</ng-template>


<!-- End of Card Templates -->

<!-- Search Results Templates, Need to update once spec is updated -->
<ng-template #moreLoading>
    <ng-container *ngIf="loadingNext">
        <nx-pre-loader type="results-pre-loader"></nx-pre-loader>
    </ng-container>
</ng-template>

<ng-template #resultBlock let-doc="doc">
    <div class=" narrow-section my-2">
        <a [routerLink]="'../' + doc.docId" (click)="navigateSearch($event)" [innerHTML]="doc.title" class="doc-link"></a>
        <p *ngIf="doc.snippet as content" [innerHTML]=" content | safe:'html'"></p>
    </div>
</ng-template>

<ng-template #searchResultsTemplate let-results="results">
    <ng-template #noResults><span translate>No Matching Search Results</span></ng-template>
    <h2 *ngIf="results.length; else noResults" class="results-heading" translate>Search Results:</h2>
    <ng-container *ngFor="let doc of results">
        <ng-container *ngTemplateOutlet="resultBlock;context{doc:doc}"></ng-container>
    </ng-container>
    <div *ngIf="currentSearchResultPage < totalSearchResultPages" class="more-results">
        <div *ngIf="!loadingNext;else moreLoading"
            (click)="fetchNext()"
            (nxOnIntersect)="fetchNext()"
            [intersectionDebounce]="CONFIG.search.debounceTime"></div>
    </div>
</ng-template>
<!-- End of Search Results Templates -->

<div *ngIf="kbService.basePath" [ngClass]="kbService.basePath !== 'content' ? 'page-wrapper' : 'content-only'">
    <nx-developers-menu *ngIf="kbService.menuName"
        [ngClass]="{'with-ribbon': ribbonService.context.visibility}"
        [service]="kbService"
        [searchEnabled]="false"
        (onClick)="handleClick($event)"
        (relatedLinks)="relatedLinks$.next($event)"
        (handlePrefetch)="prefetchDocument($event)"></nx-developers-menu>
    <div [ngClass]="{'knowledge-base': kbService.basePath !== 'content'}">
        <ng-container *ngIf="!loading; else preloader">
            <nx-search *ngIf="!kbService.contentAssetId"
                [ngModel]="search"
                (ngModelChange)="updateSearchQuery($event)"
                [placeholder]="'Knowledgebase Search' | translate"
                layout="compact"></nx-search>
            <ng-container *ngIf="pageNode.cardClass !== 'article'">
                <ng-container *ngIf="searchMode; else displayContent">
                    <ng-container *ngIf="!searchLoading; else preloader">
                        <ng-container *ngTemplateOutlet="searchResultsTemplate;context{results:(searchResults$ | async)}"></ng-container>
                    </ng-container>
                </ng-container>
                <ng-template #displayContent>
                    <ng-template #innerContent>
                        <ng-container *ngFor="let node of pageNode.nodes; let i = index">
                            <ng-container *ngTemplateOutlet="node.cardClass === CardClasses.NORMAL ? normalCard: undefined;context{node:node, index:i}"></ng-container>
                            <ng-container *ngTemplateOutlet="node.cardClass === CardClasses.SIDE ? sideCard: undefined;context{node:node, index:i}"></ng-container>
                            <ng-container *ngTemplateOutlet="node.cardClass === CardClasses.CONTENT ? contentCard: undefined;context{node:node, index:i}"></ng-container>
                        </ng-container>
                    </ng-template>
                    <div *ngIf="kbService.basePath === 'content';else innerContent" class="card">
                        <ng-container *ngTemplateOutlet="innerContent"></ng-container>
                    </div>
                    <div #scriptDiv></div>
                    <div class="related-section" *ngIf="(relatedLinksFiltered$ | async).length">
                        <h4>
                            <ng-template #related>
                                <span translate>RELATED TOPICS</span>
                            </ng-template>
                            <span *ngIf="(relatedLinks$ | async).type === 'next';else related" translate>NEXT ARTICLE:</span>
                        </h4>
                        <a *ngFor="let link of (relatedLinksFiltered$ | async)" [routerLink]="link.url" [queryParams]="{'state': link.state}">
                            {{link.display_name || link.name}}
                        </a>
                    </div>
                </ng-template>
            </ng-container>
        </ng-container>
    </div>
</div>
