<ng-template #showError>
    <nx-error-state [errors]="errorManager.errors"></nx-error-state>
</ng-template>

<ng-template #stepBlock let-block="block" let-step="step">
    <div class="detail-wrapper">
        <div class="detail-block" [routerLink]="block.url"
             (mouseenter)="block.currentIcon = block.aniIcon"
             (mouseleave)="block.currentIcon = block.icon">
            <div class="step">{{step}}</div>
            <div class="step-image" [id]="'step-image-' + step">
                <img [src]="CONFIG.images.dirDevelopers + block.currentIcon">
            </div>
            <div class="step-text">
                <h3>{{block.asset.title}}</h3>
                <span>{{block.title}}</span>
            </div>
        </div>
    </div>
</ng-template>
<ng-container *ngIf="!errorManager.hasErrors;else showError">
    <h2 class="get-started-heading" [routerLink]="steps.url">{{steps.title}}</h2>
    <section class="get-started-section">
        <div class="get-started-blocks">
            <ng-container *ngFor="let block of steps.nodes;let index=index">
                <ng-container *ngTemplateOutlet="stepBlock;context{block:block, step:index + 1}"></ng-container>
            </ng-container>
        </div>
    </section>
</ng-container>
