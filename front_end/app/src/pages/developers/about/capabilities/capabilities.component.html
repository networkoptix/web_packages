<ng-template #showError>
    <nx-error-state [errors]="errorManager.errors"></nx-error-state>
</ng-template>

<ng-template #capabilityBlock let-capability="capability">
    <div class="card capability-card" [routerLink]="capability.url">
        <header [ngStyle]="getCapabilityBlockStyle(capability)">
            <svg-icon nx-add-svg-src [src]="CONFIG.icons.dir + capability.icon.split(' ')[0]"></svg-icon>
            <div class="intro-line">{{capability.title}}</div>
            <h3>{{capability.asset.title}}</h3>
        </header>
        <div class="capability-detail" [innerHTML]="capability.asset.shortDescription">
        </div>
    </div>
</ng-template>

<section *ngIf="capabilitiesNode.nodes && !errorManager.hasErrors; else showError" class="capabilities">
    <h2 class="heading-link">{{capabilitiesNode.title}}</h2>
    <div class="detail-blocks">
        <ng-container *ngFor="let capability of capabilitiesNode.nodes">
            <ng-container *ngTemplateOutlet="capabilityBlock;context{capability:capability}"></ng-container>
        </ng-container>
    </div>
</section>
