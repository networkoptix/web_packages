<div class="support-footer">
    <h2 class="support-link"[routerLink]="supportNode.url">{{supportNode.title}}</h2>
    <div class="support-wrapper" [ngStyle]="{backgroundImage: 'url(' + CONFIG.icons.dir + supportNode.icon + ')'}">
        <div class="support-block">
            <div *ngFor="let block of supportNode.asset.blocks"
                class="support-body"
                [innerHTML]="block.contentHTML"></div>
        </div>
    </div>
</div>
