<div class="support-footer">
    <h2 class="support-link"[routerLink]="cleanSupportNode.url">{{cleanSupportNode.title}}</h2>
    <div class="support-wrapper">
        <img class="left-image" [src]="CONFIG.icons.dir + cleanSupportNode.icon.split(' ')[1]"/>
        <div class="support-block">
            <div *ngFor="let block of cleanSupportNode.asset.blocks"
                class="support-body"
                [innerHTML]="block.contentHTML"></div>
        </div>
        <img class="right-image" [src]="CONFIG.icons.dir + cleanSupportNode.icon.split(' ')[2]"/>
    </div>
</div>
