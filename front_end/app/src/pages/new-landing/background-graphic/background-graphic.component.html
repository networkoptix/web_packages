<div class="root-container">
    <div class="svg-wrapper">
        <ng-container *ngIf="componentInitialized">
            <ng-container *ngFor="let layer of layers">
                <div class="svg-layer"
                    [ngStyle]="{'width': svgProperties.defaultWidth + 'px', 'height':svgProperties.defaultHeight + 'px', 
                                'transform': 'scale('+ layer.scale +')', 'transition': isSafari?'transform 120ms':null}"
                >
                    <svg-icon 
                        [src]="CONFIG.images.dirLandingGraphic + layer.path"
                        [applyClass]="true">
                    </svg-icon>
                </div>
            </ng-container>
        </ng-container>
    </div>
</div>
