<div class="parent-container" >
    <div class="mask-wrapper">
        <div [ngStyle]="{'transform': 'scale('+ scale +')',
                         'transition': isSafari?'transform 120ms':null}" 
             class="svg-layer" 
            >
            <svg-icon
                [src]="CONFIG.images.dirLandingGraphic + 'mask.svg'"
                class="mask"
                [applyClass]="true">
            </svg-icon>
        </div>
    </div>
</div>
