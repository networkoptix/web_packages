            <ng-container #section1apply></ng-container>
        </div>
    </div>
    
    <div>
        <h2>Section 2</h2>
        <input type="text" [(ngModel)]="section2Input">

        <div>{{ section2InputWatcher.additionalProperty2 }}</div>
        <div class="section-apply-wrapper">
            <ng-container #section2apply></ng-container>
        </div>
    </div>
    
    <div>
        <h2>Section 3</h2>
        <input type="text" [(ngModel)]="section3Input">

        </div>

<ng-container #pageApply></ng-container>
