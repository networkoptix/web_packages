<div style="margin-top: 150px">
    <h4>Toaster</h4>
    <div class="form-group">
        <nx-checkbox
            name="autohide"
            componentId="autohide"
            [(ngModel)]="autohide"
            checked
        >
        </nx-checkbox>
        <label for="autohide">Auto hide</label>
    </div>
    <div class="row p-3">
        <button
            class="btn btn-primary ml-2"
            (click)="notify('I\'m info asdas sadasd asd', 'info')"
        >
            Info
        </button>
        <button
            class="btn btn-danger ml-2"
            (click)="notify('I\'m danger', 'danger')"
        >
            Danger
        </button>
        <button
            class="btn btn-warning ml-2"
            (click)="notify('I\'m warning', 'warning')"
        >
            Warning
        </button>
        <button
            class="btn btn-default ml-2"
            (click)="notify('I\'m success', 'success')"
        >
            Success
        </button>
    </div>
</div>
<div style="margin-top: 50px">
    <h4>Banner (component)</h4>
    <div class="mt-3">
        <h6>error</h6>
        <nx-alert-block
            type="error"
            id="restarting"
            [iconSrc]="CONFIG.icons.dirNonStandard + 'info-alerts.svg'"
            [line1]="'Restarting'"
            [btnIconSrc]="CONFIG.icons.dirTextButtons + 'reload.svg'"
            [btnCaption]="'Check Status'"
            (onAction)="click()"
        >
        </nx-alert-block>
    </div>
    <div class="mt-3">
        <h6>warning</h6>
        <nx-alert-block
            type="warning"
            id="restarting"
            [iconSrc]="CONFIG.icons.dirNonStandard + 'info-alerts.svg'"
            [line1]="'Restarting'"
            [btnIconSrc]="CONFIG.icons.dirTextButtons + 'reload.svg'"
            [btnCaption]="'Check Status'"
            (onAction)="click()"
        >
        </nx-alert-block>
    </div>
    <div class="mt-3">
        <h6>info</h6>
        <nx-alert-block
            type="info"
            id="restarting"
            [iconSrc]="CONFIG.icons.dirNonStandard + 'info-alerts.svg'"
            [line1]="'Restarting'"
            [btnIconSrc]="CONFIG.icons.dirTextButtons + 'reload.svg'"
            [btnCaption]="'Check Status'"
            (onAction)="click()"
        >
        </nx-alert-block>
    </div>
</div>
