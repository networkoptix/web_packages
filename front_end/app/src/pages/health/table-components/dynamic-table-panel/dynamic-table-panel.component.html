<div class="panel col-12" *ngIf="activeEntity">
    <nx-block type='gray'>
        <header>
            <div class="panel-title">
                <span>{{activeEntity._  && activeEntity._.name ? activeEntity._.name.text : activeEntity.info.name.text}}</span>
            </div>
            <span class="glyphicon close-icon detailsClose"
                  (click)="closeView()">
            </span>
        </header>
        <ng-container *ngIf="panelParams.id === 'cameras'">
            <nx-thumbnail [cameraId]="activeEntity.id"
                          [cameraState]="activeEntity.availability.status.text"
            ></nx-thumbnail>
        </ng-container>
        <ng-container *ngFor="let paramGroup of panelParams.values">
            <nx-section *ngIf="paramGroup.id !== '_'">
                <h4 *ngIf="paramGroup.values.length">{{paramGroup.name}}</h4>
                <div class="row" *ngFor="let param of paramGroup.values">
                    <div class="col-7 nx-panel">
                        <div class="row-title">
                            <span>{{param.name || param.id}}</span>
                        </div>
                        <div class="row-line"></div>
                    </div>
                    <div class="col-5 pl-0 d-flex align-items-end"
                         *ngIf="activeEntity[paramGroup.id] && activeEntity[paramGroup.id][param.id]; else noValue"
                         [title]="activeEntity[paramGroup.id][param.id].tooltip">
                        <span [ngClass]="activeEntity[paramGroup.id][param.id].class"
                              [innerText]="[undefined, ''].indexOf(activeEntity[paramGroup.id][param.id].text) === -1
                              ? activeEntity[paramGroup.id][param.id].text : '–'"></span>
                        <img *ngIf="activeEntity[paramGroup.id][param.id].icon"
                             [src]="'/static/icons/' + activeEntity[paramGroup.id][param.id].icon + '.svg'"
                             class="pl-1">
                    </div>
                    <ng-template #noValue>
                        <div class="col-5 d-flex align-items-end">–</div>
                    </ng-template>
                </div>
            </nx-section>
        </ng-container>
    </nx-block>
</div>
