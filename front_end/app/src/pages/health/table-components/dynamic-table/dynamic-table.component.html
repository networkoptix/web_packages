<!--<nx-pre-loader type="page" *ngIf="!pagedItems"></nx-pre-loader>-->
<div class="row p-0 m-0 d-flex">

    <div class="text-placeholder order-1 order-md-0 m-0 p-0 pr-2 col-md-7 col-xl-9"
         *ngIf="!pagedItems.length" translate>Nothing Found</div>
</div>

<div class="nx-table-wrapper" id="nx-table" *ngIf="pagedItems.length">
    <div *ngIf="tableHeader" class="table-header" [innerText]="tableHeader"></div>
    <div class="table-wrapper">
        <table class="table table-hover nx-table">
            <thead>
                <tr class="header-groups">
                    <ng-container *ngFor="let headerGroup of headers.values; index as index;">
                        <th *ngIf="headerGroup.values.length > 0"
                            [colSpan]="headerGroup.values.length">
                            <div *ngIf="headerGroup.name"
                                 [ngClass]="headerGroup.colorClass"
                                 [innerText]="headerGroup.name"></div>
                        </th>
                    </ng-container>
                </tr>
                <tr>
                    <ng-container *ngFor="let headerGroup of headers.values">
                        <th *ngFor="let header of headerGroup.values" class="align-bottom"
                            (click)="toggleSort(headerGroup.id, header.id, true)">
                            <div class="caption d-flex align-items-end">
                                <div class="ellipsis" [innerHTML]="header.name.replace(':', ':<br>')"></div>
                                <div class="sort-dir nav-arrow"
                                     [style.visibility]="(headerGroup.id == selectedGroup && header.id == selectedHeader) ? 'visible' : 'hidden'"
                                     [ngClass]="{'up': !sortOrderASC}">
                                    <span></span>
                                    <span></span>
                                </div>
                            </div>
                        </th>
                    </ng-container>
                </tr>
            </thead>
            <tbody>
                <tr class="table-row-spacer"></tr>
                <tr *ngFor="let item of pagedItems"
                    [ngClass]="{'selected': item == selectedEntity}"
                    (click)="setClickedRow(item);">

                    <ng-container *ngFor="let headerGroup of headers.values; first as firstGroup">
                        <ng-container *ngFor="let header of headerGroup.values; first as firstHeader">
                            <td *ngIf="firstGroup && item[headerGroup.id] && item[headerGroup.id][header.id] && item[headerGroup.id][header.id].icon; else showValue">
                                <svg-icon *ngIf="firstHeader"
                                          [svgStyle]="{'width.px': '20'}"
                                          [src]="CONFIG.icons.dir + item[headerGroup.id][header.id].icon + '.svg'"></svg-icon>
                            </td>
                            <ng-template #showValue>
                                <td [title]="item && item[headerGroup.id] && item[headerGroup.id][header.id] && item[headerGroup.id][header.id].tooltip || ''">
                                    <span [innerText]="item && item[headerGroup.id] && item[headerGroup.id][header.id] && item[headerGroup.id][header.id].text || '-'"
                                          [ngClass]="item && item[headerGroup.id] && item[headerGroup.id][header.id] && item[headerGroup.id][header.id].class || ''">
                                    </span>
                                </td>
                            </ng-template>
                        </ng-container>
                    </ng-container>
                </tr>
                <tr class="table-row-spacer"></tr>
            </tbody>
        </table>
    </div>

    <div class="vertical-align ml-0 clearfix">
        <nav aria-label="Cameras table navigation" class="pagination-nav pt-3 pb-3">
            <ngb-pagination
                    [collectionSize]="_elements.length"
                    [maxSize]="pagerMaxSize"
                    [pageSize]="pageSize"
                    [page]="currentPage"
                    [rotate]="true"
                    (pageChange)="setPage($event)"></ngb-pagination>
        </nav>
    </div>
</div>
