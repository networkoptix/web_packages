<nx-page-placeholder *ngIf="!healthService.ready"
                     [condition]="systemReady && !system.isOnline"
                     [placeholderTitle]="LANG.common.systemOffline"
                     [iconClass]="'server-offline'"
                     preloader="true"
                     class="page-placeholder offline">
</nx-page-placeholder>

<div *ngIf="healthService.ready">
    <div class="container row d-flex mt-3 m-0 pl-3" style="max-width: 1440px;">

        <div class="p-0 pr-2 pr-md-0 col-12 col-md-4 col-xl-2">
            <nx-menu [content]="menu"></nx-menu>
        </div>

        <div class="col-12 col-md-8 col-xl-10 pt-3 pt-md-0 px-0 pl-md-3">
            <router-outlet></router-outlet>
            <nx-footer></nx-footer>
        </div>
    </div>
</div>
