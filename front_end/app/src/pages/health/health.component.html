<div *ngIf="system">
    <div class="container row d-flex mt-3 m-0 pl-3" style="max-width: 1440px;">

        <div class="p-0 pr-2 pr-md-0 col-12 col-md-4 col-xl-3">
            <nx-menu [content]="menu"></nx-menu>
        </div>

        <div class="col-12 col-md-8 col-xl-7 pt-3 pt-md-0 px-0 pl-md-3" >
            <div *ngIf="selectedData && values && values.cameras" class="col-12 p-0 pr-2 pr-xl-0" >
                <nx-dynamic-table [headers]="selectedData" [elements]="values.cameras"></nx-dynamic-table>
<!--                <div><pre>{{selectedData | json}}</pre></div>-->
            </div>
            <div>
                <nx-footer></nx-footer>
            </div>
        </div>
    </div>
</div>
