<div class="row">

    <div class="col-12 mb-3"
         *ngIf="!mobileDetailMode && metricValuesLen > 1">
        <nx-search
                name="filterModel"
                [ngModel]="filterModel"
                (ngModelChange)="modelChanged($event)"
                layout="compact"
                [placeholder]="LANG.search.Search"
                ngDefaultControl>
        </nx-search>
    </div>

    <div class="d-flex w-100">
        <div *ngIf="selectedData && selectedValues && !mobileDetailMode"
             class="px-2 overflow-auto">
            <div [ngSwitch]="metricValuesLen">
                <div *ngSwitchCase="0" class="row p-0 m-0 d-flex">
                    <div class="text-placeholder order-1 order-md-0 m-0 p-0 pr-2" translate>Nothing Found</div>
                </div>
                <nx-single-entity
                        *ngSwitchCase="1"
                        [params]="selectedPanelData"
                        [entity]="objectValues(selectedValues)[0]"></nx-single-entity>
                <nx-dynamic-table *ngSwitchDefault
                                  [headers]="selectedData"
                                  [elements]="selectedValues"
                                  (onRowClick)="setActiveEntity($event)"
                                  [activeEntity]="activeEntity">
                </nx-dynamic-table>
            </div>
        </div>

        <div class="col-12 col-md-5 col-xl-4 col-xxl-3"
             *ngIf="activeEntity">

            <div class="row pl-3 pb-3"
                 [style.display]="!mobileDetailMode ? 'none' : 'block'">

                <button class="btn btn-default btn-back" (click)="resetActiveEntity()">
                    <span class="back-arrow"></span>
                    <span translate>All results</span>
                </button>
            </div>

            <nx-dynamic-table-panel-component
                    [activeEntity]="activeEntity"
                    [panelParams]="selectedPanelData"
                    (onCloseView)="resetActiveEntity()">
            </nx-dynamic-table-panel-component>
        </div>
    </div>
</div>
