<nx-page-placeholder
        placeholderTitle="No {{metricName}}"
        [condition]="metricValuesLen === 0"
        class="section-placeholder">
</nx-page-placeholder>

<div class="row">
    <div class="col-12 mb-3" #search
         *ngIf="!mobileDetailMode && metricValuesLen > 1">
        <nx-search
                name="filterModel"
                [ngModel]="filterModel"
                (ngModelChange)="modelChanged($event)"
                layout="compact"
                [placeholder]="LANG.search.Search"
                ngDefaultControl>
        </nx-search>
    </div>

    <div class="d-flex w-100" #table>
        <div *ngIf="selectedData && selectedValues && !mobileDetailMode"
             class="row col-12 m-0 px-2 overflow-auto">

            <div *ngIf="metricValuesLen === 1" class="col-12 col-xl-7 col-xxxl-5 px-0">
                <nx-single-entity
                        [params]="selectedPanelData"
                        [entity]="objectValues(selectedValues)[0]">
                </nx-single-entity>
            </div>
            <div *ngIf="metricValuesLen > 1" class="col-12 p-0">
                <nx-dynamic-table
                        [dimensions]="containerDimensions"
                        [headers]="selectedData"
                        [elements]="selectedValues"
                        (onRowClick)="setActiveEntity($event)"
                        [activeEntity]="activeEntity">
                </nx-dynamic-table>
            </div>
        </div>

        <div class="col-12 col-md-5 col-xl-4 col-xxl-3"
             *ngIf="activeEntity">

            <div class="row pl-3 pb-3"
                 [style.display]="!mobileDetailMode ? 'none' : 'block'">

                <button class="btn btn-default btn-back" (click)="resetActiveEntity()">
                    <span class="back-arrow"></span>
                    <span translate>All results</span>
                </button>
            </div>

            <nx-dynamic-table-panel-component
                    [activeEntity]="activeEntity"
                    [panelParams]="selectedPanelData"
                    (onCloseView)="resetActiveEntity()">
            </nx-dynamic-table-panel-component>
        </div>
    </div>
</div>
