<div class="card">
    <div class="card-header">{{data.name}}</div>
    <div class="card-body">
        <div *ngFor="let alert of data.alerts" class="d-flex justify-content-between" [ngClass]="{'muted': !alert.count}">
            <div>{{alert.name | titlecase}}</div>
            <nx-alert-counter [count]="alert.count" [type]="alert.level"></nx-alert-counter>
        </div>
    </div>
</div>
