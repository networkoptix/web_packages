<div class="oauth-redirect"
    [ngClass]="{ 'container-w': viewType === 'web', 'container-d': viewType === 'desktop', 'container-m': viewType === 'mobile' }">
    <nx-pre-loader *ngIf="!state"></nx-pre-loader>
    <div class="container" *ngIf="state">
        <button class="oauth-redirect-btn" *ngIf="state === 'readyToLogin'"
            (click)="redirectToOAuth()">Log In</button>
        <div class="oauth-text oauth-error" *ngIf="state === 'noNativeClient'">
            <p translate>Desktop client</p>
            <p translate>connection required</p>
        </div>
        <div class="oauth-text" *ngIf="state === 'sendingCode'">
            <p translate>Sending back to</p>
            <p translate>desktop client</p>
        </div>
    </div>
</div>
