<div class="container" *ngIf="title || body; else preloader">
    <h1 set-title>{{ title }}</h1>
    <div class="card">
        <div class="card-body"
             [innerHTML]="body">
        </div>
    </div>
    <nx-footer></nx-footer>
</div>
<ng-template #preloader><nx-pre-loader></nx-pre-loader></ng-template>
