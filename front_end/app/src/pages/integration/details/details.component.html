<nx-pre-loader type="page" *ngIf="!(plugin && LANG)"></nx-pre-loader>

<div *ngIf="plugin && LANG">
    <div class="d-flex mt-3 m-0 pl-3" style="max-width: 1440px;">
        <div class="p-0" style="width: 300px;">
            <button class="btn btn-default btn-back mb-3" routerLink="/integrations">
                <span class="back-arrow"></span>
                <span translate>All Integrations</span>
            </button>

            <nx-block header-style="slim" type="menu top">
                <header>
                    <div class="title">{{plugin.information.name}}</div>
                    <div class="second-row">
                        <div class="version"
                             [innerHTML]="plugin.versionDetails.version">
                        </div>
                    </div>
                </header>
            </nx-block>

            <div class="standalone-delimiter"></div>

            <nx-menu [content]="content"></nx-menu>

            <div class="mt-3 clearfix">
                <div>
                    <label class="group-label mb-1" translate>Tags</label>
                </div>
                <h3 class="float-left m-0 mt-1 mr-1" *ngIf="plugin.pending">
                    <span class="badge large badge-danger" translate>In Review</span>
                </h3>
                <h3 class="float-left m-0 mt-1 mr-1" *ngIf="plugin.draft">
                    <span class="badge large badge-danger" translate>Draft</span>
                </h3>
                <h3 class="float-left m-0 mt-1 mr-1" *ngFor="let type of plugin.information.type">
                    <span class="badge large" *ngIf="type.id != 'mine'">{{type.label}}</span>
                </h3>
                <h3 class="float-left m-0 mt-1 mr-1" *ngIf="plugin.mine">
                    <span class="badge large badge-brand" translate>Mine</span>
                </h3>
            </div>

            <div class="mt-3 clearfix">
                <div>
                    <label class="group-label" translate>Contact</label>
                </div>
                <div class="d-inline-flex flex-wrap justify-content-start w-100">
                    <button class="btn btn-primary" (click)="openMessageDialog()" translate>Get in touch</button>
                </div>
            </div>

            <div class="mt-3 clearfix" *ngIf="plugin.information.companyName && plugin.information.companyWeb">
                <div>
                    <label class="group-label" translate>Developer</label>
                </div>
                <div>
                    <a [href]="plugin.information.companyWeb"
                       target="_blank">{{plugin.information.companyName}}</a>
                </div>
                <div>
                    <a [href]="plugin.information.termsOfUseLink"
                       target="_blank" translate>Terms of Use</a>
                </div>
            </div>

            <div class="mt-3 clearfix">
                <div>
                    <label class="group-label" translate>Support</label>
                </div>
                <div *ngIf="plugin.support.supportPhone"
                     [translate]="'phoneNumberWithLabel'"
                     [translateParams]="{number: plugin.support.supportPhone}"></div>
                <div *ngIf="plugin.support.supportWeb">
                    <a [href]="plugin.support.supportWeb"
                       target="_blank" translate>Support URL</a>
                </div>
                <div *ngIf="plugin.support.supportEmail">
                    <a href="mailto:{{plugin.support.supportEmail}}"
                       target="_blank" translate>Support E-mail</a>
                </div>
            </div>
        </div>

        <div class="w-100 p-0" style="flex-shrink: 12;">
            <div class="row m-0 pl-2 pr-2 pt-0" *ngIf="plugin">
                <div class="col-12 col-lg-9">
                    <router-outlet></router-outlet>
                    <nx-footer class="d-none d-lg-block"></nx-footer>
                </div>

                <div class="col-12 mt-3 col-lg-3 mt-lg-0">
                    <nx-block side-element type="gray"
                              class="d-block mb-3"
                              *ngIf="plugin.downloadFiles && plugin.downloadFiles.length > 0">
                        <header translate>
                            Downloads
                        </header>

                        <nx-section>
                            <div *ngFor="let platform of plugin.downloadFiles" class="mt-3">
                                <div *ngIf="platform.name">{{ platform.name}}</div>
                                <div>
                                    <a [href]="platform.url"
                                       [attr.rel]="platform.noFollow ? 'nofollow' : ''">{{platform.file}}</a>
                                </div>
                            </div>
                        </nx-section>
                    </nx-block>
                    <nx-block side-element type="gray"
                              *ngIf="plugin.requirementsAndCompatibility">
                        <header translate>Requirements</header>

                        <nx-section>
                            <div class="card--body-info">
                                <div class="section flat">
                                    <div *ngFor="let icon of plugin.requirementsAndCompatibility.platforms.icons">
                                        <img [src]="icon.src">
                                    </div>
                                </div>

                                <div class="section"
                                     *ngIf="plugin.requirementsAndCompatibility.testedVersionsStringFull">
                                    <div *ngIf="plugin.requirementsAndCompatibility.testedVersions.length == 1">
                                        <label class="group-label" [translate]="'testedVersionLabel'"
                                               [translateParams]="{ vmsName: CONFIG.vmsName }"></label>
                                    </div>
                                    <div *ngIf="plugin.requirementsAndCompatibility.testedVersions.length > 1">
                                        <label class="group-label" [translate]="'testedVersionsLabel'"
                                               [translateParams]="{ vmsName: CONFIG.vmsName }"></label>
                                    </div>
                                    <div [innerHTML]="plugin.requirementsAndCompatibility.testedVersionsStringFull"></div>
                                </div>

                                <div class="section"
                                     *ngIf="plugin.requirementsAndCompatibility.additionalRequirements">

                                    <div><label class="group-label" translate>Additional Requirements</label></div>
                                    <div [innerHTML]="plugin.requirementsAndCompatibility.additionalRequirements"></div>
                                </div>

                            </div>
                        </nx-section>
                    </nx-block>
                    <nx-footer class="d-block d-lg-none"></nx-footer>
                </div>
            </div>
        </div>
    </div>
</div>
