<nx-pre-loader type="page" *ngIf="!(plugin && LANG)"></nx-pre-loader>

<div *ngIf="plugin && LANG" class="integration-details">
    <div class="d-flex mt-3 m-0 pl-3" style="max-width: 1440px;">
        <div class="p-0" style="width: 300px;">
            <button class="btn btn-default btn-back mb-3" routerLink="/integrations">
                <span class="back-arrow"></span>
                <span translate>All Integrations</span>
            </button>

            <nx-block header-style="slim" type="menu top">
                <header>
                    <div *ngIf="plugin.information" class="title">{{plugin.information.name}}</div>
                    <div class="minor-text d-flex justify-content-between">
                        <div *ngIf="plugin.versionDetails" name="version"
                             [innerHTML]="plugin.versionDetails.version">
                        </div>
                        <div *ngIf="plugin.lastModified" name="updateDate">
                            <span translate>Updated</span>&nbsp;<span>{{plugin.lastModified}}</span>
                        </div>
                    </div>
                </header>
            </nx-block>

            <div class="standalone-delimiter"></div>

            <nx-menu [content]="content"></nx-menu>

            <div *ngIf="plugin.information" class="mt-3 clearfix">
                <div>
                    <label class="group-label mb-1" name="tag" translate>Tags</label>
                </div>
                <h3 class="float-left m-0 mt-1 mr-1" *ngIf="plugin.pending">
                    <nx-tag type="danger" size="large" name="tag" [clickable]="false" translate>In Review</nx-tag>
                </h3>
                <h3 class="float-left m-0 mt-1 mr-1" *ngIf="plugin.draft">
                    <nx-tag type="danger" size="large" name="tag" [clickable]="false" translate>Draft</nx-tag>
                </h3>
                <h3 class="float-left m-0 mt-1 mr-1" *ngFor="let type of plugin.information.type">
                    <nx-tag size="large" name="tag" [clickable]="false" *ngIf="type.id != 'mine'">{{type.label}}</nx-tag>
                </h3>
                <h3 class="float-left m-0 mt-1 mr-1" *ngIf="plugin.mine">
                    <nx-tag type="brand" size="large" name="tag" [clickable]="false" translate>Mine</nx-tag>
                </h3>
            </div>

            <div *ngIf="plugin.support" class="mt-3 clearfix">
                <div>
                    <label class="group-label" translate>Contact</label>
                </div>
                <div class="d-inline-flex flex-wrap justify-content-start w-100">
                    <button class="btn btn-primary" (click)="openMessageDialog()" translate>Get in touch</button>
                </div>
            </div>

            <div class="mt-3 clearfix" *ngIf="plugin.information" name="information">
                <div>
                    <label class="group-label" translate>Developer</label>
                </div>
                <div *ngIf="plugin.information.companyName && plugin.information.companyWeb">
                    <a [href]="plugin.information.companyWeb" name="companyName"
                       target="_blank">{{plugin.information.companyName}}</a>
                </div>
                <div *ngIf="plugin.information.termsOfUseLink">
                    <a [href]="plugin.information.termsOfUseLink" name="termsOfUseLink"
                       target="_blank" translate>Terms of Use</a>
                </div>
            </div>

            <div *ngIf="plugin.support" class="mt-3 clearfix">
                <div>
                    <label class="group-label" translate>Support</label>
                </div>
                <div *ngIf="plugin.support.supportPhone"
                     [translate]="'phoneNumberWithLabel'"
                     [translateParams]="{number: plugin.support.supportPhone}"></div>
                <div *ngIf="plugin.support.supportWeb">
                    <a [href]="plugin.support.supportWeb"
                       target="_blank">{{plugin.support.supportWeb}}</a>
                </div>
                <div *ngIf="plugin.support.supportEmail">
                    <a href="mailto:{{plugin.support.supportEmail}}"
                       target="_blank">{{plugin.support.supportEmail}}</a>
                </div>
            </div>
        </div>

        <div class="w-100 p-0" style="flex-shrink: 12;">
            <div class="row m-0 pl-2 pr-2 pt-0" *ngIf="plugin">
                <div class="col-12 col-lg-9">
                    <router-outlet></router-outlet>
                </div>

                <div class="col-12 mt-3 col-lg-3 mt-lg-0 position-relative">
                    <div class="right-menu">
                        <nx-block side-element type="gray"
                                  class="d-block mb-3"
                                  *ngIf="plugin.downloadFiles && plugin.downloadFiles.length > 0">
                            <header translate>
                                Downloads
                            </header>

                            <nx-section>
                                <div *ngFor="let platform of plugin.downloadFiles" class="mt-3">
                                    <div *ngIf="platform.name">{{ platform.name}}</div>
                                    <div>
                                        <a [href]="platform.url"
                                           [attr.rel]="platform.noFollow ? 'nofollow' : ''">{{platform.file}}</a>
                                    </div>
                                </div>
                            </nx-section>
                        </nx-block>
                        <nx-block side-element type="gray"
                                  *ngIf="plugin.requirementsAndCompatibility">
                            <header [translate]="'integration.requirements'" [translateParams]="{name: plugin.information.name}"></header>

                            <nx-section>
                                <div class="card--body-info">
                                    <div class="section"
                                         *ngIf="plugin.requirementsAndCompatibility.platforms.icons">
                                        <div>
                                            <label class="group-label" translate>Supported Platforms</label>
                                        </div>
                                        <div class="d-flex">
                                            <ng-container *ngFor="let icon of plugin.requirementsAndCompatibility.platforms.icons; first as isFirst">
                                                <img [src]="icon.src" [title]="icon.name" [ngClass]="{'ml-0': isFirst}">
                                            </ng-container>
                                        </div>
                                    </div>

                                    <div class="section"
                                         *ngIf="plugin.requirementsAndCompatibility.testedVersionsStringFull">
                                        <div *ngIf="plugin.requirementsAndCompatibility.testedVersions.length == 1">
                                            <label class="group-label" [translate]="'testedVersionLabel'"
                                                   [translateParams]="{ vmsName: CONFIG.vmsName }"></label>
                                        </div>
                                        <div *ngIf="plugin.requirementsAndCompatibility.testedVersions.length > 1">
                                            <label class="group-label" [translate]="'testedVersionsLabel'"
                                                   [translateParams]="{ vmsName: CONFIG.vmsName }"></label>
                                        </div>
                                        <div class="d-flex">
                                            <div [innerHTML]="plugin.requirementsAndCompatibility.testedVersionsStringFull"></div>
                                            <svg-icon [src]="CONFIG.icons.dir + 'info.svg'"
                                                      [title]="'Integration likely compatible with latest version of %VMS_NAME%. Please confirm by testing and contact developer directly if you have questions.' | translate"
                                                      [svgStyle]="{'width.px': '20', 'height.px': '20', 'vertical-align': 'top'}"></svg-icon>
                                        </div>
                                    </div>

                                    <div class="section"
                                         *ngIf="plugin.requirementsAndCompatibility.additionalRequirements">

                                        <div><label class="group-label" translate>Additional Requirements</label></div>
                                        <div [innerHTML]="plugin.requirementsAndCompatibility.additionalRequirements"></div>
                                    </div>

                                </div>
                            </nx-section>
                        </nx-block>
                    </div>
                </div>

                <nx-footer class="col-12 col-lg-9"></nx-footer>
            </div>
        </div>
    </div>
</div>
