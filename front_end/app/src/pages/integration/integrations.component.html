<div class="intergations">
    <h1 class="screen-reader-only" translate>List of Integrations</h1>
    <div class="ml-4 mr-4 pt-3" *ngIf="allElements && CONFIG.integration.filter.limitation <= allElements.length">
        <nx-search
            name="filterModel"
            [ngModel]="filterModel"
            (ngModelChange)="modelChanged($event)"
            layout="compact"
            ngDefaultControl
        ></nx-search>
    </div>

    <div class="ml-3 mr-3 pt-2">
        <integrations-list-component [list]="elements"></integrations-list-component>
    </div>
</div>
