<div class="container" *ngIf="canViewRelease">
    <h1 translate>Release notes</h1>

    <div class="col-12 p-0" style="min-height: 80px;">
        <nx-pre-loader *ngIf="!activeBuilds"></nx-pre-loader>

        <ngb-tabset *ngIf="activeBuilds"
                    [style.visibility]="tabsVisible ? 'visible' : 'hidden'"
                    (tabChange)="beforeChange($event)" #tabs="ngbTabset">

            <ngb-tab *ngFor="let type of noteTypes"
                     [id]="type">
                <ng-template ngbTabTitle>
                    <span class="tab-heading">{{LANG.downloads.releasesTypes[type] || type.name}}</span>
                </ng-template>
                <ng-template ngbTabContent>
                    <div class="card card-default">
                        <div class="card-body" *ngIf="activeBuilds">
                            <div *ngFor="let release of activeBuilds">
                                <nx-release [LANG]="LANG" [linkbase]="linkbase" [release]="release"></nx-release>
                            </div>
                        </div>
                    </div>
                </ng-template>
            </ngb-tab>
        </ngb-tabset>
    </div>
    <nx-footer></nx-footer>
</div>
