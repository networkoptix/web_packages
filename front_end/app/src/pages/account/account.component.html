<nx-pre-loader
    type="page"
    *ngIf="!menuReady"
></nx-pre-loader>

<div
    class="block-container mt-3"
    *ngIf="menuReady"
>
    <div class="row">
        <div class="col-12 col-md-4 col-xl-3">
            <nx-menu [content]="content"></nx-menu>
        </div>

        <div class="col-12 col-md-8 col-xl-7 pt-3 pt-md-0">
            <router-outlet></router-outlet>
            <nx-footer></nx-footer>
        </div>
    </div>
</div>
