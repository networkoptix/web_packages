<nx-pre-loader type="page" *ngIf="!menuReady"></nx-pre-loader>

<div>
    <div class="container row d-flex mt-3 m-0 pl-3 pr-3" *ngIf="menuReady" style="max-width: 1592px;">
        <div class="p-0 col-12 col-md-4 col-xl-3 col-xxxl-2">
            <nx-menu [content]="content"></nx-menu>
        </div>

        <div class="col-12 col-md-8 col-xl-7 col-xxxl-10 pt-3 pt-md-0 px-0 pl-md-3">
            <router-outlet></router-outlet>
            <nx-footer></nx-footer>
        </div>
    </div>
</div>
