
<a class="inset menu-level-1 ellipsis toggle"
   [ngClass]="{'selected': selected, 'collapsed': _toggle, 'search-mode': searchMode}"
   [id]="item.id"
   (click)="menuClick(item.id)">

    <div class="menu-level-1-icon" *ngIf="item.icon">
        <span class="m-0 glyphicon" [ngClass]="item.icon"></span>
    </div>
    <div class="menu-level-1-icon" *ngIf="item.svg">
        <svg-icon nx-add-svg-src [src]="CONFIG.icons.dir + item.svg +'.svg'"
                  [applyClass]="true"
                  [svgStyle]="{'width.px': '24', 'height.px': '24'}"></svg-icon>
    </div>

    <ng-container>{{item.label}}</ng-container>

    <div>
        <div class="search-results-label" *ngIf="searchMode && _toggle">
            <span translate [translateParams]="{ count: item.level3.length }">result</span>
        </div>
        <div class="search-results" *ngIf="searchMode">
            <svg-icon [src]="CONFIG.icons.dir + _type + '.svg'"
                      [svgStyle]="{'width.px': '20', 'height.px': '20'}"></svg-icon>
        </div>
    </div>
</a>
