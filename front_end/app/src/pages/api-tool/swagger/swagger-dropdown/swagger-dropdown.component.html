<div [class.is-disabled]="isDisabled">
    <nx-select 
        *ngIf="!isMultiSelect"
        [items]="dropdownOptions"
        (onSelected)="onSelect($event)"
        [selected]="dropdownOptions[0]"
    ></nx-select>

    <nx-multi-select
        *ngIf="isMultiSelect"
        [items]="dropdownOptions"
        [ngModel]="selectedOptions"
        (ngModelChange)="onMultiSelect($event)"
        canSelectAll>
    </nx-multi-select>
</div>
