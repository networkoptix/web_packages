<ng-container *ngIf="!APIToolService.outDatedSystem">
    <ng-container  #swagger *ngIf="APIToolService.menuNodes; else preloader">
        <div *ngIf="APIToolService.activeNode" class="swagger-and-description-container" [ngClass]="{'api-info': APIToolService.APIInfoNodes[APIToolService.activeNode.name]}">
            <div style="padding: 0 1rem 1rem" class="swagger-description">
                <h2>{{ this.swaggerMenuDescription.title }}</h2>
                <p class="mt-3" *ngIf="this.swaggerMenuDescription.description" [innerHTML]="this.swaggerMenuDescription.description | safe:'html'">
                </p>
            </div>
            <div id="swagger-ui" #viewContainerRef [class.RTSP-request]='RTSPRequestShowing' [class.single-api-route-showing]="singleAPIRouteShowing"></div>
        </div>
    </ng-container>
</ng-container>

<ng-template #preloader>
    <nx-pre-loader></nx-pre-loader>
</ng-template>
