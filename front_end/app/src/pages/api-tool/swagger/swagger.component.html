<ng-container *ngIf="APIToolService.postSystemLoadingError; then APILoadingFailed"></ng-container>

<ng-container  #swagger *ngIf="APIToolService.menuNodes; else preloader">
    <div *ngIf="APIToolService.activeNode && !placeHolderContent[APIToolService.activeNode?.name]; else description">
        <div style="padding: 0 1rem 1rem">
            <h2>{{ this.swaggerMenuDescription.title }}</h2>
            <p class="mt-3" *ngIf="this.swaggerMenuDescription.description">
                {{ this.swaggerMenuDescription.description }}
            </p>
        </div>
        <div id="swagger-ui" [class.RTSP-request]='RTSPRequestShowing'></div>
    </div>
</ng-container>

<ng-template #preloader>
    <nx-pre-loader></nx-pre-loader>
</ng-template>

<ng-template #APILoadingFailed>
    <h2>{{ APIToolService.postSystemLoadingErrorText }}</h2>
</ng-template>

<ng-template #description>
    <h2>{{ APIToolService.currentDescription.title }}</h2>
    <div [innerHTML]="APIToolService.currentDescription.description | safe: 'html'"></div>
</ng-template>
