<ng-container *ngIf="APIToolService.APIFileLoadingError; then APILoadingFailed"></ng-container>
<ng-container *ngIf="APIToolService.leftMenuContent">
    <div *ngIf="!placeHolderContent[this.APIToolService.leftMenuContent.selectedSection] || this.APIToolService.leftMenuContent.selectedSubSection.length; else description">
        <div style="padding: 0 1rem 1rem">
            <h2>{{ this.swaggerMenuDescription.title }}</h2>
            <p class="mt-3" *ngIf="this.swaggerMenuDescription.description">{{ this.swaggerMenuDescription.description }}</p>
        </div>
        <div id="swagger-ui" [class.RTSP-request]='RTSPRequestShowing'></div>
    </div>
</ng-container>

<ng-template #APILoadingFailed>
    <h2 translate>Getting an API File for this system has failed.</h2>
</ng-template>

<ng-template #description>
    <h2>{{ APIToolService.APIDescription.title }}</h2>
    <div [innerHTML]="APIToolService.APIDescription.description | safe: 'html'"></div>
</ng-template>
