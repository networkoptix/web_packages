<console-menu [menu]="menu" [base]="base" [type]="selectedMode" [sectionParam]="sectionParam"></console-menu>
<ng-container [ngSwitch]="selectedMode">
    <console-edit
            *ngSwitchCase="CONSOLE_MODE.EDIT"
            [contextList]="manifest?.manifest?.contexts || []"></console-edit>
    <console-table *ngSwitchDefault [sectionParam]="sectionParam"></console-table>
</ng-container>
