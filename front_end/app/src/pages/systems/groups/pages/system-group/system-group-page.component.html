<h1>{{ (group$ | async)?.name }}</h1>

<h2 *ngIf="(group$ | async)?.children?.length">Child Groups:</h2>
<ul>
    <li *ngFor="let g of (group$ | async).children">
        <a [routerLink]="'/systems/groups/' + g.id">{{ g.name }}</a>
    </li>
</ul>

<h2 *ngIf="(group$ | async)?.systems?.length">Systems:</h2>
<ul>
    <li *ngFor="let s of (group$ | async).systems">
        <a [routerLink]="'/systems/' + s.id">{{ s.name }}</a>
    </li>
</ul>
