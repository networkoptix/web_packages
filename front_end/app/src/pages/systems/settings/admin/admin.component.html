<nx-pre-loader *ngIf="!system"></nx-pre-loader>

<div class="" *ngIf="system">
    <nx-block header-style="extended">
        <header>
            <h2 class="system-name mb-2">{{system.info.name}}</h2>
            <span class="system-owner">
                        <span translate>Owner</span><span>&nbsp;– </span>
                        <span class="name">
                            <span *ngIf="system.isMine; else ownerInfo" translate>you</span>
                            <ng-template #ownerInfo><span>{{system.info.ownerFullName}}
                                ({{system.info.ownerAccountEmail}})</span></ng-template>
                        </span>
                    </span>
        </header>

        <nx-section *ngIf="system.permissions.isAdmin">
            <div class="row m-0">
                <div class="col-xl-7">
                    <div class="float-left mr-2">
                        <button class="btn btn-default"
                                (click)="rename()"><span class="ellipsis" translate>Rename</span>
                        </button>
                    </div>
                    <div class="float-left mr-2" *ngIf="system.isMine">
                        <button class="btn btn-default"
                                [disabled]="(currentlyMerging || !system.isOnline || !system.isAvailable) && !(debugMode || betaMode)"
                                (click)="mergeSystems()"><span class="ellipsis"
                                                               translate>Merge with Another System</span>
                        </button>
                    </div>
                </div>
                <div class="col-xl-5 mt-2 mt-xl-0">
                    <div class="float-xl-right" *ngIf="system.isMine">
                        <button [disabled]="currentlyMerging"
                                class="btn btn-default"
                                (click)="disconnect()"><span class="ellipsis" translate>Disconnect from %CLOUD_NAME%</span>
                        </button>
                    </div>
                </div>
            </div>
        </nx-section>
    </nx-block>

    <div class="mt-3" *ngIf="!system.isMine">
        <nx-block>
            <nx-section>
                <span class="system-owner" translate>Your access level<span>&nbsp;– </span>
                    <span class="name">{{ userRole }}</span>
                </span>
                <div class="mt-2">
                    <button [disabled]="currentlyMerging"
                            class="btn btn-default"
                            (click)="delete()" translate>Disconnect from My Account
                    </button>
                </div>
            </nx-section>
        </nx-block>
    </div>
</div>
