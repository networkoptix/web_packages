<nx-pre-loader *ngIf="!system"></nx-pre-loader>

<nx-system-basic-admin-component
        *ngIf="system"
        [system]="system">
</nx-system-basic-admin-component>

<nx-block type="simple-alert" class="d-block mt-3"
          *ngIf="system && advanced">
    <nx-section>
        <div class="row p-0">
            <div class="col-12 col-md-6 d-flex flex-row">
                <div>
                    <svg-icon [src]="CONFIG.icons.dirNonStandard + 'error.svg'"
                          [svgStyle]="{'width.px': '20', 'height.px': '20'}"></svg-icon>
                </div>
                <div class="ml-2">
                    <span translate>Settings displayed below are advanced.</span>
                    <span translate>Changing them may cause server to work incorrectly.</span>
                </div>
            </div>
            <div class="col-12 col-md-6 mt-3 mt-md-0 d-flex justify-content-start justify-content-md-end">
                <button class="float-right float-md-left btn btn-text has-icon pr-0" style="height: 1rem"
                        (click)="hideAdvancedSettings()">
                    <span class="glyphicon glyphicon-eye-close"></span>
                    <span translate>Hide Advanced Settings</span>
                </button>
            </div>
        </div>
    </nx-section>
</nx-block>

<nx-system-advanced-admin-component
        *ngIf="system && advanced"
        [system]="system">
</nx-system-advanced-admin-component>
