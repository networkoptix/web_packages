<nx-pre-loader *ngIf="!system"></nx-pre-loader>

<div *ngIf="system" class="row d-flex align-items-start">
    <div class="col-12 system-settings">

        <nx-block header-style="extended" type="mb-3" *ngIf="CONFIG.isLocal">
            <header>
                <div class="system-cloud-tag float-right">
                    <nx-tag static type="success" *ngIf="CONFIG.cloudSystemId">{{LANG.system.connected() | uppercase}}</nx-tag>
                    <nx-tag static *ngIf="!CONFIG.cloudSystemId">{{LANG.system.not_connected() | uppercase}}</nx-tag>
                </div>
                <div class="float-left">
                    <h2 class="system-name mb-2" translate>%CLOUD_NAME%</h2>
                    <span class="system-owner">
                        <a [href]="CONFIG.cloudHost" target="_blank">{{CONFIG.cloudHost}}</a>
                    </span>
                </div>
            </header>

            <nx-section *ngIf="system.permissions.isAdmin && ((system.isMine && !CONFIG.cloudSystemId) || CONFIG.cloudSystemId)">
                <div class="row m-0">
                    <div class="col-12 pl-0">
                        <div *ngIf="system.isMine && !CONFIG.cloudSystemId">
                            <button [disabled]="settings.disconnectDisabled"
                                    class="btn btn-default"
                                    (click)="connectLocalToCloud()">
                                <span class="ellipsis" translate>Connect to %CLOUD_NAME%</span>
                            </button>
                        </div>
                        <div *ngIf="CONFIG.cloudSystemId">
                            <span translate>Owner</span><span>&nbsp;–&nbsp;</span>
                            <span>
                                <span *ngIf="system.isMine" class="system-header-bold" translate>you</span>
                                <span *ngIf="!system.isMine">
                                    <span class="system-header-bold">{{system.info.ownerFullName}}</span>
                                    <span>&nbsp;({{system.info.ownerAccountEmail}})</span>
                                </span>
                            </span>
                            <button *ngIf="system.isMine"
                                    [disabled]="settings.disconnectDisabled"
                                    title="BOOM!"
                                    class="btn btn-default mt-3"
                                    (click)="disconnectFromCloud()">
                                <span class="ellipsis" translate>Disconnect from %CLOUD_NAME%</span>
                            </button>
                        </div>
                    </div>
                </div>
            </nx-section>
        </nx-block>

        <nx-block header-style="extended">
            <header>
                <div class="d-flex">
                    <nx-editable-settings-heading
                            [nameWatcher]="systemNameWatcher"
                            [editEnabled]="system.permissions.isAdmin && !settings.renameDisabled"></nx-editable-settings-heading>
                    <nx-client-button *ngIf="!CONFIG.isLocal" [textOnly]="true"></nx-client-button>
                </div>
                <span *ngIf="!CONFIG.isLocal" class="system-owner">
                    <span translate>Owner</span><span>&nbsp;–&nbsp;</span>
                    <span>
                        <span *ngIf="system.userManager.isMine" class="system-header-bold" translate>you</span>
                        <ng-container *ngIf="!system.userManager.isMine">
                            <span class="system-header-bold">{{system.info.ownerFullName}}</span>
                            <span>&nbsp;({{system.info.ownerAccountEmail}})</span>
                        </ng-container>
                    </span>
                </span>
            </header>

            <nx-section *ngIf="system.isMine; else notOwner">
                <div class="row m-0">
                    <div class="col-xl-7 pl-0">
                        <div class="float-left mr-2">
                            <button class="btn btn-default"
                                    [disabled]="(merging || !system.isOnline || !system.isAvailable) && !(debugMode || betaMode)"
                                    (click)="mergeSystems()">
                                <span class="ellipsis" translate>Merge with Another System</span>
                            </button>
                        </div>
                    </div>
                    <div class="col-xl-5 p-0 mt-2 mt-xl-0" *ngIf="!CONFIG.isLocal && !CONFIG.cloudSystemId">
                        <div class="float-xl-right">
                            <button [disabled]="settings.disconnectDisabled"
                                    class="btn btn-default"
                                    (click)="disconnectFromCloud()">
                                <span class="ellipsis" translate>Disconnect from %CLOUD_NAME%</span>
                            </button>
                        </div>
                    </div>
                </div>
            </nx-section>
            <ng-template #notOwner>
                <nx-section>
                    <span class="system-owner"><span translate>Your access level</span><span>&nbsp;– </span>
                        <span class="name" [innerHTML]="updateUserRole()"></span>
                    </span>
                    <div class="mt-2">
                        <button [disabled]="settings.disconnectDisabled"
                                class="btn btn-default"
                                (click)="delete()" translate>Disconnect from My Account</button>
                    </div>
                </nx-section>
            </ng-template>
        </nx-block>

        <nx-system-standard-admin-component
                *ngIf="system.isAdmin"
                [system]="system"
                [settings]="settingsForSystem">
        </nx-system-standard-admin-component>

        <nx-alert-block
                class="d-block mt-3"
                *ngIf="system.currentUser?.isAdmin && advanced"
                [iconSrc]="CONFIG.icons.dirNonStandard + 'error.svg'"
                [line1]="'Settings displayed below are advanced.' | translate"
                [line2]="'Changing them may cause server to work incorrectly.' | translate"
                [btnIconSrc]="CONFIG.icons.dir + 'eye_closed.svg'"
                [btnCaption]="'Hide Advanced Settings' | translate"
                (onAction)="hideAdvancedSettings()">
        </nx-alert-block>

        <nx-system-advanced-admin-component
                *ngIf="system.currentUser?.isAdmin && advanced"
                [system]="system">
        </nx-system-advanced-admin-component>
    </div>
</div>
