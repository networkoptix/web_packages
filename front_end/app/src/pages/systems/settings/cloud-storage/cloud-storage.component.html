<!-- Initial State -->
<nx-pre-loader *ngIf="cloudStorageStateLoading"></nx-pre-loader>

<nx-block *ngIf="cloudStorageSystemEnabled === false" type="mt-3 mb-3" header-style="{{ layoutSimple ? 'hidden': '' }}">
    <header><h4 translate>Cloud Storage</h4></header>
    <div class="header-svg">
        <svg-icon nx-add-svg-src *ngIf="!layoutSimple" [src]="CONFIG.icons.dir + 'city.svg'"></svg-icon>
        <svg-icon nx-add-svg-src *ngIf="layoutSimple" [src]="CONFIG.icons.dir + 'cloud_storage_simple.svg'"></svg-icon>
    </div>
    <div class="initial-state">
        <h2 translate>Enhance your data storage experience</h2>
        <p translate>Now even more options for your data storage. Start using our convenient and secure cloud storage service.</p>
        <p>{{ cloudStorageInitial }}</p>

        <p *ngIf="!systemCloudStorageCapable" translate>Update your system to the <a routerLink="/download" target="_blank">latest build</a> to enable Cloud Storage.</p>
        <nx-process-button *ngIf="systemCloudStorageCapable" [actionType]="'default'" [process]="enableCloudStorage" [buttonText]="LANG.dialogs.cloudStorage.enableStorage"></nx-process-button>
    </div>
</nx-block>

<!-- Empty and Regular State -->

    </div>
    <div *ngIf="isOwner" class="normal-state-footer">
