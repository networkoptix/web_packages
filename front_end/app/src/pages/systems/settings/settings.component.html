<nx-pre-loader type="page" *ngIf="!system"></nx-pre-loader>

<ng-container *ngIf="system && !(systemNoAccess || secondaryMerge)">
    <div class="block-container mt-3">
        <div class="row">
            <!-- Calculate height of menu, offset by height of header div and 16px on top and bottom -->
            <div class="fixed-sidebar col-12 d-flex flex-column fill-screen-height"
                 [ngStyle]="{'height': 'calc(100% - ('+ headerHeight + 'px + 32px))'}">
                <nx-pre-loader *ngIf="!menuVisible"></nx-pre-loader>
                <nx-menu *ngIf="menuVisible" [content]="content"></nx-menu>
            </div>

            <!-- Offset for the fixed menu -->
            <div class="col-12 col-md-8 col-xl-7 pt-3 pt-md-0 px-3 offset-md-4 offset-xl-3">
                <router-outlet></router-outlet>
                <nx-footer *ngIf="menuVisible"></nx-footer>
            </div>
        </div>
    </div>
</ng-container>

<nx-page-placeholder *ngIf="systemNoAccess" type="FAILED_TO_ACCESS_SYSTEM" withFooter>
    <button class="btn btn-primary main-button mx-auto">
        <a routerLink="/" translate>Go to Main Page</a>
    </button>
</nx-page-placeholder>

<nx-page-placeholder *ngIf="secondaryMerge"
    [type]="'MERGE'" [data]="{ systemName: mergeTargetSystem.name }" [withFooter]="true">
</nx-page-placeholder>
