<nx-pre-loader type="page" *ngIf="!system"></nx-pre-loader>

<div *ngIf="system">
    <div *ngIf="!system.forbidden"
         class="block-container row d-flex mt-3 m-0 pl-3">

        <!-- Fixed elements don't respect sizing of parents, so we need to set container within the fixed element -->
        <div class="block-container row fixed-sidebar">
            <div class="d-flex flex-column p-0 pr-2 pr-md-0 col-12 col-md-4 col-xl-3 fill-screen-height">
                <nx-system-merge></nx-system-merge>
                <nx-menu [content]="content"></nx-menu>
            </div>
        </div>

        <!-- Offset for the fixed menu -->
        <div class="col-12 col-md-8 col-xl-7 pt-3 pt-md-0 px-0 pl-md-3 offset-md-4 offset-xl-3">
            <div class="col-12 p-0 pr-2 pr-xl-0">
                <router-outlet></router-outlet>
            </div>
            <div class="pr-2 pr-xl-0">
                <nx-footer></nx-footer>
            </div>
        </div>
    </div>

    <div *ngIf="system.forbidden" class="text-center">
        <h1 class="d-flex justify-content-center" translate>Failed to access System</h1>
        <h3 class="d-flex justify-content-center" [innerHTML]="'FAILED_SYSTEM_DESCR' | translate"></h3>
        <p class="mt-4 d-flex justify-content-center">
            <a href="/systems" class="btn btn-primary" translate>Available Systems list</a>
        </p>
    </div>
</div>
