<nx-block type="gray" *ngFor="let license of licenses" class="d-block mt-3">
    <header>
        <h4 [innerText]="license.key"></h4>
    </header>
    <nx-section>
        <nx-info-block [sectionsOrColumns]="orderedLicense[license.key]" [infoBlockStyle]="'dark'" [removeTopMargin]="true"></nx-info-block>
    </nx-section>
</nx-block>
