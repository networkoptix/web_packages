
    <nx-page-placeholder
            class="sectional-div server-placeholder"
            type="OFFLINE_INACCESSIBLE"
            *ngIf="!system?.isOnline">
    </nx-page-placeholder>

    <div *ngIf="system?.isOnline">
        <nx-license-new-component
                [system]="system"
                [servers]="system?.servers"
                [licenses]="licenses">
        </nx-license-new-component>

        <nx-pre-loader *ngIf="!licenses"></nx-pre-loader>

        <nx-license-summary-component
                [licenses]="licenses">
        </nx-license-summary-component>

        <nx-license-detail-component
                [system]="system"
                [licenses]="licenses">
        </nx-license-detail-component>
    </div>
