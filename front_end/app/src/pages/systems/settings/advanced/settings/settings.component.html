<nx-block type="mt-3">
    <header>
        <h4 translate>Advanced System Settings</h4>
        <span class="error-label"
              translate>Warning! Any changes on this page may cause server to work incorrectly.</span>
    </header>
    <nx-section *ngIf="(systemSettings | keyvalue)?.length > 0">
        <form class="form form-horizontal row" role="form" name="systemSettings" novalidate>
            <div class="form-group col-12 row p-0 mx-0"
                 *ngFor="let setting of systemSettings | keyvalue">

                <div class="form-group col-12 row p-0 mx-0"
                     *ngIf="(CONFIG.settingsConfig[setting.key] | keyvalue)?.length > 0">

                    <div class="col-12 col-md-5 m-0 d-flex align-items-start justify-content-center flex-column item">
                        <div class="w-100">{{LANG.settingsConfig[setting.key] || setting.key}}</div>
                        <div class="w-100 text-muted" *ngIf="LANG.settingsConfig[setting.key]">({{setting.key}})</div>
                    </div>
                    <div class="col-12 col-md-7 d-flex align-items-start justify-content-center flex-column item">
                        <div class="w-100">
                            <nx-checkbox
                                    *ngIf="CONFIG.settingsConfig[setting.key].type === 'checkbox' "
                                    [componentId]="setting.key"
                                    name="{{setting.key}}"
                                    [(ngModel)]="systemSettings[setting.key].value">
                            </nx-checkbox>

                            <input *ngIf="CONFIG.settingsConfig[setting.key].type === 'number' " type="number"
                                   id="{{setting.key}}"
                                   name="{{setting.key}}"
                                   [(ngModel)]="systemSettings[setting.key].value"
                                   class="form-control input-sm"/>

                            <input *ngIf="CONFIG.settingsConfig[setting.key].type === 'text'" type="text"
                                   id="{{setting.key}}"
                                   name="{{setting.key}}"
                                   [(ngModel)]="systemSettings[setting.key].value"
                                   class="form-control input-sm"/>

                            <input *ngIf="CONFIG.settingsConfig[setting.key].type === 'password'" type="password"
                                   id="{{setting.key}}"
                                   name="{{setting.key}}"
                                   [(ngModel)]="systemSettings[setting.key].value"
                                   class="form-control input-sm"/>

                            <p *ngIf="CONFIG.settingsConfig[setting.key].type === 'static'"
                               class="form-control-static input-sm m-0 d-flex align-items-center">{{systemSettings[setting.key].value || 'empty'}}</p>
                        </div>

                        <div class="help-block"
                             *ngIf="CONFIG.settingsConfig[setting.key].alert"
                             [innerHTML]="CONFIG.settingsConfig[setting.key].alert">
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </nx-section>
</nx-block>
