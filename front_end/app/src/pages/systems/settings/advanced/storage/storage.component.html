<nx-block type="mt-3">
    <header><h4 translate>Storages</h4></header>
    <nx-section>
        <form
            class="form form-horizontal row"
            role="form"
            name="storageSettings"
            novalidate
        >
            <ng-container *ngFor="let storage of storages; index as i">
                <div class="form-group col-12 row">
                    <div
                        class="col-12 col-md-5 m-0 d-flex align-items-start justify-content-center flex-column item"
                    >
                        <div class="w-100">Url</div>
                    </div>
                    <div
                        class="col-12 col-md-7 d-flex align-items-start justify-content-center flex-column item"
                    >
                        <div class="w-100">
                            <input
                                type="text"
                                id="storageUrl{{ i }}"
                                name="storageUrl{{ i }}"
                                [(ngModel)]="storage.url"
                                class="form-control input-sm"
                            />
                        </div>
                    </div>
                </div>
                <div class="form-group col-12 row">
                    <div
                        class="col-12 col-md-5 m-0 d-flex align-items-start justify-content-center flex-column item"
                    >
                        <div class="w-100">Free Space</div>
                    </div>
                    <div
                        class="col-12 col-md-7 d-flex align-items-start justify-content-center flex-column item"
                    >
                        <div class="w-100">
                            <div class="progress progress-custom" 
                                title="Reserved: 30.00 GB, /nFree: 1.67 TB, /nOccupied: 117.83 GB, /nTotal: 1.79 TB">
                                <div class="progress-bar bg-info" role="progressbar" style="width: 50%" [attr.aria-valuenow]="storage.freeSpace" aria-valuemin="0" [attr.aria-valuemax]="storage.totalSpace"></div>
                                <div class="progress-label d-flex justify-content-center align-items-center progress-text">
                                    {{ friendlyBytes(storage.freeSpace) }} of {{ friendlyBytes(storage.totalSpace) }}
                                </div>
                              </div>
                            <!-- <input
                                type="text"
                                id="freeSpace{{ i }}"
                                name="freeSpace{{ i }}"
                                [(ngModel)]="storage.freeSpace"
                                class="form-control input-sm"
                            /> -->
                        </div>
                    </div>
                </div>
                <div *ngIf="storage.isWritable" class="form-group col-12 row">
                    <div
                        class="col-12 col-md-5 m-0 d-flex align-items-start justify-content-center flex-column item"
                    >
                        <div class="w-100">Reserved Space</div>
                    </div>
                    <div
                        class="col-12 col-md-7 d-flex align-items-start justify-content-center flex-column item"
                    >
                        <div class="w-100 input-group d-flex">
                            <input
                                type="number"
                                id="reservedSpace{{ i }}"
                                name="reservedSpace{{ i }}"
                                [(ngModel)]="storage.reservedSpace"
                                class="w-100 form-control input-sm ng-valid ng-not-empty ng-valid-min ng-valid-max ng-valid-required ng-touched ng-dirty ng-valid-number"
                            />
                        </div>
                    </div>
                </div>
                <div *ngIf="storage.isWritable" class="form-group col-12 row">
                    <div
                        class="col-12 col-md-5 m-0 d-flex align-items-start justify-content-center flex-column item"
                    >
                        <div class="w-100">Used for writing</div>
                    </div>
                    <div
                        class="col-12 col-md-7 d-flex align-items-start justify-content-center flex-column item"
                    >
                        <div class="w-100">
                            <nx-checkbox
                                componentId="isUsedForWriting{{ i }}"
                                name="isUsedForWriting{{ i }}"
                                [(ngModel)]="storage.isUsedForWriting"
                            >
                            </nx-checkbox>
                            <span *ngIf="storage.isUsedForWriting">Writing is enabled for this storage</span>
                            <span *ngIf="!storage.isUsedForWriting">Writing is disabled for this storage</span>
                        </div>
                    </div>
                </div>
                <div class="form-group col-12 row">
                    <div
                        class="col-12 col-md-5 m-0 d-flex align-items-start justify-content-center flex-column item"
                    >
                        <div class="w-100">StorageType</div>
                    </div>
                    <div
                        class="col-12 col-md-7 d-flex align-items-start justify-content-center flex-column item"
                    >
                        <div class="w-100">
                            <p
                                class="form-control-static input-sm m-0 d-flex align-items-center"
                            >
                                {{ storage.storageType }}
                            </p>
                        </div>
                    </div>
                </div>
                <div *ngIf="i !== storages.length - 1" class="border-top w-100 mb-3"></div>
            </ng-container>
        </form>
    </nx-section>
</nx-block>
