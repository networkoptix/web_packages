<nx-standard-server-component
        [isOffline]="isOffline"
        [system]="system"
        [storages]="emittedStorage"
        [selectedServer]="selectedServer">
</nx-standard-server-component>

<nx-server-storage-component
        [system]="system"
        (storageEmit)="updateStorage($event)"
        [serverId]="this.selectedServer?.id">
</nx-server-storage-component>

<nx-cloud-storage *ngIf="!CONFIG.isLocal && system?.canUserViewCloudStorage()" layout="simple" type="servers"></nx-cloud-storage>

<ng-container *ngIf="!isOffline && system && advanced">
        <nx-alert-block
        class="d-block mt-3"
        [iconSrc]="CONFIG.icons.dirNonStandard + 'error.svg'"
        [line1]="'Settings displayed below are advanced.' | translate"
        [line2]="'Changing them may cause server to work incorrectly.' | translate"
        [btnIconSrc]="CONFIG.icons.dir + 'eye_closed.svg'"
        [btnCaption]="'Hide Advanced Settings' | translate"
        (onAction)="hideAdvancedSettings()"></nx-alert-block>

        <nx-server-advanced-storage-component
                [system]="system"
                [serverId]="this.selectedServer?.id">
        </nx-server-advanced-storage-component>


        <nx-server-logger-component
                [system]="system"
                [serverId]="this.selectedServer?.id">
        </nx-server-logger-component>
</ng-container>
