<div class="row auth-visible">
    <div class="col-12 loader-div" *ngIf="!selectedServer">
        <nx-pre-loader type="wrapper"></nx-pre-loader>
    </div>
    <div class="col-12 server-info" *ngIf="selectedServer">
        <nx-block header-style="extended">
            <header>
                <div class="header-top-bar d-flex justify-content-between">
                    <div class="header-title">
                        <h2>{{ selectedServer.name }}</h2>
                        <span 
                            *ngIf="selectedServer.internalStatus"
                            [ngClass]="{
                                tag: true,
                                offline: serverOffline,
                                online: selectedServer.internalStatus === CONFIG.serverStatus.restarting
                                    || selectedServer.internalStatus === CONFIG.serverStatus.reseting,
                                checking: checking
                            }"
                        >
                            {{ selectedServer.shownStatus }}
                        </span>
                    </div>
                    <button class="check-status pr-0"
                        *ngIf="serverOffline"
                        (click)="checkStatus()">
                        <span [ngClass]="{ 'animate-rotation': checking }">
                            <svg-icon src="static/icons/reload.svg"
                                [applyCss]="true"></svg-icon>
                        </span>
                        <span class="ml-1" translate>Check Status</span>
                    </button>
                </div>
                <div class="header-table col-7">
                    <div class="header-table-cell">
                        <span class="mr-2 cell-title" translate>IP</span>
                        <span class="cell-ellipsis"></span>
                        <span class="col-9">{{ selectedServer.ip || '-' }}</span>
                    </div>
                    <div class="header-table-cell">
                        <span class="mr-2 cell-title" translate>OS</span>
                        <span class="cell-ellipsis"></span>
                        <span class="col-9">{{ selectedServer.osName || '-' }}</span>
                    </div>
                    <div class="header-table-cell">
                        <span class="mr-2 cell-title" translate>Version</span>
                        <span class="cell-ellipsis"></span>
                        <span class="col-9">{{ selectedServer.version || '-' }}</span>
                    </div>
                </div>
            </header>
            <nx-section>
                <div class="server-setting-buttons">
                    <div class="left setting-buttons">
                        <button 
                            class="btn btn-default"
                            (click)="renameServer()"
                            [disabled]="renameDisabled || !system.currentServerNotBusy || serverOffline"
                        >
                            <span class="ellipsis" translate>Rename</span>
                        </button>
                        <button 
                            class="btn btn-default"
                            (click)="restartServer()"
                            [disabled]="restartDisabled || !system.currentServerNotBusy || serverOffline"
                        >
                            <span class="ellipsis" translate>Restart</span>
                        </button>
                    </div>
                    <ng-container *ngIf="CONFIG.isWebAdmin || CONFIG.debugMode">
                        <div class="right setting-buttons">
                            <button 
                                class="btn btn-default"
                                (click)="detachServer()"
                                [disabled]="detachDisabled || !system.currentServerNotBusy || serverOffline"
                                *ngIf="system.servers.length > 1"
                            >
                                <span class="ellipsis" translate>Detach from the System</span>
                            </button>
                            <button 
                                class="btn btn-default"
                                (click)="resetServer()"
                                [disabled]="resetDisabled || !system.currentServerNotBusy || serverOffline"
                            >
                                <span class="ellipsis" translate>Reset to Defaults</span>
                            </button>
                        </div>
                    </ng-container>
                </div>
            </nx-section>
        </nx-block>
        <nx-block type="mt-3">
            <header>
                <h4 translate>Settings</h4>
            </header>
            <nx-section class="pl-3">
                <div class="d-flex align-items-center">
                    <span class="ellipsis mr-2" translate>Port</span>
                    <input 
                        class="port-input pl-2" 
                        type="number"
                        [min]="CONFIG.servers.port.min"
                        [max]="CONFIG.servers.port.max"
                        [(ngModel)]="ipPortWatcher.value"
                        (keydown)="storePreviousValue($event)"
                        (keyup)="validationCheckForInput()"
                        [disabled]="portChangeDisabled || !system.currentServerNotBusy || serverOffline"
                        (change)="onPortChange()"
                    >
                </div>
            </nx-section>
        </nx-block>
    </div>
</div>
