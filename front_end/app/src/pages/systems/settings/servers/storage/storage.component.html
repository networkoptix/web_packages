<nx-block type="mt-3">
    <header><h4 translate>Storage Locations</h4></header>
    <nx-section nonPadded>
        <div class="storage-container">
            <form class="form form-horizontal" role="form" name="storageSettings" novalidate>
                <table>
                    <thead>
                        <tr>
                            <th>Address</th>
                            <th>Total space</th>
                            <th>Free space</th>
                            <th>Reserved space</th>
                            <th>Type</th>
                            <th>&nbsp;</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="table-row-spacer"></tr>
                        <tr *ngFor="let storage of storages; index as i">
                            <td title="{{storage.url}}">{{storage.url}}</td>
                            <td>{{friendlyBytes( storage.totalSpace )}}</td>
                            <td>{{friendlyBytes( storage.freeSpace.bits )}}</td>
                            <td>
                                <input
                                        type="number"
                                        id="reservedSpace{{ i }}"
                                        name="reservedSpace{{ i }}"
                                        min="0"
                                        [max]="storage.maxReserve[storage.reservedSpace.uom]"
                                        [step]="storage.reservedSpace.uom === 'GB' ? 1 : 0.001"
                                        [(ngModel)]="storage.reservedSpace.unitsInCurrentUom"
                                        class="w-50 p-1 form-control input-sm ng-valid ng-not-empty ng-valid-min ng-valid-max ng-valid-required ng-touched ng-dirty ng-valid-number text-right"/>
                                <select id="reservedSpaceUnit{{ i }}" name="reservedSpaceUnit{{ i }}"
                                        [(ngModel)]="storage.reservedSpace.uom"
                                        class="form-control input-sm w-50" style="margin-left: -1px; background-color: white; min-width: 58px;">
                                    <option selected value="GB">GB</option>
                                    <option value="TB">TB</option>
                                </select>
                            </td>
                            <td>{{storage.storageType}}</td>
                            <td>
                                <nx-switch
                                        componentId="isUsedForWriting{{ i }}"
                                        name="isUsedForWriting{{ i }}"
                                        [(ngModel)]="storage.isUsedForWriting.value">
                                </nx-switch>
                            </td>
                        </tr>
                        <tr class="table-row-spacer"></tr>
                    </tbody>
                </table>
            </form>
        </div>
    </nx-section>
    <nx-section *ngIf="watchersChanged">
        <div class="col-12 p-0 d-flex">
            <nx-process-button
                    [process]="saveSettings"
                    [buttonText]="'Save' | translate"></nx-process-button>
            <button
                    class="btn btn-default ml-2"
                    (click)="resetWatchers()" translate>Cancel</button>
        </div>
    </nx-section>
</nx-block>
