<div class="row auth-visible">
    <nx-page-placeholder class="placeholder-section" type="NO_SETTINGS" *ngIf="isOffline && !selectedServer"></nx-page-placeholder>
    <div *ngIf="serverOffline || selectedServer?.internalStatus === CONFIG.servers.status.restarting || checking" class="col-12">
        <nx-alert-block
            *ngIf="serverOffline"
            type="error"
            id="server-offline"
            [iconSrc]="CONFIG.icons.dirNonStandard + 'error.svg'"
            [line1]="'Server offline' | translate"
            [btnIconSrc]="CONFIG.icons.dirNonStandard + 'reload.svg'"
            [btnCaption]="'Check Status' | translate"
            (onAction)="checkStatus()">
        </nx-alert-block>
        <nx-alert-block
            *ngIf="selectedServer.internalStatus === CONFIG.servers.status.restarting"
            type="info"
            id="restarting"
            [iconSrc]="CONFIG.icons.dirNonStandard + 'info-alerts.svg'"
            [line1]="'Restarting' | translate"
            [btnIconSrc]="CONFIG.icons.dirNonStandard + 'reload.svg'"
            [btnCaption]="'Check Status' | translate"
            (onAction)="checkStatus()">
        </nx-alert-block>
        <nx-alert-block
            *ngIf="checking"
            type="info"
            id="checking-active"
            [iconSrc]="CONFIG.icons.dirNonStandard + 'info-alerts.svg'"
            [line1]="'Checking' | translate"
            (onAction)="checkStatus()">
        </nx-alert-block>
    </div>
    <div class="col-12 placeholder-section" *ngIf="!isOffline && !serverLoaded">
        <nx-pre-loader ></nx-pre-loader>
    </div>
    <div class="col-12 server-info" *ngIf="selectedServer && serverLoaded">
        <nx-block header-style="extended">
            <header>
                <div class="header-top-bar">
                    <div class="header-title">
                        <h2 *ngIf="renameDisabled; else editableTitle" class="system-name mb-2">{{serverName}}</h2>
                        <ng-template #editableTitle >
                            <div class="d-flex align-items-center mb-2" [ngClass]="{ 'edit-mode': editMode }">
                                <div class="header-title">
                                    <h2 NxEditable
                                        #editTitle
                                        [(content)]="serverName"
                                        (contentChange)="handleNameChange($event)"
                                        (blur)="handleBlur()"
                                        (focus)="handleFocus()"
                                        id="editable-title"></h2>
                                </div>
                                <div class="edit-button" [ngClass]="{ 'd-none' : editMode }" (click)="editTitle.focus()">
                                    <img [src]="CONFIG.icons.dirNonStandard + 'edit.png'" width="20" height="20"/>
                                </div>
                            </div>
                        </ng-template>
                        <span
                                class="ml-0 ml-lg-2 mt-2 mt-lg-1"
                            *ngIf="selectedServer.internalStatus"
                            [ngClass]="{
                                tag: true,
                                offline: serverOffline,
                                online: selectedServer.internalStatus === CONFIG.servers.status.restarting
                                    || selectedServer.internalStatus === CONFIG.servers.status.resetting,
                                checking: checking
                            }">
                            {{ selectedServer.shownStatus }}
                        </span>
                    </div>
                    <!-- <div class="section-server-buttons d-flex flex-column flex-lg-row align-items-start align-items-lg-center"> -->
                        <button class="server-buttons"
                            *ngIf="serverOffline"
                            (click)="checkStatus()">
                            <span [ngClass]="{ 'animate-rotation': checking }">
                                <svg-icon nx-add-svg-src [src]="CONFIG.icons.dirNonStandard + 'reload.svg'"
                                    [applyCss]="true"></svg-icon>
                            </span>
                            <span class="ml-1" translate>Check Status</span>
                        </button>
                        <button *ngIf="canSeeInfo" class="server-buttons"
                            [routerLink]="fullInfoPath"
                            [queryParams]="{id: parsedServerId}">
                                <span>
                                    <svg-icon nx-add-svg-src [src]="CONFIG.icons.dirNonStandard + 'info.svg'"
                                        [applyCss]="true"></svg-icon>
                                </span>
                                <span class="ml-1" translate>Detailed Info</span>
                        </button>
                        <button *ngIf="canSeeInfo" class="server-buttons"
                                routerLink="/api-tool/{{system.id}}/{{parsedServerId}}">
                                <span>
                                    <svg-icon nx-add-svg-src [src]="CONFIG.icons.dirNonStandard + 'info.svg'"
                                              [applyClass]="true"></svg-icon>
                                </span>
                            <span class="ml-1" translate>API tool</span>
                        </button>
                    </div>
                <!-- </div> -->
                <div class="col-6 col-lg-4">
                    <nx-info-block [sectionsOrColumns]="[serverDetails] "></nx-info-block>
                </div>
            </header>
            <nx-section>
                <div class="server-setting-buttons">
                    <div class="left setting-buttons">
                        <button
                            class="btn btn-default"
                            (click)="restartServer()"
                            [disabled]="restartDisabled || serverUnavailable"
                        >
                            <span class="ellipsis" translate>Restart</span>
                        </button>
                    </div>
                    <div class="right setting-buttons">
                        <button
                            class="btn btn-default"
                            (click)="detachServer()"
                            [disabled]="detachDisabled || serverUnavailable"
                            *ngIf="(CONFIG.isLocal || betaMode) && system.servers.length > 1"
                        >
                            <span class="ellipsis" translate>Detach from the System</span>
                        </button>
                        <button
                            *ngIf="CONFIG.isLocal || betaMode"
                            class="btn btn-default"
                            (click)="resetServer()"
                            [disabled]="resetDisabled || serverUnavailable"
                        >
                            <span class="ellipsis" translate>Reset to Defaults</span>
                        </button>
                    </div>
                </div>
            </nx-section>
        </nx-block>
        <nx-block type="mt-3">
            <header>
                <h4 translate>Settings</h4>
            </header>
            <nx-section class="pl-3">
                <div class="server-settings">
                    <span class="ellipsis text-column" translate>Port</span>
                    <input
                        class="port-input pl-2"
                        type="number"
                        [min]="CONFIG.servers.port.min"
                        [max]="CONFIG.servers.port.max"
                        [(ngModel)]="ipPortWatcher.value"
                        (keydown)="storePreviousValue($event)"
                        (keyup)="validationCheckForInput()"
                        [disabled]="portChangeDisabled || serverUnavailable"
                        (change)="onPortChange()"
                    >
                    <ng-container *ngIf="dropdownStorages.length">
                        <span class="ellipsis text-column" translate>Analytics DB Storage</span>
                        <nx-select
                            id="system"
                            [ellipsisMargin]="true"
                            [stillLoading]="checkingForDataAnalytics"
                            [items]="dropdownStorages"
                            [selected]="selectedStorage"
                            (onSelected)="changeAnalyticsStorage($event)"></nx-select>
                        <ng-container *ngIf="systemStorageChosen">
                            <span></span>
                            <div class="error-label">
                                <p class="mb-0" translate>Analytics data can take up large amounts of space.</p>
                                <p class="mb-0" translate>We recommend to choose another locations for it instead of the system partition.</p>
                            </div>
                        </ng-container>
                    </ng-container>
                </div>
            </nx-section>
        </nx-block>
    </div>
</div>
