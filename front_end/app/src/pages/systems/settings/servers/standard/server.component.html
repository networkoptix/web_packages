<div class="row auth-visible">
    <nx-page-placeholder class="sectional-div server-placeholder" type="NO_SETTINGS" *ngIf="isOffline && !selectedServer"></nx-page-placeholder>
    <div class="col-12 sectional-div server-loader" *ngIf="!isOffline && !serverLoaded">
        <nx-pre-loader type="wrapper"></nx-pre-loader>
    </div>
    <div class="col-12 server-info" *ngIf="selectedServer && serverLoaded">
        <nx-block header-style="extended">
            <header>
                <div class="header-top-bar d-flex justify-content-start">
                    <div class="header-title">
                        <h2>{{ selectedServer.name }}</h2>
                        <span
                            *ngIf="selectedServer.internalStatus"
                            [ngClass]="{
                                tag: true,
                                offline: serverOffline,
                                online: selectedServer.internalStatus === CONFIG.servers.status.restarting
                                    || selectedServer.internalStatus === CONFIG.servers.status.reseting,
                                checking: checking
                            }">
                            {{ selectedServer.shownStatus }}
                        </span>
                    </div>
                    <button class="server-buttons pr-0"
                        *ngIf="serverOffline"
                        (click)="checkStatus()">
                        <span [ngClass]="{ 'animate-rotation': checking }">
                            <svg-icon nx-add-svg-src [src]="CONFIG.icons.dirNonStandard + 'reload.svg'"
                                [applyCss]="true"></svg-icon>
                        </span>
                        <span class="ml-1" translate>Check Status</span>
                    </button>
                    <button *ngIf="canSeeInfo" class="server-buttons pr-0"
                        [routerLink]="fullInfoPath"
                        [queryParams]="{id: parsedServerId}">
                            <span>
                                <svg-icon nx-add-svg-src [src]="CONFIG.icons.dirNonStandard + 'info.svg'"
                                    [applyCss]="true"></svg-icon>
                            </span>
                            <span class="ml-1" translate>Detailed Info</span>
                    </button>
                </div>
                <div class="col-4">
                    <nx-info-block [sectionsOrColumns]="[serverDetails]"></nx-info-block>
                </div>
            </header>
            <nx-section>
                <div class="server-setting-buttons">
                    <div class="left setting-buttons">
                        <button
                            class="btn btn-default"
                            (click)="renameServer()"
                            [disabled]="renameDisabled || serverUnavailable"
                        >
                            <span class="ellipsis" translate>Rename</span>
                        </button>
                        <button
                            class="btn btn-default"
                            (click)="restartServer()"
                            [disabled]="restartDisabled || serverUnavailable"
                        >
                            <span class="ellipsis" translate>Restart</span>
                        </button>
                    </div>
                    <div class="right setting-buttons">
                        <button
                            class="btn btn-default"
                            (click)="detachServer()"
                            [disabled]="detachDisabled || serverUnavailable"
                            *ngIf="system.servers.length > 1 && betaMode"
                        >
                            <span class="ellipsis" translate>Detach from the System</span>
                        </button>
                        <button
                            *ngIf="betaMode"
                            class="btn btn-default"
                            (click)="resetServer()"
                            [disabled]="resetDisabled || serverUnavailable"
                        >
                            <span class="ellipsis" translate>Reset to Defaults</span>
                        </button>
                    </div>
                </div>
            </nx-section>
        </nx-block>
        <nx-block type="mt-3">
            <header>
                <h4 translate>Settings</h4>
            </header>
            <nx-section class="pl-3">
                <div class="d-flex align-items-center">
                    <span class="ellipsis mr-2" translate>Port</span>
                    <input
                        class="port-input pl-2"
                        type="number"
                        [min]="CONFIG.servers.port.min"
                        [max]="CONFIG.servers.port.max"
                        [(ngModel)]="ipPortWatcher.value"
                        (keydown)="storePreviousValue($event)"
                        (keyup)="validationCheckForInput()"
                        [disabled]="portChangeDisabled || serverUnavailable"
                        (change)="onPortChange()"
                    >
                </div>
            </nx-section>
        </nx-block>
    </div>
</div>
