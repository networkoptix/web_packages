<nx-block class="d-block mt-3">
    <header>
        <h4 translate>Log settings</h4>
    </header>
    <nx-section>
        <form class="form" role="form" name="logLevelsForm" #logLevelsForm="ngForm" novalidate>
            <nx-pre-loader *ngIf="loading"></nx-pre-loader>
            <div *ngIf="!loading && !showLoggers" translate>System is offline. This information is not available.</div>
            <div *ngFor="let log of systemLoggers | keyvalue" class="form-group row">
                <label class="col-12 col-md-4 m-0 pr-0 d-flex align-items-center justify-content-end">{{log.key}} log level</label>
                <div class="col-11 col-md-8">
                    <nx-select [id]="log.key"
                               [name]="log.key"
                               [items]="loggerOptions"
                               [(ngModel)]="systemLoggers[log.key]"
                               [selected]="systemLoggers[log.key]"
                               [allowHTML]="true">
                    </nx-select>
                </div>
            </div>
        </form>
    </nx-section>
</nx-block>
