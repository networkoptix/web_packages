<div class="row auth-visible">
    <div class="col-12 loader-div" *ngIf="!selectedCamera">
        <nx-pre-loader type="wrapper"></nx-pre-loader>
    </div>
    <div class="col-12 camera-settings-info" *ngIf="selectedCamera">
        <nx-block header-style="extended">
            <header>
                <div class="header-top-bar d-flex justify-content-start">
                    <div class="header-title">
                        <h2>{{selectedCamera.name}}</h2>
                        <!-- <span
                            *ngIf="selectedServer.internalStatus"
                            [ngClass]="{
                                tag: true,
                                offline: serverOffline,
                                online: selectedServer.internalStatus === CONFIG.servers.status.restarting
                                    || selectedServer.internalStatus === CONFIG.servers.status.reseting,
                                checking: checking
                            }">
                            {{ selectedServer.shownStatus }}
                        </span> -->
                    </div>
                    <button class="camera-buttons pr-0"
                        *ngIf="true"
                        >
                        <span [ngClass]="{ 'animate-rotation': false }">
                            <svg-icon [src]="CONFIG.icons.dirNonStandard + 'reload.svg'"
                                [applyCss]="true"></svg-icon>
                        </span>
                        <span class="ml-1" translate>View</span>
                    </button>
                    <button class="camera-buttons pr-0"
                        [routerLink]="'fullInfoPath'"
                        [queryParams]="{id: 'parsedServerId'}"
                        >
                            <span>
                                <svg-icon [src]="CONFIG.icons.dirNonStandard + 'info.svg'"
                                    [applyCss]="true"></svg-icon>
                            </span>
                            <span class="ml-1" translate>Detailed Info</span>
                    </button>
                </div>
                <div class="d-flex justify-content-stretch align-items-start">
                    <nx-health-image [isPrimary]="true" [state]="selectedCamera.status" [url]="selectedCamera.previewUrl"></nx-health-image>
                    <div class="header-table col-7">
                        <div class="header-table-cell">
                            <span class="mr-2 cell-title" translate>Vendor</span>
                            <span class="cell-ellipsis"></span>
                            <span class="col-9">{{ selectedCamera.vendor || '-' }}</span>
                        </div>
                        <div class="header-table-cell">
                            <span class="mr-2 cell-title" translate>Model</span>
                            <span class="cell-ellipsis"></span>
                            <span class="col-9">{{ selectedCamera.model || '-' }}</span>
                        </div>
                        <div class="header-table-cell">
                            <span class="mr-2 cell-title" translate>IP Address</span>
                            <span class="cell-ellipsis"></span>
                            <span class="col-9">{{ selectedCamera.url || '-' }}</span>
                        </div>
                        <div class="header-table-cell">
                            <span class="mr-2 cell-title" translate>Server</span>
                            <span class="cell-ellipsis"></span>
                            <span class="col-9">{{ selectedCamera.parentName || '-' }}</span>
                        </div>
                    </div>
                </div>
            </header>
            <nx-section>
                the stuff
            </nx-section>
        </nx-block>
    </div>
</div>
