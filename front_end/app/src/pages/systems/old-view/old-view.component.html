<nx-pre-loader type="page" *ngIf="systemOnline === undefined; else stage"></nx-pre-loader>

<ng-template #stage>
    <div style="height: 100%; display: block;" #container *ngIf="systemOnline === true; else offline"></div>
</ng-template>

<ng-template #offline>
    <nx-page-placeholder
            type="OFFLINE"
            class="page-placeholder">
    </nx-page-placeholder>
</ng-template>
