<nx-pre-loader *ngIf="!initialized; else uninitialized"></nx-pre-loader>

<ng-template #uninitialized>

    <nx-page-placeholder
            *ngIf="initializedWithError; else primary"
            type="FAILED_TO_ACCESS_SYSTEM"
            class="page-placeholder">
    </nx-page-placeholder>

    <ng-template #primary>
        <div class="nx-view-sidebar" *ngIf="hasCameras; else noCameras">
            <media-server-list></media-server-list>
            <div class="sidebar-toggling-ear--wrapper"
                 [ngClass]="{ 'shown': isSidebarShown }"
                 (click)="handleSidebarTogglingEarClick()">
                <div class="sidebar-toggling-ear"></div>
            </div>
        </div>
        <router-outlet *ngIf="hasCameras"></router-outlet>
        <ng-template #noCameras>
            <div class="no-cameras-placeholder">No Cameras</div>
        </ng-template>
    </ng-template>
</ng-template>
