<div class="nx-camera-page" id="nx-camera-page" [ngClass]="{ fullscreen: isFullScreen }">
  <div class="camera-view" id="nx-camera-view">
    <div class="player-header">
      <div class="camera-name" [ngClass]="camera.status">
        <span class="name">{{ camera.name }}</span>
      </div>
      <div class="buttons">
        <div class="settings-toggler" (click)="toggleSettings()">
          <svg viewBox="0 0 36 36">
            <path class="st0" d="M34.7,23l-3.5-2c0.2-1,0.4-2,0.4-3s-0.1-2.1-0.4-3l3.5-2c0.5-0.3,0.6-0.9,0.4-1.4l-3-5.2
              c-0.3-0.5-0.9-0.6-1.4-0.4l-3.5,2C25.8,6.6,24,5.6,22,5V0.5C22,0.2,21.8,0,21.5,0h-7C14.2,0,14,0.2,14,0.5V5C12,5.6,10.2,6.6,8.7,8
              L5.3,6C4.8,5.8,4.2,5.9,3.9,6.4l-3,5.2c-0.3,0.5-0.1,1.1,0.4,1.4l3.5,2c-0.2,1-0.4,2-0.4,3s0.1,2.1,0.4,3l-3.5,2
              c-0.5,0.3-0.6,0.9-0.4,1.4l3,5.2c0.3,0.5,0.9,0.6,1.4,0.4l3.5-2c1.5,1.4,3.3,2.4,5.3,3.1v4.5c0,0.3,0.2,0.5,0.5,0.5h7
              c0.3,0,0.5-0.2,0.5-0.5V31c2-0.6,3.8-1.7,5.3-3.1l3.5,2c0.5,0.3,1.1,0.1,1.4-0.4l3-5.2C35.4,23.9,35.2,23.3,34.7,23z M18,25.6
              c-4.2,0-7.6-3.4-7.6-7.6s3.4-7.6,7.6-7.6s7.6,3.4,7.6,7.6S22.2,25.6,18,25.6z"/>
            </svg>
        </div>
        <div class="fullscreen-toggler" (click)="toggleFullScreen()">
          <svg viewBox="0 0 24 24">
            <path class="st0" d="M10,6V4H4v6h2V7.4l2.8,2.8l1.4-1.4L7.4,6H10z"/>
            <path class="st0" d="M18,16.6l-2.8-2.8l-1.4,1.4l2.8,2.8H14v2h6v-6h-2V16.6z"/>
            <path class="st0" d="M14,4v2h2.6l-2.8,2.8l1.4,1.4L18,7.4V10h2V4H14z"/>
            <path class="st0" d="M8.8,13.8L6,16.6V14H4v6h6v-2H7.4l2.8-2.8L8.8,13.8z"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="settings" [ngClass]="{ shown: settingsShown }">
      <div class="section qualitySelection">
        <div class="caption">Quality</div>
        <div class="options">
          <div class="option" [ngClass]="{ selected: qualitySelected === 'auto' }" (click)="setQuality('auto')">Auto</div>
          <div class="option" [ngClass]="{ selected: qualitySelected === 'low' }" (click)="setQuality('low')">Low</div>
          <!-- <div *ngFor="let q in qualitiesAvailable" class="option" [ngClass]="{ selected: qualitySelected === q }" (click)="setQuality(q)">{{ q }}</div> -->
        </div>
      </div>
    </div>
    <nx-camera-hls-player
      [system]="system"
      [camera]="camera"
      [startTime]="playbackStartTime"
      [quality]="qualitySelected"
      (playbackStarted)="onPlaybackStarted($event)"
    ></nx-camera-hls-player>
  </div>

  <div class="controls">
    <div
      class="play-pause-button"
      [ngClass]="{ playing: isPlaying, paused: !isPlaying }"
      (click)="onPlayPauseButtonClick()"
    ></div>
    <nx-camera-timeline
      [system]="system"
      [camera]="camera"
      (archivePlayRequest)="onArchivePlayRequest($event)"
      (livePlayRequest)="onLivePlayRequest($event)"
      [playbackStartedTime]="playbackStartedTime"
      (playbackTimeUpdate)="onPlaybackTimeUpdate($event)"
    ></nx-camera-timeline>
  </div>

  <div class="live-status-indicator"></div>
</div>
