<div class="timeline">
  <canvas
    #canvas
    (wheel)="canvasWheelHandler($event)"
    (mousemove)="canvasMouseMoveHandler($event)"
    (mouseenter)="canvasMouseEnterHandler($event)"
    (mouseleave)="canvasMouseLeaveHandler($event)"
    (mousedown)="canvasMouseDownHandler($event)"
    (mouseup)="canvasMouseUpHandler($event)"
  ></canvas>
  <time-under-mouse *ngIf="!hideTimeUnderMouse"></time-under-mouse>
  <timeline-scrollbar></timeline-scrollbar>
  <timeline-playback-indicator></timeline-playback-indicator>
  <!-- <timeline-selection></timeline-selection> -->
</div>
