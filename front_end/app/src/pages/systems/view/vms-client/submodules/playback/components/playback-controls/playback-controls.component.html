<div
    class="playback-control-button"
    [ngClass]="{
        'enabled': enabled,
        'play': btnClass === 'play' || (playback.livePaused$ | async),
        'pause': btnClass === 'pause' && !(playback.livePaused$ | async)
    }"
    (click)="handleClick()"
>
    <span class="glyph"></span>
</div>
