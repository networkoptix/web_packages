<div class="search-box">
  <div class="search-icon"></div>
  <input [placeholder]="'Search' | translate" (input)="onFilterTokenChange()" [(ngModel)]="token">
  <svg *ngIf="token" class="search-reset-icon" viewBox="0 0 20 20" (click)="resetSearch()">
    <line x1="5" x2="15" y1="5" y2="15"/>
    <line x2="5" x1="15" y1="5" y2="15"/>
  </svg>
  <div
    class="details-toggler"
    (click)="onIpVisibilityStateChange(!ipVisibilityState)"
    [ngClass]="{ active: ipVisibilityState }"
  >
    <svg viewBox="0 0 20 20">
      <circle cx="10" cy="9" r="7" class="outer-circle"/>
      <circle cx="10" cy="6" r="1" class="point-over-i"/>
      <line x1="10" x2="10" y1="8" y2="13" class="i-body"/>
    </svg>
  </div>
</div>
