<div class="button zoom-in" [ngClass]="{ 'enabled': !disabled && canZoomIn }" (mousedown)="startZooming(+1)" (mouseup)="stopZooming()">+</div>
<div class="button zoom-out" [ngClass]="{ 'enabled': !disabled && canZoomOut }" (mousedown)="startZooming(-1)" (mouseup)="stopZooming()" (dblclick)="fullZoomOut()">–</div>
