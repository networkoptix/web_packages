<div class="media-server-list">

  <nx-media-server-list-header
    (ipVisibilityStateChange)="updateShowIP($event)"
    (filterTokenChange)="updateFilteredList($event)"
  ></nx-media-server-list-header>

  <div class="server-list" [ngStyle]="{height : 'calc(100vh - 92px)'}">
    <div
      class="server"
      *ngFor="let server of mediaservers"
      [ngClass]="{
        'show-ip': showIP,
        'expanded': isServerExpanded[server.id],
        'online': server.status === 'Online',
        'offline': server.status === 'Offline',
        'empty': !server.cameras.length
      }"
    >
      <div class="server-name" (click)=changeServerVisibility(server.id)>
        <span class="name" [ngClass]="server.status" [innerHTML]="server.name | highlight:token"></span>
        <span class="ip-info" [innerHTML]="server.url | ip_info | highlight:token"></span>
        <svg-icon nx-add-svg-src
          [src]="CONFIG.icons.dir + (server.status === 'Offline' ? 'server_offline.svg' : 'server.svg')"
          [applyClass]="true"></svg-icon>
      </div>
      <div class="cameras">
        <a
          class="camera"
          *ngFor="let camera of server.cameras"
          [routerLink]="[camera.id]"
          [ngClass]="{
            online: camera.isOnline,
            live: camera.isLive,
            recording: camera.isRecording,
            hasArchive: camera.hasArchive,
            offline: !camera.isOnline,
            unauthorized: !camera.isAuthorized,
            isScheduleEnabled: camera.isScheduleEnabled,
            error: previewLoaded[camera.id] === -1,
            selected: camera.id === activeCameraId
          }"
        >
          <div class="preview">
            <nx-pre-loader class="preloader" *ngIf="camera.thumbnailUrl && !previewLoaded[camera.id]"></nx-pre-loader>
            <img *ngIf="camera.thumbnailUrl" [src]="camera.thumbnailUrl" (load)="handlePreviewLoaded(camera.id)" (error)="handlePreviewError(camera.id)">
            <svg-icon nx-add-svg-src
              *ngIf="!camera.isAuthorized || previewLoaded[camera.id] === -1 || !camera.isOnline"
              [src]="previewLoaded[camera.id] === -1
                ? '/static/images/icons/view/placeholder_preview_alert.svg'
                : CONFIG.icons.dir + 'cameras_list_placeholder_' + (!camera.isAuthorized ? 'unauthorized' : 'offline') + '.svg'"
              [applyClass]="true"></svg-icon>
          </div>
          <span class="name" [ngClass]="camera.status" [innerHTML]="camera.name | highlight:token"></span>
          <span class="ip-info" [innerHTML]="camera.url | ip_info | highlight:token"></span>
        </a>
      </div>
    </div>
  </div>
</div>
