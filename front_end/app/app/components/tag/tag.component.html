<a
    name="tag-{{ name }}"
    id="tag-{{ name }}"
    [ngClass]="[element, size, badgeType, locked ? 'static' : '']"
    [attr.href]="tagHref"
    (click)="clickChange(true)"
>
    <ng-content></ng-content>
    <span
        *ngIf="selected"
        class="close-button"
        (click)="$event.stopPropagation(); clickChange(false)"
    >
        <span class="glyphicon tag-close-icon"></span>
    </span>
</a>
