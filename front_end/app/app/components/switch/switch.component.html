<div
    [ngClass]="{ 'switch-with-label': label }"
    (click)="changeState()"
    [id]="componentId + '-wrapper'"
>
    <div class="switch position-relative">
        <label class="switch-element">
            <input
                type="checkbox"
                [ngClass]="{ selected: _value }"
                [id]="componentId"
                [name]="componentId"
                [attr.checked]="_value ? '' : null"
                (click)="preventBubbling($event)"
                [attr.disabled]="disabled ? '' : null"
            />
            <span
                class="slider round"
                [ngClass]="{ disable: disabled, 'show-warning': showWarning }"
            ></span>

            <div
                class="bar"
                [ngClass]="{ disable: disabled, 'show-warning': showWarning }"
            ></div>
            <div
                class="circle"
                [ngClass]="{ disable: disabled, 'show-warning': showWarning }"
            ></div>
        </label>
    </div>
    <h4
        *ngIf="label"
        class="pl-3 switch-label"
    >
        {{ label }}
    </h4>
</div>
