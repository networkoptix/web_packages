<div class="state-container">
    <div class="state-container--title"></div>
    <div class="state-container--body">
        <form
            #mergeForm="ngForm"
            name="mergeForm"
            novalidate
        >
            <div class="form-group">
                <nx-searchable-select
                    name="mergeDropdown"
                    componentId="mergeDropdown"
                    [form]="mergeForm"
                    [items]="items"
                    [(ngModel)]="remoteSystem"
                    [placeholder]="'Existing System URL (https://host:port)' | translate"
                    [noMatchMsg]="'No peers found' | translate"
                    [freeText]="true"
                    [validation]="urlRegex"
                    #mergeDropdown="ngModel"
                    required
                ></nx-searchable-select>
            </div>
            <div class="form-group">
                <input
                    name="userField"
                    id="userField"
                    class="form-control"
                    value="admin"
                    readonly
                    disabled
                />
            </div>
            <div class="form-group">
                <input
                    name="passwordField"
                    id="passwordField"
                    class="form-control"
                    type="password"
                    [(ngModel)]="password"
                    [placeholder]="'Password' | translate"
                    #passwordField="ngModel"
                    required
                />
            </div>
            <div class="mt-2">
                <ng-container *ngIf="mergeForm.touched && mergeForm.dirty && mergeForm.invalid">
                    <div
                        class="input-error"
                        translate
                    >
                        All fields are required
                    </div>
                </ng-container>
            </div>
        </form>
    </div>
</div>
