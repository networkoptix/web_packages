<div class="state-container">
    <div class="state-container--title"></div>
    <div class="state-container--body">
        <form
            #mergeForm="ngForm"
            name="mergeForm"
            novalidate
        >
            <div class="form-group">
                <nx-autocomplete
                    name="mergeDropdown"
                    style="text-align: left"
                    #mergeDropdown="ngModel"
                    [(ngModel)]="remoteSystemUrl"
                    (select)="setRemoteSystem($event)"
                    [placeholder]="'Existing System URL (https://host:port)'"
                    [noMatchesContent]="'No peers found'"
                    [validator]="urlRegex"
                    required
                >
                    @for (peer of peers; track peer.url) {
                        <nx-autocomplete-item
                            [value]="peer.url"
                            [searchBy]="peer.name + ' ' + peer.url"
                            >{{ peer.name }} - ({{ peer.url }})</nx-autocomplete-item
                        >
                    }
                </nx-autocomplete>
            </div>
            <div class="form-group">
                <input
                    name="userField"
                    id="userField"
                    class="form-control"
                    value="admin"
                    readonly
                    disabled
                />
            </div>
            <div class="form-group">
                <input
                    name="passwordField"
                    id="passwordField"
                    class="form-control"
                    type="password"
                    [(ngModel)]="password"
                    [placeholder]="'Password' | translate"
                    #passwordField="ngModel"
                    required
                />
            </div>
            <div class="mt-2">
                @if (mergeForm.touched && mergeForm.dirty && mergeForm.invalid) {
                    <p
                        class="paragraph input-error"
                        translate
                    >
                        All fields are required
                    </p>
                }
            </div>
        </form>
    </div>
</div>
