<div class="state-container">
    <div class="state-container--title"></div>
    <div class="state-container--body">
        <form
            name="setAdminPasswordForm"
            #setAdminPasswordForm="ngForm"
        >
            <div class="form-group">
                <input
                    id="adminName"
                    name="adminName"
                    class="form-control"
                    value="admin"
                    readonly
                    disabled
                />
            </div>
            <div class="form-group">
                <nx-password-input
                    name="createPassword"
                    componentId="createPassword"
                    class="form-component fs-exclude"
                    [(ngModel)]="password"
                    [placeholder]="'Password' | translate"
                    [component]="createPassword"
                    [form]="setAdminPasswordForm"
                    #createPassword="ngModel"
                    [setFocus]="true"
                ></nx-password-input>
            </div>
            <div class="form-group">
                <div class="position-relative">
                    <input
                        name="confirmPassword"
                        id="confirmedPassword"
                        class="form-control"
                        type="{{ passwordToggle ? 'password' : 'text' }}"
                        [(ngModel)]="confirmedPassword"
                        [placeholder]="'Repeat Password' | translate"
                        (blur)="checkPasswords()"
                        #confirmPassword="ngModel"
                        required
                    />
                    <span
                        class="input-group-addon position-absolute"
                        (click)="passwordToggle = !passwordToggle"
                        style="cursor: pointer"
                    >
                        <svg-icon
                            nx-add-svg-src
                            *ngIf="passwordToggle"
                            [src]="icons.dirTextButtons + 'eye_closed.svg'"
                            [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                            [applyClass]="true"
                        ></svg-icon>
                        <svg-icon
                            nx-add-svg-src
                            *ngIf="!passwordToggle"
                            [src]="icons.dirTextButtons + 'eye.svg'"
                            [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                            [applyClass]="true"
                        ></svg-icon>
                    </span>
                </div>

                <div class="mt-2">
                    <nx-password-input-validation
                        [forElement]="createPassword"
                        [value]="password"
                    >
                    </nx-password-input-validation>
                    <ng-container
                        *ngIf="
                            confirmPassword.invalid &&
                            ((confirmPassword.dirty && !confirmPassword.errors?.pattern) ||
                                confirmPassword.touched)
                        "
                    >
                        <div
                            class="input-error"
                            *ngIf="confirmPassword.errors.required"
                            translate
                        >
                            Password confirmation is required
                        </div>
                        <div
                            class="input-error"
                            *ngIf="confirmPassword.errors?.dontMatch"
                            translate
                        >
                            Passwords do not match
                        </div>
                    </ng-container>
                </div>
            </div>
        </form>
    </div>
</div>
