<div class="state-container">
    <div
        class="state-container--title"
        translate
    >
        Merge failed!
    </div>
    <div class="state-container--body">
        <div>
            <button
                class="btn btn-default"
                (click)="retry()"
                translate
            >
                Try again
            </button>
            <button
                class="btn btn-default"
                (click)="skip()"
                translate
            >
                Setup a separate System
            </button>
        </div>
    </div>
</div>
