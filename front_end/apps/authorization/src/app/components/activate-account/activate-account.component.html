<!-- <nx-pre-loader *ngIf=""></nx-pre-loader> -->
<header
    #activateHeader
    [ngClass]="{
        'header-d': viewType === 'desktop',
        'header-m': viewType === 'mobile',
        'd-none': (activated$ | async)
    }"
>
    <h3
        class="authorize-header"
        translate
    >
        Activate %CLOUD_NAME% Account
    </h3>
</header>
<main
    [ngClass]="{
        'main-w': viewType === 'web',
        'main-d': viewType === 'desktop',
        'main-m': viewType === 'mobile'
    }"
    [ngStyle]="{
        height: activateHeader ? 'calc(480px - ' + activateHeader.offsetHeight + 'px)' : '480px'
    }"
>
    <form #activateAccountForm="ngForm">
        <svg-icon
            nx-add-svg-src
            [src]="
                icons.dirSectionPlaceholder +
                ((activated$ | async) ? 'success' : 'mail') +
                (viewType === 'web' ? '' : '_desktop') +
                '_placeholder.svg'
            "
            [svgStyle]="{ 'width.px': '280', 'height.px': '120' }"
            [applyClass]="true"
            data-testid="accountActivatedIcon"
        ></svg-icon>
        <h3
            class="authorize-header mt-3 mb-2"
            data-testid="activationHeader"
        >
            {{ contentHeader$ | async | translate }}
        </h3>
        <div
            class="content-message"
            [ngClass]="{ 'fs-mask': !!loginEmail }"
            [innerHTML]="contentMessage$ | async | nxTranslate"
        ></div>
    </form>
    <footer
        [ngClass]="{
            'footer-w': viewType === 'web',
            'footer-d': viewType === 'desktop',
            'footer-m': viewType === 'mobile'
        }"
    >
        <div [ngClass]="{ 'd-none': (activated$ | async) }">
            <button
                class="btn text-button"
                type="button"
                (click)="setCurrentState.emit('email')"
                data-testid="btnActivateLogIn"
            >
                <span translate>Log In</span>
            </button>
        </div>
        <div
            class="right w-100"
            [ngClass]="{ 'd-none': !(activated$ | async) }"
        >
            <nx-process-button
                [form]="activateAccountForm"
                [process]="loginProcess"
                data-testid="accountActivatedLogin"
                buttonText="{{ 'Log In' | translate }}"
            >
            </nx-process-button>
        </div>
    </footer>
</main>
