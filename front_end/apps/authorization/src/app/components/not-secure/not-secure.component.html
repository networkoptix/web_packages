<!-- <nx-pre-loader *ngIf=""></nx-pre-loader> -->
<header
    #emailHeader
    [ngClass]="{ 'header-d': viewType === 'desktop', 'header-m': viewType === 'mobile' }"
>
    <svg-icon
        nx-add-svg-src
        [ngStyle]="{ 'minWidth.px': '320', 'minHeight.px': '80' }"
        [src]="
            icons.dirSectionPlaceholder +
            (environment.isLocal ? 'local_header' : 'cloud_header') +
            (viewType === 'web' ? '' : '_desktop') +
            '.svg'
        "
        [svgStyle]="{ 'width.px': '320', 'height.px': '80' }"
        [applyClass]="true"
    ></svg-icon>
    <h3
        class="authorize-header"
        translate
    >
        Log in to %CLOUD_NAME%
    </h3>
    <div
        class="authorize-subheader"
        *ngIf="loginEmail"
    >
        <span
            class="sub-header"
            translate
            >As</span
        >
        <span
            class="fs-mask for-account"
            [ngClass]="{ 'span-disabled': emailLocked }"
            (click)="!emailLocked && setCurrentState.emit('email')"
            >{{ loginEmail }}</span
        >
    </div>
</header>
<main
    [ngClass]="{
        'main-w': viewType === 'web',
        'main-d': viewType === 'desktop',
        'main-m': viewType === 'mobile'
    }"
    [ngStyle]="{ height: 'calc(480px - ' + emailHeader.offsetHeight + 'px)' }"
>
    <form class="text-center form">
        <p translate>We could not verify the redirect URL.</p>
        <br />
        <p
            [innerHTML]="
                LANG.authorize.notSecureText | translate: { redirectUrl: redirectUrl | escapeHTML }
            "
        ></p>
        <br />
        <p translate>Make sure your trust this URL.</p>
    </form>
    <footer
        [ngClass]="{
            'footer-w': viewType === 'web',
            'footer-d': viewType === 'desktop',
            'footer-m': viewType === 'mobile'
        }"
    >
        <div>
            <button
                class="btn text-button"
                type="button"
                (click)="next()"
            >
                <span translate>Accept the risks and continue</span>
                <svg-icon
                    nx-add-svg-src
                    [src]="icons.dir + 'arrow_right.svg'"
                    [svgStyle]="{ 'width.px': '20', 'height.px': '20' }"
                ></svg-icon>
            </button>
        </div>
    </footer>
</main>
