            width="128"
            height="128"
            viewBox="0 0 128 128"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >
            <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M45.606 55.8199L43.3583 56.1022C36.9553 56.9065 32 62.3777 32 69C32 76.1797 37.8203 82 45

                fill="#698796"
            />
            <circle
                cx="64"
                cy="64"
                r="46"
                stroke="#c22626"
                stroke-width="4"
            />
            <path
                d="M31 30L97 96"
                stroke="#D92A2A"
                stroke-width="4"
            />
        </svg>
        <div class="for-small">
            <button
                *ngIf="clientType === 'loginToWebadmin' && smallView"
                class="btn mobile-back-button"
                type="button"
                (click)="setCurrentState.emit('email')"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    x="0px"
                    y="0px"
                    width="36"
                    height="36"
                    viewBox="0 0 36 36"
                >
                    <path
                        class="fill-color-main"
                        display="block"
                        stroke-width="0"
                        d="M17.5,10H3.7l3.1-3.1C7,6.7,7,6.3,6.9,6.1S6.3,6,6.1,6.1l-4.4,4.4l4.4,4.4C6.2,15,6.4,15,
                          6.5,15s0.3,0,0.4-0.1 c0.2-0.2,0.2-0.5,0-0.7L3.7,11h13.8c0.3,0,0.5-0.2,0.5-0.5S17.8,10,17.5,10z"
                    />
                </svg>
            </button>
            <h3
                *ngIf="errorType !== 'maintenance'"
                class="h3 authorize-header mt-3 mb-2"
                translate
            >
                Cannot connect to %CLOUD_NAME%
            </h3>
            <h3
                *ngIf="errorType === 'maintenance'"
                class="h3 authorize-header mt-3 mb-2"
                translate
            >
                Maintenance
            </h3>
        </div>
        <p
            class="my-0"
            style="text-align: center"
            *ngIf="errorType === 'maintenance'"
        >
            <span
                class="d-block"
                [innerHTML]="LANG.maintenance.description | translateAndSplitText: 40"
            ></span>
        </p>
        <div style="margin-top: 26px">
            <nx-process-button
                buttonText="{{ 'Try Again' | translate }}"
                [process]="processTryAgain"
            >
            </nx-process-button>
        </div>
    </form>
    <footer
        *ngIf="['setupWizard', 'loginToWebadmin'].includes(clientType) && !smallView"
        [ngClass]="{
            'footer-w': viewType === 'web',
            'footer-d': viewType === 'desktop',
            'footer-m': viewType === 'mobile'
        }"
    >
        <div class="left">
            <button
                *ngIf="clientType === 'setupWizard'"
                class="btn text-button"
                (click)="setupNonCloudSystem()"
                type="button"
            >
                <span translate>Setup Non-cloud System</span>
            </button>
        </div>
        <div class="right">
            <button
                *ngIf="clientType === 'loginToWebadmin' && !smallView"
                class="btn text-button"
                type="button"
                (click)="setCurrentState.emit('email')"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    x="0px"
                    y="0px"
                    width="20"
                    height="20"
                    viewBox="0 0 20 20"
                >
                    <path
                        class="fill-color-main"
                        display="block"
                        stroke-width="0"
                        d="M17.5,10H3.7l3.1-3.1C7,6.7,7,6.3,6.9,6.1S6.3,6,6.1,6.1l-4.4,4.4l4.4,4.4C6.2,15,6.4,15,
                          6.5,15s0.3,0,0.4-0.1 c0.2-0.2,0.2-0.5,0-0.7L3.7,11h13.8c0.3,0,0.5-0.2,0.5-0.5S17.8,10,17.5,10z"
                    />
                </svg>
                <span translate>Back</span>
            </button>
        </div>
    </footer>
</main>
