<nx-app-toasts
    aria-live="polite"
    aria-atomic="true"
>
</nx-app-toasts>

<div
    class="authorize-main"
    data-testid="authorizeMain"
    [ngClass]="{
        'main-w': viewType === 'web',
        'main-d': viewType === 'desktop',
        'main-m': viewType === 'mobile'
    }"
>
    <div
        class="auth-window"
        [ngSwitch]="currentState"
        [ngClass]="{
            'window-w': viewType === 'web',
            'window-d': viewType === 'desktop',
            'window-m': viewType === 'mobile',
            'show-scrollbar': showScrollbar
        }"
    >
        <nx-authorize-not-secure-component
            *ngSwitchCase="AuthorizeState.notSecure"
            [viewType]="viewType"
            [emailLocked]="emailLocked"
            [loginEmail]="loginEmail"
            [redirectUrl]="initialData.redirect_uri"
            (setCurrentState)="setCurrentState($event)"
        ></nx-authorize-not-secure-component>
        <nx-authorize-email-component
            *ngSwitchCase="AuthorizeState.email"
            [clientType]="clientType"
            [viewType]="viewType"
            [(loginEmail)]="loginEmail"
            [emailProcess]="checkEmailProcess"
            [errorCode]="emailErrorCode"
            [reactivate]="reactivate"
            [isMobileClient]="isMobileClient"
            (setCurrentState)="setCurrentState($event)"
        ></nx-authorize-email-component>
        <nx-authorize-password-component
            *ngSwitchCase="AuthorizeState.password"
            [clientType]="clientType"
            [viewType]="viewType"
            [smallView]="windowSmallEnough"
            [loginEmail]="loginEmail"
            [emailLocked]="emailLocked"
            [(loginPassword)]="loginPassword"
            [passwordProcess]="loginProcess"
            [errorCode]="passwordErrorCode"
            (setCurrentState)="setCurrentState($event)"
        ></nx-authorize-password-component>
        <nx-authorize-create-account-component
            *ngSwitchCase="AuthorizeState.create"
            [viewType]="viewType"
            [smallView]="windowSmallEnough"
            [loginEmail]="loginEmail"
            [fromInvite]="fromInvite"
            [footerItems]="footerItems"
            [(accountInfo)]="accountInfo"
            [createAccountProcess]="createProcess"
            [errorCode]="createErrorCode"
            (setCurrentState)="setCurrentState($event)"
        ></nx-authorize-create-account-component>
        <nx-authorize-activate-account-component
            *ngSwitchCase="AuthorizeState.activate"
            [viewType]="viewType"
            [smallView]="windowSmallEnough"
            [loginEmail]="loginEmail"
            (setCurrentState)="setCurrentState($event)"
            [checkActivationProcess]="checkEmailProcess"
            [checkIfActivated]="checkIfActivated"
            [loginProcess]="loginPostExternalProcess"
            [activated$]="activated$"
            [fromEmail$]="fromEmail$"
        ></nx-authorize-activate-account-component>
        <nx-authorize-confirmation-component
            *ngSwitchCase="AuthorizeState.confirm"
            [viewType]="viewType"
            [clientType]="clientType"
            [confirm]="redirect"
        ></nx-authorize-confirmation-component>
        <nx-authorize-reset-request-component
            *ngSwitchCase="AuthorizeState.request"
            [viewType]="viewType"
            [smallView]="windowSmallEnough"
            [(confirm)]="confirmRequest"
            [(resetEmail)]="resetPasswordEmail"
            [loginEmail]="loginEmail"
            [resetRequestProcess]="resetRequestProcess"
            [errorCode]="resetRequestErrorCode"
            (setCurrentState)="setCurrentState($event)"
        ></nx-authorize-reset-request-component>
        <nx-authorize-reset-password-component
            *ngSwitchCase="AuthorizeState.reset"
            [viewType]="viewType"
            [confirm]="confirmReset"
            [loginEmail]="loginEmail"
            [(password)]="resetPassword"
            [newPasswordProcess]="resetPasswordProcess"
            [loginProcess]="loginPostExternalProcess"
            (setCurrentState)="setCurrentState($event)"
        ></nx-authorize-reset-password-component>
        <nx-authorize-auth-code-component
            *ngSwitchCase="AuthorizeState.auth"
            [viewType]="viewType"
            [clientType]="clientType"
            [smallView]="windowSmallEnough"
            [action]="action"
            [loginEmail]="loginEmail"
            [(code)]="authCode"
            [checkAuthCodeProcess]="checkAuthCodeProcess"
            [errorCode]="authCodeErrorCode"
            (setCurrentState)="setCurrentState($event)"
        ></nx-authorize-auth-code-component>
        <nx-authorize-backup-code-component
            *ngSwitchCase="AuthorizeState.backup"
            [viewType]="viewType"
            [clientType]="clientType"
            [smallView]="windowSmallEnough"
            [loginEmail]="loginEmail"
            [(code)]="backupCode"
            [checkBackupCodeProcess]="checkBackupCodeProcess"
            [errorCode]="backupCodeErrorCode"
            (setCurrentState)="setCurrentState($event)"
        ></nx-authorize-backup-code-component>
        <nx-bind-system-to-cloud
            *ngSwitchCase="AuthorizeState.bind"
            [systemName]="initialData.system_name"
            [viewType]="viewType"
            [code]="code"
            [redirectUri]="initialData.redirect_uri"
        ></nx-bind-system-to-cloud>
        <nx-show-404-authorize-component
            *ngSwitchCase="AuthorizeState.show404"
            [viewType]="viewType"
            (setCurrentState)="setCurrentState($event)"
        ></nx-show-404-authorize-component>
    </div>
    <div
        class="auth-overlay"
        *ngIf="errorDialog$.value"
    >
        <div
            class="auth-window"
            [ngClass]="{
                'window-w': viewType === 'web',
                'window-d': viewType === 'desktop',
                'window-m': viewType === 'mobile'
            }"
        >
            <nx-authorize-connect-error-component
                [clientType]="clientType"
                [viewType]="viewType"
                [smallView]="windowSmallEnough"
                [processTryAgain]="errorDialogProcess"
                [errorType]="errorType"
                (setCurrentState)="setCurrentState($event)"
            ></nx-authorize-connect-error-component>
        </div>
    </div>
    <div
        *ngIf="windowLargeEnough"
        class="auth-footer"
    >
        <nx-footer
            *ngIf="!newHeader; else newFooter"
            [oauth]="true"
            [center]="true"
        ></nx-footer>
        <ng-template #newFooter>
            <nx-nav-footer></nx-nav-footer>
        </ng-template>
    </div>
</div>
