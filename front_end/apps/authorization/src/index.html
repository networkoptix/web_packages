<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title></title>
        <base href="/">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no">

        <link rel="icon" href="static/images/favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="static/styles/skin.css" />
        <link rel="stylesheet" href="static/fonts/fonts.css"/>

        <style>
            /* immediate css */
            html[data-theme="light*"] {
                background-color: #EDF1F3;
            }

            html[data-theme="dark*"] {
                background-color : #0C1012;
            }
        </style>
    </head>
    <body>
        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const viewType = urlParams.get('view_type') ?? 'web';
            const language = urlParams.get('lang');
            if (viewType !== 'web' && ['desktop', 'mobile'].includes(viewType)) {
                document.body.classList.add(viewType === 'desktop' ? 'desktopBackground' : 'mobileBackground');
                document.querySelector('html').setAttribute('data-platform', viewType);
            } else {
                const themes = {
                    dark: '#0D0E0F',
                    light: '#F0F3F4',
                }
                const getCookieValue = (name) => (
                  document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)')?.pop() || ''
                )
                const themeCookie = getCookieValue('theme');
                const themeFromCookie = themeCookie in themes && themeCookie || 'auto';
                const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
                const theme = themeFromCookie === 'auto' ? systemTheme : themeFromCookie;
                document.querySelector('html').setAttribute('data-theme', theme);
                document.querySelector('body').style.backgroundColor = themes[theme];
            }
            if (language) {
                const payload = {
                    method: 'POST',
                    headers: {'content-type': 'application/json'},
                    body: JSON.stringify({ language })
                };
                fetch('/api/utils/language', payload);
            }
        </script>
        <nx-auth-app-root></nx-auth-app-root>
    </body>
</html>
