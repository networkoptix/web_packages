<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title></title>
        <base href="/">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no">

        <link rel="icon" href="static/images/favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="static/styles/skin.css" />
        <link rel="stylesheet" href="static/fonts/fonts.css"/>
    </head>
    <body>
        <script>
            const viewType = new URLSearchParams(window.location.search).get('view_type') ?? 'web';
            if (viewType !== 'web' && ['desktop', 'mobile'].includes(viewType)) {
                document.body.classList.add(viewType === 'desktop' ? 'desktopBackground' : 'mobileBackground');
            } else {
                const themes = {
                    dark: '#0D0E0F',
                    light: '#F0F3F4'
                }
                const themeFromStorage = window.localStorage.getItem('ngx-webstorage|loginstate') && window.localStorage.getItem('ngx-webstorage|theme')?.replaceAll('"', '')
                const localStorageTheme = themeFromStorage in themes && themeFromStorage;
                const storedTheme = localStorageTheme || 'auto';
                const systemTheme = this.window.matchMedia('(prefers-color-scheme: dark)') ? 'dark' : 'light'
                const theme = storedTheme === 'auto' ? systemTheme : storedTheme;
                document.querySelector('html').setAttribute('data-theme', theme);
                document.querySelector('body').style.backgroundColor = themes[theme];
            }
        </script>
        <nx-auth-app-root></nx-auth-app-root>
    </body>
</html>
