<h2>Books</h2>
<ngrx-demo-book-list
    class="book-list"
    [books]="books$ | async"
    (add)="onAdd($event)"
></ngrx-demo-book-list>

<h2>My Collection</h2>
<ngrx-demo-book-collection
    class="book-collection"
    [books]="bookCollection$ | async"
    (remove)="onRemove($event)"
>
</ngrx-demo-book-collection>
