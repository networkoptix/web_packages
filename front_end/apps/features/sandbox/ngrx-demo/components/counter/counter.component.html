<h1 translate>NGRX Demo :: Counter Component</h1>

<button
    (click)="increment()"
    translate
>
    Increment
</button>

<div>Current Count: {{ count$ | async }}</div>
<div>Squared: {{ countSquared$ | async }}</div>

<button
    (click)="decrement()"
    translate
>
    Decrement
</button>

<button
    (click)="reset()"
    translate
>
    Reset Counter
</button>
