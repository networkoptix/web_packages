<!doctype html>
<html
    class="no-js"
    data-theme-mode="dark"
>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <meta name="description" content="">

    <base href="/">

    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no">

    <link rel="icon" href="static/images/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="static/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="static/styles/skin.css" />
    <link rel="stylesheet" href="static/fonts/fonts.css" />


    <style>
        /* immediate css */
        html[data-theme="light*"] {
            background-color: #EDF1F3;
        }

        html[data-theme="dark*"] {
            background-color : #0C1012;
        }

        .app-placeholder {
            background-color: transparent;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-placeholder .placeholder-content {
            transform: none;
        }
    </style>
    <meta name="theme-color" content="#1976d2">
</head>

<body data-testid="body" class="loading">

    <noscript>
        Please, turn on JavaScript in your browser
    </noscript>

    <script type="application/javascript">
        if (/msie|trident|edge/.test(window.navigator.userAgent.toLowerCase())) {
            window.document.styleSheets[0].insertRule(`
                h1.nx-h1--vertical-margin {
                    font-family: "robotomedium", "Helvetica Neue", Helvetica, Arial, sans-serif;
                    color: #2B383F;
                }
            `)
            window.document.write('<div class="container d-flex flex-column">\n' +
                '<div class="jumbotron error-page" style="width: 60%; margin: 0 auto">\n' +
                '    <img alt="Maintenance is in progress picture" src="/static/images/placeholders/page/Wrong.svg">\n' +
                '</div>' +
                '    <h1 class="nx-h1--vertical-margin d-flex flex-column justify-content-center text-center" translate>Your browser is not supported</h1>\n' +
                '\n' +
                '    <div class="row">\n' +
                '        <h4 class="offset-1 col-10 offset-md-3 col-md-6 d-flex flex-column justify-content-center text-center" translate>\n' +
                '            We\'d recommend to install the latest versions of Google Chrome or Mozilla Firefox, but you can use any other modern web-browser.\n' +
                '        </h4>\n' +
                '    </div>\n' +
                '    <div class="d-flex flex-row justify-content-center mt-4">\n' +
                '        <a href="https://www.google.com/chrome/" target="_blank" class="btn btn-default" translate>Download Chrome</a>\n' +
                '        <a href="https://www.mozilla.org/" target="_blank" class="btn btn-default ml-2" translate>Download Firefox</a>\n' +
                '    </div>\n' +
                '</div>');
        } else {
            const themes = {
                dark: '#0D0E0F',
                light: '#F0F3F4',
            }
            const getCookieValue = (name) => (
              document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)')?.pop() || ''
            )
            const themeCookie = getCookieValue('theme');
            const themeFromCookie = themeCookie in themes && themeCookie || 'auto';
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
            const theme = themeFromCookie === 'auto' ? systemTheme : themeFromCookie;
            document.querySelector('html').setAttribute('data-theme', theme);
            document.querySelector('body').style.backgroundColor = themes[theme];
        }
    </script>

    <nx-app>
    </nx-app>

    <!-- Google Tag Manager -->
    <script async>
        const addTag = (w, d, s, l, i) => {
            if (i && i !== 'N/A') {
                w[l] = w[l] || [];
                w[l].push({
                    'gtm.start':
                        new Date().getTime(), event: 'gtm.js'
                });
                var f = d.getElementsByTagName(s)[0],
                    j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : '';
                j.async = true;
                j.src =
                    '//www.googletagmanager.com/gtm.js?id=' + i + dl;
                f.parentNode.insertBefore(j, f);
            }
        };
        fetch('/api/utils/settings')
            .then((res) => res.json())
            .then((data) => data && addTag(window, document, 'script', 'dataLayer', data?.googleTagManagerId?.trim()));
    </script>
    <!-- End Google Tag Manager -->

</body>

</html>
