{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <title></title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="{% static 'uppy/dist/uppy.min.css' %}" rel="stylesheet" />
    <script src="{% static 'uppy/dist/uppy.min.js' %}"></script>
  </head>
  <body>
    <button id="uppyModalOpener">Open Modal</button>
    <script>
      const uppy = new Uppy.Core({ debug: true, autoProceed: false })
        .use(Uppy.Dashboard, { trigger: "#uppyModalOpener" })
        .use(Uppy.Webcam, { target: Uppy.Dashboard })
        .use(Uppy.AwsS3Multipart, { companionUrl: "/api/upload" });

      uppy.on("success", (fileCount) => {
        console.log(`${fileCount} files uploaded`);
      });
    </script>
  </body>
</html>
