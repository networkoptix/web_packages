<style>
    .field-{{ widget.field_name }}, .field-{{ widget.field_name }} * {
        overflow: visible;
        color: unset;
    }

    .field-{{ widget.field_name }} .btn-group:not(.open) > ul.dropdown-menu {
        display: none;
    }

    .field-{{ widget.field_name }} .dropdown-menu > .active > a {
        background-image: none;
    }

    .field-{{ widget.field_name }} .dropdown-menu > li > a > label {
        display: block;
        width: 100%;
        height: 100%;
        line-height: 1.6;
    }

    .field-{{ widget.field_name }} .dropdown-menu > li > a > label:after {
        content: none;
    }

    .field-{{ widget.field_name }} .dropdown-menu > li > a > label input[type="checkbox"] {
        margin-top: 3px;
    }
</style>

{% include 'django/forms/widgets/select.html' %}

<script>
    (function ($) {
        $(document).ready(function () {
            $('#{{ widget.attrs.id }}').multiselect({{ widget.options_json | safe }});
        });
    })(django.jQuery);
</script>
