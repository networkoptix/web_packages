[tool.poetry]
name = "cloud-portal"
version = "23.2"
description = "Nx Cloud Portal"
authors = []
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "3.8.10"

[tool.poetry.group.prod]
optional = true

[tool.poetry.group.prod.dependencies]
asgiref = "3.5.2"
boto3 = "~1.9.132"
botocore = "1.12.253"
cssutils = "1.0.2"
Django = "4.1.2"
django-admin-tools = "0.9.2"
django_autocomplete_light = "3.9.4"
django-celery-beat = "2.4.0"
django_celery_results = "2.4.0"
django-cleanup = "5.1.0"
django-cors-headers = "3.7.0"
django_csv_exports = "1.0.5"
django-model-utils = "3.1.2"
django_mock_queries = "2.1.7"
django_nested_admin = "3.3.0"
django-npm = "1.0.0"
django-oauth-toolkit = "1.7.0"
django_proxy = "1.2.2"
django_push_notifications = "3.0.0"
django-redis = "5.2.0"
django_rest_hooks = "1.7.1"
django-silk = "5.0.1"
django-storages = "1.13.1"
django-tinymce = "3.5.0"
django_waffle = "2.2.1"
djangorestframework = "3.12.2"
drf_yasg = "1.20.0"
gunicorn = "20.0.4"
html2text = "2020.1.16"
html_sanitizer = "1.7.0"
htmlmin = "0.1.12"
importlib_metadata = "1.6.0"
inlinestyler = "0.2.1"
jsonfield = "3.1.0"
libsass = "0.20.1"
meilisearch = "0.17.0"
mistletoe = "0.7.2"
mysqlclient = "2.0.3"
MarkupSafe = "^1.1.1"
numpy="==1.22.0"
packaging = "~21.0"
pandas="==1.5.0"
Pillow = "9.0.1"
py = "1.10.0"
pystache = "0.6.0"
pytz = "2022.2.1"
PyYAML = "5.4"
redis = "4.4.4"
requests = "2.21.0"
"ruamel.yaml" = "0.17.21"
"ruamel.yaml.clib" = "0.2.6"
uvicorn = "0.18.3"
zenpy = "2.0.24"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
mock = "4.0.3"
model_bakery = "1.3.1"
pyfakefs = "4.5.1"
pytest = "6.2.4"
pytest-asyncio = "0.20.3"
pytest-cov = "2.12.1"
pytest-django = "4.3.0"
pytest-env = "0.6.2"
pytest-mock = "3.6.1"
moto = "^2"

[tool.poetry.group.front-build]
optional = true

[tool.poetry.group.front-build.dependencies]
cssutils = "1.0.2"
htmlmin = "0.1.12"
inlinestyler = "0.2.1"
nodeenv = "1.6.0"
PyYAML = "5.4"
pystache = "0.6.0"

[tool.poetry.group.local]
optional = true

[tool.poetry.group.local.dependencies]

[tool.poetry.group.piplicenses]
optional=true

[tool.poetry.group.piplicenses.dependencies]
pip-licenses = "4.2.0"

[[tool.poetry.source]]
name = "pypi-python3.8-alpine3.12"
url = "http://artifactory.us.nxteam.dev/artifactory/api/pypi/pypi-python3.8-alpine3.12/simple"
default = false
secondary = true


[[tool.poetry.source]]
name = "pypi-remote"
url = "http://artifactory.us.nxteam.dev/artifactory/api/pypi/pypi-remote/simple"
default = false
secondary = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
