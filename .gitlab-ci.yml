.fail-on:
  image: ${DJANGO_PYTHON_IMAGE}:${DJANGO_PYTHON_IMAGE_TAG}
  stage: fail-fast
  interruptible: true
  variables:
    CANCEL_ENDPOINT: "${CI_API_V4_URL}/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/cancel"
    CANCEL_HEADER: "PRIVATE-TOKEN:$CANCEL_PIPELINE_ACCESS_TOKEN"
  allow_failure: true
  script:
    - cd cloud
    - /usr/local/bin/python -m pip install --upgrade pip==23.2.1
    - /usr/local/bin/python -m pip install discord.py
    - cd bots
    - python y_u_no_pipeline_bot.py
    - echo "Canceling jobs still running on pipeline"
    - curl --request POST --header $CANCEL_HEADER $CANCEL_ENDPOINT

.fail-on-backend:
  extends: .fail-on
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - cloud/**/*
      when: on_failure

.fail-on-frontend:
  extends: .fail-on
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - front_end/**/*
      when: on_failure

on-other-frontend-checks:
  extends: .fail-on-frontend
  needs: ["other-frontend-checks"]

on-frontend-builds:
  extends: .fail-on-frontend
  needs: ["frontend-builds"]

on-frontend-tests:
  extends: .fail-on-frontend
  needs: ["frontend-tests"]

on-jenkins-builds:
  extends: .fail-on-frontend
  needs: ["jenkins-build-frontend"]

on-django-checks:
  extends: .fail-on-backend
  needs: ["django-checks"]

on-django-tests-slow:
  extends: .fail-on-backend
  needs: ["django-unit-test-slow"]

on-django-tests-fast:
  extends: .fail-on-backend
  needs: ["django-unit-test-fast"]

