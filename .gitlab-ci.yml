image: nx/ci:1.20

include:
  - project: "dev/ci"
    file: "pipelines/infra-templates.yml"
  - project: "dev/ci"
    file: "pipelines/secrets.yml"
  - local: "ci/Docker/**/.gitlab-ci.yml"

default:
  tags:
    - service

variables:
  JENKINS_JOB_LOG: "true"
  JUNKSHOP_ENABLED: "false"

workflow:
  rules:
    - if: $CI_PROJECT_NAMESPACE != "dev"
      when: never
    # Enable for merge requests.
    - if: $CI_MERGE_REQUEST_ID
    # Enable for protected branch.
    - if: $CI_COMMIT_REF_PROTECTED
    - when: never

stages:
  - pre-build
  - docker image
  - check
  - build
  - test
  - fail-fast

.retries:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
#
.frontend-changes:
  extends: .retries
  needs:
    - job: docker:build-node-chrome
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - front_end/**/*

.get_target_branch_script:
  script:
  - set -e
  - if [[ "$CI_COMMIT_REF_PROTECTED" == "true" ]]; then
  -   TARGET_BRANCH_NAME=${CI_COMMIT_REF_NAME}
  - else
  -   TARGET_BRANCH_NAME=$(get_target_protected_branch.py
        --gitlab-server-url=${CI_SERVER_URL}
        --gitlab-token="${GITLAB_API_TOKEN}"
        --project-id=${CI_PROJECT_ID}
        --merge-request-iid=${CI_MERGE_REQUEST_IID})
  - fi

no-changes:
  extends: .retries
  rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        changes:
            - cloud/**/*
            - front_end/**/*
        when: never
  stage: check
  script:
    - echo "If this is the only job that runs then no changes were made that requires the pipeline"

.backend-changes:
  extends: .retries
  needs:
    - job: docker:build-django-python
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - cloud/**/*

.django-python:
  extends: .backend-changes
  image: ${DJANGO_PYTHON_IMAGE}:${DJANGO_PYTHON_IMAGE_TAG}
  needs:
    - job: docker:build-django-python
      optional: true
  services:
    - name: mysql:5.7
      alias: mysql
    - name: redis:3.2.8-alpine
      alias: redis
  variables:
    TESTING: "true"
    MYSQL_DATABASE: "cloudportal"
    MYSQL_ROOT_PASSWORD: ""
    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    MYSQL_PASSWORD: ""
  before_script:
    - cd cloud
    - echo "Waiting for mysql server to be ready"
    - >
      for i in {1..60}; do
        if ! mysql --host=mysql -u root -e ";"
        then
          if [ $i == 60 ]
          then
            echo "Could not connect to mysql server after 60 attempts"
            exit 1
          else
            echo "Attempt $i to connect to mysql server failed"
          fi
        else
          echo "Attempt $i Successfully connected to mysql server"
          break
        fi

        sleep 5
      done

.django-unit-test:
  extends: .django-python
  stage: test
  coverage: /^TOTAL.+?(\d+\%)$/

django-checks:
  extends: .backend-changes
  image: ${DJANGO_PYTHON_IMAGE}:${DJANGO_PYTHON_IMAGE_TAG}
  stage: check
  variables:
    USE_SQLITE: "true"
  script:
    - cd cloud
    - if ! python manage.py makemigrations --dry-run --check ; then echo Missing above migrations && exit 1 ; fi
    - if ! python manage.py check ; then echo System check failed && exit 1 ; fi

django-unit-test-slow:
  extends: .django-unit-test
  artifacts:
    when: always
    reports:
      junit: cloud/slow-report.xml
      coverage_report:
        coverage_format: cobertura
        path: cloud/slow-coverage.xml
  script:
    - pytest -m "not integration" -m slow --create-db --junitxml=slow-report.xml --cov="." --cov-report xml:slow-coverage.xml --cov-report term

django-unit-test-fast:
  extends: .django-unit-test
  artifacts:
    when: always
    reports:
      junit: cloud/fast-report.xml
      coverage_report:
        coverage_format: cobertura
        path: cloud/fast-coverage.xml
  script:
    - pytest -m "not integration" -m "not slow" --create-db --junitxml=fast-report.xml --cov="." --cov-report xml:fast-coverage.xml --cov-report term

.frontend-node:
  extends: .frontend-changes
  image: ${NODE_JS_IMAGE}:${NODE_JS_IMAGE_TAG}

all-frontend-checks:
  extends: .frontend-node
  variables:
    CHROME_BIN: /usr/bin/google-chrome
  stage: check
  artifacts:
    paths:
      - logs/**/*
    reports:
      junit:
        - front_end/reports/*/*.xml
      coverage_report:
        coverage_format: cobertura
        path: front_end/coverage/cobertura-coverage.xml
  script:
   - |
    echo "Running all frontend checks"
    log_folder="$PWD/logs"
    status_codes=()
    exit_code="0"

    mkdir -p "$log_folder"

    run_background_task() {
        echo "Starting $2: $1"
        $1 1> "$log_folder/$2.log" 2>&1 & status_codes+=("$2 exit code: $?")
    }

    # Start background tasks
    echo "Starting tasks in the background"

    run_background_task "npx recursive-check-licenses -a licenses_whitelist.json -e licenses_excluded_packages.json -ci true" "license_check"

    pushd "ci"
        run_background_task "./nx_mentions.sh" "nx_mentions"
    popd

    pushd "front_end"
        echo "Installing node_modules"
        npm ci
        pushd "eslint-plugin-nx"
            npm ci
        popd
        run_background_task "npm run lang-ci-check" "lang_check"
        run_background_task "npm run lint:ci" "lint_ci"
        run_background_task "npm run test:ci" "test_ci"
        pushd "eslint-plugin-nx"
            npm ci
            run_background_task "npm run build-check" "eslint_plugin_build_check"
            echo "Installing eslint-plugin-nx node_modules"
            run_background_task "npm run test" "eslint_plugin_test"
        popd
    popd

    echo "Waiting for background tasks to complete"

    wait

    # Display results
    for status in "${status_codes[@]}"; do
      echo "$status"

      code=${status##*:}

      if [ ! "$code" = ' 0' ]; then
        exit_code="1"
      fi
    done

    # TODO: Merge coverage
    # pushd "front_end"
    #   pushd "coverage"
    #     merge_coverage_reports="npx -y cobertura-merge -o cobertura-coverage.xml"

    #     echo "merging coverage reports"

    #     for coverage_file in **/cobertura-coverage.xml; do
    #         dir="$(dirname $coverage_file)""
    #         project=$(echo "$dir" | cut -d "/" -f1)
    #         moved_coverage="$project.xml"
    #         cp "$coverage_file" "$moved_coverage"
    #         merge_coverage_reports+=" $project=$moved_coverage"
    #     done

    #     eval "$merge_coverage_reports"
    #   popd
    # popd

    exit "$exit_code"

all-builds:
  extends: .frontend-changes
  stage: build
  image: nx/ci
  tags:
  - ru-moscow
  artifacts:
    paths:
      - logs/**/*
  secrets:
    JENKINS_API_TOKEN_FILE: !reference [.tokens, secrets, JENKINS_API_TOKEN_FILE]
  script:
    - mkdir logs
    - SOME_BUILD_FAILED=false
    - echo "Running webadmin and frontend builds in parallel"
    - runJenkinsJob.sh gitlab.vms.review.webadmin.build
      "BUILD_DESCRIPTION=$CI_COMMIT_TITLE"
      "GITLAB_BRANCH=$CI_COMMIT_REF_NAME"
      "GITLAB_COMMIT=$CI_COMMIT_SHORT_SHA"
      "GITLAB_PIPELINE_URL=$CI_PIPELINE_URL"
      "GITLAB_JOB_ID=$CI_JOB_ID"
      "GITLAB_JOB_PROJECT=$CI_PROJECT_PATH"
      "GITLAB_JOB_URL=$CI_JOB_URL" 1> logs/webadmin.log 2>&1  & WEBADMIN_EXIT="$?"
    - runJenkinsJob.sh gitlab.cloud.frontend
      "PUSH_TO_ARTIFACTORY=true"
      "BRANCH=$TARGET_BRANCH_NAME"
      "BUILD_IDENTITY=$CI_PIPELINE_ID"
      "GITLAB_BRANCH=$CI_COMMIT_REF_NAME"
      "GITLAB_COMMIT=$CI_COMMIT_SHORT_SHA"
      "GITLAB_PIPELINE_URL=$CI_PIPELINE_URL"
      "GITLAB_JOB_ID=$CI_JOB_ID"
      "GITLAB_JOB_PROJECT=$CI_PROJECT_PATH"
      "GITLAB_JOB_URL=$CI_JOB_URL"
      "REVISION=$CI_COMMIT_SHORT_SHA" 1> logs/frontend.log 2>&1 & FRONTEND_EXIT="$?"
    - wait
    - if [ "$WEBADMIN_EXIT" != "0" ]; then SOME_BUILD_FAILED=true && echo "Webadmin build failed $WEBADMIN_EXIT"; else echo "Webadmin build successful"; fi
    - if [ "$FRONTEND_EXIT" != "0" ]; then SOME_BUILD_FAILED=true && echo "Frontend build failed $FRONTEND_EXIT"; else echo "Frontend build successful"; fi
    - if $SOME_BUILD_FAILED; then exit 1; fi

wheel-uploader:
  extends: .retries
  stage: pre-build
  script:
    - mkdir ~/.nxcloud
    - >
      echo "auth: $NXCLOUD_UTIL_SERVICE_AUTH" > ~/.nxcloud/config.yaml
    - curl -L hdw.mx/linux/nxcloud | tee ./nxcloud > /dev/null && chmod +x ./nxcloud
    - cat cloud/requirements.txt | ./nxcloud runCommand UploadWheels
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - cloud/requirements.txt


.fail-on:
  image: ${DJANGO_PYTHON_IMAGE}:${DJANGO_PYTHON_IMAGE_TAG}
  stage: fail-fast
  variables:
    CANCEL_ENDPOINT: "${CI_API_V4_URL}/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/cancel"
    CANCEL_HEADER: "PRIVATE-TOKEN:$CANCEL_PIPELINE_ACCESS_TOKEN"
  allow_failure: true
  script:
    - cd cloud
    - /usr/local/bin/python -m pip install --upgrade pip
    - /usr/local/bin/python -m pip install discord.py
    - cd bots
    - python y_u_no_pipeline_bot.py
    - echo "Canceling jobs still running on pipeline"
    - curl --request POST --header $CANCEL_HEADER $CANCEL_ENDPOINT

.fail-on-backend:
  extends: .fail-on
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - cloud/**/*
      when: on_failure

.fail-on-frontend:
  extends: .fail-on
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - front_end/**/*
      when: on_failure

on-all-frontend-checks:
  extends: .fail-on-frontend
  needs: ["all-frontend-checks"]

on-all-builds:
  extends: .fail-on-frontend
  needs: ["all-builds"]

on-django-checks:
  extends: .fail-on-backend
  needs: ["django-checks"]

on-django-tests-slow:
  extends: .fail-on-backend
  needs: ["django-unit-test-slow"]

on-django-tests-fast:
  extends: .fail-on-backend
  needs: ["django-unit-test-fast"]

on-wheel-upload:
  extends: .fail-on
  needs: ["wheel-uploader"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - cloud/requirements.txt
      when: on_failure

.hooker:
  image: ${DJANGO_PYTHON_IMAGE}:${DJANGO_PYTHON_IMAGE_TAG}
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    CANCEL_ENDPOINT: "${CI_API_V4_URL}/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/cancel"
    CANCEL_HEADER: "PRIVATE-TOKEN:$CANCEL_PIPELINE_ACCESS_TOKEN"
  allow_failure: true
  before_script:
    - cd cloud
    - /usr/local/bin/python -m pip install --upgrade pip
    - /usr/local/bin/python -m pip install discord-webhook
    - /usr/local/bin/python -m pip install gql
    - /usr/local/bin/python -m pip install aiohttp
    - cd bots

y-u-no-review:
  extends: .hooker
  script:
    - python y_u_no_review_bot.py

check-python-licenses:
  image: ${DJANGO_PYTHON_IMAGE}:${DJANGO_PYTHON_IMAGE_TAG}
  stage: check
  needs:
    - job: docker:build-django-python
      optional: true
  artifacts:
    paths:
      - cloud/ci-license.json
    when: on_failure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - cloud/**/requirements.txt
        - build_scripts/**/requirements.txt
  script:
#    - /usr/local/bin/python -m pip install -r cloud/requirements.txt
    - /usr/local/bin/python -m pip install pip-licenses
    - ./cloud_helper.sh update_requirements_licenses

fail-on-python-license-check:
  extends: .fail-on
  needs: [check-python-licenses]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - cloud/**/requirements.txt
        - build_scripts/**/requirements.txt
      when: on_failure
