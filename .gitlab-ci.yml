.hooker:
  image: ${DJANGO_PYTHON_IMAGE}:develop${DJANGO_PYTHON_IMAGE_TAG}
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    CANCEL_ENDPOINT: "${CI_API_V4_URL}/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/cancel"
    CANCEL_HEADER: "PRIVATE-TOKEN:$CANCEL_PIPELINE_ACCESS_TOKEN"
  allow_failure: true
  before_script:
    - cd cloud
    - /usr/local/bin/python -m pip install --upgrade pip==23.2.1
    - /usr/local/bin/python -m pip install gql
    - /usr/local/bin/python -m pip install aiohttp
    - cd bots

y-u-no-review:
  extends: .hooker
  script:
    - python y_u_no_review_bot.py

check-python-licenses:
  image: ${DJANGO_PYTHON_IMAGE}:${DJANGO_PYTHON_IMAGE_TAG}
  stage: check
  needs:
    - job: docker:build-django-python
# Docker must be rebuilt before licenses check
      optional: false
# Does not produce artifacts anymore, see job logs
#  artifacts:
#    paths:
#      - cloud/ci-license.json
#    when: on_failure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - cloud/**/requirements.txt
        - build_scripts/**/requirements.txt
        - cloud/**/pyproject.toml
        - cloud/**/poetry.lock
        - cloud/**/poetry.toml
        - cloud/**/allowed_licenses.txt
  script:
#    - /usr/local/bin/python -m pip install -r cloud/requirements.txt
    - /usr/local/bin/python -m pip install pip-licenses
    - ./cloud_helper.sh check_licenses

fail-on-python-license-check:
  extends: .fail-on
  needs: [check-python-licenses]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - cloud/**/requirements.txt
        - build_scripts/**/requirements.txt
        - cloud/**/pyproject.toml
        - cloud/**/poetry.lock
        - cloud/**/poetry.toml
        - cloud/**/allowed_licenses.txt
      when: on_failure

.cp-backend-changes:
  extends: .retries
  needs:
    - job: docker:build-channel-partners
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - channel_partners/src/**/*
        - channel_partners/build/channel_partners_ci/**/*
        - channel_partners/poetry.toml
        - channel_partners/poetry.lock
        - channel_partners/pyproject.toml
  before_script:
    - poetry -C /builds/dev/cloud_portal/channel_partners export --with test --without-hashes --without-urls -o /app/requirements.txt
    - pip install --upgrade --no-cache-dir -r /app/requirements.txt

cp-checks:
  extends: .cp-backend-changes
  image: ${CP_DJANGO_PYTHON_IMAGE}:${CP_DJANGO_PYTHON_IMAGE_TAG}
  stage: check
  variables:
    USE_SQLITE: "true"
    PYTHONPATH: "/builds/dev/cloud_portal/common/python"
  script:
    - cd channel_partners/src
    - echo "Running safety check in $(pwd)"
    - python -m pip install safety==2.3.5
#    - if ! python safety-check.py ; then echo PIP packages need to be updated && exit 1 ; fi
    - if ! python manage.py makemigrations --dry-run --check ; then echo Missing above migrations && exit 1 ; fi
    - if ! python manage.py check ; then echo System check failed && exit 1 ; fi

.cp-django-python:
  extends: .cp-backend-changes
  image: ${CP_DJANGO_PYTHON_IMAGE}:${CP_DJANGO_PYTHON_IMAGE_TAG}
  needs:
    - job: docker:build-channel-partners
      optional: true
  services:
    - name: postgres:15.3-bullseye
      alias: postgres-cp
    - name: redis:5.0.6
      alias: redis-cp
      command:
        - redis-server
        - --databases 32
  variables:
    TESTING: "true"
    PYTHONPATH: "/builds/dev/cloud_portal/common/python"
    POSTGRES_USER: channel
    POSTGRES_PASSWORD: partners
    POSTGRES_DB: channel_partners
    POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'


.cp-unit-test:
  extends: .cp-django-python
  stage: test
  coverage: /^TOTAL.+?(\d+\%)$/

cp-unit-test-fast:
  extends: .cp-unit-test
  artifacts:
    when: always
    reports:
      junit: channel_partners/src/fast-report.xml
      coverage_report:
        coverage_format: cobertura
        path: channel_partners/src/fast-coverage.xml
