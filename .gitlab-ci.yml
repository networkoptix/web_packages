cp-checks:
  extends: .cp-django-python
  stage: check
  variables:
    PYTHONPATH: "/builds/dev/cloud_portal/common/python"
    INSTANCE_NAME: test
  script:
    - env
    - cd channel_partners/src
    - echo "Running safety check in $(pwd)"
    - python -m pip install safety==2.3.5
#    - if ! python safety-check.py ; then echo PIP packages need to be updated && exit 1 ; fi
    - if ! python manage.py makemigrations --dry-run --check ; then echo Missing above migrations && exit 1 ; fi
    - if ! python manage.py check ; then echo System check failed && exit 1 ; fi



.cp-unit-test:
  extends: .cp-django-python
  stage: test
  coverage: /^TOTAL.+?(\d+\%)$/

cp-unit-test-fast:
  extends: .cp-unit-test
  artifacts:
    when: always
    reports:
      junit: channel_partners/src/fast-report.xml
      coverage_report:
        coverage_format: cobertura
        path: channel_partners/src/fast-coverage.xml
  script:
    - cd channel_partners/src
    - echo "Running safety check in $(pwd)"
    - pytest -m "not integration and not slow" --create-db --junitxml=fast-report.xml --cov="." --cov-report xml:fast-coverage.xml --cov-report term


cp-lint:
  extends: .cp-django-python
  stage: check
  script:
    - cd /builds/dev/cloud_portal/channel_partners/
    - echo "Checking relative and starred imports, removing unused imports."
    - ruff check --fix src/
    - echo "Checking imports sorting and grouping."
    - isort /builds/dev/cloud_portal/channel_partners/
    - COMMIT_MESSAGE="CPS lint auto fixed"
    - !reference [".commit-changes", "script"]

approval-check:
  stage: check
  image: ${CP_DJANGO_PYTHON_IMAGE}:${CP_IMAGE_VERSION}
  rules:
    - if: !reference [ .enable_for_mr ]
  script:
    - |
        REACTIONS=$(curl -s --header "PRIVATE-TOKEN: $CANCEL_PIPELINE_ACCESS_TOKEN" "https://gitlab.nxvms.dev/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/award_emoji")

        echo "Reactions: $REACTIONS"

        # Check if the MR is robocat cherry pick
        if echo $REACTIONS  | grep -q '"name":"fast_forward","user":{"id":78'; then
          echo "MR is robocat cherry pick and has fast_forward reaction. Auto approving."
        else
          git config user.email "$GITLAB_USER_EMAIL"
          git config user.name "$GITLAB_USER_NAME"
          git remote add mr_upstream "https://PRIVATE-TOKEN:$CANCEL_PIPELINE_ACCESS_TOKEN@gitlab.nxvms.dev/$CI_MERGE_REQUEST_PROJECT_PATH.git"
          echo "Attempting to fetch origin"
          git fetch mr_upstream $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
          pushd "/builds/dev/cloud_portal"
            python3 approval-check.py "https://@gitlab.nxvms.dev/api/v4/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/approvals" "$CANCEL_PIPELINE_ACCESS_TOKEN" "$(git rev-parse mr_upstream/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME)"
          popd
        fi
