image: nx/ci

include:
  - project: "dev/ci"
    file: "pipelines/infra-templates.yml"
  - project: "dev/ci"
    file: "pipelines/secrets.yml"
  - local: "ci/Docker/**/.gitlab-ci.yml"
  - local: "channel_partners/build/channel_partners_ci/.gitlab-ci.yml"

default:
  tags:
    - us-service

variables:
  JENKINS_JOB_LOG: "true"
  JUNKSHOP_ENABLED: "false"
  JENKINS_URL: "https://jenkins.us.nxteam.dev"

workflow:
  rules:
    - if: $CI_PROJECT_NAMESPACE != "dev"
      when: never
    # Enable for merge requests.
    - if: $CI_MERGE_REQUEST_ID
    # Enable for protected branch.
    - if: $CI_COMMIT_REF_PROTECTED
    - when: never

stages:
  - pre-build
  - docker image
  - check
  - build
  - create mr
  - test
  - fail-fast

.retries:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
#
.frontend-changes:
  extends: .retries
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - front_end/**/*

.get_target_branch_script:
  script:
  - set -e
  - if [[ "$CI_COMMIT_REF_PROTECTED" == "true" ]]; then
  -   TARGET_BRANCH_NAME=${CI_COMMIT_REF_NAME}
  - else
  -   TARGET_BRANCH_NAME=$(get_target_protected_branch.py
        --gitlab-server-url=${CI_SERVER_URL}
        --gitlab-token="${GITLAB_API_TOKEN}"
        --project-id=${CI_PROJECT_ID}
        --merge-request-iid=${CI_MERGE_REQUEST_IID})
  - fi

no-changes:
#  extends: .retries
  needs: []
  rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        changes:
            - cloud/**/*
            - front_end/**/*
        when: never
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        when: always
  stage: check
  script:
    - echo "If this is the only job that runs then no changes were made that requires the pipeline"

.backend-changes:
  extends: .retries
  needs:
    - job: docker:build-django-python
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - cloud/**/*
        - cloud/poetry.toml
        - cloud/poetry.lock
        - cloud/pyproject.toml
        - cloud/allowed_licenses.txt
  before_script:
    - poetry -C /builds/dev/cloud_portal/cloud export --with prod,test,front-build --without-hashes --without-urls -o /app/requirements.txt
    - cat /app/requirements.txt
    - pip install --upgrade --no-cache-dir -r /app/requirements.txt

.django-python:
  extends: .backend-changes
  image: ${DJANGO_PYTHON_IMAGE}:${DJANGO_PYTHON_IMAGE_TAG}
  needs:
    - job: docker:build-django-python
      optional: true
  services:
    - name: mysql:8.0
      alias: mysql
    - name: redis:5.0.6-alpine
      alias: redis
      command:
        - redis-server
        - --databases 32
  variables:
    TESTING: "true"
    PYTHONPATH: "/builds/dev/cloud_portal/common/python"
    MYSQL_DATABASE: "cloudportal"
    MYSQL_ROOT_PASSWORD: ""
    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    MYSQL_PASSWORD: ""
  before_script:
    - cd cloud
    - echo "Waiting for mysql server to be ready"
    - poetry -C /builds/dev/cloud_portal/cloud export --with prod,test,front-build --without-hashes --without-urls -o /app/requirements.txt
    - pip install --upgrade --no-cache-dir -r /app/requirements.txt
    - >
      for i in {1..60}; do
        if ! mysql --host=mysql -u root -e ";"
        then
          if [ $i == 60 ]
          then
            echo "Could not connect to mysql server after 60 attempts"
            exit 1
          else
            echo "Attempt $i to connect to mysql server failed"
          fi
        else
          echo "Attempt $i Successfully connected to mysql server"
          break
        fi

        sleep 5
      done

.django-unit-test:
  extends: .django-python
  stage: test
  coverage: /^TOTAL.+?(\d+\%)$/

django-checks:
  extends: .backend-changes
  image: ${DJANGO_PYTHON_IMAGE}:${DJANGO_PYTHON_IMAGE_TAG}
  stage: check
  variables:
    USE_SQLITE: "true"
    PYTHONPATH: "/builds/dev/cloud_portal/common/python"
  script:
    - cd cloud
    - python -m pip install safety==2.3.5
    - if ! python safety-check.py ; then echo PIP packages need to be updated && exit 1 ; fi
    - if ! python manage.py makemigrations --dry-run --check ; then echo Missing above migrations && exit 1 ; fi
    - if ! python manage.py check ; then echo System check failed && exit 1 ; fi

django-unit-test-slow:
  extends: .django-unit-test
  artifacts:
    when: always
    reports:
      junit: cloud/slow-report.xml
      coverage_report:
        coverage_format: cobertura
        path: cloud/slow-coverage.xml
  script:
    - pytest -m "integration and slow" --create-db --junitxml=slow-report.xml --cov="." --cov-report xml:slow-coverage.xml --cov-report term

django-unit-test-fast:
  extends: .django-unit-test
  artifacts:
    when: always
    reports:
      junit: cloud/fast-report.xml
      coverage_report:
        coverage_format: cobertura
        path: cloud/fast-coverage.xml
  script:
    - pytest -m "not integration and not slow" --create-db --junitxml=fast-report.xml --cov="." --cov-report xml:fast-coverage.xml --cov-report term

common-python-unit-test:
  extends: .django-unit-test
  artifacts:
    when: always
    reports:
      junit: common/python/fast-report.xml
      coverage_report:
        coverage_format: cobertura
        path: common/python/fast-coverage.xml
  variables:
    PYTHONPATH: "/builds/dev/cloud_portal/common/python"
  script:
    - cd /builds/dev/cloud_portal/common/python
    - pytest -m "not integration and not slow" --create-db --junitxml=fast-report.xml --cov="." --cov-report xml:fast-coverage.xml --cov-report term
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - common/python/**/*
        - cloud/poetry.toml
        - cloud/poetry.lock
        - cloud/pyproject.toml
        - cloud/allowed_licenses.txt

cp-common-python-unit-test:
  extends: .cp-unit-test
  artifacts:
    when: always
    reports:
      junit: common/python/fast-report.xml
      coverage_report:
        coverage_format: cobertura
        path: common/python/fast-coverage.xml
  variables:
    PYTHONPATH: "/builds/dev/cloud_portal/common/python"
  script:
    - cd /builds/dev/cloud_portal/common/python
    - pytest -m "not integration and not slow" --create-db --junitxml=fast-report.xml --cov="." --cov-report xml:fast-coverage.xml --cov-report term
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - common/python/**/*
        - channel_partners/poetry.toml
        - channel_partners/poetry.lock
        - channel_partners/pyproject.toml

.frontend-node:
  extends: .frontend-changes
  needs:
    - job: docker:build-node-chrome
      optional: true
  variables:
    CHROME_BIN: /usr/bin/google-chrome
    FRONTEND_NODE_MODULES: /node_modules_frontend
    ES_LINT_PLUGIN_NODE_MODULES: /node_modules_es_lint_plugin
    NX_CLOUD_ACCESS_TOKEN: NzU4OWM0MGQtNmJkNi00YzI3LWJkZjUtMThiMmMwYTkyYWNifHJlYWQtd3JpdGU=

  image: ${NODE_JS_IMAGE}:${NODE_JS_IMAGE_TAG}
  before_script:
    - cp -r "$FRONTEND_NODE_MODULES" ./front_end/node_modules
    - cp -r "$ES_LINT_PLUGIN_NODE_MODULES" ./front_end/eslint-plugin-nx/node_modules

open-source:monorepo-checks:
  extends: .frontend-node
  stage: check
  script:
    - |
      pushd "front_end"
        npm run ci:open
      popd

open-source:open-source-checker:
  stage: check
  image: ${DOCKER_REGISTRY}/nx/workflow_police/open-source-checker
  script:
  - git config --global --add safe.directory "${CI_PROJECT_DIR}" #< Prevent "detected dubious ownership" error.
  - echo "Getting files changed by this MR (${CI_MERGE_REQUEST_DIFF_BASE_SHA} => ${CI_COMMIT_SHA})"
  - git diff-tree --no-commit-id --name-status -r "${CI_MERGE_REQUEST_DIFF_BASE_SHA}" "${CI_COMMIT_SHA}"
      | (egrep '^(M|A)\s+(open|open_candidate)/' || true) | awk '{print $2}'
      | tee changed_open_source_files.txt
  - |
    if [[ -s changed_open_source_files.txt ]]; then
      /workdir/open_source_check.py \
        --config open_source_check_config.json --check-file-list changed_open_source_files.txt --display-relative-paths \
        --repo-dir . 2>&1 | tee report.txt
    else
      echo "No new or modified open-source files in git diff." | tee report.txt
    fi
  artifacts:
    expose_as: open-source-check-report
    when: always
    paths: ['report.txt']
  variables:
    GIT_STRATEGY: "fetch"
  rules:
  - if: $CI_MERGE_REQUEST_ID
    changes:
    - open/**/*
    - open_candidate/**/*
    - open_source_check_config.json

node-license-check:
  extends: .frontend-node
  stage: check
  artifacts:
    paths:
      - package-license.json
    when: on_failure
  script:
    - |
      npx recursive-check-licenses -a licenses_whitelist.json -e licenses_excluded_packages.json
      if [[ $(git diff --stat) != '' ]]; then
        echo 'package-license.json updated, attempting commiting changes'
        git config user.email "$GITLAB_USER_EMAIL"
        git config user.name "$GITLAB_USER_NAME"
        git remote add mr_origin "https://PRIVATE-TOKEN:$CANCEL_PIPELINE_ACCESS_TOKEN@gitlab.nxvms.dev/$CI_MERGE_REQUEST_SOURCE_PROJECT_PATH.git"
        echo "Attempting to fetch origin"
        git remote show mr_origin
        git pull --ff-only mr_origin $CI_COMMIT_REF_NAME
        git add .
        git commit -m "Node Licenses autofixed by pipeline"
        git push -u mr_origin HEAD:$CI_COMMIT_REF_NAME
        echo 'pushed node licenses fixe to branch'
      fi

other-frontend-checks:
  extends: .frontend-node
  stage: check
  script:
    - |
      pushd "ci"
        start_task "./nx_mentions.sh" "nx_mentions" &
      popd
      pushd "front_end"
        pushd "eslint-plugin-nx"
          start_task "npm run build-check" "eslint_plugin_build_check" &
          start_task "npm run test" "eslint_plugin_test" &
        popd
      popd

frontend-lang:
  extends: .frontend-node
  stage: check
  script:
    - |
      pushd "front_end"
        npm run update-lang
        python3 fill-lang.py
        python3 compile-lang.py
        npm run test-lang
      if [[ $(git diff --stat) != '' ]]; then
        echo 'Language files changed, attempting commiting changes'
        git config user.email "$GITLAB_USER_EMAIL"
        git config user.name "$GITLAB_USER_NAME"
        git remote add mr_origin "https://PRIVATE-TOKEN:$CANCEL_PIPELINE_ACCESS_TOKEN@gitlab.nxvms.dev/$CI_MERGE_REQUEST_SOURCE_PROJECT_PATH.git"
        echo "Attempting to fetch origin"
        git remote show mr_origin
        git pull --ff-only mr_origin $CI_COMMIT_REF_NAME
        git add .
        git commit -m "Language autofixed by pipeline"
        git push -u mr_origin HEAD:$CI_COMMIT_REF_NAME
        echo 'pushed lang fixes to branch'
      fi
      popd

frontend-lint:
  extends: .frontend-node
  stage: check
  script:
    - |
      pushd "front_end"
        LINT_STATUS=$(npm run lint:ci; echo $?)
        echo $LINT_STATUS
        EXIT_FROM_LINT=$(echo "$LINT_STATUS" | tail -n1)

        if [ $EXIT_FROM_LINT == 0 ]; then
          echo "Lint passed"
        else
          echo "Lint failed with exit code $EXIT_FROM_LINT, attempting to fix automatically"
          npm run lint:ci -- --fix
        fi
      popd

      if [[ $(git diff --stat) != '' ]]; then
        echo 'Lint errors automatically fixed, attempting commiting changes'
        git config user.email "$GITLAB_USER_EMAIL"
        git config user.name "$GITLAB_USER_NAME"
        git remote add mr_origin "https://PRIVATE-TOKEN:$CANCEL_PIPELINE_ACCESS_TOKEN@gitlab.nxvms.dev/$CI_MERGE_REQUEST_SOURCE_PROJECT_PATH.git"
        echo "Attempting to fetch origin"
        git remote show mr_origin
        git pull --ff-only mr_origin $CI_COMMIT_REF_NAME
        git add .
        git commit -m "Lint autofixed by pipeline"
        git push -u mr_origin HEAD:$CI_COMMIT_REF_NAME
        echo 'pushed lint fixes to branch'
      fi

frontend-tests:
  extends: .frontend-node
  stage: test
  coverage: /^TOTAL.+?(\d+\%)$/
  artifacts:
    when: always
    reports:
      junit:
        - front_end/junit/**/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: front_end/coverage/**/cobertura-coverage.xml
  script:
    - |
      pushd "front_end"
        npm run test:ci
      popd

.jenkins-builds:
  extends: .frontend-changes
  stage: build
  image: nx/ci
  artifacts:
    paths:
      - logs/**/*
  secrets:
    JENKINS_API_TOKEN_FILE: !reference [.tokens, secrets, JENKINS_API_TOKEN_FILE]

jenkins-build-webadmin:
  extends: .jenkins-builds
  rules:
  - if: '$CI_MERGE_REQUEST_ID && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^vms_/'
    when: on_success
    changes:
      - front_end/**/*
  - if: '$CI_MERGE_REQUEST_ID && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
    when: on_success
    changes:
      - front_end/**/*
  - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_REF_NAME =~ /^vms_/'
    when: on_success
    changes:
      - front_end/**/*
  - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_REF_NAME == "develop"'
    when: on_success
    changes:
      - front_end/**/*
  script:
    - |
      set -ex
      if [[ "$CI_COMMIT_REF_PROTECTED" == true ]]; then
        PUBLISH=ON
      else
        PUBLISH=OFF
      fi
    - mkdir logs
    - echo "Running webadmin build"
    - runJenkinsJob.sh gitlab.vms.review.webadmin.build
      "PUBLISH=$PUBLISH"
      "BUILD_DESCRIPTION=$CI_COMMIT_TITLE"
      "GITLAB_BRANCH=$CI_COMMIT_REF_NAME"
      "GITLAB_COMMIT=$CI_COMMIT_SHA"
      "GITLAB_PIPELINE_URL=$CI_PIPELINE_URL"
      "GITLAB_JOB_ID=$CI_JOB_ID"
      "GITLAB_JOB_PROJECT=$CI_PROJECT_PATH"
      "GITLAB_JOB_URL=$CI_JOB_URL"
      "GITLAB_REFSPEC=$CI_COMMIT_SHA"

jenkins-build-frontend:
  extends: .jenkins-builds
  script:
    - mkdir logs
    - echo "Running frontend build"
    - runJenkinsJob.sh gitlab.cloud.frontend
      "BRANCH=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      "BUILD_IDENTITY=$CI_PIPELINE_ID"
      "GITLAB_BRANCH=$CI_COMMIT_REF_NAME"
      "GITLAB_COMMIT=$CI_COMMIT_SHA"
      "GITLAB_PIPELINE_URL=$CI_PIPELINE_URL"
      "GITLAB_JOB_ID=$CI_JOB_ID"
      "GITLAB_JOB_PROJECT=$CI_PROJECT_PATH"
      "GITLAB_JOB_URL=$CI_JOB_URL"
      "REVISION=$CI_COMMIT_SHA"

create-vms-mr:
  stage: create mr
  extends: .jenkins-builds
  rules:
  - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_REF_NAME =~ /^vms_/'
    when: on_success
    changes:
    - front_end/**/*
  - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_REF_NAME == "develop"'
    when: on_success
    changes:
    - front_end/**/*
  script:
    - runJenkinsJob.sh gitlab.vms.review.webadmin.create-vms-mr
      "BUILD_DESCRIPTION=$CI_COMMIT_TITLE"
      "CLOUD_PORTAL_COMMIT=$CI_COMMIT_SHA"
      "GITLAB_PIPELINE_URL=$CI_PIPELINE_URL"
      "GITLAB_JOB_ID=$CI_JOB_ID"
      "GITLAB_JOB_PROJECT=$CI_PROJECT_PATH"
      "GITLAB_JOB_URL=$CI_JOB_URL"

