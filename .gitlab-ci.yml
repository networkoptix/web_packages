image: nx/ci

include:
  - project: "dev/ci"
    file: "pipelines/infra-templates.yml"
  - project: "dev/ci"
    file: "pipelines/secrets.yml"
  - local: "ci/Docker/**/.gitlab-ci.yml"

default:
  tags:
    - us-service

variables:
  JUNKSHOP_ENABLED: "false"
  # These variables are required for deploy cloud
  K8S_PRODUCT_RELEASE: cp-mr-${CI_MERGE_REQUEST_IID}

workflow:
  rules:
    - if: $CI_PROJECT_NAMESPACE != "dev"
      when: never
    # Enable for merge requests.
    - if: $CI_MERGE_REQUEST_ID
    # Enable for protected branch.
    - if: $CI_COMMIT_REF_PROTECTED
    - when: never

stages:
  - pre-build
  - docker image
  - check
  - build
  - deploy
  - test
  - fail-fast

# Rules

.enable_for_mr: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.frontend_changes:
  - front_end/**/*
  - .gitlab-ci.yml

.notification_changes:
 - desktop_notifications/**/*
 - .gitlab-ci.yml

.webadmin_changes:
  - front_end/**/*
  - webadmin/**/*

.enable_for_mr_branch: '( $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^vms_/ ||
  $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" )'

.enable_for_protected_branch: '( $CI_PIPELINE_SOURCE == "push" &&
  ( $CI_COMMIT_REF_NAME =~ /^vms_/ || $CI_COMMIT_REF_NAME == "develop" ) )'

no-changes:
  needs: []
  rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        changes:
            - cloud/**/*
            - front_end/**/*
        when: never
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        when: always
  stage: check
  script:
    - echo "If this is the only job that runs then no changes were made that requires the pipeline"

.backend-changes:
  needs:
    - job: docker:build-django-python
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - cloud/**/*

.django-python:
  extends: .backend-changes
  image: ${DJANGO_PYTHON_IMAGE}:${DJANGO_PYTHON_IMAGE_TAG}
  needs:
    - job: docker:build-django-python
      optional: true
  services:
    - name: mysql:5.7
      alias: mysql
    - name: redis:3.2.8-alpine
      alias: redis
  variables:
    TESTING: "true"
    MYSQL_DATABASE: "cloudportal"
    MYSQL_ROOT_PASSWORD: ""
    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    MYSQL_PASSWORD: ""
  before_script:
    - cd cloud
    - echo "Waiting for mysql server to be ready"
    - >
      for i in {1..60}; do
        if ! mysql --host=mysql -u root -e ";"
        then
          if [ $i == 60 ]
          then
            echo "Could not connect to mysql server after 60 attempts"
            exit 1
          else
            echo "Attempt $i to connect to mysql server failed"
          fi
        else
          echo "Attempt $i Successfully connected to mysql server"
          break
        fi

        sleep 5
      done

.django-unit-test:
  extends: .django-python
  stage: test
  coverage: /^TOTAL.+?(\d+\%)$/

django-checks:
  extends: .backend-changes
  image: ${DJANGO_PYTHON_IMAGE}:${DJANGO_PYTHON_IMAGE_TAG}
  stage: check
  variables:
    USE_SQLITE: "true"
  script:
    - cd cloud
    - if ! python manage.py makemigrations --dry-run --check ; then echo Missing above migrations && exit 1 ; fi
    - if ! python manage.py check ; then echo System check failed && exit 1 ; fi

django-unit-test-slow:
  extends: .django-unit-test
  artifacts:
    when: always
    reports:
      junit: cloud/slow-report.xml
      coverage_report:
        coverage_format: cobertura
        path: cloud/slow-coverage.xml
  script:
    - pytest -m "not integration" -m slow --create-db --junitxml=slow-report.xml --cov="." --cov-report xml:slow-coverage.xml --cov-report term

django-unit-test-fast:
  extends: .django-unit-test
  artifacts:
    when: always
    reports:
      junit: cloud/fast-report.xml
      coverage_report:
        coverage_format: cobertura
        path: cloud/fast-coverage.xml
  script:
    - pytest -m "not integration" -m "not slow" --create-db --junitxml=fast-report.xml --cov="." --cov-report xml:fast-coverage.xml --cov-report term

.frontend-node:
  variables:
    CHROME_BIN: /usr/bin/google-chrome
    FRONTEND_NODE_MODULES: /node_modules_frontend
    ES_LINT_PLUGIN_NODE_MODULES: /node_modules_es_lint_plugin
  image: ${NODE_JS_IMAGE}:${NODE_JS_IMAGE_TAG}
  before_script:
    - cp -r "$FRONTEND_NODE_MODULES" ./front_end/node_modules
    - cp -r "$ES_LINT_PLUGIN_NODE_MODULES" ./front_end/eslint-plugin-nx/node_modules
  rules:
    - if: !reference [ .enable_for_mr ]
      changes: !reference [ .frontend_changes ]

other-frontend-checks:
  extends: .frontend-node
  stage: check
  artifacts:
    paths:
      - ci-package-license.json
    when: on_failure
  script:
    - |
      npx recursive-check-licenses -a licenses_whitelist.json -e licenses_excluded_packages.json -ci true
      pushd "ci"
        start_task "./nx_mentions.sh" "nx_mentions" &
      popd
      pushd "front_end"
        pushd "eslint-plugin-nx"
          start_task "npm run build-check" "eslint_plugin_build_check" &
          start_task "npm run test" "eslint_plugin_test" &
        popd
        npm run lang-ci-check
      popd

frontend-lint:
  extends: .frontend-node
  stage: check
  script:
    - |
      pushd "front_end"
        npm run lint:ci
      popd

frontend-builds:
  extends: .frontend-node
  stage: build
  script:
    - |
      pushd "front_end"
          npm run build:ci
      popd

frontend-tests:
  extends: .frontend-node
  stage: test
  allow_failure: true
  script:
    - |
      pushd "front_end"
        npm run test:ci
      popd

      # TODO: Merge coverage
