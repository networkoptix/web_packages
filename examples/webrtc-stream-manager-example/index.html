<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC Stream Manager Example</title>
  </head>

  <body>
    <div id="app">
      <h1 id="description"></h1>
      <div class="card">
        <form name="cloud-data">
          <div>
            <label for="cloudInstance">Cloud Instance Url</label>
            <input
              type="url"
              name="cloudInstance"
              id="endpcloudInstanceoint"
              required
              value=""
              placeholder="https://nxvms.com"
            />
          </div>
          <button type="submit">Authenticate</button>
        </form>

        <form name="endpoint-data">
          <fieldset>
            <legend>Endpoint Options</legend>
            <div>
              <label for="selectedSystem">Select a site</label>
              <select name="selectedSystem">
                <option value="loading">Loading Sites...</option>
              </select>
            </div>
            <div id="selectedCamera">
              <label for="selectedCamera">Select a camera</label>
              <select name="selectedCamera">
                <option value="loading">Loading Cameras...</option>
              </select>
            </div>
            <div id="selectedPosition">
              <label for="selectedPosition">Select playback start position (Use 0 for Live)</label>
              <input type="number" name="selectedPosition" step="1" value="0" />
            </div>
            <div id="selectedSpeed">
              <label for="selectedSpeed">Select playback speed</label>
              <select name="selectedSpeed" disabled>
                <option value="0.25">0.25</option>
                <option value="0.5">0.5</option>
                <option value="1" selected>1</option>
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="unlimited">Max</option>
              </select>
            </div>
            <div id="streamQuality">
              <label for="streamQuality">Stream Quality</label>
              <select name="streamQuality">
                <option value="auto" selected>Auto (Both Streams)</option>
                <option value="high">High Quality Only</option>
                <option value="low">Low Quality Only</option>
              </select>
            </div>
          </fieldset>
          <button type="submit" disabled>Start WebRTC Connection</button>
          <button type="button" id="stopStreamBtn" disabled style="background-color: #dc3545; margin-left: 10px;">
            Stop & Cleanup Stream
          </button>
        </form>
      </div>
      <div class="card">
        <h2>Non-H264 stream being transcoded</h2>
        <h3>Timestamp: <span id="timestamp">-1</span></h3>
        <h3>Current Stream: <span id="currentStream" style="font-weight: bold; color: #4CAF50;">Not Started</span></h3>
        <h3>Current Resolution: <span id="currentResolution" style="font-weight: bold; color: #FF9800;">-</span></h3>
        <h4>Memory Debug:
          <span id="memoryInfo">Not tracked</span>
          <button type="button" id="forceGCBtn" style="margin-left: 10px;">Force GC (if enabled)</button>
        </h4>
        <video id="targetVideo" autoplay muted></video>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
