include:
  - local: "ci/.shared.yml"

.functional_tests_required: '( $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" ||
  $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^releases_23\.3\./ )'

.require_testing:
  - cloud/**/*
  - front_end/**/*
  - ft/**/*

# Private Cloud deployed for MR cannot handle two sets of functional tests simultaneously.
# See: https://networkoptix.atlassian.net/browse/PC-49
