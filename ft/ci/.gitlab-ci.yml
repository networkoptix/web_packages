include:
  - local: "ci/.shared.yml"

.functional_tests_required: '( $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" ||
  $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^releases_23\.3\./ )'

.require_testing:
  - cloud/**/*
  - front_end/**/*
  - ft/**/*

FT:
  stage: 'ft (#ask-ft)'
  needs: [ 'cloud-deploy' ]
  script: [ 'dev-cloud-portal-gitlab' ]
  tags: [ 'cloud_portal_tests' ]
  timeout: '180m'
  rules:
    - if: !reference [ .functional_tests_required ]
      # noinspection YAMLSchemaValidation
      changes: !reference [ .require_testing ]
