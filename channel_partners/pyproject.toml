[tool.poetry]
name = "channel-partners"
version = "0.1.0"
description = ""
authors = [
    "Kyrylo Apanovych <kapanovich@networkoptix.com>",
    "Kevin Brostoff <kBrostoff@NetworkOptix.com>"
]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "~3.11"
django = "~4.2.3"
redis = "~4.6.0"
psycopg = "~3.1.9"
pyyaml = "^6.0.1"
uvicorn = "^0.23.2"
gunicorn = "^21.2.0"
llutil = { path = "llutil-0.6.tar.gz" }
djangorestframework = "^3.14.0"
drf-extensions = "^0.7.1"
python-dateutil = "^2.8.2"
drf-spectacular = "^0.26.4"
requests = "^2.31.0"
django-extensions = "^3.2.3"
django-cors-headers = "^4.2.0"
httpx = "^0.24.1"
django-cte = "^1.3.1"
django-filter = "^23.3"
celery = { version="5.3.4", extras=["redis", "django", "sqs"] }
django-celery-results = "^2.5.1"
django-celery-beat = "^2.5.0"
gevent = "^23.9.1"
django-structlog = "7.1.0"

[tool.poetry.group.test.dependencies]
django-silk = "^5.0.4"
isort = "^5.13.2"
mock = "^5.1.0"
model-bakery = "^1.13.0"
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
pytest-django = "^4.5.2"
pytest-mock = "^3.11.1"
pytest-cov = "^4.1.0"
pytest-env = "^0.8.2"
pytest-httpx = "^0.23.1"
ruff = "^0.1.14"


[[tool.poetry.source]]
name = "pypi-remote"
url = "http://artifactory.us.nxteam.dev/artifactory/api/pypi/pypi-remote/simple"
priority = "default"

[[tool.poetry.source]]
name = "pypi-local"
url = "http://artifactory.us.nxteam.dev/artifactory/api/pypi/pypi-local/simple"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
