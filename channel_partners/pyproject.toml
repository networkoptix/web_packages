[tool.poetry]
name = "channel-partners"
version = "0.1.0"
description = ""
authors = ["Kyrylo Apanovych <kapanovich@networkoptix.com>"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "~3.11"
django = "~4.2.3"
redis = "~4.6.0"
psycopg = "~3.1.9"
pyyaml = "^6.0.1"
uvicorn = "^0.23.2"
gunicorn = "^21.2.0"


[tool.poetry.group.test.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
