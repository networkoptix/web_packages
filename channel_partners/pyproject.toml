[[tool.poetry.source]]
name = "pypi-local"
url = "http://artifactory.us.nxteam.dev/artifactory/api/pypi/pypi-local/simple"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
