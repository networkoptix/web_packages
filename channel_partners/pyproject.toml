[tool.poetry]
name = "channel-partners"
version = "0.1.0"
description = ""
authors = [
    "Kyrylo Apanovych <kapanovich@networkoptix.com>",
    "Kevin Brostoff <kBrostoff@NetworkOptix.com>"
]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "~3.11"
django = "~4.2.3"
redis = "~5.1.0"
psycopg = "~3.2.3"
pyyaml = "^6.0.1"
uvicorn = "^0.31.0"
gunicorn = "^22.0"
llutil = { path = "llutil-0.6.tar.gz" }
djangorestframework = "~3.15.0"
drf-extensions = "^0.7.1"
python-dateutil = "^2.8.2"
drf-spectacular = "^0.27.2"
requests = "^2.32.0"
django-extensions = "^3.2.3"
django-cors-headers = "^4.2.0"
httpx = "^0.27.2"
django-cte = "^1.3.1"
django-filter = "^24.3"
celery = { version="5.4.0", extras=["redis", "django", "sqs"] }
django-celery-results = "^2.5.1"
django-celery-beat = "^2.7.0"
gevent = "^24.2.1"
django-structlog = "^8.1.0"
django-environ = "^0.11.2"
pyjwt = { version="^2.8.0", extras=["crypto"] }
openpyxl = "^3.1.2"
etils = { version = "*", extras = ["edc"] }
django-storages = { version="^1.14.2", extras=["s3"] }
drf-standardized-errors = "^0.14.0"
django-waffle = "^4.0.0"

[tool.poetry.group.test.dependencies]
django-silk = "^5.0.4"
isort = "^5.13.2"
mock = "^5.1.0"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-django = "^4.9.0"
pytest-mock = "^3.14.0"
pytest-cov = "^5.0.0"
pytest-env = "^1.1.5"
pytest-httpx = "^0.32.0"
pytest-xdist = "^3.6.1"
ruff = "^0.6.8"
model-bakery = "^1.19.5"
moto = { version = "^5.0.16", extras = ["s3"] }

[[tool.poetry.source]]
name = "pypi-remote"
url = "http://artifactory.us.nxteam.dev/artifactory/api/pypi/pypi-remote/simple"
priority = "default"

[[tool.poetry.source]]
name = "pypi-local"
url = "http://artifactory.us.nxteam.dev/artifactory/api/pypi/pypi-local/simple"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
