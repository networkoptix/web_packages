version: '2'
services:
  redis:
    image: redis:5.0.6
    container_name: redis_cp
    domainname: redis_cp
    restart: always
    ports:
      - "6379:6379"
    expose:
      - "6379"
    command:
      - redis-server
      - --databases 32

  postgres:
    image: postgres:15.3-bullseye
    container_name: postgres_cp
    domainname: postgres_cp
    restart: always
    ports:
      - "5432:5432"
    expose:
      - "5432"
    environment:
      POSTGRES_USER: channel
      POSTGRES_PASSWORD: partners
      POSTGRES_DB: channel_partners
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    command: ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]

  migration:
    build:
      context: ../..
      dockerfile: build/channel_partners_local/Dockerfile
    depends_on:
      - postgres
      - redis
    volumes:
      - ../../src/:/app/app
      - ../../../common/python/:/app/common_python
    working_dir: /app/app
    command: ["/app/entrypoint.sh", "migratedb"]
    environment:
      - LOCAL_ENV=1
      - LOCAL_DOCKER=1

  celery:
    build:
      context: ../..
      dockerfile: build/channel_partners_local/Dockerfile
    depends_on:
      - postgres
      - redis
      - migration
    volumes:
      - ../../src/:/app/app
      - ../../../common/python/:/app/common_python
    working_dir: /app/app
    command: ["/app/entrypoint.sh", "celery"]
    environment:
      - LOCAL_ENV=1
      - LOCAL_DOCKER=1

  app:
    container_name: app
    domainname: app
    build:
      context: ../..
      dockerfile: build/channel_partners_local/Dockerfile
    depends_on:
      - postgres
      - redis
      - migration
    volumes:
      - ../../src/:/app/app
      - ../../../common/python/:/app/common_python
    working_dir: /app/app
    command: [ "/app/entrypoint.sh", "web" ]
    environment:
      - LOCAL_ENV=1
      - LOCAL_DOCKER=1



  nginx:
    image: nginx:1.25-alpine
    container_name: cloud_portal_nginx
    depends_on:
      - app
    ports:
      - "80:80"

    environment:
      - PORTAL_HOST=host.docker.internal
    volumes:
      - ../../src/static:/app/static
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
