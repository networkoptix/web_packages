include /etc/nginx/modules-enabled/*.conf;

error_log /dev/stdout debug;

worker_processes 1;

# user nobody nogroup;
pid /tmp/nginx.pid;

events {
    worker_connections 20000;
    accept_mutex off;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format custom_json escape=json '{'
        '"log_version": "1.1",'
        '"level": "info",'
        '"timestamp": "$time_iso8601",'
        '"message": "handled request $request_method $request_uri",'
        '"request_id": "$http_x_request_id",'
        '"server": {'
            '"name": "$server_name",'
            '"port": "$server_port"'
        '},'
        '"request": {'
            '"remote_ip": "$remote_addr",'
            '"remote_port": "$remote_port",'
            '"protocol": "$server_protocol",'
            '"method": "$request_method",'
            '"host": "$host",'
            '"uri": "$request_uri",'
            '"path": "$uri",'
            '"query_string": "$query_string",'
            '"length": $request_length,'
            '"headers": {'
                '"user_agent": "$http_user_agent",'
                '"accept": "$http_accept",'
                '"accept_encoding": "$http_accept_encoding",'
                '"traceparent": "$http_traceparent",'
                '"tracestate": "$http_tracestate",'
                '"x_forwarded_for": "$http_x_forwarded_for",'
                '"x_amzn_trace_id": "$http_x_amzn_trace_id",'
                '"origin": "$http_origin",'
                '"x_flush_cps_cache": "$http_x_flush_cps_cache",'
                '"x_ignore_cps_cache": "$http_x_ignore_cps_cache"'
            '}'
        '},'
        '"response": {'
            '"status": $status,'
            '"size": $bytes_sent,'
            '"body_size": $body_bytes_sent,'
            '"headers": {'
                '"content_length": "$sent_http_content_length",'
                '"content_type": "$sent_http_content_type",'
                '"x_cps_cache_status": "$sent_http_x_cps_cache_status",'
                '"etag": "$sent_http_etag"'
            '}'
        '},'
        '"timing": {'
            '"request_time": $request_time,'
            '"upstream_connect_time": $upstream_connect_time,'
            '"upstream_header_time": $upstream_header_time,'
            '"upstream_response_time": $upstream_response_time'
        '},'
        '"upstream": {'
            '"addr": "$upstream_addr",'
            '"status": "$upstream_status",'
            '"response_length": "$upstream_response_length"'
        '}'
    '}';

    access_log /var/log/nginx/access.log custom_json;


    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # don't send the nginx version number in error pages and Server header
    server_tokens off;

    # Expires map
    map $sent_http_content_type $expires {
        default                    off;
        text/html                  epoch;
        text/css                   epoch;
        application/javascript     epoch;
    }

    upstream app_server {
        # For a TCP configuration:
        # server app:8000 fail_timeout=0;
        server app:8000 fail_timeout=0;
    }

    server {
        listen 80 default;

        keepalive_timeout 5;

        location /partners/static/ {
            alias /app/app/static/;
#             try_files $uri =404;
        }

        location / {
            proxy_pass  http://app_server;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass_request_headers on;
            proxy_redirect off;
            proxy_connect_timeout 600s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            send_timeout 600s;
        }
    }
}
