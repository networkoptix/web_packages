<h1>Здравствуйте, </h1>

<p>Вы были приглашены в %CLOUD_NAME%</p>

{{#message.message}}
<p>{{ message.message }}</p>
{{/message.message}}

<p>Пожалуйста, создайте учетную запись в
    <a href="{{ config.portal_url }}">%CLOUD_NAME%</a>,
    используя свой текущий адрес электронной почты, и следуйте дальнейшим инструкциям.
</p>

<a class="btn" href="{{ config.portal_url }}/authorize/register/{{ message.code }}">Зарегистрироваться</a>
