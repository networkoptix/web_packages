<h1>Olá, </h1>

<p>Você foi convidado para %CLOUD_NAME%</p>

{{#message.message}}
<p>{{ message.message }}</p>
{{/message.message}}

<p>Por favor crie uma conta em
    <a href="{{ config.portal_url }}">%CLOUD_NAME%</a>

<a class="btn" href="{{ config.portal_url }}/authorize/register/{{ message.code }}">Registrar conta</a>
