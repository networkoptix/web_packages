<!--suppress ALL -->
<header ng-if="viewHeader">
    <nav class="navbar navbar-default">
        <div class="container-fluid">
            <div class="app-header-left d-flex flex-row">
                <ul ng-if="activeSystem" class="nav navbar-nav navbar-left auth-visible d-block d-sm-none">
                    <li>
                        <nx-active-system [active-system]="activeSystem"></nx-active-system>
                    </li>
                </ul>

                <div class="navbar-header">
                    <a class="inset navbar-brand product-name add-version" href="/"
                       [ngClass]="{'ml-sm-0': true}">
                        <img ng-src="{{config.previewPath}}/static/images/logo.png">
                    </a>
                </div>

                <ul ng-if="active.integrations" class="nav navbar-nav d-none d-md-flex">
                    <li class="active">
                        <a class="inset" href="">연동</a>
                    </li>
                </ul>

                <ul ng-if="active.ipvd" class="nav navbar-nav d-none d-md-flex">
                    <li class="active">
                        <a class="inset" href="">지원되는 IP 비디오 장치들</a>
                    </li>
                </ul>

                <ul ng-if="activeSystem && !active.integrations && !active.ipvd"
                    class="nav navbar-nav auth-visible d-none d-md-flex">

                    <li ng-class="{ 'active' :active.view }">
                        <a class="inset" ng-href="/systems/{{activeSystem.id}}/view">보기</a>
                    </li>
                    <li ng-class="{ 'active' :active.settings}">
                        <a class="inset" ng-href="/systems/{{activeSystem.id}}">설정</a>
                    </li>
                </ul>
            </div>

            <div class="app-header-right">
                <ul class="nav navbar-nav navbar-right auth-hidden margin-right flex-nowrap">
                    <li>
                        <span>
                            <a href="" class="btn btn-default btn-collapse" ng-click="login()">
                                <span class="glyphicon glyphicon-login"></span>
                                <span class="btn-caption">로그인</span>
                            </a>
                        </span>
                        <span>
                            <a href="/register" class="btn btn-primary btn-collapse">
                                <span class="glyphicon glyphicon-create-user"></span>
                                <span class="btn-caption">계정 생성</span>
                            </a>
                        </span>
                    </li>
                </ul>

                <ul class="nav navbar-nav navbar-right auth-visible flex-nowrap">
                    <li ng-if="singleSystem" class="no-hover collapse-second hidden-collapse">
                        <a href="" class="m-0 border-0">
                            <span class="glyphicon glyphicon-home"></span>
                            <span class="ellipsis">{{activeSystem.name}}</span>
                        </a>
                    </li>

                    <li ng-if="systemCounter && !singleSystem" class="collapse-second">
                        <nx-systems
                                [endpoint]="active"
                                [systems]="systems"
                                [active-system]="activeSystem">
                        </nx-systems>
                    </li>

                    <li class="vertical-bar"></li>

                    <li class="collapse-first">
                        <nx-account-settings-select></nx-account-settings-select>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <toast></toast>
</header>
