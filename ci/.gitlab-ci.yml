django-unit-test-all:
  extends: .django-unit-test
  artifacts:
    when: always
    reports:
      junit: cloud/fast-report.xml
      coverage_report:
        coverage_format: cobertura
        path: cloud/fast-coverage.xml
  script:
    - pytest --create-db --junitxml=fast-report.xml --cov="." --cov-report xml:fast-coverage.xml --cov-report term -n 3

common-python-unit-test:
  extends: .django-unit-test
  artifacts:
    when: always
    reports:
      junit: common/python/fast-report.xml
      coverage_report:
        coverage_format: cobertura
        path: common/python/fast-coverage.xml
  variables:
    PYTHONPATH: "/builds/dev/cloud_portal/common/python"
  script:
    - cd /builds/dev/cloud_portal/common/python
    - pytest -m "not integration and not slow" --create-db --junitxml=fast-report.xml --cov="." --cov-report xml:fast-coverage.xml --cov-report term
  rules:
    - if: !reference [ .enable_for_mr ]
      changes:
        - common/python/**/*
        - cloud/poetry.toml
        - cloud/poetry.lock
        - cloud/pyproject.toml
        - cloud/allowed_licenses.txt

portal-nginx-conf-test:
  image: nginx:1.14.0-alpine
  stage: check
  variables:
    DATA_HOSTS: "relay.relay.cloud.hdw.mx,relay.cloud.hdw.mx,*.relay.relay.cloud.hdw.mx,*.relay.cloud.hdw.mx,nxcloud-test-integrations-static.s3.amazonaws.com,*.hdw.mx,*.vmsproxy.com"
    CUSTOMIZATION: "default"
    PORTAL_HOST: "localhost"
    PORTAL_BUCKET: "cloud-portal"
  script:
    - cd /builds/dev/cloud_portal
    - mkdir -p etc/nginx
    - cp deploy/cloud_portal_nginx/nginx.conf.template /etc/nginx/conf.d/nginx.conf.template
    - cp deploy/cloud_portal_nginx/static_caching.conf /etc/nginx/static_caching.conf
    - cp deploy/cloud_portal_nginx/one_day_caching.conf /etc/nginx/one_day_caching.conf
    - cp deploy/cloud_portal_nginx/proxy.conf /etc/nginx/proxy.conf
    - sh etc/scripts/test_nginx.sh
  rules:
    - if: !reference [ .enable_for_mr ]
      changes:
        - deploy/cloud_portal_nginx/**/*
