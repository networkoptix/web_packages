# GitLab CI/CD configuration file for Cloud Portal python backend


include:
  - project: "dev/ci"
    file: "pipelines/infra-templates.yml"
  - project: "dev/ci"
    file: "pipelines/secrets.yml"
  - local: "ci/Docker/**/.gitlab-ci.yml"
  - local: "ci/.shared.yml"

.backend-changes:
  needs:
    - job: docker:build-django-python-pulled
      optional: true
  rules:
    - if: !reference [ .enable_for_mr ]
      changes:
        - cloud/**/*
        - cloud/poetry.toml
        - cloud/poetry.lock
        - cloud/pyproject.toml
        - cloud/allowed_licenses.txt

.django-python:
  extends: .backend-changes
  image:
    name: ${DJANGO_PYTHON_IMAGE}:${DJANGO_PYTHON_IMAGE_TAG}
  needs:
    - job: docker:build-django-python-pulled
      optional: true
  services:
    - name: mysql:8.0
      alias: mysql
    - name: redis:5.0.6-alpine
      alias: redis
      command:
        - redis-server
        - --databases 96
  variables:
    TESTING: "true"
    PYTHONPATH: "/builds/dev/cloud_portal/common/python"
    MYSQL_DATABASE: "cloudportal"
    MYSQL_ROOT_PASSWORD: ""
    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    MYSQL_PASSWORD: ""
  before_script:
    - cd cloud
    - echo "Waiting for mysql server to be ready"
    - poetry -C /builds/dev/cloud_portal/cloud export --with prod,test --without-hashes --without-urls -o /app/requirements.txt
    - >
      for i in {1..60}; do
        if ! mysql --host=mysql -u root -e ";"
        then
          if [ $i == 60 ]
          then
            echo "Could not connect to mysql server after 60 attempts"
            exit 1
          else
            echo "Attempt $i to connect to mysql server failed"
          fi
        else
          echo "Attempt $i Successfully connected to mysql server"
          break
        fi

        sleep 5
      done

.django-unit-test:
  extends: .django-python
  stage: test
  coverage: /^TOTAL.+?(\d+\%)$/

django-checks:
  extends: .backend-changes
  image:
    name: ${DJANGO_PYTHON_IMAGE}:${DJANGO_PYTHON_IMAGE_TAG}
  stage: check
  variables:
    USE_SQLITE: "true"
    PYTHONPATH: "/builds/dev/cloud_portal/common/python"
  script:
    - cd cloud
    - poetry lock --check
    - python -m pip install safety==2.3.5
    - if ! python safety-check.py ; then echo PIP packages need to be updated && exit 1 ; fi
    - if ! python manage.py makemigrations --dry-run --check ; then echo Missing above migrations && exit 1 ; fi
    - if ! python manage.py check ; then echo System check failed && exit 1 ; fi

