project_id: 199203
base_path: ..
preserve_hierarchy: true

files:
  -
    source: '/front_end/src/language_i18n.json'
    translation: '/translations/%locale_with_underscore%/language_i18n.json'
    dest: '/language_i18n.json'
  -
    source: '/front_end/src/language_i18n_static.json'
    translation: '/translations/%locale_with_underscore%/language_i18n_static.json'
    dest: '/language_i18n_static.json'
  -
    source: '/robot_tests/translations/variables_language_en_US.json'
    translation: '/robot_tests/translations/variables_language_%locale_with_underscore%.json'
    dest: '/robot_tests/variables_language.json'
  -
    source: '/front_end/src/views/**/*.*'
    translation: '/translations/%locale_with_underscore%/views/**/%original_file_name%'
    ignore:
      - '/front_end/src/views/debug.html'
      - '/front_end/src/views/view.html'
      - '/front_end/src/views/static/eula.html'
      - '/front_end/src/views/components/downloadRelease.html'
  -
    source: '/front_end/inline-wizard/app/views/**/*.html'
    translation: '/front_end/inline-wizard/translations/%locale_with_underscore%/views/**/%original_file_name%'
    ignore:
      - '/front_end/inline-wizard/app/views/components/dialog.html'
  -
    source: '/front_end/inline-wizard/app/language.json'
    translation: '/front_end/inline-wizard/translations/%locale_with_underscore%/language.json'
    ignore:
      - '/front_end/inline-wizard/app/views/components/dialog.html'
  -
    source: '/cloud/notifications/static/templates/*.json'
    translation: '/translations/%locale_with_underscore%/templates/%original_file_name%'
  -
    source: '/cloud/notifications/static/templates/*.template'
    translation: '/translations/%locale_with_underscore%/templates/%original_file_name%'
    ignore: ['/cloud/notifications/static/templates/container.mustache.template']
  -
    source: '/cloud/notifications/static/templates/*.html'
    translation: '/translations/%locale_with_underscore%/templates/%original_file_name%'
  -
    source: '/cloud/notifications/static/templates/*.txt'
    translation: '/translations/%locale_with_underscore%/templates/%original_file_name%'
  -
    source: '/cloud/notifications/static/templates/container.mustache.template'
    dest: '/cloud/notifications/static/templates/container.mustache.template.html'
    translation: '/translations/%locale_with_underscore%/templates/container.mustache.template'
    type: 'html'
